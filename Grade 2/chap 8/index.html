<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rainbow Writer Adventure - OpenOffice Writer 2</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS', cursive;
}

body{
overflow:hidden;
background:linear-gradient(45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1,#84fab0,#8fd3f4);
background-size:400% 400%;
animation:bgMove 12s infinite alternate;
height:100vh;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

.screen{
display:none;
width:100%;
height:100vh;
padding:20px;
overflow:auto;
}

.active{
display:block;
}

.logo{
position:absolute;
top:10px;
left:10px;
width:120px;
z-index:1000;
}

.header{
text-align:center;
margin-top:40px;
color:white;
text-shadow:3px 3px 5px black;
}

.header h1{
font-size:42px;
}

.levelBox{
background:rgba(255,255,255,0.9);
border-radius:25px;
padding:20px;
margin:20px auto;
max-width:1000px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
animation:pop 0.5s;
}

@keyframes pop{
from{transform:scale(0.5);}
to{transform:scale(1);}
}

.question{
font-size:30px;
margin:20px 0;
text-align:center;
color:#333;
}

.buttonArea{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:20px;
}

.gameBtn{
padding:20px 30px;
font-size:28px;
border:none;
border-radius:20px;
cursor:pointer;
background:linear-gradient(to right,#ff758c,#ff7eb3);
color:white;
box-shadow:0 5px 10px rgba(0,0,0,0.3);
transition:0.3s;
}

.gameBtn:hover{
transform:scale(1.1);
}

.correct{
background:limegreen !important;
}

.wrong{
background:red !important;
}

.teacher{
width:180px;
display:block;
margin:auto;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.scoreBoard{
position:fixed;
top:10px;
right:10px;
background:white;
padding:10px 20px;
border-radius:20px;
font-size:24px;
font-weight:bold;
z-index:999;
}

.progress{
width:100%;
height:25px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.progressBar{
height:100%;
width:0%;
background:linear-gradient(to right,#00f260,#0575e6);
transition:0.5s;
}

.typingBox{
padding:15px;
font-size:28px;
border-radius:15px;
border:3px solid purple;
width:300px;
text-align:center;
}

.dragContainer{
display:flex;
justify-content:space-around;
margin-top:30px;
flex-wrap:wrap;
}

.dragItem,.dropBox{
padding:20px;
background:white;
border-radius:20px;
font-size:28px;
margin:10px;
cursor:pointer;
min-width:150px;
text-align:center;
}

.dropBox{
border:4px dashed purple;
height:100px;
}

.confetti{
position:fixed;
width:10px;
height:10px;
background:red;
animation:fall 3s linear forwards;
z-index:9999;
}

@keyframes fall{
0%{
transform:translateY(-100px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

.finalScreen{
text-align:center;
color:white;
margin-top:80px;
}

.finalScreen h1{
font-size:60px;
text-shadow:4px 4px black;
}

.badge{
display:inline-block;
padding:20px;
margin:15px;
background:gold;
border-radius:20px;
font-size:28px;
}

.replay{
margin-top:30px;
padding:20px 40px;
font-size:30px;
border:none;
border-radius:20px;
background:#00c853;
color:white;
cursor:pointer;
}

@media(max-width:768px){

.question{
font-size:22px;
}

.gameBtn{
font-size:22px;
padding:15px;
}

.typingBox{
width:90%;
}

.logo{
width:90px;
}

.header h1{
font-size:28px;
}
}
</style>
</head>

<body>

<img src="assets/innovine-logo.png" class="logo">

<div class="scoreBoard">
⭐ Score: <span id="score">0</span>/15
</div>

<!-- START SCREEN -->

<div class="screen active" id="startScreen">

<div class="header">
<h1>🌈 Rainbow Writer Adventure 🌈</h1>
<h2>OpenOffice Writer - 2</h2>
</div>

<div class="levelBox">

<img src="https://cdn-icons-png.flaticon.com/512/201/201818.png" class="teacher">

<div class="question">
Welcome Kids! Help Miss Rainbow complete all 15 Writer missions!
</div>

<div class="buttonArea">
<button class="gameBtn" onclick="startGame()">START GAME</button>
</div>

</div>

</div>

<!-- GAME SCREEN -->

<div class="screen" id="gameScreen">

<div class="progress">
<div class="progressBar" id="progressBar"></div>
</div>

<div class="levelBox">

<h2 id="levelTitle"></h2>

<div class="question" id="questionText"></div>

<div id="gameArea"></div>

</div>

</div>

<!-- FINAL SCREEN -->

<div class="screen" id="finalScreen">

<div class="finalScreen">

<h1>🎉 Congratulations 🎉</h1>

<h2 id="finalScore"></h2>

<div class="badge">🏅 Writer Wizard</div>
<div class="badge">⭐ Formatting Hero</div>
<div class="badge">🌈 Rainbow Champion</div>

<br>

<button class="replay" onclick="location.reload()">PLAY AGAIN</button>

</div>

</div>

<script>

const correctSound = new Audio("assets/correct-1.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

let level = 1;
let score = 0;

const levels = [

{
title:"Level 1 - Bold Magic",
question:"Click the BOLD button",
type:"buttons",
options:["Bold","Italic","Underline"],
correct:"Bold"
},

{
title:"Level 2 - Italic Race",
question:"Click ITALIC",
type:"buttons",
options:["Italic","Center","Bullets"],
correct:"Italic"
},

{
title:"Level 3 - Underline Detective",
question:"Find UNDERLINE",
type:"buttons",
options:["Underline","Right Align","Find"],
correct:"Underline"
},

{
title:"Level 4 - Alignment Mission",
question:"Click CENTER ALIGN",
type:"buttons",
options:["Left","Center","Right"],
correct:"Center"
},

{
title:"Level 5 - Shortcut Hero",
question:"Type Ctrl+B",
type:"typing",
correct:"Ctrl+B"
},

{
title:"Level 6 - Shortcut Hero",
question:"Type Ctrl+I",
type:"typing",
correct:"Ctrl+I"
},

{
title:"Level 7 - Shortcut Hero",
question:"Type Ctrl+U",
type:"typing",
correct:"Ctrl+U"
},

{
title:"Level 8 - Bullets Party",
question:"Click BULLETS",
type:"buttons",
options:["Bullets","Numbering","Find"],
correct:"Bullets"
},

{
title:"Level 9 - Numbering Ninja",
question:"Click NUMBERING",
type:"buttons",
options:["Bold","Numbering","Replace"],
correct:"Numbering"
},

{
title:"Level 10 - Find Detective",
question:"Click FIND",
type:"buttons",
options:["Replace","Find","Italic"],
correct:"Find"
},

{
title:"Level 11 - Replace Wizard",
question:"Click REPLACE",
type:"buttons",
options:["Replace","Underline","Center"],
correct:"Replace"
},

{
title:"Level 12 - Justify Mission",
question:"Click JUSTIFY",
type:"buttons",
options:["Left","Justify","Center"],
correct:"Justify"
},

{
title:"Level 13 - Drag Match",
question:"Drag B to Bold",
type:"drag"
},

{
title:"Level 14 - Speed Typing",
question:"Type: OpenOffice Writer",
type:"typing",
correct:"OpenOffice Writer"
},

{
title:"Level 15 - Final Rainbow Mission",
question:"Click SAVE DOCUMENT",
type:"buttons",
options:["Open","Save Document","Close"],
correct:"Save Document"
}

];

function startGame(){

document.getElementById("startScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");

loadLevel();

}

function loadLevel(){

if(level > levels.length){

showFinal();
return;

}

const current = levels[level-1];

document.getElementById("levelTitle").innerHTML = current.title;
document.getElementById("questionText").innerHTML = current.question;

document.getElementById("progressBar").style.width =
((level-1)/15)*100 + "%";

const gameArea = document.getElementById("gameArea");

gameArea.innerHTML = "";

if(current.type === "buttons"){

const area = document.createElement("div");
area.className = "buttonArea";

current.options.forEach(option=>{

const btn = document.createElement("button");
btn.className = "gameBtn";
btn.innerHTML = option;

btn.onclick = ()=>{

if(option === current.correct){

btn.classList.add("correct");
correctAnswer();

}else{

btn.classList.add("wrong");
wrongSound.play();

}

};

area.appendChild(btn);

});

gameArea.appendChild(area);

}

else if(current.type === "typing"){

const div = document.createElement("div");
div.style.textAlign = "center";

div.innerHTML = `
<input class="typingBox" id="typingInput" placeholder="Type Here">
<br><br>
<button class="gameBtn" onclick="checkTyping()">SUBMIT</button>
`;

gameArea.appendChild(div);

}

else if(current.type === "drag"){

gameArea.innerHTML = `

<div class="dragContainer">

<div class="dragItem" draggable="true" id="dragBold">B</div>

<div class="dropBox" id="dropBold">Bold</div>

</div>

`;

const dragItem = document.getElementById("dragBold");
const dropBox = document.getElementById("dropBold");

dragItem.addEventListener("dragstart", dragStart);

dropBox.addEventListener("dragover", dragOver);

dropBox.addEventListener("drop", dropped);

}

}

function checkTyping(){

const input = document.getElementById("typingInput").value.trim();

if(input === levels[level-1].correct){

correctAnswer();

}else{

wrongSound.play();
alert("Try Again!");

}

}

function correctAnswer(){

score++;

document.getElementById("score").innerHTML = score;

correctSound.play();

confettiBlast();

setTimeout(()=>{

level++;
loadLevel();

},1500);

}

function confettiBlast(){

for(let i=0;i<100;i++){

const confetti = document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left = Math.random()*window.innerWidth+"px";

confetti.style.background =
`hsl(${Math.random()*360},100%,50%)`;

confetti.style.animationDuration =
(Math.random()*3+2)+"s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},5000);

}

}

function dragStart(e){

e.dataTransfer.setData("text", e.target.id);

}

function dragOver(e){

e.preventDefault();

}

function dropped(e){

e.preventDefault();

const data = e.dataTransfer.getData("text");

if(data === "dragBold"){

correctAnswer();

}

}

function showFinal(){

document.getElementById("gameScreen").classList.remove("active");
document.getElementById("finalScreen").classList.add("active");

document.getElementById("finalScore").innerHTML =
`⭐ You scored ${score} out of 15`;

confettiBlast();

}

</script>

</body>
</html>
