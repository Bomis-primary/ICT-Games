<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KidPix Fun World</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS',cursive;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow-x:hidden;
}

#game-box{
width:100%;
max-width:1000px;
background:white;
border-radius:30px;
padding:25px;
box-shadow:0 10px 35px rgba(0,0,0,0.2);
overflow:hidden;
position:relative;
}

.logo{
width:130px;
display:block;
margin:auto;
margin-bottom:10px;
}

.screen{
display:none;
animation:fade 0.5s;
}

.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1,h2,h3{
text-align:center;
color:#6a1b9a;
margin-bottom:15px;
}

.question{
font-size:28px;
font-weight:bold;
text-align:center;
margin:20px 0;
}

.btn{
background:#ff7043;
color:white;
border:none;
padding:14px 28px;
border-radius:40px;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
transition:0.3s;
margin-right:10px;
}

.btn:hover{
transform:scale(1.05);
}

input{
padding:14px;
width:90%;
border-radius:12px;
border:2px solid #ccc;
font-size:18px;
margin-top:15px;
}

.score-box{
font-size:26px;
font-weight:bold;
text-align:center;
color:#ff6f00;
margin-bottom:10px;
}

.timer{
font-size:26px;
font-weight:bold;
text-align:center;
color:#d32f2f;
margin-bottom:15px;
}

.feedback{
font-size:28px;
font-weight:bold;
text-align:center;
margin-top:20px;
min-height:50px;
}

.balloon{
position:absolute;
bottom:-100px;
font-size:50px;
animation:floatUp linear infinite;
cursor:pointer;
transition:0.3s;
}

.balloon:hover{
transform:scale(1.2);
}

@keyframes floatUp{
0%{
transform:translateY(0);
}
100%{
transform:translateY(-120vh);
}
}

.option-container{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.option{
background:#e1bee7;
padding:18px;
border-radius:20px;
cursor:pointer;
font-size:22px;
font-weight:bold;
transition:0.3s;
min-width:180px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.option:hover{
background:#ce93d8;
transform:scale(1.05);
}

.memory-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:20px;
}

.card{
height:110px;
background:#90caf9;
border-radius:18px;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
cursor:pointer;
color:white;
transition:0.4s;
}

.card.flipped{
background:#fff3e0;
color:black;
transform:rotateY(180deg);
}

.final-score{
font-size:70px;
font-weight:bold;
text-align:center;
color:#ff6f00;
margin:20px 0;
}

.rank{
font-size:30px;
font-weight:bold;
text-align:center;
color:#1565c0;
}

@media(max-width:768px){

.question{
font-size:22px;
}

.option{
min-width:140px;
font-size:18px;
}

.memory-grid{
grid-template-columns:repeat(2,1fr);
}

}

</style>

</head>

<body>

<div id="game-box">

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<!-- INTRO -->

<div class="screen active" id="intro">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎨 KidPix Fun World</h1>

<h3>Grade 2 | Chapter 4</h3>

<center>

<input type="text" id="studentName"
placeholder="Enter Student Name">

<br>

<button class="btn" onclick="startGame()">
🚀 Start Game
</button>

</center>

</div>

<!-- MENU -->

<div class="screen" id="menu">

<img src="assets/innovine-logo.png" class="logo">

<div class="score-box">
⭐ Total Score :
<span id="score">0</span>
</div>

<h1>🎮 Choose Activity</h1>

<center>

<button class="btn" onclick="startCatchGame()">
🎈 Catch Brush Challenge
</button>

<br>

<button class="btn" onclick="startEmojiQuiz()">
😄 Emoji Puzzle Quiz
</button>

<br>

<button class="btn" onclick="startTreasureGame()">
💎 Treasure Hunt
</button>

<br>

<button class="btn" onclick="startMemoryGame()">
🧠 Memory Match
</button>

<br>

<button class="btn" onclick="showFinal()">
🏁 Finish Game
</button>

</center>

</div>

<!-- CATCH GAME -->

<div class="screen" id="catchScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎈 Catch Brush Challenge</h1>

<div class="question">
Catch ONLY the Brush Tools
</div>

<div class="timer">
⏰ Time Left :
<span id="timer">60</span>s
</div>

<div id="balloonArea"
style="position:relative;height:420px;overflow:hidden;">
</div>

<div class="feedback" id="catchFeedback"></div>

<center>

<button class="btn" onclick="backMenu()">
⬅ Back to Menu
</button>

</center>

</div>

<!-- EMOJI QUIZ -->

<div class="screen" id="emojiScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>😄 Emoji Puzzle Quiz</h1>

<div class="question" id="emojiQuestion"></div>

<div class="option-container" id="emojiOptions"></div>

<div class="feedback" id="emojiFeedback"></div>

<center>

<button class="btn" onclick="nextEmojiQuestion()">
Next ➜
</button>

<button class="btn" onclick="backMenu()">
⬅ Back
</button>

</center>

</div>

<!-- TREASURE -->

<div class="screen" id="treasureScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>💎 Treasure Hunt</h1>

<div class="question">
Find Hidden KidPix Tool
</div>

<div class="option-container" id="treasureArea"></div>

<div class="feedback" id="treasureFeedback"></div>

<center>

<button class="btn" onclick="resetTreasure()">
🔄 Retry
</button>

<button class="btn" onclick="backMenu()">
⬅ Back
</button>

</center>

</div>

<!-- MEMORY -->

<div class="screen" id="memoryScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🧠 Memory Match</h1>

<div class="question">
Match Same KidPix Tools
</div>

<div class="memory-grid" id="memoryGrid"></div>

<div class="feedback" id="memoryFeedback"></div>

<center>

<button class="btn" onclick="backMenu()">
⬅ Back
</button>

</center>

</div>

<!-- FINAL -->

<div class="screen" id="finalScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🏆 Congratulations</h1>

<h2 id="studentDisplay"></h2>

<div class="final-score" id="finalScore"></div>

<div class="rank" id="rank"></div>

<h2 id="brushResult"
style="text-align:center;color:#ff7043;">
</h2>

<center>

<button class="btn" onclick="location.reload()">
🔄 Play Again
</button>

</center>

</div>

</div>

<script>

let score=0;
let student="";
let brushesCaught=0;
let timerInterval;
let gameEnded=false;

/* START */

function startGame(){

student=document.getElementById("studentName").value;

if(student===""){
alert("Please Enter Student Name");
return;
}

showScreen("menu");

}

/* SCREEN */

function showScreen(id){

document.querySelectorAll(".screen")
.forEach(screen=>{
screen.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

}

/* SCORE */

function updateScore(){

document.getElementById("score")
.innerHTML=score;

}

/* SOUND */

function correct(){

document.getElementById("correctSound").play();

}

function wrong(){

document.getElementById("wrongSound").play();

}

/* BACK */

function backMenu(){

clearInterval(timerInterval);

showScreen("menu");

updateScore();

}

/* TIMER */

function startTimer(seconds){

clearInterval(timerInterval);

let timeLeft=seconds;

document.getElementById("timer").innerHTML=timeLeft;

timerInterval=setInterval(()=>{

timeLeft--;

document.getElementById("timer").innerHTML=timeLeft;

if(timeLeft<=0){

clearInterval(timerInterval);

gameEnded=true;

document.getElementById("catchFeedback")
.innerHTML=
"🎉 Well Done! You caught "+
brushesCaught+
" brushes";

document.getElementById("catchFeedback")
.style.color="green";

confetti({
particleCount:250,
spread:180
});

setTimeout(()=>{
backMenu();
},3000);

}

},1000);

}

/* CATCH GAME */

function startCatchGame(){

showScreen("catchScreen");

brushesCaught=0;

gameEnded=false;

document.getElementById("catchFeedback")
.innerHTML="";

startTimer(60);

const area=document.getElementById("balloonArea");

area.innerHTML="";

const items=[
"🖌️","🎵","🖌️","📚",
"🖌️","💻","🖌️","🎮",
"🖌️","📱","🖌️","🎨"
];

items.forEach((item,index)=>{

let div=document.createElement("div");

div.className="balloon";

div.style.left=(index*8+2)+"%";

div.style.animationDuration=
(4+Math.random()*5)+"s";

div.innerHTML=item;

div.onclick=()=>{

if(gameEnded) return;

if(item==="🖌️"){

score+=2;
brushesCaught++;

updateScore();

correct();

document.getElementById("catchFeedback")
.innerHTML=
"✅ Brushes Caught : "+
brushesCaught;

document.getElementById("catchFeedback")
.style.color="green";

confetti({
particleCount:70,
spread:80
});

}else{

score--;

if(score<0) score=0;

updateScore();

wrong();

document.getElementById("catchFeedback")
.innerHTML=
"❌ Wrong Tool";

document.getElementById("catchFeedback")
.style.color="red";

}

div.remove();

};

area.appendChild(div);

});

}

/* EMOJI QUIZ */

const emojiQuestions=[

{
q:"🖌️ + 🎨 = ?",
options:["Paint","Music","Printer"],
ans:"Paint"
},

{
q:"⌨️ + 🖥️ = ?",
options:["Computer","Brush","Book"],
ans:"Computer"
},

{
q:"🖱️ + 💻 = ?",
options:["Mouse","Tree","Music"],
ans:"Mouse"
}

];

let emojiIndex=0;

function startEmojiQuiz(){

emojiIndex=0;

showScreen("emojiScreen");

loadEmojiQuestion();

}

function loadEmojiQuestion(){

let q=emojiQuestions[emojiIndex];

document.getElementById("emojiQuestion")
.innerHTML=q.q;

let html="";

q.options.forEach(opt=>{

html+=`
<div class="option"
onclick="checkEmoji('${opt}')">
${opt}
</div>
`;

});

document.getElementById("emojiOptions")
.innerHTML=html;

}

function checkEmoji(ans){

let q=emojiQuestions[emojiIndex];

if(ans===q.ans){

score+=2;

correct();

document.getElementById("emojiFeedback")
.innerHTML="✅ Correct";

document.getElementById("emojiFeedback")
.style.color="green";

confetti({
particleCount:120,
spread:120
});

}else{

score--;

if(score<0) score=0;

wrong();

document.getElementById("emojiFeedback")
.innerHTML="❌ Wrong";

document.getElementById("emojiFeedback")
.style.color="red";

}

updateScore();

}

function nextEmojiQuestion(){

emojiIndex++;

if(emojiIndex>=emojiQuestions.length){

backMenu();

}else{

loadEmojiQuestion();

}

}

/* TREASURE */

function startTreasureGame(){

showScreen("treasureScreen");

resetTreasure();

}

function resetTreasure(){

const area=document.getElementById("treasureArea");

document.getElementById("treasureFeedback")
.innerHTML="";

area.innerHTML="";

const items=[false,false,true,false];

items.sort(()=>0.5-Math.random());

items.forEach(item=>{

let div=document.createElement("div");

div.className="option";

div.innerHTML=item?"🖌️":"📦";

div.onclick=()=>treasure(div,item);

area.appendChild(div);

});

}

function treasure(el,correctAns){

if(correctAns){

score+=3;

correct();

document.getElementById("treasureFeedback")
.innerHTML=
"🎉 Treasure Found";

document.getElementById("treasureFeedback")
.style.color="green";

confetti({
particleCount:200,
spread:150
});

}else{

score--;

if(score<0) score=0;

wrong();

document.getElementById("treasureFeedback")
.innerHTML=
"❌ Empty Box";

document.getElementById("treasureFeedback")
.style.color="red";

}

updateScore();

el.style.transform="scale(1.2)";

}

/* MEMORY */

const memoryItems=[
"Brush","Brush",
"Paint","Paint",
"Text","Text",
"Shape","Shape"
];

let flipped=[];

function startMemoryGame(){

showScreen("memoryScreen");

const grid=document.getElementById("memoryGrid");

grid.innerHTML="";

flipped=[];

memoryItems.sort(()=>0.5-Math.random());

memoryItems.forEach(item=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML="?";

card.onclick=()=>flipCard(card,item);

grid.appendChild(card);

});

}

function flipCard(card,item){

if(card.classList.contains("flipped")) return;

card.classList.add("flipped");

card.innerHTML=item;

flipped.push({card,item});

if(flipped.length===2){

if(flipped[0].item===flipped[1].item){

score+=2;

updateScore();

correct();

document.getElementById("memoryFeedback")
.innerHTML="✅ Match Found";

document.getElementById("memoryFeedback")
.style.color="green";

confetti({
particleCount:100,
spread:100
});

flipped=[];

}else{

score--;

if(score<0) score=0;

updateScore();

wrong();

setTimeout(()=>{

flipped.forEach(f=>{
f.card.classList.remove("flipped");
f.card.innerHTML="?";
});

flipped=[];

},1000);

}

}

}

/* FINAL */

function showFinal(){

clearInterval(timerInterval);

showScreen("finalScreen");

document.getElementById("studentDisplay")
.innerHTML=
"👏 "+student;

document.getElementById("finalScore")
.innerHTML=
score+" Points";

document.getElementById("brushResult")
.innerHTML=
"🎈 You caught "+
brushesCaught+
" brushes in Catch Challenge";

let rank="";

if(score>=20){

rank="🏆 KidPix Superstar";

}else if(score>=10){

rank="🌟 Creative Artist";

}else{

rank="👍 Keep Practicing";

}

document.getElementById("rank")
.innerHTML=rank;

confetti({
particleCount:400,
spread:180
});

}

</script>

</body>
</html>
