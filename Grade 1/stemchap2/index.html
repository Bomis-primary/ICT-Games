<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STEM Robot Adventure - Chapter 2</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS',sans-serif;
}

body{
background:url('assets/robot-bg.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
min-height:100vh;
overflow-x:hidden;
color:white;
transition:1s;
}

.overlay{
background:rgba(0,0,0,0.35);
min-height:100vh;
padding:15px;
}

.container{
max-width:1200px;
margin:auto;
padding-bottom:120px;
}

.logo{
width:130px;
display:block;
margin:auto;
margin-bottom:10px;
}

h1{
text-align:center;
font-size:48px;
color:#FFD700;
margin-bottom:15px;
text-shadow:2px 2px 8px black;
}

.topbar{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
font-size:24px;
background:rgba(255,255,255,0.15);
padding:12px;
border-radius:20px;
margin-bottom:20px;
}

.progressBox{
width:100%;
height:20px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress{
height:100%;
width:0%;
background:linear-gradient(to right,#00e5ff,#00ff95);
transition:0.5s;
}

.card{
background:rgba(255,255,255,0.18);
padding:20px;
border-radius:25px;
backdrop-filter:blur(8px);
}

#question{
font-size:30px;
text-align:center;
margin-bottom:20px;
}

#options{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.questionImage{
width:220px;
height:220px;
object-fit:contain;
background:white;
padding:10px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
}

.questionImage:hover{
transform:scale(1.08);
background:#fff59d;
}

.optionBtn{
padding:15px 25px;
font-size:22px;
border:none;
border-radius:15px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(135deg,#ffeb3b,#ff9800);
color:black;
transition:0.3s;
}

.optionBtn:hover{
transform:scale(1.05);
}

.sequenceBox{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-top:20px;
}

.sequenceItem{
padding:15px 20px;
background:#00e5ff;
border-radius:15px;
font-size:22px;
cursor:pointer;
font-weight:bold;
color:black;
}

.feedback{
font-size:30px;
font-weight:bold;
margin-top:20px;
text-align:center;
}

.nextArea{
position:fixed;
bottom:0;
left:0;
width:100%;
background:rgba(0,0,0,0.7);
padding:10px;
text-align:center;
z-index:999;
}

#nextBtn{
padding:15px 40px;
font-size:24px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#00ff95,#00c853);
color:white;
display:none;
cursor:pointer;
font-weight:bold;
}

.finalScreen{
display:none;
background:rgba(255,255,255,0.95);
color:black;
padding:30px;
border-radius:25px;
text-align:center;
margin-top:30px;
}

.playBtn{
padding:15px 30px;
font-size:22px;
background:#2196F3;
color:white;
border:none;
border-radius:15px;
cursor:pointer;
margin-top:20px;
}

@media(max-width:768px){

.questionImage{
width:140px;
height:140px;
}

.optionBtn{
font-size:18px;
padding:12px 18px;
}

h1{
font-size:34px;
}

#question{
font-size:22px;
}

}

</style>
</head>

<body>

<div class="overlay">

<div class="container">

<img src="assets/innovine-logo.png" class="logo">

<h1>🚀 STEM Robot Adventure</h1>

<div class="topbar">
<div>⭐ Score: <span id="score">0</span></div>
<div>🏆 Badges: <span id="badges">0</span></div>
<div>⏰ <span id="timer">40</span>s</div>
</div>

<div class="progressBox">
<div class="progress" id="progress"></div>
</div>

<div class="card" id="gameCard">

<h2 id="question"></h2>

<div id="imageArea"></div>

<div id="options"></div>

<div class="feedback" id="feedback"></div>

</div>

<div class="finalScreen" id="finalScreen">

<h1>🎉 Great Job!</h1>

<h2 id="finalScore"></h2>

<h2 id="rank"></h2>

<button onclick="location.reload()" class="playBtn">
Play Again
</button>

</div>

</div>

<div class="nextArea">
<button id="nextBtn">Next ➜</button>
</div>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

const backgrounds=[
"assets/robot-bg.jpg",
"assets/robot-bg1.jpg"
];

const questions=[

{
type:"image",
question:"Click the Helper Robot",
options:[
"assets/helper-robot.PNG",
"assets/factory-robot.PNG",
"assets/medical-robot.PNG"
],
answer:"assets/helper-robot.PNG"
},

{
type:"truefalse",
question:"Medical robots help doctors.",
options:["True","False"],
answer:"True",
image:"assets/medical-robot.PNG"
},

{
type:"list",
question:"Choose the robot used in space",
options:[
"Factory Robot",
"Exploration Robot",
"Medical Robot"
],
answer:"Exploration Robot",
image:"assets/exploration-robot.PNG"
},

{
type:"sequence",
question:"Which comes FIRST?",
sequence:[
"Robot gets command",
"Robot works",
"Robot finishes work"
],
answer:"Robot gets command"
},

{
type:"image",
question:"Click the Factory Robot",
options:[
"assets/factory-robot.PNG",
"assets/helper-robot.PNG",
"assets/medical-robot.PNG"
],
answer:"assets/factory-robot.PNG"
},

{
type:"fillblank",
question:"Robots help ________.",
options:[
"Humans",
"Clouds",
"Trees"
],
answer:"Humans"
},

{
type:"truefalse",
question:"Factory robots make toys and cars.",
options:["True","False"],
answer:"True",
image:"assets/factory-robot.PNG"
},

{
type:"list",
question:"Choose the robot used in hospitals",
options:[
"Medical Robot",
"Factory Robot",
"Exploration Robot"
],
answer:"Medical Robot",
image:"assets/medical-robot.PNG"
},

{
type:"image",
question:"Click the Exploration Robot",
options:[
"assets/exploration-robot.PNG",
"assets/factory-robot.PNG",
"assets/helper-robot.PNG"
],
answer:"assets/exploration-robot.PNG"
},

{
type:"sorting",
question:"Click the robot that helps at home",
options:[
"assets/helper-robot.PNG",
"assets/exploration-robot.PNG",
"assets/factory-robot.PNG"
],
answer:"assets/helper-robot.PNG"
}

];

let current=0;
let score=0;
let badges=0;
let timer;
let time=40;

const question=document.getElementById('question');
const options=document.getElementById('options');
const imageArea=document.getElementById('imageArea');
const feedback=document.getElementById('feedback');

function startTimer(){

clearInterval(timer);

time=40;

document.getElementById('timer').innerHTML=time;

timer=setInterval(()=>{

time--;

document.getElementById('timer').innerHTML=time;

if(time<=0){

clearInterval(timer);

feedback.innerHTML="⏰ Time Up!";
document.getElementById('nextBtn').style.display='inline-block';

}

},1000);

}

function showQuestion(){

startTimer();

document.body.style.background=
`url('${backgrounds[current % 2]}')`;

document.body.style.backgroundSize='cover';

const q=questions[current];

question.innerHTML=q.question;

options.innerHTML='';
imageArea.innerHTML='';
feedback.innerHTML='';

document.getElementById('nextBtn').style.display='none';

document.getElementById('progress').style.width=
((current)/questions.length)*100+'%';

if(q.image){

imageArea.innerHTML=
`<img src="${q.image}" class="questionImage">`;

}

if(q.type==="image" || q.type==="sorting"){

q.options.forEach(opt=>{

const img=document.createElement('img');

img.src=opt;
img.className='questionImage';

img.onclick=()=>check(opt===q.answer);

options.appendChild(img);

});

}

if(q.type==="truefalse"){

q.options.forEach(opt=>{

const btn=document.createElement('button');

btn.className='optionBtn';
btn.innerHTML=opt;

btn.onclick=()=>check(opt===q.answer);

options.appendChild(btn);

});

}

if(q.type==="list" || q.type==="fillblank"){

const select=document.createElement('select');

select.className='optionBtn';

q.options.forEach(opt=>{

select.innerHTML+=`<option>${opt}</option>`;

});

const btn=document.createElement('button');

btn.className='optionBtn';
btn.innerHTML='Submit';

btn.onclick=()=>{

if(select.value===q.answer){
correct();
}else{
wrong();
}

};

options.appendChild(select);
options.appendChild(btn);

}

if(q.type==="sequence"){

const area=document.createElement('div');

area.className='sequenceBox';

q.sequence.forEach(item=>{

const div=document.createElement('div');

div.className='sequenceItem';
div.innerHTML=item;

div.onclick=()=>{

if(item===q.answer){
correct();
}else{
wrong();
}

};

area.appendChild(div);

});

options.appendChild(area);

}

}

function check(ans){

if(ans){
correct();
}else{
wrong();
}

}

function correct(){

clearInterval(timer);

feedback.innerHTML="✅ Correct!";
feedback.style.color='#00ff95';

document.getElementById('correctSound').play();

confetti({
particleCount:250,
spread:120
});

score++;
badges++;

document.getElementById('score').innerHTML=score;
document.getElementById('badges').innerHTML=badges;

document.getElementById('nextBtn').style.display='inline-block';

}

function wrong(){

clearInterval(timer);

feedback.innerHTML="❌ Wrong!";
feedback.style.color='red';

document.getElementById('wrongSound').play();

document.getElementById('nextBtn').style.display='inline-block';

}

document.getElementById('nextBtn').onclick=()=>{

current++;

if(current<questions.length){
showQuestion();
}else{
showFinal();
}

};

function showFinal(){

document.getElementById('gameCard').style.display='none';

document.getElementById('finalScreen').style.display='block';

document.getElementById('finalScore').innerHTML=
`⭐ Your Score: ${score}/10`;

let rank='';

if(score===10){
rank='🏆 CHAMPION';
}else if(score>=7){
rank='👍 EXCELLENT';
}else if(score>=4){
rank='🙂 NEED TO IMPROVE';
}else{
rank='📘 BEGINNER';
}

document.getElementById('rank').innerHTML=rank;

confetti({
particleCount:500,
spread:180
});

}

showQuestion();

</script>

</body>
</html>
