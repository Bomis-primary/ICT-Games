<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Paint Shape Matcher</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.min.js"></script>
<style>
:root {
    --paint-blue: #3b82f6;
    --paint-red: #ef4444;
    --paint-yellow: #eab308;
    --paint-green: #10b981;
    --window-border: #1e3a8a;
}
* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
    user-select: none; 
}
body { 
    background: linear-gradient(135deg, #cbd5e1, #94a3b8); 
    min-height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    overflow: hidden; 
}

/* 5-Second Splash Screen */
#splashScreen {
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: #ffffff;
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    z-index: 9999;
    transition: opacity 0.5s ease;
}
#splashScreen img { 
    width: 280px; 
    max-width: 80%;
    animation: bounce 2s infinite ease-in-out; 
}
@keyframes bounce { 
    0%, 100% { transform: translateY(0); } 
    50% { transform: translateY(-10px); } 
}

/* UI Application Shell Box Window */
.app-window { 
    width: 95vw; 
    max-width: 1150px; 
    height: 90vh; 
    background: #f8fafc; 
    border: 4px solid var(--window-border); 
    border-radius: 18px; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
    box-shadow: 0 25px 50px rgba(0,0,0,0.25); 
}
.paint-window-header { 
    background: linear-gradient(to right, #1e3a8a, #3b82f6); 
    color: white; 
    padding: 10px 14px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
}
.window-title-side { 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    font-weight: 700; 
}
.window-title-side img { 
    width: 18px; 
    height: 18px; 
}
.window-control-buttons {
    display: flex;
    gap: 6px;
}
.window-control-buttons img {
    width: 22px;
    height: 22px;
    cursor: pointer;
}

.window-body-content { 
    padding: 16px; 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
    flex-grow: 1; 
    min-height: 0; 
}
.hidden { display: none !important; }

/* Dashboard Cards */
.welcome-card { text-align: center; max-width: 650px; margin: auto; padding: 20px; }
.welcome-card h1 span { 
    background: linear-gradient(135deg, var(--paint-red), var(--paint-blue)); 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
    font-size: 2.8rem; 
    font-weight: 800; 
}

.top-hud { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background: #ffffff; 
    border: 2px solid #cbd5e1; 
    padding: 12px 20px; 
    border-radius: 12px; 
    font-weight: 700; 
}
.game-workspace { 
    display: grid; 
    grid-template-columns: 260px 1fr; 
    gap: 16px; 
    flex-grow: 1; 
    min-height: 0; 
}
.left-panel { 
    background: #ffffff; 
    border: 2px solid #cbd5e1; 
    border-radius: 14px; 
    padding: 15px; 
    display: flex; 
    flex-direction: column; 
    gap: 12px; 
}
.tools-vault { display: flex; flex-direction: column; gap: 10px; }

.tool-btn { 
    background: #f8fafc; 
    border: 2px solid #cbd5e1; 
    padding: 12px; 
    border-radius: 12px; 
    font-weight: 700; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    gap: 12px; 
    width: 100%; 
    transition: all 0.2s; 
}
.tool-btn:hover { background: #f1f5f9; transform: translateY(-1px); }
.tool-btn.active-selected { 
    background: #e0f2fe; 
    border-color: var(--paint-blue); 
    box-shadow: 0 0 8px rgba(59,130,246,0.3); 
}
/* Crucial safety formatting overlay rules */
.tool-btn img, .tool-btn span { pointer-events: none; }
.tool-btn img { width: 32px; height: 32px; object-fit: contain; }

.canvas-container { 
    background: #ffffff; 
    border: 3px solid #cbd5e1; 
    border-radius: 14px; 
    position: relative; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
}
#matchCanvas { width: 100%; flex-grow: 1; background: #ffffff; cursor: pointer; }
.feedback-bar { padding: 10px; border-radius: 10px; font-weight: 700; text-align: center; }
.footer-toast { background: #334155; color: white; padding: 10px; border-radius: 10px; text-align: center; font-weight: 600; }
.btn-primary { 
    background: linear-gradient(135deg, var(--paint-blue), #1d4ed8); 
    color: white; 
    border: none; 
    padding: 12px 32px; 
    border-radius: 25px; 
    font-size: 1.1rem; 
    font-weight: 700; 
    cursor: pointer; 
}
</style>
</head>
<body>

<audio id="audioCorrect" src="assets/correct.mp3" preload="auto"></audio>
<audio id="audioWrong" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="audioClap" src="assets/correct-1.mp3" preload="auto"></audio>

<div id="splashScreen">
    <img src="assets/innovine-logo.png" alt="Logo">
    <h2 style="margin-top:15px; color:#475569;">Loading Paint Shape Matcher...</h2>
</div>

<div class="app-window hidden" id="appMainWrapper">
    <div class="paint-window-header">
        <div class="window-title-side">
            <img src="assets/ms paint.png" alt="Paint">
            <span>Shape Matcher Studio (Chapter 2)</span>
        </div>
        <div class="window-control-buttons">
            <img src="assets/minimize.png" alt="-">
            <img src="assets/maximize.png" alt="[]">
            <img src="assets/close.png" alt="X">
        </div>
    </div>

    <div class="window-body-content">
        <div id="introScreen" class="welcome-card">
            <img src="assets/innovine-logo.png" style="max-width:180px; margin-bottom:15px;" alt="Logo">
            <h1><span>SHAPE MATCHING MYSTERY!</span></h1>
            <p style="margin: 15px 0; color:#475569; font-size:1.1rem;">Pick the right tool that matches the mystery red layout, then tap on it to stamp it perfectly!</p>
            <button class="btn-primary" onclick="startGame()">Start Matching Game</button>
        </div>

        <div id="gamePlayPanel" class="hidden" style="display:flex; flex-direction:column; gap:12px; flex-grow:1; min-height:0;">
            <div class="top-hud">
                <div>⭐ Score: <span id="scoreDisplay" style="color:var(--paint-yellow);">0</span></div>
                <div>🎬 Task: <span id="levelTitle" style="color:var(--paint-blue);">Level 1</span></div>
                <div>🎯 Goal: <span id="levelObjective" style="color:var(--paint-green);">Loading...</span></div>
            </div>
            <div class="game-workspace">
                <div class="left-panel">
                    <div class="tools-vault">
                        <button class="tool-btn" id="tool-triangle" onclick="selectTool('tool-triangle')">
                            <img src="assets/triangle.png"><span>Triangle Tool</span>
                        </button>
                        <button class="tool-btn" id="tool-text" onclick="selectTool('tool-text')">
                            <img src="assets/text-tool.png"><span>Text Tool (A)</span>
                        </button>
                        <button class="tool-btn" id="tool-pencil" onclick="selectTool('tool-pencil')">
                            <img src="assets/pencil.png"><span>Pencil Tool</span>
                        </button>
                    </div>
                </div>
                <div class="canvas-container">
                    <canvas id="matchCanvas"></canvas>
                </div>
            </div>
            <div class="feedback-bar hidden" id="feedbackNotification"></div>
            <div class="footer-toast" id="statusBarText">Choose a tool first!</div>
        </div>

        <div id="resultScreenCard" class="welcome-card hidden">
            <h1 style="color:var(--paint-green);">🏆 Shape Wizard Certificate!</h1>
            <p style="margin:25px 0; font-size:1.25rem;" id="victoryMessageText"></p>
            <button class="btn-primary" onclick="location.reload()">Play Playground Again</button>
        </div>
    </div>
</div>

<script>
setTimeout(() => {
    document.getElementById("splashScreen").style.opacity = "0";
    setTimeout(() => { 
        document.getElementById("splashScreen").style.setProperty("display", "none", "important"); 
        document.getElementById("appMainWrapper").classList.remove("hidden"); 
    }, 500);
}, 5000);

const levels = {
    1: { 
        title: "Level 1: The Missing Roof", 
        objective: "Find the Triangle Tool to fix the roof outline!", 
        required: "tool-triangle", 
        hint: "Look for the 3-sided shape icon!", 
        draw: (ctx, w, h) => { 
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 4; ctx.setLineDash([6, 6]); 
            ctx.beginPath(); ctx.moveTo(w/2 - 80, h/2 + 20); ctx.lineTo(w/2, h/2 - 50); ctx.lineTo(w/2 + 80, h/2 + 20); ctx.closePath(); ctx.stroke(); 
            ctx.setLineDash([]); ctx.strokeStyle = "#334155"; ctx.strokeRect(w/2 - 60, h/2 + 20, 120, 80); 
        }, 
        hit: (x, y, w, h) => Math.abs(x - w/2) < 100 && Math.abs(y - h/2) < 80, 
        solve: (ctx, w, h) => { 
            ctx.fillStyle = "#eab308"; ctx.beginPath(); ctx.moveTo(w/2 - 80, h/2 + 20); ctx.lineTo(w/2, h/2 - 50); ctx.lineTo(w/2 + 80, h/2 + 20); ctx.closePath(); ctx.fill(); ctx.stroke(); 
        } 
    },
    2: { 
        title: "Level 2: The Signboard Letter", 
        objective: "Find the Text Tool (A) to write inside the greeting box!", 
        required: "tool-text", 
        hint: "The Text Tool looks like an 'A' letter!", 
        draw: (ctx, w, h) => { 
            ctx.strokeStyle = "#334155"; ctx.lineWidth = 4; ctx.strokeRect(w/2 - 100, h/2 - 40, 200, 80); 
            ctx.strokeStyle = "#ef4444"; ctx.setLineDash([4, 4]); ctx.strokeRect(w/2 - 80, h/2 - 20, 160, 40); ctx.setLineDash([]); 
        }, 
        hit: (x, y, w, h) => Math.abs(x - w/2) < 120 && Math.abs(y - h/2) < 60, 
        solve: (ctx, w, h) => { 
            ctx.fillStyle = "#1e3a8a"; ctx.font = "bold 24px sans-serif"; ctx.fillText("WELCOME!", w/2 - 60, h/2 + 8); 
        } 
    },
    3: { 
        title: "Level 3: Draw the Line Trail", 
        objective: "Find the Pencil Tool to fix the straight mountain vector outline!", 
        required: "tool-pencil", 
        hint: "The Pencil tool is sharp and sketches fine details!", 
        draw: (ctx, w, h) => { 
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 5; ctx.setLineDash([8, 8]); 
            ctx.beginPath(); ctx.moveTo(w/2 - 150, h/2 + 60); ctx.lineTo(w/2, h/2 - 60); ctx.lineTo(w/2 + 150, h/2 + 60); ctx.stroke(); ctx.setLineDash([]); 
        }, 
        hit: (x, y, w, h) => Math.abs(y - h/2) < 120, 
        solve: (ctx, w, h) => { 
            ctx.strokeStyle = "#10b981"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(w/2 - 150, h/2 + 60); ctx.lineTo(w/2, h/2 - 60); ctx.lineTo(w/2 + 150, h/2 + 60); ctx.stroke(); 
        } 
    }
};

let currentLevel = 1, score = 0, selectedTool = null, active = true, canvas, ctx;

function playSound(id) { 
    let a = document.getElementById(id); 
    if(a) { a.currentTime = 0; a.play().catch(()=>{}); } 
}

function startGame() { 
    playSound("audioCorrect"); 
    document.getElementById("introScreen").classList.add("hidden"); 
    document.getElementById("gamePlayPanel").classList.remove("hidden"); 
    canvas = document.getElementById("matchCanvas"); 
    ctx = canvas.getContext("2d"); 
    let b = canvas.parentElement.getBoundingClientRect(); 
    canvas.width = b.width; 
    canvas.height = b.height - 20; 
    
    canvas.addEventListener("mousedown", handleTap);
    canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const t = e.touches[0]; const r = canvas.getBoundingClientRect();
        handleTap({ offsetX: t.clientX - r.left, offsetY: t.clientY - r.top });
    });
    loadLevel(); 
}

function loadLevel() { 
    active = true; 
    selectedTool = null; 
    document.getElementById("scoreDisplay").innerText = score; 
    document.getElementById("feedbackNotification").classList.add("hidden"); 
    document.querySelectorAll(".tool-btn").forEach(b => b.classList.remove("active-selected")); 
    let d = levels[currentLevel]; 
    document.getElementById("levelTitle").innerText = d.title; 
    document.getElementById("levelObjective").innerText = d.objective; 
    ctx.clearRect(0,0,canvas.width,canvas.height); 
    d.draw(ctx, canvas.width, canvas.height); 
}

function selectTool(id) { 
    if(!active) return; 
    selectedTool = id; 
    document.querySelectorAll(".tool-btn").forEach(b => b.classList.remove("active-selected")); 
    document.getElementById(id).classList.add("active-selected"); 
    playSound("audioCorrect"); 
}

function handleTap(e) { 
    if(!active) return; 
    let d = levels[currentLevel]; 
    if(!selectedTool) { 
        document.getElementById("statusBarText").innerText = "⚠️ Pick a tool first from the side box!";
        playSound("audioWrong"); 
        return; 
    } 
    if(selectedTool !== d.required) { 
        playSound("audioWrong"); 
        let f = document.getElementById("feedbackNotification"); 
        f.className="feedback-bar"; f.style.background="#f2dede"; f.style.color="#a94442"; 
        f.innerText=`❌ Wrong Tool! Hint: ${d.hint}`; 
        f.classList.remove("hidden"); 
        return; 
    } 
    if(d.hit(e.offsetX, e.offsetY, canvas.width, canvas.height)) { 
        active = false; 
        score += 100; 
        d.solve(ctx, canvas.width, canvas.height); 
        playSound("audioCorrect"); 
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } }); 
        let f = document.getElementById("feedbackNotification"); 
        f.className="feedback-bar"; f.style.background="#dff0d8"; f.style.color="#3c763d"; 
        f.innerText="🎉 Fantastic Shape Match! Level Completed."; 
        f.classList.remove("hidden"); 
        setTimeout(() => { 
            currentLevel++; 
            if(levels[currentLevel]) { 
                loadLevel(); 
            } else { 
                document.getElementById("gamePlayPanel").classList.add("hidden"); 
                document.getElementById("resultScreenCard").classList.remove("hidden"); 
                playSound("audioClap"); 
                document.getElementById("victoryMessageText").innerHTML = `Incredible! You completed all shapes using MS Paint tools! <br><br><strong>Final Score: ${score} Points!</strong>`; 
            } 
        }, 3000); 
    } else {
        document.getElementById("statusBarText").innerText = "Missed the target! Click directly on the red dotted guidelines area.";
        playSound("audioWrong");
    }
}
</script>
</body>
</html>
