<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exploring the Desktop</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f7f4; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { width: 800px; height: 600px; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); position: relative; overflow: hidden; border: 4px solid #00a896; }
        .screen { width: 100%; height: 100%; display: none; position: absolute; top: 0; left: 0; padding: 30px; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        /* Screen Specific Styles */
        #logo-screen { display: flex; background: #ffffff; }
        #logo-screen img { max-width: 350px; animation: pulse 1.5s infinite; }
        
        #instruction-screen { background: #e8f1f5; }
        h1 { color: #023e8a; font-size: 32px; margin-bottom: 10px; }
        h2 { color: #0077b6; font-size: 24px; }
        p { color: #333; font-size: 18px; line-height: 1.5; max-width: 600px; }
        
        .btn { background: #ffb703; color: #023047; border: none; padding: 15px 40px; font-size: 22px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; margin-top: 20px; }
        .btn:hover { transform: scale(1.05); background: #fb8500; }
        
        /* HUD / Scoreboard */
        #hud { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; color: #023047; margin-bottom: 20px; background: #e8f1f5; padding: 10px 20px; border-radius: 8px; }
        
        /* Game Screen layout */
        #game-screen { justify-content: flex-start; }
        .question-box { font-size: 24px; color: #023e8a; font-weight: bold; margin: 20px 0; background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid #ffb703; width: 100%; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 650px; margin-top: 20px; }
        .option-btn { background: #ffffff; border: 3px solid #0077b6; border-radius: 12px; padding: 20px; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.2s; color: #0077b6; }
        .option-btn:hover { background: #0077b6; color: white; }
        
        /* Animations */
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. Logo Screen (First 5 Seconds) -->
    <div id="logo-screen" class="screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>

    <!-- 2. Instruction Screen (Triggered After Logo) -->
    <div id="instruction-screen" class="screen">
        <h1>Exploring the Desktop! 🖥️</h1>
        <hr style="width:80%; border: 1px solid #00a896; margin: 20px 0;">
        <p>Welcome, Little Explorer! Let's learn about the computer screen. Look at the questions carefully and click on the correct answer. Try to score a perfect 5 out of 5!</p>
        <button class="btn" onclick="startGame()">Let's Play!</button>
    </div>

    <!-- 3. Interactive Quiz Game Screen -->
    <div id="game-screen" class="screen">
        <div id="hud">
            <span id="question-number">Question: 1/5</span>
            <span id="score-display">Score: 0</span>
        </div>
        <div class="question-box" id="question-text">Loading question...</div>
        <div class="options-container" id="options-box">
            <!-- Options dynamically injected -->
        </div>
    </div>

    <!-- 4. Final Score / Completion Screen -->
    <div id="completion-screen" class="screen">
        <h1> 🎉 Game Complete! 🎉</h1>
        <p style="font-size: 24px; font-weight: bold;">You are a Desktop Expert!</p>
        <h2 id="final-score" style="font-size: 40px; margin: 15px 0; color: #00a896;">Score: 0 / 5</h2>
        <button class="btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<!-- Audio Asset Handling Elements -->
<audio id="sound-correct" src="assets/correct.mp3" preload="auto"></audio>
<audio id="sound-wrong" src="assets/wrong.mp3" preload="auto"></audio>

<script>
    // Game Questions pool (Page 56-63 specific)
    const questionsData = [
        { q: "What is the very first screen called when you switch on a computer?", options: ["Desktop", "MS Paint", "Mousepad", "Calculator"], correct: 0 },
        { q: "What are the small pictures sitting on the computer desktop called?", options: ["Stickers", "Icons", "Toys", "Buttons"], correct: 1 },
        { q: "Where can you find the long horizontal bar located at the bottom of the screen?", options: ["Title bar", "Taskbar", "Ribbon", "Scroll Wheel"], correct: 1 },
        { q: "Which special button launches the main menu and helps open programs?", options: ["Close Button", "Start Button", "Minimize Button", "Save Button"], correct: 1 },
        { q: "Where on the taskbar can you see the current date and time widget?", options: ["On the far left", "On the far right", "Right in the middle", "Inside the icons"], correct: 1 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    // Phase 1: Show branding screen exclusively for 5 seconds
    window.onload = function() {
        setTimeout(() => {
            document.getElementById('logo-screen').style.display = 'none';
            document.getElementById('instruction-screen').style.display = 'flex';
        }, 5000);
    };

    // Phase 2: Core gameplay instantiation
    function startGame() {
        document.getElementById('instruction-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        currentQuestionIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questionsData.length) {
            endGame();
            return;
        }

        // Reset HUD element displays
        document.getElementById('question-number').innerText = `Question: ${currentQuestionIndex + 1}/${questionsData.length}`;
        document.getElementById('score-display').innerText = `Score: ${score}`;
        
        let currentData = questionsData[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentData.q;
        
        let optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = "";

        currentData.options.forEach((option, index) => {
            let button = document.createElement('button');
            button.className = "option-btn";
            button.innerText = option;
            button.onclick = () => checkAnswer(index);
            optionsBox.appendChild(button);
        });
    }

    function checkAnswer(selectedIndex) {
        let currentData = questionsData[currentQuestionIndex];
        let correctAudio = document.getElementById('sound-correct');
        let wrongAudio = document.getElementById('sound-wrong');

        if (selectedIndex === currentData.correct) {
            score++;
            try { correctAudio.currentTime = 0; correctAudio.play(); } catch(e){}
        } else {
            try { wrongAudio.currentTime = 0; wrongAudio.play(); } catch(e){}
        }

        // Prevent endless loops: step forward to the next index immediately 
        currentQuestionIndex++;
        setTimeout(loadQuestion, 600); 
    }

    // Phase 3: Final Score Completion State
    function endGame() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('completion-screen').style.display = 'flex';
        document.getElementById('final-score').innerText = `Score: ${score} / ${questionsData.length}`;
    }

    function restartGame() {
        document.getElementById('completion-screen').style.display = 'none';
        startGame();
    }
</script>

</body>
</html>
