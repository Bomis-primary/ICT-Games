<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tux Paint Fun Challenge</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS', sans-serif;
}

body{
background:linear-gradient(to bottom,#b3f0ff,#ffe6ff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.game-box{
width:100%;
max-width:950px;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
text-align:center;
border:8px solid #ffcc00;
}

.logo{
width:120px;
margin-bottom:10px;
}

h1{
color:#ff6600;
margin-bottom:20px;
}

#question{
font-size:1.5rem;
margin:20px 0;
min-height:80px;
color:#333;
}

#options{
margin-top:20px;
}

.word-card{
display:inline-block;
padding:15px 25px;
background:#4da6ff;
color:white;
border-radius:15px;
margin:10px;
cursor:pointer;
font-size:1.2rem;
transition:0.3s;
}

.word-card:hover{
transform:scale(1.05);
background:#0077ff;
}

.image-grid{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.image-grid img{
width:180px;
height:180px;
object-fit:contain;
background:#fff;
padding:10px;
border-radius:20px;
border:5px solid transparent;
cursor:pointer;
transition:0.3s;
}

.image-grid img:hover{
transform:scale(1.05);
}

.drop-zone{
width:250px;
height:90px;
border:3px dashed #666;
border-radius:15px;
margin:20px auto;
display:flex;
justify-content:center;
align-items:center;
font-size:1.1rem;
background:#fff8dc;
}

.drag-item{
display:inline-block;
padding:14px 20px;
background:#4da6ff;
color:white;
border-radius:15px;
cursor:grab;
margin:10px;
font-size:1.1rem;
}

#scoreBoard{
margin-top:20px;
font-size:1.3rem;
}

#progress{
margin-top:10px;
font-size:1rem;
}

#restartBtn{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:15px;
background:#ff9900;
color:white;
font-size:1.2rem;
cursor:pointer;
display:none;
}

#restartBtn:hover{
background:#ff7700;
}

.result{
font-size:2rem;
color:#ff3300;
margin-top:25px;
}

@media(max-width:768px){

.image-grid img{
width:130px;
height:130px;
}

#question{
font-size:1.2rem;
}

}

</style>
</head>

<body>

<div class="game-box">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎨 Tux Paint Fun Challenge 🎨</h1>

<div id="question"></div>

<div id="options"></div>

<div id="progress"></div>

<div id="scoreBoard">
⭐ Score: <span id="score">0</span>
</div>

<button id="restartBtn">🔄 Restart Game</button>

<div class="result" id="result"></div>

</div>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

const questions = [

{
type:"unscramble",
question:"Unscramble the word for a drawing software.",
scrambled:"XTU TPIAN",
answer:"TUX PAINT"
},

{
type:"unscramble",
question:"Unscramble the tool name.",
scrambled:"HBSUR",
answer:"BRUSH"
},

{
type:"unscramble",
question:"Unscramble the word.",
scrambled:"RSEEAR",
answer:"ERASER"
},

{
type:"guessimage",
question:"Click on the Brush Tool.",
images:[
{src:"assets/brushtool.PNG",correct:true},
{src:"assets/eraser.PNG",correct:false},
{src:"assets/undo.PNG",correct:false}
]
},

{
type:"guessimage",
question:"Click on the Eraser Tool.",
images:[
{src:"assets/eraser.PNG",correct:true},
{src:"assets/brush.PNG",correct:false},
{src:"assets/lines.PNG",correct:false}
]
},

{
type:"guessimage",
question:"Click on the Lines Tool.",
images:[
{src:"assets/lines.PNG",correct:true},
{src:"assets/undo.PNG",correct:false},
{src:"assets/brushtool.PNG",correct:false}
]
},

{
type:"dragdrop",
question:"Drag the correct tool name to the picture.",
answer:"Brush Tool",
image:"assets/brushtool.PNG"
},

{
type:"dragdrop",
question:"Drag the correct tool name to the picture.",
answer:"Eraser Tool",
image:"assets/eraser.PNG"
},

{
type:"memory",
question:"Find the matching pair.",
pairs:[
{word:"Brush",image:"assets/brushtool.PNG"},
{word:"Eraser",image:"assets/eraser.PNG"}
]
},

{
type:"tapfast",
question:"Tap the correct tool quickly!",
correct:"Undo Tool",
options:["Undo Tool","Brush Tool","Paint Tool"]
}

];

questions.sort(()=>Math.random()-0.5);

let currentQuestion=0;
let score=0;

const questionEl=document.getElementById("question");
const optionsEl=document.getElementById("options");
const progressEl=document.getElementById("progress");
const scoreEl=document.getElementById("score");
const restartBtn=document.getElementById("restartBtn");
const resultEl=document.getElementById("result");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

function loadQuestion(){

optionsEl.innerHTML="";

let q=questions[currentQuestion];

questionEl.innerHTML=`Q${currentQuestion+1}. ${q.question}`;

progressEl.innerHTML=`Question ${currentQuestion+1} / ${questions.length}`;

if(q.type==="unscramble"){

let scramble=document.createElement("h2");

scramble.style.color="#ff6600";

scramble.innerText=q.scrambled;

optionsEl.appendChild(scramble);

let input=document.createElement("input");

input.type="text";

input.placeholder="Type Answer";

input.style.padding="15px";
input.style.marginTop="20px";
input.style.fontSize="1.1rem";
input.style.borderRadius="10px";

optionsEl.appendChild(input);

let btn=document.createElement("button");

btn.innerText="Check";

btn.classList.add("word-card");

btn.onclick=()=>{

if(input.value.toUpperCase()===q.answer){

correctAnswer();

}
else{

wrongAnswer();

}

};

optionsEl.appendChild(btn);

}

else if(q.type==="guessimage"){

let grid=document.createElement("div");

grid.classList.add("image-grid");

q.images.forEach(imgData=>{

let img=document.createElement("img");

img.src=imgData.src;

img.onclick=()=>{

if(imgData.correct){

img.style.border="5px solid green";

correctAnswer();

}
else{

img.style.border="5px solid red";

wrongAnswer();

}

};

grid.appendChild(img);

});

optionsEl.appendChild(grid);

}

else if(q.type==="dragdrop"){

let img=document.createElement("img");

img.src=q.image;

img.style.width="180px";
img.style.marginTop="15px";

optionsEl.appendChild(img);

let drop=document.createElement("div");

drop.classList.add("drop-zone");

drop.innerText="Drop Correct Tool Here";

optionsEl.appendChild(drop);

["Brush Tool","Lines Tool","Eraser Tool"].forEach(tool=>{

let drag=document.createElement("div");

drag.classList.add("drag-item");

drag.draggable=true;

drag.innerText=tool;

drag.addEventListener("dragstart",(e)=>{

e.dataTransfer.setData("text",tool);

});

optionsEl.appendChild(drag);

});

drop.addEventListener("dragover",(e)=>{

e.preventDefault();

});

drop.addEventListener("drop",(e)=>{

e.preventDefault();

let data=e.dataTransfer.getData("text");

if(data===q.answer){

drop.style.background="lightgreen";

drop.innerHTML="✅ Correct!";

correctAnswer();

}
else{

drop.style.background="pink";

wrongAnswer();

}

});

}

else if(q.type==="memory"){

let cards=[];

q.pairs.forEach(pair=>{

cards.push(pair.word);

cards.push(pair.image);

});

cards.sort(()=>Math.random()-0.5);

let selected=[];

let matched=[];

let grid=document.createElement("div");

grid.classList.add("image-grid");

cards.forEach(card=>{

let div=document.createElement("div");

div.classList.add("word-card");

div.style.width="150px";
div.style.height="150px";
div.style.display="flex";
div.style.justifyContent="center";
div.style.alignItems="center";

div.innerHTML="?";

div.onclick=()=>{

if(div.innerHTML!=="?") return;

if(card.includes(".PNG")){

div.innerHTML=`<img src="${card}" width="80">`;

}
else{

div.innerHTML=card;

}

selected.push({div,card});

if(selected.length===2){

setTimeout(()=>{

let first=selected[0].card;
let second=selected[1].card;

if(
(first==="Brush" && second==="assets/brush.PNG") ||
(second==="Brush" && first==="assets/brush.PNG") ||
(first==="Eraser" && second==="assets/eraser.PNG") ||
(second==="Eraser" && first==="assets/eraser.PNG")
){

correctSound.play();

score++;

scoreEl.innerHTML=score;

confetti({
particleCount:100,
spread:70
});

matched.push(first);

if(matched.length===2){

setTimeout(nextQuestion,1500);

}

}
else{

selected[0].div.innerHTML="?";
selected[1].div.innerHTML="?";

wrongSound.play();

}

selected=[];

},800);

}

};

grid.appendChild(div);

});

optionsEl.appendChild(grid);

}

else if(q.type==="tapfast"){

q.options.sort(()=>Math.random()-0.5);

q.options.forEach(option=>{

let btn=document.createElement("button");

btn.classList.add("option-btn");

btn.innerText=option;

btn.onclick=()=>{

if(option===q.correct){

correctAnswer();

}
else{

wrongAnswer();

}

};

optionsEl.appendChild(btn);

});

}

}

function correctAnswer(){

correctSound.play();

score++;

scoreEl.innerHTML=score;

confetti({
particleCount:150,
spread:90
});

setTimeout(nextQuestion,1500);

}

function wrongAnswer(){

wrongSound.play();

setTimeout(nextQuestion,1500);

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

loadQuestion();

}
else{

showResult();

}

}

function showResult(){

questionEl.style.display="none";
optionsEl.style.display="none";
progressEl.style.display="none";

resultEl.innerHTML=`
🎉 Game Finished! <br><br>
Your Score: ${score} / ${questions.length}
`;

restartBtn.style.display="inline-block";

}

restartBtn.onclick=()=>{

location.reload();

};

loadQuestion();

</script>

</body>
</html>
