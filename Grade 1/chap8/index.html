<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 1 MS Paint Interactive Game</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS', sans-serif;
}

body{
background:url('https://img.freepik.com/free-vector/cartoon-school-background_23-2149464863.jpg') no-repeat center center/cover;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.game-container{
width:100%;
max-width:950px;
background:rgba(255,255,255,0.96);
border-radius:25px;
padding:25px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
text-align:center;
}

h1{
color:#ff6600;
margin-bottom:20px;
font-size:2rem;
}

#question{
font-size:1.5rem;
margin:20px 0;
color:#333;
min-height:80px;
}

.option-btn{
display:block;
width:90%;
margin:10px auto;
padding:14px;
border:none;
border-radius:15px;
background:#4da6ff;
color:white;
font-size:1.1rem;
cursor:pointer;
transition:0.3s;
}

.option-btn:hover{
background:#0077ff;
transform:scale(1.03);
}

.correct{
background:green !important;
}

.wrong{
background:red !important;
}

#score{
font-size:1.3rem;
margin-top:20px;
}

#progress{
margin-top:10px;
font-size:1rem;
}

.truefalse-container button{
padding:14px 30px;
margin:15px;
font-size:1.2rem;
border:none;
border-radius:15px;
cursor:pointer;
background:#ff9900;
color:white;
}

.truefalse-container button:hover{
background:#ff7700;
}

.radio-container{
margin-top:20px;
text-align:left;
padding-left:30%;
}

.radio-container label{
display:block;
margin:15px 0;
font-size:1.2rem;
cursor:pointer;
}

.drag-container{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.drag-item{
padding:15px 20px;
background:#4da6ff;
color:white;
border-radius:15px;
cursor:grab;
font-size:1.1rem;
}

.drop-box{
width:250px;
height:80px;
border:3px dashed #666;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
background:#fff8dc;
font-size:1rem;
padding:10px;
}

.result{
font-size:2rem;
color:#ff3300;
margin-top:25px;
}

#restartBtn{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:15px;
background:#ff9900;
color:white;
font-size:1.2rem;
cursor:pointer;
display:none;
}

#restartBtn:hover{
background:#ff7700;
}

.word-box{
display:inline-block;
padding:10px 20px;
background:#4da6ff;
color:white;
border-radius:12px;
margin:10px;
cursor:pointer;
font-size:1.1rem;
}

.blank-space{
display:inline-block;
min-width:120px;
padding:8px;
border-bottom:3px solid #333;
margin-left:10px;
font-weight:bold;
color:#ff3300;
}

@media(max-width:768px){

.radio-container{
padding-left:10%;
}

.drag-container{
flex-direction:column;
align-items:center;
}

h1{
font-size:1.5rem;
}

#question{
font-size:1.2rem;
}

}

</style>
</head>

<body>

<div class="game-container">

<h1>🎨 MS Paint Fun Learning 🎨</h1>

<div id="question"></div>

<div id="options"></div>

<div id="progress"></div>

<div id="score">⭐ Score: 0</div>

<button id="restartBtn">🔄 Restart Game</button>

<div class="result" id="result"></div>

</div>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

const questions = [

{
type:"truefalse",
question:"CTRL + C is used for Copy.",
answer:"True"
},

{
type:"truefalse",
question:"CTRL + V is used for Save.",
answer:"False"
},

{
type:"radio",
question:"Choose the correct shortcut key for SAVE.",
options:["CTRL + X","CTRL + S","CTRL + V"],
answer:"CTRL + S"
},

{
type:"radio",
question:"Choose the correct shortcut key for OPEN.",
options:["CTRL + O","CTRL + C","CTRL + P"],
answer:"CTRL + O"
},

{
type:"fillblank",
question:"Shortcut key for CUT is",
correctWord:"CTRL + X",
words:["CTRL + V","CTRL + X","CTRL + S"]
},

{
type:"fillblank",
question:"Shortcut key for PASTE is",
correctWord:"CTRL + V",
words:["CTRL + C","CTRL + O","CTRL + V"]
},

{
type:"dragdrop",
question:"Drag the correct tool to its work.",
pairs:[
{drag:"Brush Tool",drop:"Used for Drawing"},
{drag:"Eraser Tool",drop:"Used for Removing Mistakes"}
]
},

{
type:"dragdrop",
question:"Match the shortcut key correctly.",
pairs:[
{drag:"CTRL + C",drop:"Copy"},
{drag:"CTRL + V",drop:"Paste"}
]
},

{
type:"truefalse",
question:"Brush Tool is used for drawing pictures.",
answer:"True"
},

{
type:"radio",
question:"Choose the correct tool used for erasing.",
options:["Brush Tool","Text Tool","Eraser Tool"],
answer:"Eraser Tool"
}

];

questions.sort(()=>Math.random()-0.5);

let currentQuestion=0;
let score=0;

const questionEl=document.getElementById("question");
const optionsEl=document.getElementById("options");
const progressEl=document.getElementById("progress");
const scoreEl=document.getElementById("score");
const resultEl=document.getElementById("result");
const restartBtn=document.getElementById("restartBtn");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

correctSound.volume=1.0;
wrongSound.volume=1.0;

function loadQuestion(){

optionsEl.innerHTML="";

let q=questions[currentQuestion];

questionEl.innerHTML=`Q${currentQuestion+1}. ${q.question}`;

progressEl.innerHTML=`Question ${currentQuestion+1} / ${questions.length}`;

if(q.type==="truefalse"){

let container=document.createElement("div");

container.classList.add("truefalse-container");

["True","False"].forEach(option=>{

let btn=document.createElement("button");

btn.innerText=option;

btn.onclick=()=>checkAnswer(btn,option,q.answer);

container.appendChild(btn);

});

optionsEl.appendChild(container);

}

else if(q.type==="radio"){

let container=document.createElement("div");

container.classList.add("radio-container");

q.options.forEach(option=>{

let label=document.createElement("label");

let radio=document.createElement("input");

radio.type="radio";

radio.name="radioQuestion";

radio.value=option;

radio.onclick=()=>{

checkRadio(option,q.answer);

};

label.appendChild(radio);

label.append(" "+option);

container.appendChild(label);

});

optionsEl.appendChild(container);

}

else if(q.type==="fillblank"){

let sentence=document.createElement("div");

sentence.style.fontSize="1.3rem";
sentence.style.marginTop="20px";

sentence.innerHTML=`
${q.question}
<span class="blank-space" id="blankSpace">_____</span>
`;

optionsEl.appendChild(sentence);

let wordContainer=document.createElement("div");

q.words.forEach(word=>{

let wordBox=document.createElement("div");

wordBox.classList.add("word-box");

wordBox.innerText=word;

wordBox.onclick=()=>{

document.getElementById("blankSpace").innerText=word;

if(word===q.correctWord){

correctAnswer();

}
else{

wrongAnswer();

}

};

wordContainer.appendChild(wordBox);

});

optionsEl.appendChild(wordContainer);

}

else if(q.type==="dragdrop"){

let dragContainer=document.createElement("div");

dragContainer.classList.add("drag-container");

q.pairs.forEach((pair,index)=>{

let drag=document.createElement("div");

drag.classList.add("drag-item");

drag.draggable=true;

drag.id="drag"+index;

drag.innerText=pair.drag;

drag.addEventListener("dragstart",(e)=>{

e.dataTransfer.setData("text",drag.id);

});

dragContainer.appendChild(drag);

});

optionsEl.appendChild(dragContainer);

q.pairs.forEach((pair,index)=>{

let drop=document.createElement("div");

drop.classList.add("drop-box");

drop.innerText=pair.drop;

drop.dataset.answer=pair.drag;

drop.addEventListener("dragover",(e)=>{

e.preventDefault();

});

drop.addEventListener("drop",(e)=>{

e.preventDefault();

let draggedId=e.dataTransfer.getData("text");

let draggedElement=document.getElementById(draggedId);

if(draggedElement.innerText===drop.dataset.answer){

drop.style.background="lightgreen";

drop.innerHTML=`✅ ${pair.drop}`;

draggedElement.style.display="none";

correctSound.play();

score++;

scoreEl.innerHTML=`⭐ Score: ${score}`;

confetti({
particleCount:120,
spread:80
});

}

else{

drop.style.background="pink";

wrongSound.play();

}

checkDragCompletion();

});

optionsEl.appendChild(drop);

});

}

}

function checkAnswer(button,selected,answer){

if(selected===answer){

button.classList.add("correct");

correctAnswer();

}
else{

button.classList.add("wrong");

wrongAnswer();

}

}

function checkRadio(selected,answer){

if(selected===answer){

correctAnswer();

}
else{

wrongAnswer();

}

}

function correctAnswer(){

correctSound.play();

score++;

scoreEl.innerHTML=`⭐ Score: ${score}`;

confetti({
particleCount:150,
spread:90
});

setTimeout(nextQuestion,1500);

}

function wrongAnswer(){

wrongSound.play();

setTimeout(nextQuestion,1500);

}

function checkDragCompletion(){

let hidden=document.querySelectorAll('.drag-item[style*="display: none"]');

let q=questions[currentQuestion];

if(hidden.length===q.pairs.length){

setTimeout(nextQuestion,1500);

}

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

loadQuestion();

}
else{

showResult();

}

}

function showResult(){

questionEl.style.display="none";
optionsEl.style.display="none";
progressEl.style.display="none";

resultEl.innerHTML=`
🎉 Game Finished! <br><br>
Your Score: ${score} / ${questions.length}
`;

restartBtn.style.display="inline-block";

}

restartBtn.onclick=()=>{

location.reload();

};

loadQuestion();

</script>

</body>
</html>
