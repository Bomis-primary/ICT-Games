<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formatting Fun Kingdom</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS',cursive;
}

body{

background:linear-gradient(135deg,#ffecd2,#fcb69f,#a18cd1,#fbc2eb);
min-height:100vh;
padding:10px;
display:flex;
justify-content:center;
align-items:center;

}

#gameBox{

width:100%;
max-width:1300px;
background:white;
border-radius:30px;
padding:20px;
box-shadow:0 10px 35px rgba(0,0,0,0.3);

}

.logo{

width:120px;
display:block;
margin:auto;
margin-bottom:10px;

}

.screen{
display:none;
animation:fade 0.5s;
}

.active{
display:block;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

h1,h2,h3{

text-align:center;
color:#6a1b9a;
margin-bottom:15px;

}

.btn{

background:linear-gradient(45deg,#ff7043,#ff4081);
color:white;
border:none;
padding:14px 24px;
border-radius:40px;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin:10px;
transition:0.3s;

}

.btn:hover{

transform:scale(1.05);

}

input{

padding:14px;
width:90%;
max-width:350px;
border-radius:12px;
border:2px solid #ccc;
font-size:18px;
margin-top:15px;

}

.score{

font-size:28px;
font-weight:bold;
text-align:center;
color:#ff6f00;
margin:10px 0;

}

.question{

font-size:30px;
font-weight:bold;
text-align:center;
margin:20px 0;
color:#4a148c;

}

.option-container{

display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;

}

.option{

background:#81d4fa;
padding:16px 22px;
border-radius:20px;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:0.3s;

}

.option:hover{

transform:scale(1.08);
background:#4fc3f7;

}

.feedback{

font-size:28px;
font-weight:bold;
text-align:center;
margin-top:20px;
min-height:50px;

}

.badge{

font-size:40px;
text-align:center;
margin-top:10px;

}

.progress{

width:100%;
height:20px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin:20px 0;

}

.progress-bar{

height:100%;
width:0%;
background:linear-gradient(90deg,#00c853,#64dd17);
transition:0.5s;

}

.kingdom-box{

background:#fff8e1;
padding:25px;
border-radius:25px;
margin-top:20px;
border:5px dashed #ff9800;

}

.final-score{

font-size:65px;
font-weight:bold;
text-align:center;
color:#ff6f00;

}

.certificate{

background:#fff8e1;
border:8px dashed #ff9800;
padding:30px;
border-radius:25px;

}

.character{

font-size:70px;
text-align:center;

}

@media(max-width:768px){

.question{
font-size:22px;
}

.option{
width:100%;
font-size:18px;
}

.final-score{
font-size:45px;
}

}

</style>

</head>

<body>

<div id="gameBox">

<audio id="correctSound"
src="assets/correct-1.mp3"></audio>

<audio id="wrongSound"
src="assets/wrong.mp3"></audio>

<!-- INTRO -->

<div class="screen active"
id="intro">

<img src="assets/innovine-logo.png"
class="logo">

<div class="character">🏰</div>

<h1>Formatting Fun Kingdom</h1>

<h3>Grade 2 Interactive Game</h3>

<h3>
Bold • Italic • Underline • Alignment • Bullets
</h3>

<center>

<input type="text"
id="studentName"
placeholder="Enter Student Name">

<br>

<button class="btn"
onclick="startGame()">
🚀 Enter Kingdom
</button>

</center>

</div>

<!-- GAME -->

<div class="screen"
id="gameScreen">

<img src="assets/innovine-logo.png"
class="logo">

<div class="score">
⭐ Stars :
<span id="score">0</span>
</div>

<div class="progress">

<div class="progress-bar"
id="progressBar"></div>

</div>

<div class="character"
id="character">
🧙
</div>

<div class="question"
id="question">
Question
</div>

<div class="kingdom-box">

<div id="gameArea"></div>

</div>

<div class="feedback"
id="feedback"></div>

<div class="badge"
id="badge"></div>

<center>

<button class="btn"
onclick="nextQuestion()">
Next ➜
</button>

</center>

</div>

<!-- FINAL -->

<div class="screen"
id="finalScreen">

<img src="assets/innovine-logo.png"
class="logo">

<div class="certificate">

<h1>🏆 Formatting Champion Certificate</h1>

<h2 id="studentDisplay"></h2>

<div class="final-score"
id="finalScore"></div>

<h2 id="rank"></h2>

<h3>
🌈 You saved the Formatting Kingdom!
</h3>

</div>

<center>

<button class="btn"
onclick="location.reload()">
🔄 Replay
</button>

</center>

</div>

</div>

<script>

let student="";
let score=0;
let currentQuestion=0;

const questions=[

{
type:"mcq",
q:"Which tool makes text dark?",
options:["Bold","Italic","Underline"],
answer:"Bold",
badge:"⭐ Bold Badge"
},

{
type:"mcq",
q:"Which tool slants text?",
options:["Underline","Italic","Bold"],
answer:"Italic",
badge:"🌈 Italic Badge"
},

{
type:"mcq",
q:"Which tool draws line below text?",
options:["Bold","Underline","Redo"],
answer:"Underline",
badge:"✨ Underline Badge"
},

{
type:"mcq",
q:"Which alignment keeps text in center?",
options:["Center","Left","Right"],
answer:"Center",
badge:"🎯 Alignment Badge"
},

{
type:"mcq",
q:"Which alignment starts text from left side?",
options:["Right","Left","Center"],
answer:"Left",
badge:"🏆 Left Align Badge"
},

{
type:"mcq",
q:"Which option creates points in list?",
options:["Bullets","Paste","Save"],
answer:"Bullets",
badge:"🌟 Bullets Badge"
},

{
type:"mcq",
q:"Which command finds a word?",
options:["Find","Copy","Italic"],
answer:"Find",
badge:"🔍 Find Badge"
},

{
type:"mcq",
q:"Which command changes one word into another?",
options:["Replace","Save","Bold"],
answer:"Replace",
badge:"🪄 Replace Badge"
},

{
type:"mcq",
q:"Shortcut key for Copy is?",
options:["Ctrl + C","Ctrl + V","Ctrl + B"],
answer:"Ctrl + C",
badge:"⌨ Copy Master"
},

{
type:"mcq",
q:"Shortcut key for Paste is?",
options:["Ctrl + P","Ctrl + V","Ctrl + U"],
answer:"Ctrl + V",
badge:"📋 Paste Master"
}

];

/* START */

function startGame(){

student=
document.getElementById("studentName").value;

if(student===""){

alert("Please Enter Student Name");
return;

}

showScreen("gameScreen");

loadQuestion();

}

/* SCREEN */

function showScreen(id){

document.querySelectorAll(".screen")
.forEach(screen=>{
screen.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

}

/* LOAD QUESTION */

function loadQuestion(){

updateProgress();

let q=questions[currentQuestion];

document.getElementById("question")
.innerHTML=
"Q"+(currentQuestion+1)+". "+q.q;

let html=`<div class="option-container">`;

q.options.forEach(opt=>{

html+=`
<div class="option"
onclick="checkAnswer('${opt}')">
${opt}
</div>
`;

});

html+=`</div>`;

document.getElementById("gameArea")
.innerHTML=html;

document.getElementById("feedback")
.innerHTML="";

}

/* SCORE */

function updateScore(){

document.getElementById("score")
.innerHTML=score;

}

/* PROGRESS */

function updateProgress(){

let progress=
(currentQuestion/questions.length)*100;

document.getElementById("progressBar")
.style.width=progress+"%";

}

/* CORRECT */

function correctAnswer(badge){

score+=2;

updateScore();

document.getElementById("correctSound").play();

document.getElementById("feedback")
.innerHTML=
"⭐ Correct Answer!";

document.getElementById("feedback")
.style.color="green";

document.getElementById("badge")
.innerHTML=badge;

confetti({
particleCount:180,
spread:120
});

}

/* WRONG */

function wrongAnswer(){

document.getElementById("wrongSound").play();

document.getElementById("feedback")
.innerHTML=
"❌ Wrong Answer";

document.getElementById("feedback")
.style.color="red";

document.getElementById("badge")
.innerHTML="";

}

/* CHECK ANSWER */

function checkAnswer(ans){

let q=questions[currentQuestion];

if(ans===q.answer){

correctAnswer(q.badge);

}else{

wrongAnswer();

}

}

/* NEXT */

function nextQuestion(){

currentQuestion++;

if(currentQuestion>=questions.length){

showFinal();

}else{

loadQuestion();

}

}

/* FINAL */

function showFinal(){

showScreen("finalScreen");

document.getElementById("studentDisplay")
.innerHTML=
"👏 Congratulations "+student;

document.getElementById("finalScore")
.innerHTML=
score+" Stars";

let rank="";

if(score>=18){

rank="🏆 Formatting Kingdom Hero";

}else if(score>=10){

rank="🌟 Writer Wizard";

}else{

rank="👍 Keep Practicing";

}

document.getElementById("rank")
.innerHTML=rank;

confetti({
particleCount:600,
spread:250
});

}

</script>

</body>
</html>
