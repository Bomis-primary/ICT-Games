<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fun With KidPix 1</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

:root{
--primary:#1a73e8;
--secondary:#ff7043;
--success:#43a047;
--danger:#e53935;
--light:#f4f7fb;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS',cursive;
}

body{
background:
linear-gradient(135deg,#ffecd2,#fcb69f,#a1c4fd,#c2e9fb);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow-x:hidden;
}

#gameBox{
width:100%;
max-width:900px;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
position:relative;
overflow:hidden;
}

.logo{
width:130px;
display:block;
margin:auto;
margin-bottom:10px;
}

.screen{
display:none;
animation:fade 0.5s;
}

.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1,h2,h3{
color:var(--primary);
margin-bottom:15px;
text-align:center;
}

.question{
font-size:28px;
font-weight:bold;
text-align:center;
margin:20px 0;
color:#333;
}

.btn{
background:var(--secondary);
color:white;
border:none;
padding:14px 24px;
border-radius:40px;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

input{
padding:14px;
width:90%;
border-radius:12px;
border:2px solid #ccc;
font-size:18px;
margin-top:15px;
}

.scoreBox{
font-size:24px;
font-weight:bold;
color:#ff6f00;
text-align:center;
margin-bottom:10px;
}

.progress{
height:10px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(to right,#00c853,#64dd17);
transition:0.5s;
}

.option-container{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.option{
background:#e3f2fd;
padding:18px;
border-radius:20px;
cursor:pointer;
font-size:20px;
font-weight:bold;
min-width:180px;
transition:0.3s;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.option:hover{
background:#90caf9;
transform:scale(1.05);
}

.memory-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:20px;
}

.card{
height:110px;
background:#90caf9;
border-radius:18px;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
cursor:pointer;
color:white;
transition:0.4s;
}

.card.flipped{
background:#fff3e0;
color:black;
transform:rotateY(180deg);
}

.maze{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
}

.maze-cell{
height:80px;
background:#bbdefb;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.maze-cell:hover{
background:#64b5f6;
}

.crossword{
display:flex;
justify-content:center;
gap:8px;
margin-top:25px;
flex-wrap:wrap;
}

.crossword input{
width:60px;
height:60px;
font-size:28px;
text-align:center;
font-weight:bold;
}

.feedback{
font-size:28px;
font-weight:bold;
margin-top:20px;
height:40px;
text-align:center;
}

.final-score{
font-size:70px;
font-weight:bold;
color:#ff6f00;
margin:20px 0;
text-align:center;
}

.rank{
font-size:28px;
font-weight:bold;
text-align:center;
color:#1565c0;
}

@media(max-width:768px){

.memory-grid{
grid-template-columns:repeat(2,1fr);
}

.maze{
grid-template-columns:repeat(3,1fr);
}

.option{
min-width:140px;
font-size:18px;
}

.question{
font-size:22px;
}

.crossword input{
width:45px;
height:45px;
font-size:22px;
}

}

</style>
</head>

<body>

<div id="gameBox">

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<!-- INTRO -->

<div class="screen active" id="intro">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎨 Fun With KidPix 1</h1>

<h3>Grade 2 | Chapter 4</h3>

<center>
<input type="text" id="studentName"
placeholder="Enter Student Name">
</center>

<center>
<button class="btn" onclick="startGame()">
🚀 Start Game
</button>
</center>

</div>

<!-- MENU -->

<div class="screen" id="menu">

<img src="assets/innovine-logo.png" class="logo">

<div class="scoreBox">
⭐ Score :
<span id="scoreVal">0</span>
</div>

<div class="progress">
<div class="bar" id="progressBar"></div>
</div>

<h1>🎮 Choose Activity</h1>

<center>

<button class="btn" onclick="startMemory()">
🧠 Memory Match
</button>

<br>

<button class="btn" onclick="startMaze()">
🌀 KidPix Maze
</button>

<br>

<button class="btn" onclick="startCrossword()">
✏️ Crossword Puzzle
</button>

</center>

</div>

<!-- MEMORY -->

<div class="screen" id="memoryScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🧠 Memory Match</h1>

<div class="question">
Match the KidPix Tools
</div>

<div class="memory-grid" id="memoryGrid"></div>

<div class="feedback" id="memoryFeedback"></div>

<center>
<button class="btn" onclick="backMenu()">
⬅ Back
</button>
</center>

</div>

<!-- MAZE -->

<div class="screen" id="mazeScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🌀 KidPix Maze</h1>

<div class="question">
Find the Correct Brush Tool
</div>

<div class="maze" id="mazeBoard"></div>

<div class="feedback" id="mazeFeedback"></div>

<center>
<button class="btn" onclick="backMenu()">
⬅ Back
</button>
</center>

</div>

<!-- CROSSWORD -->

<div class="screen" id="crosswordScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>✏️ Crossword Puzzle</h1>

<div class="question">
Complete the word: BRUSH
</div>

<div class="crossword">

<input maxlength="1" id="c1">
<input maxlength="1" id="c2">
<input maxlength="1" id="c3">
<input maxlength="1" id="c4">
<input maxlength="1" id="c5">

</div>

<center>

<button class="btn" onclick="checkCrossword()">
Submit
</button>

</center>

<div class="feedback" id="crosswordFeedback"></div>

<center>

<button class="btn" onclick="showFinal()">
🏁 Finish Game
</button>

</center>

</div>

<!-- FINAL -->

<div class="screen" id="finalScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🏆 Congratulations</h1>

<h2 id="studentDisplay"></h2>

<div class="final-score" id="finalScore"></div>

<div class="rank" id="rank"></div>

<center>

<button class="btn" onclick="location.reload()">
🔄 Play Again
</button>

</center>

</div>

</div>

<script>

let score=0;
let student="";

/* START */

function startGame(){

student=document.getElementById("studentName").value;

if(student===""){
alert("Please Enter Student Name");
return;
}

showScreen("menu");

}

/* SCREEN */

function showScreen(id){

document.querySelectorAll(".screen")
.forEach(screen=>{
screen.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

}

/* SCORE */

function updateScore(){

document.getElementById("scoreVal").innerHTML=score;

let progress=(score/10)*100;

if(progress>100) progress=100;

document.getElementById("progressBar")
.style.width=progress+"%";

}

/* SOUND */

function playCorrect(){

document.getElementById("correctSound").play();

}

function playWrong(){

document.getElementById("wrongSound").play();

}

/* MENU */

function backMenu(){

showScreen("menu");

updateScore();

}

/* MEMORY */

const memoryItems=[
"Brush","Brush",
"Color","Color",
"Text","Text",
"Shape","Shape"
];

let flipped=[];
let matched=0;

function startMemory(){

showScreen("memoryScreen");

const grid=document.getElementById("memoryGrid");

grid.innerHTML="";

memoryItems.sort(()=>0.5-Math.random());

memoryItems.forEach(item=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML="?";

card.onclick=()=>flipCard(card,item);

grid.appendChild(card);

});

}

function flipCard(card,item){

if(card.classList.contains("flipped")) return;

card.classList.add("flipped");

card.innerHTML=item;

flipped.push({card,item});

if(flipped.length===2){

if(flipped[0].item===flipped[1].item){

matched++;

score++;

updateScore();

playCorrect();

document.getElementById("memoryFeedback")
.innerHTML="✅ Match Found";

document.getElementById("memoryFeedback")
.style.color="green";

confetti({
particleCount:120,
spread:90
});

flipped=[];

}else{

playWrong();

setTimeout(()=>{

flipped.forEach(f=>{
f.card.classList.remove("flipped");
f.card.innerHTML="?";
});

flipped=[];

},1000);

}

}

}

/* MAZE */

function startMaze(){

showScreen("mazeScreen");

const maze=document.getElementById("mazeBoard");

maze.innerHTML="";

for(let i=1;i<=15;i++){

const cell=document.createElement("div");

cell.className="maze-cell";

if(i===12){

cell.innerHTML="🖌️";

cell.dataset.correct="yes";

}else{

cell.innerHTML="🎨";

}

cell.onclick=()=>checkMaze(cell);

maze.appendChild(cell);

}

}

function checkMaze(cell){

if(cell.dataset.correct==="yes"){

score++;

updateScore();

playCorrect();

document.getElementById("mazeFeedback")
.innerHTML="🎉 Correct Brush Found";

document.getElementById("mazeFeedback")
.style.color="green";

confetti({
particleCount:140,
spread:100
});

}else{

playWrong();

document.getElementById("mazeFeedback")
.innerHTML="❌ Try Again";

document.getElementById("mazeFeedback")
.style.color="red";

}

}

/* CROSSWORD */

function startCrossword(){

showScreen("crosswordScreen");

}

function checkCrossword(){

let word=
document.getElementById("c1").value+
document.getElementById("c2").value+
document.getElementById("c3").value+
document.getElementById("c4").value+
document.getElementById("c5").value;

word=word.toUpperCase();

if(word==="BRUSH"){

score++;

updateScore();

playCorrect();

document.getElementById("crosswordFeedback")
.innerHTML="✅ Correct Word";

document.getElementById("crosswordFeedback")
.style.color="green";

confetti({
particleCount:180,
spread:130
});

}else{

playWrong();

document.getElementById("crosswordFeedback")
.innerHTML="❌ Wrong Word";

document.getElementById("crosswordFeedback")
.style.color="red";

}

}

/* FINAL */

function showFinal(){

showScreen("finalScreen");

document.getElementById("studentDisplay")
.innerHTML=student;

document.getElementById("finalScore")
.innerHTML=score+" Points";

let rank="";

if(score>=8){

rank="🏆 KidPix Champion";

}else if(score>=5){

rank="🌟 Creative Artist";

}else{

rank="👍 Keep Practicing";

}

document.getElementById("rank")
.innerHTML=rank;

confetti({
particleCount:400,
spread:180
});

}

</script>

</body>
</html>
