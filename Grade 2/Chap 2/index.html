<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission: The Missing Innovine Mascot!</title>
    <style>
        /* CSS styling for a fun, arcade-like educational interface */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .logo-area img {
            height: 60px; /* Adjust based on your actual Innovine logo dimensions */
            object-fit: contain;
        }

        .title-area h1 {
            margin: 0;
            font-size: 24px;
            color: #1e3a8a;
        }
        .title-area p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #6b7280;
        }

        .game-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        /* Sidebar Instructions & Controls */
        .sidebar {
            flex: 1;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .mission-box {
            background-color: #eff6ff;
            border-left: 5px solid #3b82f6;
            padding: 15px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 15px;
        }

        .mission-box h3 {
            margin: 0 0 8px 0;
            color: #1d4ed8;
        }

        .mission-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.4;
        }

        /* Color Palette & Tool styling */
        .controls-group {
            margin-top: 15px;
        }

        .label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
            color: #4b5563;
        }

        .palette {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #111827;
        }

        /* Standard Innovine Brand Palette colors simulated here */
        #color-blue { background-color: #0284c7; }
        #color-orange { background-color: #f97316; }
        #color-green { background-color: #22c55e; }

        .action-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #059669;
        }

        /* Canvas Window Design simulating MS Paint */
        .canvas-area {
            flex: 2;
            background-color: #e5e7eb;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .paint-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #4b5563;
        }

        canvas {
            background-color: #ffffff;
            border: 2px solid #9ca3af;
            border-radius: 8px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="2" x2="22" y2="6"></line><path d="M7.5 10.5L19 19"></path><path d="M16 2.5L21.5 8 16 13.5 10.5 8 16 2.5z"></path><path d="M10.5 8L3 15.5 3 21 8.5 21 16 13.5 10.5 8z"></path></svg>') 0 20, pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-area">
            <h1>🎨 Mission: The Missing Innovine Mascot</h1>
            <p>Introduction to MS Paint</p>
        </div>
        <div class="logo-area">
            <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x60?text=Innovine+Logo';">
        </div>
    </header>

    <div class="game-container">
        
        <div class="sidebar">
            <div>
                <div class="mission-box" id="step-box">
                    <h3 id="step-title">🚀 Level 1: Start Engine</h3>
                    <p id="step-text">Click inside the white canvas drawing box to wake up your digital pencil and make your first sound!</p>
                </div>

                <div class="controls-group">
                    <span class="label">Innovine Power Palette:</span>
                    <div class="palette">
                        <button class="color-btn active" id="color-blue" onclick="changeColor('#0284c7', this)"></button>
                        <button class="color-btn" id="color-orange" onclick="changeColor('#f97316', this)"></button>
                        <button class="color-btn" id="color-green" onclick="changeColor('#22c55e', this)"></button>
                    </div>
                </div>
            </div>

            <button class="action-btn" id="next-btn" onclick="advanceLevel()">Next Level ➡️</button>
        </div>

        <div class="canvas-area">
            <div class="paint-header">
                <span>✏️ Pencil Tool Active</span>
                <span id="canvas-status">Status: Waiting for Artist</span>
            </div>
            <canvas id="paintCanvas" width="500" height="380"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#0284c7'; 
        let currentLevel = 1;

        // Audio Context setup for synthesising sounds directly safely
        let audioCtx = null;
        function playTone(freq, type, duration) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Sound Triggers for Grade 2 feedback
        function playDrawSound() { playTone(300, 'triangle', 0.1); }
        function playLevelUpSound() {
            playTone(523.25, 'sine', 0.15); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.15), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.3), 200); // G5
        }

        // Canvas Drawing Physics
        ctx.lineCap = 'round';
        ctx.lineWidth = 4;

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
            document.getElementById('canvas-status').innerText = "Status: Drawing ✨";
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = currentColor;
            ctx.stroke();
            if(Math.random() < 0.15) playDrawSound(); // Play feedback sound periodically during strokes
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
            document.getElementById('canvas-status').innerText = "Status: Canvas Ready";
        });
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        // Color Management Logic
        function changeColor(colorHex, buttonElement) {
            currentColor = colorHex;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            playTone(440, 'sine', 0.05); // Short click sound
        }

        // Gamified Progress Loop Engine
        function advanceLevel() {
            currentLevel++;
            const title = document.getElementById('step-title');
            const text = document.getElementById('step-text');
            const btn = document.getElementById('next-btn');

            playLevelUpSound();

            if (currentLevel === 2) {
                title.innerText = "🌊 Level 2: The Wobbly Wave Test";
                text.innerText = "Excellent! Now hold down your mouse and draw 3 large ocean waves on the white canvas without letting go!";
            } else if (currentLevel === 3) {
                title.innerText = "🎨 Level 3: Match the Innovine Identity";
                text.innerText = "Click on the Orange or Green color button. Use that color to trace a huge happy smile on your canvas!";
                btn.innerText = "Lock in Canvas 💾";
            } else if (currentLevel === 4) {
                title.innerText = "🏆 Victory! Mascot Restored";
                text.innerText = "Fantastic Work, Designer! You successfully used the palette and digital pencil to save the file.";
                btn.innerText = "Start New Session 🔄";
                btn.style.backgroundColor = '#3b82f6';
            } else {
                // Reset Game loop
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                currentLevel = 1;
                title.innerText = "🚀 Level 1: Start Engine";
                text.innerText = "Click inside the white canvas drawing box to wake up your digital pencil and make your first sound!";
                btn.innerText = "Next Level ➡️";
                btn.style.backgroundColor = '#10b981';
            }
        }
    </script>
</body>
</html>
