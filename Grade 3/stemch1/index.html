<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBL Circuit Lab! ⚡</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary-green: #4caf50;
            --dark-green: #2e7d32;
            --light-green: #e8f5e9;
            --border-green: #81c784;
            --accent-orange: #ff5722;
            --accent-yellow: #ffeb3b;
            --wire-color: #37474f;
            --slate-dark: #1e293b;
            --purple-arcade: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        /* --- PAGE 1: EXCLUSIVE 5-SECOND INNOVINE SOLUTIONS SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
            padding: 20px;
        }

        .splash-logo-wrap {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .splash-logo-wrap img {
            width: 100%;
            max-width: 380px;
            height: auto;
            max-height: 50vh;
            object-fit: contain;
            animation: elegantPulse 2.5s infinite ease-in-out;
        }

        @keyframes elegantPulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.03); opacity: 1; }
        }

        .innovine-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .innovine-symbol {
            position: relative;
            width: 50px;
            height: 90px;
        }

        .innovine-pencil {
            width: 12px;
            height: 70px;
            background: #475569;
            position: absolute;
            left: 19px;
            top: 10px;
            border-radius: 2px;
        }

        .innovine-pencil::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid #f97316;
        }

        .innovine-ribbon {
            position: absolute;
            top: 0;
            left: 0;
            width: 50px;
            height: 90px;
            border: 8px solid #dc2626;
            border-left: transparent;
            border-bottom: transparent;
            border-radius: 50%;
            transform: rotate(-25deg);
        }

        .innovine-text-block { text-align: left; }
        .innovine-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: 2px;
            line-height: 1;
        }
        .innovine-sub {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: 6px;
            margin-top: 4px;
        }

        /* --- PAGE 2: MAIN GAME CONTAINER --- */
        #game-wrapper {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            padding: clamp(8px, 2vw, 15px);
            opacity: 0;
            transition: opacity 0.6s ease-in;
        }

        #game-container {
            width: 100%;
            max-width: 820px;
            min-height: 92vh;
            background: #ffffff;
            border: clamp(4px, 1.5vw, 8px) solid var(--primary-green);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: clamp(10px, 2.5vw, 20px);
        }

        /* HEADER & NAVIGATION */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .home-btn {
            background: var(--purple-arcade);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #6d28d9;
            transition: all 0.2s;
        }

        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #6d28d9;
        }

        .game-title {
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            color: var(--dark-green);
            font-weight: bold;
            text-align: center;
        }

        .instructions {
            font-size: clamp(0.85rem, 2.8vw, 1.1rem);
            background: #fff3e0;
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px dashed #ffb74d;
            text-align: center;
            font-weight: bold;
            color: #e65100;
            width: 100%;
            margin-bottom: 8px;
        }

        /* Circuit Board Display */
        .circuit-board {
            width: 100%;
            height: clamp(220px, 36vh, 280px);
            background: var(--light-green);
            border: 4px solid var(--border-green);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .component {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: clamp(0.75rem, 2.5vw, 1rem);
            z-index: 10;
        }

        .battery {
            left: 5%;
            top: 35%;
            width: clamp(70px, 18vw, 95px);
            height: clamp(50px, 12vh, 65px);
            background: var(--accent-orange);
            color: white;
            border-radius: 8px;
            border: 3px solid #d84315;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .bulb-container {
            right: 8%;
            top: 28%;
            width: clamp(70px, 18vw, 90px);
            height: clamp(70px, 18vw, 90px);
            border-radius: 50%;
            background: #b0bec5;
            border: 4px solid #78909c;
            transition: all 0.3s ease;
        }

        .bulb-lit {
            background: var(--accent-yellow) !important;
            box-shadow: 0 0 40px var(--accent-yellow), 0 0 70px var(--accent-yellow);
            border-color: #fbc02d !important;
        }

        .switch-component {
            left: 42%;
            bottom: 8%;
            transform: translateX(-50%);
            cursor: pointer;
            padding: 8px;
            background: #cfd8dc;
            border: 3px solid #90a4ae;
            border-radius: 10px;
            width: clamp(85px, 22vw, 110px);
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #78909c;
            min-height: 48px;
        }

        .switch-component:active { 
            transform: translateX(-50%) translateY(2px); 
            box-shadow: 0 2px 0 #78909c; 
        }

        .wire-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Material Deck */
        .item-deck {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            padding: 10px;
            background: #eceff1;
            border-radius: 14px;
            border: 2px solid #cfd8dc;
        }

        .draggable-item {
            padding: 10px 14px;
            background: #2196f3;
            color: white;
            font-size: clamp(0.85rem, 2.6vw, 1.05rem);
            border-radius: 10px;
            cursor: grab;
            box-shadow: 0 4px 0 #1976d2;
            font-weight: bold;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
        }

        .draggable-item:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .circuit-gap {
            left: 42%;
            top: 28%;
            transform: translateX(-50%);
            width: clamp(100px, 26vw, 140px);
            height: clamp(55px, 14vh, 75px);
            border: 3px dashed #78909c;
            border-radius: 10px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.75rem, 2.2vw, 0.95rem);
            color: #78909c;
            z-index: 5;
            transition: all 0.2s ease;
        }

        .gap-hover {
            background: #b2dfdb;
            border-color: #009688;
            transform: translateX(-50%) scale(1.05);
        }

        /* Quiz Panel for Advanced Missions */
        .quiz-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-btn {
            background: #334155;
            color: white;
            border: 3px solid #475569;
            padding: 12px;
            border-radius: 12px;
            font-size: clamp(0.9rem, 2.8vw, 1.05rem);
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .quiz-btn:hover { background: #475569; border-color: var(--accent-yellow); }

        #status-message {
            font-size: clamp(1rem, 3.5vw, 1.3rem);
            font-weight: bold;
            min-height: 38px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .success-text { color: #2e7d32; animation: pop 0.4s ease; }
        .fail-text { color: #d32f2f; animation: shake 0.3s ease; }

        @keyframes pop {
            0% { transform: scale(0.7); }
            100% { transform: scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- PAGE 1: SPLASH INTRO LOGO (Exactly 5 Seconds) -->
    <div id="splash-screen">
        <div class="splash-logo-wrap">
            <img src="assets/innovine-logo.png" alt="Innovine Solutions Logo" onerror="this.onerror=null; this.style.display='none'; document.getElementById('vectorFallback').classList.remove('hidden');">
            
            <div id="vectorFallback" class="innovine-fallback hidden">
                <div class="innovine-symbol">
                    <div class="innovine-pencil"></div>
                    <div class="innovine-ribbon"></div>
                </div>
                <div class="innovine-text-block">
                    <div class="innovine-title">INNOVINE</div>
                    <div class="innovine-sub">SOLUTIONS</div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAGE 2: MAIN GAME WRAPPER -->
    <div id="game-wrapper">
        <div id="game-container">
            <div class="header-bar">
                <button class="home-btn" onclick="resetToHome()">🏠 Home</button>
                <div class="game-title">⚡ SBL Circuit Lab Challenge! 💡</div>
                <div style="font-weight:bold; color:var(--dark-green);" id="mission-tracker">Mission 1/4</div>
            </div>

            <div class="instructions" id="instruction-text">Mission 1: Click or tap the switch to CLOSE the loop and turn on the light!</div>

            <!-- Interactive Circuit Board -->
            <div class="circuit-board" id="circuitBoardNode">
                <svg class="wire-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M 18 45 L 35 45" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 58 45 L 85 45" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 85 45 L 85 78" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 85 78 L 52 78" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 12 55 L 12 78" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 12 78 L 32 78" stroke="#37474f" stroke-width="2.5" fill="none"/>
                </svg>

                <div class="component battery">🔋 Battery</div>

                <!-- Drop Slot Area -->
                <div class="component circuit-gap" id="drop-zone" style="display: none;">
                    Drop item here!
                </div>

                <div class="component bulb-container" id="light-bulb">
                    <div style="margin-top: clamp(20px, 5vw, 32px); font-size: 0.8rem;">💡 BULB</div>
                </div>

                <!-- Open/Close Switch -->
                <div class="component switch-component" id="circuit-switch" onclick="toggleSwitch()">
                    OFF<br>❌ (Open)
                </div>
            </div>

            <!-- Material Deck for Mission 2 -->
            <div class="item-deck" id="item-deck" style="display: none;">
                <div class="draggable-item" draggable="true" id="item-metal" data-conductor="true">🔑 Iron Key</div>
                <div class="draggable-item" draggable="true" id="item-plastic" data-conductor="false">🧸 Plastic Toy</div>
                <div class="draggable-item" draggable="true" id="item-coin" data-conductor="true">🪙 Copper Coin</div>
                <div class="draggable-item" draggable="true" id="item-eraser" data-conductor="false">✏️ Rubber Eraser</div>
            </div>

            <!-- Quiz Panel for Missions 3 & 4 -->
            <div class="quiz-panel hidden" id="quiz-panel"></div>

            <div id="status-message"></div>
        </div>
    </div>

    <!-- AUDIO FILES WITH SYNTHESIZER FALLBACK -->
    <audio id="audio-clap" src="assets/clap.mp3" preload="auto"></audio>
    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // Web Audio Synthesizer Engine
        class WebAudioSynth {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }

            playCorrect() {
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.35);
            }

            playWrong() {
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        const audioSynth = new WebAudioSynth();

        let currentMission = 1; 
        let switchStateClosed = false;

        const splashScreen = document.getElementById('splash-screen');
        const gameWrapper = document.getElementById('game-wrapper');
        const instructionText = document.getElementById('instruction-text');
        const lightBulb = document.getElementById('light-bulb');
        const circuitSwitch = document.getElementById('circuit-switch');
        const dropZone = document.getElementById('drop-zone');
        const itemDeck = document.getElementById('item-deck');
        const quizPanel = document.getElementById('quiz-panel');
        const statusMsg = document.getElementById('status-message');
        const tracker = document.getElementById('mission-tracker');

        const audioClap = document.getElementById('audio-clap');
        const audioCorrect = document.getElementById('audio-correct');
        const audioWrong = document.getElementById('audio-wrong');

        function playSound(type) {
            if (type === 'correct') {
                if (audioCorrect) {
                    audioCorrect.currentTime = 0;
                    audioCorrect.play().catch(() => audioSynth.playCorrect());
                } else {
                    audioSynth.playCorrect();
                }
                if (audioClap) {
                    audioClap.currentTime = 0;
                    audioClap.play().catch(() => {});
                }
            } else if (type === 'wrong') {
                if (audioWrong) {
                    audioWrong.currentTime = 0;
                    audioWrong.play().catch(() => audioSynth.playWrong());
                } else {
                    audioSynth.playWrong();
                }
            }
        }

        // 5-Second Splash Transition
        setTimeout(() => {
            splashScreen.style.opacity = '0';
            gameWrapper.style.opacity = '1';
            setTimeout(() => {
                splashScreen.style.display = 'none';
                setupMission1();
            }, 800); 
        }, 5000);

        function resetToHome() {
            setupMission1();
        }

        /* --- MISSION 1: SWITCH --- */
        function setupMission1() {
            currentMission = 1;
            tracker.innerText = "Mission 1/4";
            switchStateClosed = false;
            
            instructionText.innerText = "Mission 1: Click or tap the switch to CLOSE the loop and turn on the light!";
            circuitSwitch.style.display = "block";
            circuitSwitch.innerHTML = "OFF<br>❌ (Open)";
            circuitSwitch.style.background = "#cfd8dc";
            
            dropZone.style.display = "none";
            itemDeck.style.display = "none";
            quizPanel.classList.add("hidden");
            lightBulb.classList.remove('bulb-lit');
            statusMsg.innerText = "";
        }

        function toggleSwitch() {
            if (currentMission !== 1) return;

            switchStateClosed = !switchStateClosed;
            
            if (switchStateClosed) {
                circuitSwitch.innerHTML = "ON<br>✅ (Closed)";
                circuitSwitch.style.background = "#81c784";
                lightBulb.classList.add('bulb-lit');
                
                statusMsg.innerText = "Fantastic! The loop is Closed! 👏";
                statusMsg.className = "success-text";

                playSound('correct');

                setTimeout(() => {
                    setupMission2();
                }, 2500);

            } else {
                circuitSwitch.innerHTML = "OFF<br>❌ (Open)";
                circuitSwitch.style.background = "#cfd8dc";
                lightBulb.classList.remove('bulb-lit');
                statusMsg.innerText = "";
            }
        }

        /* --- MISSION 2: CONDUCTORS --- */
        function setupMission2() {
            currentMission = 2;
            tracker.innerText = "Mission 2/4";
            lightBulb.classList.remove('bulb-lit');
            statusMsg.innerText = "";
            statusMsg.className = "";
            
            circuitSwitch.style.display = "none"; 
            dropZone.style.display = "flex";      
            dropZone.innerText = "Drop item here!";
            dropZone.style.background = "#fafafa";
            
            itemDeck.style.display = "flex"; 
            document.querySelectorAll('.draggable-item').forEach(i => i.style.visibility = "visible");
            
            instructionText.innerText = "Mission 2: Drag or tap a Conductor (Metal) into the gap to light the bulb!";
            initializeDragAndDrop();
        }

        function handleItemEvaluation(draggedElement) {
            if (!draggedElement) return;

            const isConductor = draggedElement.getAttribute('data-conductor') === "true";

            if (isConductor) {
                dropZone.style.background = "#ffe082";
                dropZone.innerText = draggedElement.innerText;
                lightBulb.classList.add('bulb-lit');
                
                statusMsg.innerText = "Correct! Metal lets electricity flow! 🪙⚡";
                statusMsg.className = "success-text";
                
                playSound('correct');
                draggedElement.style.visibility = "hidden";

                setTimeout(() => {
                    setupMission3();
                }, 2800);

            } else {
                lightBulb.classList.remove('bulb-lit');
                statusMsg.innerText = "Oops! Insulators block electricity! Try again! ❌";
                statusMsg.className = "fail-text";
                playSound('wrong');
            }
        }

        /* --- MISSION 3: SAFETY / SHORT CIRCUIT --- */
        function setupMission3() {
            currentMission = 3;
            tracker.innerText = "Mission 3/4";
            lightBulb.classList.remove('bulb-lit');
            dropZone.style.display = "none";
            itemDeck.style.display = "none";
            statusMsg.innerText = "";

            instructionText.innerText = "Mission 3: What happens if a wire directly connects the + and - battery terminals without a bulb?";
            quizPanel.classList.remove("hidden");
            quizPanel.innerHTML = `
                <button class="quiz-btn" onclick="answerMission3(true)">⚠️ It causes a Short Circuit (Overheating & Danger)!</button>
                <button class="quiz-btn" onclick="answerMission3(false)">💡 The room lights up brighter automatically.</button>
            `;
        }

        function answerMission3(isCorrect) {
            if (isCorrect) {
                statusMsg.innerText = "Correct! Short circuits bypass loads and overheat wires! ⚡⚠️";
                statusMsg.className = "success-text";
                playSound('correct');
                setTimeout(() => {
                    setupMission4();
                }, 2800);
            } else {
                statusMsg.innerText = "Incorrect! Direct connection without resistance causes short circuits! 🛑";
                statusMsg.className = "fail-text";
                playSound('wrong');
            }
        }

        /* --- MISSION 4: SERIES VS PARALLEL --- */
        function setupMission4() {
            currentMission = 4;
            tracker.innerText = "Mission 4/4";
            statusMsg.innerText = "";

            instructionText.innerText = "Mission 4: In a Parallel Circuit, if one bulb burns out, what happens to the others?";
            quizPanel.innerHTML = `
                <button class="quiz-btn" onclick="answerMission4(true)">💡 The other bulbs stay lit!</button>
                <button class="quiz-btn" onclick="answerMission4(false)">❌ All bulbs turn off instantly.</button>
            `;
        }

        function answerMission4(isCorrect) {
            if (isCorrect) {
                statusMsg.innerText = "Outstanding! Parallel circuits provide multiple current paths! 🏆";
                statusMsg.className = "success-text";
                lightBulb.classList.add('bulb-lit');
                playSound('correct');

                if (window.confetti) {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }

                setTimeout(() => {
                    showLabCompletion();
                }, 3000);
            } else {
                statusMsg.innerText = "Try again! Parallel pathways operate independently! 💡";
                statusMsg.className = "fail-text";
                playSound('wrong');
            }
        }

        /* --- FINAL LAB COMPLETION --- */
        function showLabCompletion() {
            quizPanel.classList.add("hidden");
            instructionText.innerText = "🎉 Congratulations! You are an Official SBL Circuit Master!";
            statusMsg.innerText = "Lab Completed Successfully! Click '🏠 Home' to replay.";
            statusMsg.className = "success-text";
        }

        /* --- DRAG & DROP CONTROLLERS --- */
        function initializeDragAndDrop() {
            const items = document.querySelectorAll('.draggable-item');
            let activeTouchItem = null;

            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', e.target.id);
                });

                item.addEventListener('click', () => {
                    if (currentMission === 2) handleItemEvaluation(item);
                });

                item.addEventListener('touchstart', (e) => {
                    activeTouchItem = item;
                }, { passive: true });

                item.addEventListener('touchmove', (e) => {
                    if (!activeTouchItem) return;
                    const touch = e.touches[0];
                    const dropRect = dropZone.getBoundingClientRect();
                    
                    if (touch.clientX >= dropRect.left && touch.clientX <= dropRect.right &&
                        touch.clientY >= dropRect.top && touch.clientY <= dropRect.bottom) {
                        dropZone.classList.add('gap-hover');
                    } else {
                        dropZone.classList.remove('gap-hover');
                    }
                }, { passive: true });

                item.addEventListener('touchend', (e) => {
                    if (!activeTouchItem) return;
                    dropZone.classList.remove('gap-hover');
                    const touch = e.changedTouches[0];
                    const dropRect = dropZone.getBoundingClientRect();

                    if (touch.clientX >= dropRect.left && touch.clientX <= dropRect.right &&
                        touch.clientY >= dropRect.top && touch.clientY <= dropRect.bottom) {
                        handleItemEvaluation(activeTouchItem);
                    }
                    activeTouchItem = null;
                });
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('gap-hover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('gap-hover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('gap-hover');
                const draggedElement = document.getElementById(e.dataTransfer.getData('text/plain'));
                handleItemEvaluation(draggedElement);
            });
        }
    </script>
</body>
</html>
