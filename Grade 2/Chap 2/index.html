<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MS Paint Adventure Game</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS',cursive;
}

body{
background:linear-gradient(135deg,#89f7fe,#66a6ff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.screen{
display:none;
background:white;
width:95%;
max-width:1100px;
padding:25px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
animation:fade 0.5s;
}

.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:scale(0.9);
}
to{
opacity:1;
transform:scale(1);
}
}

.logo{
width:140px;
margin-bottom:10px;
}

h1{
color:#1565c0;
margin-bottom:15px;
}

.question{
font-size:30px;
font-weight:bold;
margin:20px 0;
color:#333;
}

.option-container{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.option{
background:#e3f2fd;
padding:15px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
width:220px;
font-size:22px;
font-weight:bold;
}

.option:hover{
transform:scale(1.05);
background:#90caf9;
}

.option img{
width:120px;
height:120px;
object-fit:contain;
margin-bottom:10px;
}

.btn{
background:#ff7043;
color:white;
border:none;
padding:14px 28px;
border-radius:40px;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

.btn:hover{
transform:scale(1.05);
}

.feedback{
font-size:32px;
font-weight:bold;
height:40px;
margin-top:20px;
}

.score{
font-size:26px;
font-weight:bold;
color:#ff6f00;
margin-top:15px;
}

input{
padding:14px;
width:90%;
border-radius:12px;
border:2px solid #ccc;
font-size:20px;
margin-top:20px;
}

.answer-box{
padding:15px;
font-size:22px;
border-radius:12px;
border:2px solid #999;
width:300px;
margin-top:20px;
text-align:center;
}

.label-container{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
margin-top:20px;
}

.label-box{
background:#fff3e0;
padding:15px;
border-radius:15px;
font-size:20px;
font-weight:bold;
cursor:pointer;
width:200px;
}

.final-score{
font-size:70px;
font-weight:bold;
color:#ff6f00;
margin:20px 0;
}

@media(max-width:768px){

.option{
width:150px;
font-size:18px;
}

.question{
font-size:24px;
}

.answer-box{
width:90%;
}

}

</style>

</head>

<body>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<!-- INTRO -->

<div class="screen active" id="intro">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎨 MS Paint Quest </h1>

<input type="text" id="studentName" placeholder="Enter Student Name">

<br>

<button class="btn" onclick="startGame()">
🚀 Start Game
</button>

</div>

<!-- GAME -->

<div class="screen" id="gameScreen">

<img src="assets/innovine-logo.png" class="logo">

<div class="question" id="question"></div>

<div id="gameArea"></div>

<div class="feedback" id="feedback"></div>

<div class="score" id="score">
Score : 0
</div>

<button class="btn" onclick="nextQuestion()">
Next ➜
</button>

</div>

<!-- FINAL -->

<div class="screen" id="finalScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🏆 Congratulations</h1>

<h2 id="studentDisplay"></h2>

<div class="final-score" id="finalScore"></div>

<h2 id="rank"></h2>

<button class="btn" onclick="location.reload()">
🔄 Play Again
</button>

</div>

<script>

let student="";
let score=0;
let currentQuestion=0;

const questions=[

{
type:"picture-click",
question:"Click the Pencil Tool",
options:[
{img:"assets/pencil.png",answer:"yes"},
{img:"assets/eraser.png",answer:"no"},
{img:"assets/color .png",answer:"no"}
]
},

{
type:"picture-click",
question:"Click the Eraser Tool",
options:[
{img:"assets/text-tool.png",answer:"no"},
{img:"assets/eraser.png",answer:"yes"},
{img:"assets/fill-with-color.png",answer:"no"}
]
},

{
type:"one-word",
question:"Which tool is used to fill color?",
answer:"fill"
},

{
type:"one-word",
question:"Which tool is used to write text?",
answer:"text"
},

{
type:"picture-click",
question:"Click the Triangle Shape",
options:[
{img:"assets/triangle.png",answer:"yes"},
{img:"assets/pencil.png",answer:"no"},
{img:"assets/color .png",answer:"no"}
]
},

{
type:"one-word",
question:"Which button closes the MS Paint window?",
answer:"close"
},

{
type:"picture-click",
question:"Click the Minimize Button",
options:[
{img:"assets/minimize.png",answer:"yes"},
{img:"assets/maximize.png",answer:"no"},
{img:"assets/close.png",answer:"no"}
]
},

{
type:"label",
question:"Label the Components of MS Paint Window"
}

];

function startGame(){

student=document.getElementById("studentName").value;

if(student===""){
alert("Enter Student Name");
return;
}

showScreen("gameScreen");

loadQuestion();

}

function showScreen(id){

document.querySelectorAll(".screen").forEach(screen=>{
screen.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}

function loadQuestion(){

let q=questions[currentQuestion];

document.getElementById("question").innerHTML=q.question;

document.getElementById("feedback").innerHTML="";

document.getElementById("score").innerHTML=
"Score : "+score;

let html="";

if(q.type==="picture-click"){

html+=`<div class="option-container">`;

q.options.forEach(option=>{

html+=`

<div class="option"
onclick="checkPicture('${option.answer}')">

<img src="${option.img}">

</div>

`;

});

html+=`</div>`;

}

else if(q.type==="one-word"){

html+=`

<input type="text"
id="wordAnswer"
class="answer-box"
placeholder="Type One Word Answer">

<br>

<button class="btn"
onclick="checkWordAnswer('${q.answer}')">
Submit
</button>

`;

}

else if(q.type==="label"){

html+=`

<div class="label-container">

<div class="label-box"
onclick="checkLabel('correct')">

🎨 Drawing Area

</div>

<div class="label-box"
onclick="checkLabel('wrong')">

🚗 Car Tool

</div>

<div class="label-box"
onclick="checkLabel('wrong')">

📱 Mobile Tool

</div>

</div>

`;

}

document.getElementById("gameArea").innerHTML=html;

}

function checkPicture(answer){

if(answer==="yes"){

correctAnswer();

}else{

wrongAnswer();

}

}

function checkWordAnswer(correct){

let ans=document.getElementById("wordAnswer")
.value
.toLowerCase()
.trim();

if(ans.includes(correct)){

correctAnswer();

}else{

wrongAnswer();

}

}

function checkLabel(answer){

if(answer==="correct"){

correctAnswer();

}else{

wrongAnswer();

}

}

function correctAnswer(){

document.getElementById("feedback").innerHTML=
"✅ Correct";

document.getElementById("feedback").style.color="green";

document.getElementById("correctSound").play();

score++;

confetti({
particleCount:180,
spread:100
});

}

function wrongAnswer(){

document.getElementById("feedback").innerHTML=
"❌ Wrong";

document.getElementById("feedback").style.color="red";

document.getElementById("wrongSound").play();

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion>=questions.length){

showFinal();

}else{

loadQuestion();

}

}

function showFinal(){

showScreen("finalScreen");

document.getElementById("studentDisplay").innerHTML=
student;

document.getElementById("finalScore").innerHTML=
score+" / "+questions.length;

let rank="";

if(score>=7){

rank="🏆 MS Paint Champion";

}else if(score>=5){

rank="🌟 Excellent Learner";

}else{

rank="👍 Keep Practicing";

}

document.getElementById("rank").innerHTML=rank;

confetti({
particleCount:350,
spread:150
});

}

</script>

</body>

</html>
