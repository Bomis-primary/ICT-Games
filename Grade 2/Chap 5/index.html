<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KidPix 2: Magic Scenery Painter</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            background-color: #fef08a;
            color: #1e293b;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            padding: 8px;
        }

        /* 5-Second Clean White Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash-screen img {
            max-width: 300px;
            width: 75%;
            height: auto;
            object-fit: contain;
        }

        /* Main Workspace */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: 100dvh;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.6s ease;
            gap: 6px;
            padding-bottom: calc(env(safe-area-inset-bottom, 6px) + 4px);
        }

        header {
            background: #ffffff;
            width: 100%;
            padding: 8px 12px;
            border-radius: 12px;
            border: 3px solid #0284c7;
            box-shadow: 0 3px 0px #0369a1;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 15px;
            color: #0284c7;
            font-weight: 700;
        }

        .status-badge {
            background-color: #0284c7;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
            gap: 6px;
            overflow: hidden;
        }

        /* Instruction Card */
        .instruction-card {
            background-color: #ffffff;
            border-left: 4px solid #16a34a;
            padding: 8px 10px;
            border-radius: 4px 8px 8px 4px;
            flex-shrink: 0;
        }

        .instruction-card h3 {
            margin: 0 0 3px 0;
            color: #15803d;
            font-size: 13px;
            font-weight: 700;
        }

        .instruction-card p {
            margin: 0;
            font-size: 11px;
            color: #334155;
            line-height: 1.3;
        }

        /* Canvas Frame Viewport */
        .canvas-window {
            background: #ffffff;
            padding: 6px;
            border-radius: 14px;
            border: 4px solid #f59e0b;
            box-shadow: 0 3px 0px #d97706;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 160px;
            position: relative;
            overflow: hidden;
        }

        .canvas-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: 700;
            font-size: 11px;
            color: #b45309;
        }

        canvas {
            background: #ffffff;
            border-radius: 6px;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }

        /* Tool Dock Panel */
        .dock-panel {
            background: #ffffff;
            padding: 8px;
            border-radius: 12px;
            border: 3px solid #0284c7;
            box-shadow: 0 3px 0px #0369a1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .tool-rack {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .kidpix-tool {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 6px 2px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .kidpix-tool.active {
            background: #e0f2fe;
            border-color: #0284c7;
            color: #0369a1;
        }

        .kidpix-tool.dragging {
            opacity: 0.85;
            transform: scale(1.1);
            position: fixed;
            z-index: 1000 !important;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }

        /* Action Next Button */
        .action-btn {
            background-color: #94a3b8;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: not-allowed;
            width: 100%;
            flex-shrink: 0;
            box-shadow: 0 3px 0 #64748b;
            transition: background-color 0.2s;
        }

        .action-btn.active-step {
            background-color: #16a34a;
            cursor: pointer;
            box-shadow: 0 3px 0 #15803d;
        }

        .action-btn.active-step:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #15803d;
        }
    </style>
</head>
<body>

    <!-- 5-Second Clean White Splash Screen -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Solutions Logo" onerror="this.src='https://via.placeholder.com/300x120?text=Innovine+Solutions';">
    </div>

    <!-- Main Game Workspace -->
    <div class="main-content" id="app-workspace">
        <header>
            <h1>🎨 Magic Scenery Painter</h1>
            <div class="status-badge" id="round-badge">Stage 1 / 5</div>
        </header>

        <div class="game-container">
            <div class="instruction-card">
                <h3 id="round-title">🪄 Stage 1: Wave Away Storm Clouds</h3>
                <p id="round-desc">Select the <b>Magic Wand (🪄)</b> tool and tap the dark grey storm cloud to reveal a bright blue sunny sky!</p>
            </div>

            <div class="canvas-window">
                <div class="canvas-meta">
                    <span id="active-tool-label">Active Tool: Magic Wand</span>
                    <span id="status-label">Status: Dark Stormy Sky</span>
                </div>
                <canvas id="kidpixCanvas" width="320" height="220"></canvas>
            </div>

            <div class="dock-panel">
                <div class="tool-rack" id="tool-dock">
                    <button class="kidpix-tool active" id="tool-wand" onclick="selectTool('wand')">🪄 Wand</button>
                    <button class="kidpix-tool" id="tool-spray" onclick="selectTool('spray')">💨 Spray</button>
                    <button class="kidpix-tool" id="tool-fill" onclick="selectTool('fill')">🪣 Bucket</button>
                    <button class="kidpix-tool" id="tool-stamp" onclick="selectTool('stamp')">⭐ Stamp</button>
                    <button class="kidpix-tool" id="tool-brush" onclick="selectTool('brush')">🖌️ Brush</button>
                </div>
            </div>
        </div>

        <button class="action-btn" id="next-btn" onclick="advanceRound()" disabled>Complete Canvas Action First</button>
    </div>

    <!-- Sound Assets -->
    <audio id="snd-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="snd-clap" src="assets/clap.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // Exactly 5 Seconds Splash Screen Delay
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                document.getElementById('app-workspace').style.opacity = '1';
                loadStage1();
            }, 5000);
        });

        const canvas = document.getElementById('kidpixCanvas');
        const ctx = canvas.getContext('2d');

        let currentStage = 1;
        let selectedTool = 'wand';

        let skyCleared = false;
        let grassSprayCount = 0;
        let houseFilled = false;
        let stampsPlacedCount = 0;
        let flowersCount = 0;

        function playSound(id) {
            const track = document.getElementById(id);
            if (track) {
                track.currentTime = 0;
                track.play().catch(() => {});
            }
        }

        function selectTool(tool) {
            selectedTool = tool;
            document.querySelectorAll('.kidpix-tool').forEach(b => b.classList.remove('active'));
            const targetBtn = document.getElementById(`tool-${tool}`);
            if (targetBtn) targetBtn.classList.add('active');

            let labels = { 
                'wand': 'Magic Wand', 
                'spray': 'Grass Spray', 
                'fill': 'Paint Bucket',
                'stamp': 'Animal Stamp',
                'brush': 'Flower Brush'
            };
            document.getElementById('active-tool-label').innerText = `Active Tool: ${labels[tool] || 'Tool'}`;
        }

        // --- SCENERY STAGE DRAWING ENGINES ---
        function loadStage1() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw Dark Stormy Sky Background
            ctx.fillStyle = "#475569";
            ctx.fillRect(0, 0, canvas.width, 130);

            // Draw Ground Land Contour
            ctx.fillStyle = "#cbd5e1";
            ctx.fillRect(0, 130, canvas.width, 90);

            // Draw Storm Cloud
            ctx.fillStyle = "#334155";
            ctx.beginPath();
            ctx.arc(160, 50, 45, 0, Math.PI * 2);
            ctx.arc(125, 60, 35, 0, Math.PI * 2);
            ctx.arc(195, 60, 35, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText("Tap Cloud with Magic Wand 🪄", 85, 110);
        }

        function loadStage2() {
            // Sunny Sky Restored
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(0, 0, canvas.width, 130);

            // Sun
            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.arc(40, 35, 22, 0, Math.PI * 2);
            ctx.fill();

            // Uncolored Gray Ground
            ctx.fillStyle = "#cbd5e1";
            ctx.fillRect(0, 130, canvas.width, 90);

            // House Line Art Outline
            drawHouseOutline();
        }

        function drawHouseOutline() {
            // House Roof Outline
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(110, 130);
            ctx.lineTo(160, 90);
            ctx.lineTo(210, 130);
            ctx.closePath();
            ctx.stroke();

            // House Walls Outline
            ctx.strokeRect(120, 130, 80, 55);
        }

        // --- CANVAS INTERACTION LOGIC ---
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            // STAGE 1: Magic Wand on Storm Cloud
            if (currentStage === 1) {
                if (selectedTool === 'wand' && (x >= 80 && x <= 240 && y >= 20 && y <= 110)) {
                    skyCleared = true;
                    playSound('snd-correct');

                    loadStage2();
                    document.getElementById('status-label').innerText = "Status: Sunny Sky Restored!";
                    unlockNext();
                } else {
                    playSound('snd-wrong');
                }
            }
            // STAGE 2: Color Spray Grass
            else if (currentStage === 2) {
                if (selectedTool === 'spray' && y >= 130) {
                    grassSprayCount++;
                    playSound('snd-correct');

                    ctx.fillStyle = "#22c55e";
                    for (let i = 0; i < 15; i++) {
                        let rx = x + (Math.random() * 30 - 15);
                        let ry = y + (Math.random() * 20 - 10);
                        if (ry >= 130) ctx.fillRect(rx, ry, 5, 5);
                    }

                    // Keep house outline sharp
                    drawHouseOutline();

                    document.getElementById('status-label').innerText = `Grass Sprayed: ${grassSprayCount} / 5`;
                    if (grassSprayCount >= 5) {
                        playSound('snd-clap');
                        unlockNext();
                    }
                } else {
                    playSound('snd-wrong');
                }
            }
            // STAGE 3: Paint Bucket on House Walls
            else if (currentStage === 3) {
                if (selectedTool === 'fill' && (x >= 120 && x <= 200 && y >= 130 && y <= 185)) {
                    houseFilled = true;
                    playSound('snd-correct');

                    // Fill Yellow Walls
                    ctx.fillStyle = "#fde047";
                    ctx.fillRect(120, 130, 80, 55);

                    // Fill Orange Roof
                    ctx.fillStyle = "#f97316";
                    ctx.beginPath();
                    ctx.moveTo(110, 130);
                    ctx.lineTo(160, 90);
                    ctx.lineTo(210, 130);
                    ctx.closePath();
                    ctx.fill();

                    drawHouseOutline();

                    document.getElementById('status-label').innerText = "Status: House Painted Cozy Yellow!";
                    unlockNext();
                } else {
                    playSound('snd-wrong');
                }
            }
            // STAGE 5: Magic Brush for Flowers
            else if (currentStage === 5) {
                if (selectedTool === 'brush' && y >= 140) {
                    flowersCount++;
                    playSound('snd-correct');

                    const flowers = ['🌸', '🌻', '🌷', '🌺'];
                    let fl = flowers[flowersCount % flowers.length];

                    ctx.font = "20px Arial";
                    ctx.fillText(fl, x - 10, y + 8);

                    document.getElementById('status-label').innerText = `Flowers Planted: ${flowersCount} / 4`;
                    if (flowersCount >= 4) {
                        playSound('snd-clap');
                        unlockNext();
                    }
                } else {
                    playSound('snd-wrong');
                }
            }
        });

        // --- UNIFIED MOBILE DRAG & DROP ENGINE FOR STAGE 4 ---
        function makeToolDraggable(btnElement, onDropSuccess) {
            let isDragging = false;
            let startX = 0, startY = 0;
            let initialRect = null;

            const onPointerDown = (e) => {
                isDragging = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialRect = btnElement.getBoundingClientRect();

                const onPointerMove = (moveEvent) => {
                    const curX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
                    const curY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;

                    const deltaX = curX - startX;
                    const deltaY = curY - startY;

                    if (Math.hypot(deltaX, deltaY) > 5) {
                        isDragging = true;
                        btnElement.classList.add('dragging');
                        btnElement.style.left = `${initialRect.left + deltaX}px`;
                        btnElement.style.top = `${initialRect.top + deltaY}px`;
                    }
                };

                const onPointerUp = (upEvent) => {
                    window.removeEventListener('mousemove', onPointerMove);
                    window.removeEventListener('mouseup', onPointerUp);
                    window.removeEventListener('touchmove', onPointerMove);
                    window.removeEventListener('touchend', onPointerUp);

                    if (isDragging) {
                        btnElement.classList.remove('dragging');
                        btnElement.style.left = '';
                        btnElement.style.top = '';

                        const endX = upEvent.changedTouches ? upEvent.changedTouches[0].clientX : upEvent.clientX;
                        const endY = upEvent.changedTouches ? upEvent.changedTouches[0].clientY : upEvent.clientY;

                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width;
                        const scaleY = canvas.height / rect.height;
                        const canvasX = (endX - rect.left) * scaleX;
                        const canvasY = (endY - rect.top) * scaleY;

                        onDropSuccess(canvasX, canvasY);
                    }
                };

                window.addEventListener('mousemove', onPointerMove, { passive: true });
                window.addEventListener('mouseup', onPointerUp, { passive: true });
                window.addEventListener('touchmove', onPointerMove, { passive: true });
                window.addEventListener('touchend', onPointerUp, { passive: true });
            };

            btnElement.addEventListener('mousedown', onPointerDown);
            btnElement.addEventListener('touchstart', onPointerDown, { passive: true });
        }

        function unlockNext() {
            const btn = document.getElementById('next-btn');
            btn.disabled = false;
            btn.classList.add('active-step');
            btn.innerText = currentStage === 5 ? "Scenery Complete! Restart 🎉" : "Advance to Next Stage ➡️";
        }

        function advanceRound() {
            const title = document.getElementById('round-title');
            const desc = document.getElementById('round-desc');
            const badge = document.getElementById('round-badge');
            const btn = document.getElementById('next-btn');
            const dock = document.getElementById('tool-dock');

            btn.disabled = true;
            btn.classList.remove('active-step');
            btn.innerText = "Complete Canvas Action First";

            if (currentStage === 1) {
                currentStage = 2;
                badge.innerText = "Stage 2 / 5";
                title.innerText = "💨 Stage 2: Spray Green Grass";
                desc.innerText = "Select the <b>Grass Spray (💨)</b> tool and tap 5 times along the bottom land to spray green grass patches!";
                selectTool('spray');
            } else if (currentStage === 2) {
                currentStage = 3;
                badge.innerText = "Stage 3 / 5";
                title.innerText = "🪣 Stage 3: Paint the House Walls";
                desc.innerText = "Select the <b>Paint Bucket (🪣)</b> tool and tap inside the house outline to color it cozy yellow!";
                selectTool('fill');
            } else if (currentStage === 3) {
                currentStage = 4;
                badge.innerText = "Stage 4 / 5";
                title.innerText = "⭐ Stage 4: Drag & Drop Animal Stamps";
                desc.innerText = "Drag the <b>Pet Stamps (⭐)</b> from the dock and drop 3 animal friends into the scenery!";

                dock.innerHTML = `
                    <button class="kidpix-tool active" id="drag-stamp-btn" style="grid-column: span 5;">🦁 Drag Animal Stamp</button>
                `;

                selectTool('stamp');

                // Draw 3 target drop zones on ground
                ctx.strokeStyle = "#0284c7";
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(30, 145, 45, 45);
                ctx.strokeRect(240, 145, 45, 45);
                ctx.strokeRect(80, 155, 35, 35);
                ctx.setLineDash([]);

                makeToolDraggable(
                    document.getElementById('drag-stamp-btn'),
                    (dropX, dropY) => {
                        if (dropY >= 130 && dropY <= 210) {
                            stampsPlacedCount++;
                            playSound('snd-correct');

                            const pets = ['🐶', '🐰', '🦁'];
                            let pet = pets[(stampsPlacedCount - 1) % pets.length];

                            ctx.font = "30px Arial";
                            ctx.fillText(pet, dropX - 15, dropY + 10);

                            document.getElementById('status-label').innerText = `Animals Added: ${stampsPlacedCount} / 3`;

                            if (stampsPlacedCount >= 3) {
                                playSound('snd-clap');
                                unlockNext();
                            }
                        } else {
                            playSound('snd-wrong');
                        }
                    }
                );

            } else if (currentStage === 4) {
                currentStage = 5;
                badge.innerText = "Stage 5 / 5";
                title.innerText = "🖌️ Stage 5: Plant Meadow Flowers";
                desc.innerText = "Select the <b>Flower Brush (🖌️)</b> tool and tap 4 times in the meadow to plant beautiful blooming flowers!";

                dock.innerHTML = `
                    <button class="kidpix-tool active" id="tool-brush" onclick="selectTool('brush')" style="grid-column: span 5;">🖌️ Flower Brush</button>
                `;

                selectTool('brush');

            } else {
                // Reset Game
                currentStage = 1;
                skyCleared = false;
                grassSprayCount = 0;
                houseFilled = false;
                stampsPlacedCount = 0;
                flowersCount = 0;

                badge.innerText = "Stage 1 / 5";
                title.innerText = "🪄 Stage 1: Wave Away Storm Clouds";
                desc.innerText = "Select the Magic Wand (🪄) tool and tap the dark grey storm cloud to reveal a bright blue sunny sky!";

                dock.innerHTML = `
                    <button class="kidpix-tool active" id="tool-wand" onclick="selectTool('wand')">🪄 Wand</button>
                    <button class="kidpix-tool" id="tool-spray" onclick="selectTool('spray')">💨 Spray</button>
                    <button class="kidpix-tool" id="tool-fill" onclick="selectTool('fill')">🪣 Bucket</button>
                    <button class="kidpix-tool" id="tool-stamp" onclick="selectTool('stamp')">⭐ Stamp</button>
                    <button class="kidpix-tool" id="tool-brush" onclick="selectTool('brush')">🖌️ Brush</button>
                `;

                selectTool('wand');
                loadStage1();
                document.getElementById('status-label').innerText = "Status: Dark Stormy Sky";
            }
        }
    </script>
</body>
</html>
