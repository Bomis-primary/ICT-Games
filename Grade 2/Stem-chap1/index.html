<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electricity STEM Adventure</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS', cursive;
}

body{
overflow:hidden;
background:linear-gradient(45deg,#6a11cb,#2575fc,#ff758c,#ffd200);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
height:100vh;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

.sparkles{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.sparkle{
position:absolute;
width:10px;
height:10px;
background:white;
border-radius:50%;
animation:sparkleMove 5s linear infinite;
opacity:0.7;
}

@keyframes sparkleMove{
0%{
transform:translateY(100vh);
}
100%{
transform:translateY(-100px);
}
}

.screen{
display:none;
width:100%;
height:100vh;
padding:20px;
overflow:auto;
position:relative;
z-index:2;
}

.active{
display:block;
}

.logo{
position:fixed;
top:10px;
left:10px;
width:120px;
z-index:999;
}

.scoreBox{
position:fixed;
top:10px;
right:10px;
background:white;
padding:10px 20px;
border-radius:20px;
font-size:24px;
font-weight:bold;
z-index:999;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.guideBox{
position:fixed;
bottom:20px;
left:20px;
background:white;
padding:15px 20px;
border-radius:20px;
font-size:22px;
max-width:420px;
display:none;
z-index:999;
box-shadow:0 0 15px rgba(0,0,0,0.3);
animation:flash 1s infinite alternate;
}

@keyframes flash{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

.header{
text-align:center;
margin-top:40px;
color:white;
text-shadow:3px 3px 5px black;
}

.header h1{
font-size:55px;
}

.levelBox{
max-width:1150px;
margin:20px auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:30px;
min-height:580px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.question{
font-size:30px;
text-align:center;
margin:25px 0;
}

.buttonArea{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:25px;
}

.gameBtn{
padding:18px 35px;
font-size:24px;
border:none;
border-radius:20px;
cursor:pointer;
background:linear-gradient(to right,#ff758c,#ff7eb3);
color:white;
transition:0.3s;
}

.gameBtn:hover{
transform:scale(1.1);
}

.imageCard{
width:180px;
height:180px;
background:white;
border-radius:20px;
padding:10px;
cursor:pointer;
transition:0.3s;
box-shadow:0 5px 10px rgba(0,0,0,0.3);
object-fit:contain;
}

.imageCard:hover{
transform:scale(1.1);
}

.correct{
border:8px solid limegreen;
background:limegreen !important;
color:white;
}

.wrong{
border:8px solid red;
background:red !important;
color:white;
}

.nextBtn{
display:none;
margin:30px auto;
}

.confetti{
position:fixed;
width:10px;
height:10px;
animation:fall 4s linear forwards;
z-index:9999;
}

@keyframes fall{
0%{
transform:translateY(-100px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

.platformArea{
position:relative;
width:100%;
height:300px;
background:linear-gradient(to bottom,#87ceeb,#fff);
border-radius:20px;
overflow:hidden;
margin-top:30px;
}

.player{
position:absolute;
left:20px;
bottom:20px;
font-size:60px;
transition:0.4s;
}

.platform{
position:absolute;
width:120px;
height:20px;
background:#8e44ad;
border-radius:20px;
}

.goal{
position:absolute;
right:20px;
top:20px;
font-size:60px;
}

.finalScreen{
text-align:center;
margin-top:70px;
color:white;
}

.finalScreen h1{
font-size:60px;
text-shadow:4px 4px black;
}

.badge{
display:inline-block;
padding:20px;
margin:15px;
background:gold;
border-radius:20px;
font-size:28px;
}

.replay{
padding:20px 40px;
font-size:30px;
border:none;
border-radius:20px;
background:#00c853;
color:white;
cursor:pointer;
margin-top:30px;
}

@media(max-width:768px){

.question{
font-size:22px;
}

.gameBtn{
font-size:18px;
padding:15px;
}

.logo{
width:80px;
}

.header h1{
font-size:32px;
}

.imageCard{
width:120px;
height:120px;
}

.guideBox{
font-size:16px;
max-width:280px;
}

}

</style>
</head>

<body>

<div class="sparkles" id="sparkles"></div>

<img src="assets/innovine-logo.png" class="logo">

<div class="scoreBox">
⭐ Score: <span id="score">0</span>/8
</div>

<div class="guideBox" id="guideBox">
🤖 Great job!
</div>

<!-- START SCREEN -->

<div class="screen active" id="startScreen">

<div class="header">

<h1>⚡ Electricity STEM Adventure ⚡</h1>


</div>

<div class="levelBox">

<div class="question">

🌟 Welcome Young Scientist! 🌟

<br><br>

Learn:
<br><br>

⚡ Electricity  
💡 Circuits  
🔋 Batteries  
🚫 Safety Rules  
🧲 Electric Appliances

</div>

<div class="buttonArea">

<button class="gameBtn"
onclick="startGame()">

START GAME

</button>

</div>

</div>

</div>

<!-- GAME SCREEN -->

<div class="screen" id="gameScreen">

<div class="levelBox">

<h2 id="levelTitle"></h2>

<div class="question" id="questionText"></div>

<div id="gameArea"></div>

<div class="buttonArea">

<button class="gameBtn nextBtn"
id="nextBtn"
onclick="nextQuestion()">

➡ NEXT LEVEL

</button>

</div>

</div>

</div>

<!-- FINAL SCREEN -->

<div class="screen" id="finalScreen">

<div class="finalScreen">

<h1>🎉 YOU COMPLETED ALL LEVELS 🎉</h1>

<h2 id="finalScore"></h2>

<div class="badge">⚡ Electricity Hero</div>
<div class="badge">🔋 Circuit Master</div>
<div class="badge">🌈 STEM Champion</div>

<br>

<button class="replay"
onclick="location.reload()">

PLAY AGAIN

</button>

</div>

</div>

<script>

const correctSound =
new Audio("assets/correct-1.mp3");

const wrongSound =
new Audio("assets/wrong.mp3");

let currentQuestion = 0;
let score = 0;

const questions = [

{
title:"Level 1 - Electrical Appliances",
question:"Click ALL appliances using electricity",
type:"appliances"
},

{
title:"Level 2 - Closed Circuit",
question:"Click the CLOSED CIRCUIT picture",
type:"circuit"
},

{
title:"Level 3 - Safety Hero",
question:"Choose SAFE electricity actions",
type:"safety"
},

{
title:"Level 4 - Platform Circuit Maze",
question:"Jump platforms to reach glowing bulb",
type:"platform"
},

{
title:"Level 5 - Space Power Mission",
question:"Charge the spaceship battery",
type:"space"
},

{
title:"Level 6 - Electricity Detective",
question:"Find the electrical appliances",
type:"detective"
},

{
title:"Level 7 - Bulb Switch Puzzle",
question:"Which switch will turn bulb ON?",
type:"switch"
},

{
title:"Level 8 - STEM Quiz",
question:"Electricity makes appliances ____",
type:"dropdown",
correct:"Work"
}

];

function createSparkles(){

for(let i=0;i<60;i++){

const sparkle =
document.createElement("div");

sparkle.classList.add("sparkle");

sparkle.style.left =
Math.random()*100+"%";

sparkle.style.animationDuration =
(Math.random()*5+3)+"s";

document.getElementById("sparkles")
.appendChild(sparkle);

}

}

createSparkles();

function showGuide(message){

const guide =
document.getElementById("guideBox");

guide.innerHTML = "🤖 " + message;

guide.style.display = "block";

setTimeout(()=>{

guide.style.display = "none";

},3000);

}

function startGame(){

document.getElementById("startScreen")
.classList.remove("active");

document.getElementById("gameScreen")
.classList.add("active");

loadQuestion();

}

function loadQuestion(){

if(currentQuestion >= questions.length){

showFinal();
return;

}

document.getElementById("nextBtn")
.style.display="none";

const q = questions[currentQuestion];

document.getElementById("levelTitle")
.innerHTML=q.title;

document.getElementById("questionText")
.innerHTML=q.question;

const gameArea =
document.getElementById("gameArea");

gameArea.innerHTML="";

if(q.type==="appliances"){

gameArea.innerHTML=`

<div class="buttonArea">

<img src="assets/fan.png"
class="imageCard"
onclick="checkAppliance(true,this)">

<img src="assets/fridge.jpeg"
class="imageCard"
onclick="checkAppliance(true,this)">

<img src="assets/laptop.png"
class="imageCard"
onclick="checkAppliance(true,this)">

<img src="assets/microwave.jpg"
class="imageCard"
onclick="checkAppliance(true,this)">

</div>

`;

}

else if(q.type==="circuit"){

gameArea.innerHTML=`

<div class="buttonArea">

<img src="assets/closed circuits.png"
class="imageCard"
onclick="correctAnswer(this,
'Awesome! You completed the circuit!')">

<img src="assets/fan.png"
class="imageCard"
onclick="wrongAnswer(this,
'Oops! That is not a circuit.')">

</div>

`;

}

else if(q.type==="safety"){

gameArea.innerHTML=`

<div class="buttonArea">

<button class="gameBtn"
onclick="checkSafety(true,this)">
🙌 Dry Hands
</button>

<button class="gameBtn"
onclick="checkSafety(false,this)">
💧 Wet Hands
</button>

<button class="gameBtn"
onclick="checkSafety(true,this)">
🔌 Safe Plug
</button>

<button class="gameBtn"
onclick="checkSafety(false,this)">
⚡ Touch Wire
</button>

</div>

`;

safeCount=0;

}

else if(q.type==="platform"){

gameArea.innerHTML=`

<div class="platformArea">

<div class="platform"
style="left:80px;bottom:80px;"></div>

<div class="platform"
style="left:250px;bottom:140px;"></div>

<div class="platform"
style="left:450px;bottom:100px;"></div>

<div class="platform"
style="left:650px;bottom:170px;"></div>

<div class="player"
id="platformPlayer">

⚡

</div>

<div class="goal">

💡

</div>

</div>

<div class="buttonArea">

<button class="gameBtn"
onclick="movePlatformPlayer()">

JUMP ➡

</button>

</div>

`;

platformStep=0;

}

else if(q.type==="space"){

gameArea.innerHTML=`

<div style="text-align:center;
margin-top:40px;">

<div style="font-size:100px;"
id="rocket">

🚀

</div>

<div style="font-size:90px;">
🔋
</div>

<div class="buttonArea">

<button class="gameBtn"
onclick="chargeRocket()">

CHARGE ⚡

</button>

</div>

</div>

`;

}

else if(q.type==="detective"){

gameArea.innerHTML=`

<div class="buttonArea">

<img src="assets/fan.png"
class="imageCard"
onclick="detectiveAnswer(true,this)">

<img src="assets/laptop.png"
class="imageCard"
onclick="detectiveAnswer(true,this)">

<img src="assets/microwave.jpg"
class="imageCard"
onclick="detectiveAnswer(true,this)">

<img src="assets/fridge.jpeg"
class="imageCard"
onclick="detectiveAnswer(true,this)">

</div>

`;

detectiveCount=0;

}

else if(q.type==="switch"){

gameArea.innerHTML=`

<div class="buttonArea">

<button class="gameBtn"
onclick="correctAnswer(this,
'Great job! Electricity is flowing!')">

ON SWITCH

</button>

<button class="gameBtn"
onclick="wrongAnswer(this,
'Oh no! Bulb is OFF.')">

OFF SWITCH

</button>

</div>

`;

}

else if(q.type==="dropdown"){

gameArea.innerHTML=`

<div style="text-align:center;">

<select id="dropdown"
style="
padding:15px;
font-size:24px;
border-radius:20px;
">

<option>Select</option>
<option>Sleep</option>
<option>Dance</option>
<option>Work</option>

</select>

<br><br>

<button class="gameBtn"
onclick="checkDropdown()">

SUBMIT

</button>

</div>

`;

}

}

let applianceCount=0;

function checkAppliance(correct,element){

if(correct){

element.classList.add("correct");

correctSound.play();

showGuide(
"Excellent! This appliance uses electricity."
);

applianceCount++;

if(applianceCount===4){

score++;

updateScore();

showNextButton();

}

}else{

wrongSound.play();

showGuide(
"Oops! Try again little scientist."
);

}

}

function correctAnswer(element,message){

element.classList.add("correct");

correctSound.play();

showGuide(message);

score++;

updateScore();

showNextButton();

}

function wrongAnswer(element,message){

element.classList.add("wrong");

wrongSound.play();

showGuide(message);

showNextButton();

}

let safeCount=0;

function checkSafety(correct,element){

if(correct){

element.classList.add("correct");

correctSound.play();

showGuide(
"Safe choice! You are an electricity hero!"
);

safeCount++;

if(safeCount===2){

score++;

updateScore();

showNextButton();

}

}else{

element.classList.add("wrong");

wrongSound.play();

showGuide(
"Careful! That is dangerous."
);

}

}

let platformStep=0;

function movePlatformPlayer(){

const player =
document.getElementById("platformPlayer");

platformStep++;

if(platformStep===1){

player.style.left="120px";
player.style.bottom="120px";

}

if(platformStep===2){

player.style.left="300px";
player.style.bottom="180px";

}

if(platformStep===3){

player.style.left="500px";
player.style.bottom="140px";

}

if(platformStep===4){

player.style.left="720px";
player.style.bottom="210px";

correctSound.play();

showGuide(
"Fantastic! You reached the glowing bulb!"
);

score++;

updateScore();

confettiBlast();

showNextButton();

}

}

function chargeRocket(){

const rocket =
document.getElementById("rocket");

rocket.style.transform=
"translateY(-150px)";

correctSound.play();

showGuide(
"Rocket charged successfully!"
);

score++;

updateScore();

confettiBlast();

showNextButton();

}

let detectiveCount=0;

function detectiveAnswer(correct,element){

if(correct){

element.classList.add("correct");

correctSound.play();

showGuide(
"Awesome detective work!"
);

detectiveCount++;

if(detectiveCount===4){

score++;

updateScore();

confettiBlast();

showNextButton();

}

}else{

wrongSound.play();

showGuide(
"Oops! That is not electrical."
);

}

}

function checkDropdown(){

const answer =
document.getElementById("dropdown").value;

if(answer==="Work"){

correctSound.play();

showGuide(
"Correct! Electricity helps appliances work."
);

score++;

updateScore();

confettiBlast();

}else{

wrongSound.play();

showGuide(
"Try again! Think carefully."
);

}

showNextButton();

}

function updateScore(){

document.getElementById("score")
.innerHTML=score;

}

function showNextButton(){

document.getElementById("nextBtn")
.style.display="block";

}

function nextQuestion(){

currentQuestion++;

loadQuestion();

}

function confettiBlast(){

for(let i=0;i<120;i++){

const confetti =
document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left =
Math.random()*window.innerWidth+"px";

confetti.style.background =
`hsl(${Math.random()*360},
100%,50%)`;

confetti.style.animationDuration =
(Math.random()*3+2)+"s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},5000);

}

}

function showFinal(){

document.getElementById("gameScreen")
.classList.remove("active");

document.getElementById("finalScreen")
.classList.add("active");

document.getElementById("finalScore")
.innerHTML =
`⭐ You scored ${score} out of ${questions.length}`;

confettiBlast();

}

</script>

</body>
</html>
