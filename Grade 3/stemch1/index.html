<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBL Circuit Lab! ⚡</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary-green: #4caf50;
            --dark-green: #2e7d32;
            --light-green: #e8f5e9;
            --border-green: #81c784;
            --accent-orange: #ff5722;
            --accent-yellow: #ffeb3b;
            --wire-color: #37474f;
            --slate-dark: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            padding: clamp(8px, 2vw, 15px);
            overflow-x: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 820px;
            min-height: 90vh;
            background: #ffffff;
            border: clamp(4px, 1.5vw, 8px) solid var(--primary-green);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: clamp(10px, 2.5vw, 20px);
        }

        /* --- 5-Second Splash Screen --- */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.6s ease-out;
            padding: 20px;
        }

        #splash-screen img {
            max-width: 80%;
            max-height: 50vh;
            object-fit: contain;
            animation: pulse 2s infinite ease-in-out;
        }

        /* --- Main Game Layout --- */
        #game-screen {
            display: none; 
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            gap: 10px;
        }

        .game-title {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: var(--dark-green);
            margin: 2px 0;
            font-weight: bold;
            text-align: center;
        }

        .instructions {
            font-size: clamp(0.85rem, 2.8vw, 1.15rem);
            background: #fff3e0;
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px dashed #ffb74d;
            text-align: center;
            font-weight: bold;
            color: #e65100;
            width: 100%;
        }

        /* --- Interactive Circuit Board --- */
        .circuit-board {
            width: 100%;
            height: clamp(220px, 38vh, 290px);
            background: var(--light-green);
            border: 4px solid var(--border-green);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .component {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: clamp(0.75rem, 2.5vw, 1rem);
            z-index: 10;
        }

        .battery {
            left: 5%;
            top: 35%;
            width: clamp(70px, 18vw, 95px);
            height: clamp(50px, 12vh, 65px);
            background: var(--accent-orange);
            color: white;
            border-radius: 8px;
            border: 3px solid #d84315;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .bulb-container {
            right: 8%;
            top: 28%;
            width: clamp(70px, 18vw, 90px);
            height: clamp(70px, 18vw, 90px);
            border-radius: 50%;
            background: #b0bec5;
            border: 4px solid #78909c;
            transition: all 0.3s ease;
        }

        .bulb-lit {
            background: var(--accent-yellow) !important;
            box-shadow: 0 0 40px var(--accent-yellow), 0 0 70px var(--accent-yellow);
            border-color: #fbc02d !important;
        }

        .switch-component {
            left: 42%;
            bottom: 8%;
            transform: translateX(-50%);
            cursor: pointer;
            padding: 8px;
            background: #cfd8dc;
            border: 3px solid #90a4ae;
            border-radius: 10px;
            width: clamp(85px, 22vw, 110px);
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #78909c;
            min-height: 48px;
        }
        .switch-component:active { transform: translateX(-50%) translateY(2px); box-shadow: 0 2px 0 #78909c; }

        .wire {
            position: absolute;
            background: var(--wire-color);
            z-index: 1;
        }

        /* Responsive Wire Network SVG */
        .wire-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- Drag and Drop Objects --- */
        .item-deck {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            padding: 10px;
            background: #eceff1;
            border-radius: 14px;
            border: 2px solid #cfd8dc;
        }

        .draggable-item {
            padding: 10px 14px;
            background: #2196f3;
            color: white;
            font-size: clamp(0.85rem, 2.6vw, 1.05rem);
            border-radius: 10px;
            cursor: grab;
            box-shadow: 0 4px 0 #1976d2;
            font-weight: bold;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
        }

        .draggable-item:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .circuit-gap {
            left: 42%;
            top: 28%;
            transform: translateX(-50%);
            width: clamp(100px, 26vw, 140px);
            height: clamp(55px, 14vh, 75px);
            border: 3px dashed #78909c;
            border-radius: 10px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.75rem, 2.2vw, 0.95rem);
            color: #78909c;
            z-index: 5;
            transition: all 0.2s ease;
        }

        .gap-hover {
            background: #b2dfdb;
            border-color: #009688;
            transform: translateX(-50%) scale(1.05);
        }

        /* --- Feedback Notifications --- */
        #status-message {
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            font-weight: bold;
            min-height: 40px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .success-text { color: #2e7d32; animation: pop 0.4s ease; }
        .fail-text { color: #d32f2f; animation: shake 0.3s ease; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes pop {
            0% { transform: scale(0.7); }
            100% { transform: scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- 1. SPLASH INTRO LOGO (First 5 Seconds) -->
        <div id="splash-screen">
            <img src="asset/innovine-logo.png" id="innovineLogoImg" alt="Innovine Solutions Logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'320\' height=\'100\' viewBox=\'0 0 320 100\'><rect width=\'320\' height=\'100\' rx=\'16\' fill=\'%234caf50\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'22\' font-weight=\'bold\' fill=\'%23ffffff\'>SBL CIRCUIT LAB</text></svg>';">
            <h2 style="color:#2e7d32; margin-top:15px; font-size:1.2rem;">Loading Circuit Lab...</h2>
        </div>

        <!-- 2. GAME SCREEN -->
        <div id="game-screen">
            <div class="game-title">⚡ SBL Circuit Lab Challenge! 💡</div>
            <div class="instructions" id="instruction-text">Mission 1: Click the switch to CLOSE the loop and turn on the light!</div>

            <div class="circuit-board" id="circuitBoardNode">
                <!-- SVG Vector Wire Routing -->
                <svg class="wire-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M 18 45 L 35 45" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 58 45 L 85 45" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 85 45 L 85 78" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 85 78 L 52 78" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 12 55 L 12 78" stroke="#37474f" stroke-width="2.5" fill="none"/>
                    <path d="M 12 78 L 32 78" stroke="#37474f" stroke-width="2.5" fill="none"/>
                </svg>

                <div class="component battery">🔋 Battery</div>

                <!-- Drop Slot Area -->
                <div class="component circuit-gap" id="drop-zone" style="display: none;">
                    Drop item here!
                </div>

                <div class="component bulb-container" id="light-bulb">
                    <div style="margin-top: clamp(20px, 5vw, 32px); font-size: 0.8rem;">💡 BULB</div>
                </div>

                <!-- Open/Close Switch Link -->
                <div class="component switch-component" id="circuit-switch" onclick="toggleSwitch()">
                    OFF<br>❌ (Open)
                </div>
            </div>

            <!-- Material Deck selection -->
            <div class="item-deck" id="item-deck" style="visibility: hidden;">
                <div class="draggable-item" draggable="true" id="item-metal" data-conductor="true">🔑 Iron Key</div>
                <div class="draggable-item" draggable="true" id="item-plastic" data-conductor="false">🧸 Plastic Toy</div>
                <div class="draggable-item" draggable="true" id="item-coin" data-conductor="true">🪙 Copper Coin</div>
                <div class="draggable-item" draggable="true" id="item-eraser" data-conductor="false">✏️ Rubber Eraser</div>
            </div>

            <div id="status-message"></div>
        </div>

    </div>

    <!-- AUDIO CORE DIRECTIVES FROM ASSETS WITH SYNTHESIZER FALLBACK -->
    <audio id="audio-clap" src="asset/clap.mp3" preload="auto"></audio>
    <audio id="audio-correct" src="asset/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="asset/wrong.mp3" preload="auto"></audio>

    <script>
        class WebAudioSynth {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }

            playCorrect() {
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.35);
            }

            playWrong() {
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        const audioSynth = new WebAudioSynth();

        let currentMission = 1; 
        let switchStateClosed = false;

        const splashScreen = document.getElementById('splash-screen');
        const gameScreen = document.getElementById('game-screen');
        const instructionText = document.getElementById('instruction-text');
        const lightBulb = document.getElementById('light-bulb');
        const circuitSwitch = document.getElementById('circuit-switch');
        const dropZone = document.getElementById('drop-zone');
        const itemDeck = document.getElementById('item-deck');
        const statusMsg = document.getElementById('status-message');

        const audioClap = document.getElementById('audio-clap');
        const audioCorrect = document.getElementById('audio-correct');
        const audioWrong = document.getElementById('audio-wrong');

        function playSound(type) {
            if (type === 'correct') {
                if (audioCorrect) {
                    audioCorrect.currentTime = 0;
                    audioCorrect.play().catch(() => audioSynth.playCorrect());
                } else {
                    audioSynth.playCorrect();
                }
                if (audioClap) {
                    audioClap.currentTime = 0;
                    audioClap.play().catch(() => {});
                }
            } else if (type === 'wrong') {
                if (audioWrong) {
                    audioWrong.currentTime = 0;
                    audioWrong.play().catch(() => audioSynth.playWrong());
                } else {
                    audioSynth.playWrong();
                }
            }
        }

        // 5-Second Splash Screen Timeout
        setTimeout(() => {
            splashScreen.style.opacity = 0;
            setTimeout(() => {
                splashScreen.style.display = 'none';
                gameScreen.style.display = 'flex';
                setupMission1();
            }, 600); 
        }, 5000);

        function setupMission1() {
            currentMission = 1;
            circuitSwitch.style.display = "block";
            dropZone.style.display = "none";
        }

        // Toggle Switch Mechanics (Level 1)
        function toggleSwitch() {
            if (currentMission !== 1) return;

            switchStateClosed = !switchStateClosed;
            
            if (switchStateClosed) {
                circuitSwitch.innerHTML = "ON<br>✅ (Closed)";
                circuitSwitch.style.background = "#81c784";
                lightBulb.classList.add('bulb-lit');
                
                statusMsg.innerText = "Fantastic! The loop is Closed! 👏";
                statusMsg.className = "success-text";

                playSound('correct');

                setTimeout(() => {
                    setupMission2();
                }, 3500);

            } else {
                circuitSwitch.innerHTML = "OFF<br>❌ (Open)";
                circuitSwitch.style.background = "#cfd8dc";
                lightBulb.classList.remove('bulb-lit');
                statusMsg.innerText = "";
            }
        }

        // Drag and Drop Conductivity (Level 2)
        function setupMission2() {
            currentMission = 2;
            lightBulb.classList.remove('bulb-lit');
            statusMsg.innerText = "";
            statusMsg.className = "";
            
            circuitSwitch.style.display = "none"; 
            dropZone.style.display = "flex";      
            itemDeck.style.visibility = "visible"; 
            
            instructionText.innerText = "Mission 2: Drag or tap a Conductor (Metal) into the gap to light the bulb!";
            initializeDragAndDrop();
        }

        function handleItemEvaluation(draggedElement) {
            if (!draggedElement) return;

            const isConductor = draggedElement.getAttribute('data-conductor') === "true";

            if (isConductor) {
                dropZone.style.background = "#ffe082";
                dropZone.innerText = draggedElement.innerText;
                lightBulb.classList.add('bulb-lit');
                
                statusMsg.innerText = "Correct! Metal lets electricity flow! 🪙⚡";
                statusMsg.className = "success-text";
                
                playSound('correct');
                draggedElement.style.visibility = "hidden"; 
            } else {
                lightBulb.classList.remove('bulb-lit');
                statusMsg.innerText = "Oops! Insulators block electricity! ❌";
                statusMsg.className = "fail-text";
                
                playSound('wrong');
            }
        }

        function initializeDragAndDrop() {
            const items = document.querySelectorAll('.draggable-item');
            let activeTouchItem = null;

            items.forEach(item => {
                // Desktop HTML5 Drag
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', e.target.id);
                });

                // Tap-to-Place Support for Mobile
                item.addEventListener('click', () => {
                    if (currentMission === 2) handleItemEvaluation(item);
                });

                // Mobile Touch Drag Engine
                item.addEventListener('touchstart', (e) => {
                    activeTouchItem = item;
                }, { passive: true });

                item.addEventListener('touchmove', (e) => {
                    if (!activeTouchItem) return;
                    const touch = e.touches[0];
                    const dropRect = dropZone.getBoundingClientRect();
                    
                    if (touch.clientX >= dropRect.left && touch.clientX <= dropRect.right &&
                        touch.clientY >= dropRect.top && touch.clientY <= dropRect.bottom) {
                        dropZone.classList.add('gap-hover');
                    } else {
                        dropZone.classList.remove('gap-hover');
                    }
                }, { passive: true });

                item.addEventListener('touchend', (e) => {
                    if (!activeTouchItem) return;
                    dropZone.classList.remove('gap-hover');
                    const touch = e.changedTouches[0];
                    const dropRect = dropZone.getBoundingClientRect();

                    if (touch.clientX >= dropRect.left && touch.clientX <= dropRect.right &&
                        touch.clientY >= dropRect.top && touch.clientY <= dropRect.bottom) {
                        handleItemEvaluation(activeTouchItem);
                    }
                    activeTouchItem = null;
                });
            });

            // Desktop Drag Over / Drop
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('gap-hover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('gap-hover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('gap-hover');
                const draggedElement = document.getElementById(e.dataTransfer.getData('text/plain'));
                handleItemEvaluation(draggedElement);
            });
        }
    </script>
</body>
</html>
