<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fun with MS Paint - Interactive Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-screen img {
            max-width: 75%;
            max-height: 50vh;
            object-fit: contain;
        }

        /* Confetti Canvas Overlay */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
        }

        /* Sad Overlay on Wrong Answer */
        #sad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9997;
        }

        #sad-overlay .smiley {
            font-size: 85px;
            animation: shake 0.5s ease-in-out;
        }

        #sad-overlay .msg {
            font-size: 20px;
            font-weight: bold;
            color: #ef4444;
            margin-top: 10px;
            text-align: center;
            padding: 0 15px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px); }
            40%, 80% { transform: translateX(15px); }
        }

        /* Main Compact Layout */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
            height: 100%;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background-color: #ffffff;
            padding: 8px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .title-area h1 {
            margin: 0;
            font-size: 16px;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title-area h1 img {
            height: 22px;
            width: auto;
        }

        /* Timer Badge */
        .timer-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            min-width: 65px;
            text-align: center;
        }

        /* Level Banner */
        .mission-box {
            width: 100%;
            background-color: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            margin: 4px 0;
        }

        .mission-box h3 {
            margin: 0;
            color: #0369a1;
            font-size: 14px;
        }

        .mission-box p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #334155;
        }

        /* Interactive Area */
        .interactive-area {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            max-height: 58vh;
            overflow-y: auto;
        }

        /* Tool Palette Options */
        .tool-palette {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }

        .tool-card {
            width: 85px;
            height: 90px;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .tool-card img {
            max-width: 42px;
            max-height: 42px;
            object-fit: contain;
            pointer-events: none;
        }

        .tool-card span {
            margin-top: 5px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            color: #334155;
            pointer-events: none;
        }

        .tool-card.selected {
            border-color: #0284c7;
            background-color: #e0f2fe;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.3);
        }

        /* Interactive Drawing Canvas View (House Drawing Activity) */
        .paint-canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .paint-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            background-color: #f1f5f9;
            padding: 6px;
            border-radius: 8px;
            width: 100%;
            justify-content: center;
        }

        .paint-tool-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .paint-tool-btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .paint-tool-btn.active {
            border-color: #0284c7;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        canvas#houseCanvas {
            background-color: #ffffff;
            border: 2px solid #94a3b8;
            border-radius: 8px;
            touch-action: none;
            cursor: crosshair;
        }

        /* Generic Multiple Choice Options */
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .option-btn {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #1e293b;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn img {
            height: 28px;
            width: auto;
            object-fit: contain;
        }

        .option-btn.selected {
            background-color: #e0f2fe;
            border-color: #0284c7;
            color: #0369a1;
        }

        /* Action Buttons */
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 5px;
        }

        .action-btn {
            flex: 1;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .action-btn.reset-btn {
            background-color: #6b7280;
        }
    </style>
</head>
<body>

    <!-- 5-Second Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/250x100?text=Innovine+Logo';">
    </div>

    <!-- Confetti Particle Overlay Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Sad Overlay for Incorrect Attempts -->
    <div id="sad-overlay">
        <div class="smiley">😢</div>
        <div class="msg" id="sad-msg">Wrong Tool! Try Again</div>
    </div>

    <!-- Assets Audio elements -->
    <audio id="audio-clap" src="assets/clap.mp3" preload="auto"></audio>
    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>

    <!-- Main Game Viewport -->
    <div class="main-content" id="game-workspace">
        <header>
            <div class="title-area">
                <h1>
                    <img src="assets/ms paint.png" alt="MS Paint" onerror="this.style.display='none'">
                    Fun with MS Paint
                </h1>
            </div>
            <div class="timer-badge" id="timer-display">⏱️ 20s</div>
        </header>

        <div class="mission-box">
            <h3 id="level-title">Level 1</h3>
            <p id="level-desc">Description</p>
        </div>

        <div class="interactive-area" id="interactive-area">
            <!-- Content dynamically rendered here -->
        </div>

        <div class="controls">
            <button class="action-btn reset-btn" onclick="resetCurrentLevel()">Clear 🔄</button>
            <button class="action-btn" id="check-btn" onclick="checkAnswer()">Submit ✨</button>
        </div>
    </div>

    <script>
        // Splash Screen Timer (5 Seconds)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('splash-screen').style.visibility = 'hidden';
                document.getElementById('game-workspace').style.opacity = '1';
            }, 5000);
            
            loadLevel(1);
        });

        // Audio Handler
        function playSound(type) {
            const clapAudio = document.getElementById('audio-clap');
            const correctAudio = document.getElementById('audio-correct');

            if (type === 'correct') {
                clapAudio.currentTime = 0;
                clapAudio.play().catch(e => {
                    correctAudio.currentTime = 0;
                    correctAudio.play().catch(err => {});
                });
            } else if (type === 'wrong') {
                // Synthetic fallback beep for wrong answer
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch(e) {}
            }
        }

        // Game Levels Data
        const levels = [
            {
                level: 1,
                type: "tool_selection",
                title: "🏠 Level 1: Drawing the House Roof & Walls",
                desc: "Which tool should you select to draw the straight lines for the roof and walls of a house?",
                options: [
                    { id: "pencil", name: "Pencil / Line Tool", img: "assets/pencil.png" },
                    { id: "eraser", name: "Eraser Tool", img: "assets/eraser.png" },
                    { id: "text", name: "Text Tool", img: "assets/text-tool.png" }
                ],
                correctAnswer: "pencil"
            },
            {
                level: 2,
                type: "tool_selection",
                title: "🎨 Level 2: Coloring the House",
                desc: "Which tool allows you to fill the walls and roof of your house with vibrant colors?",
                options: [
                    { id: "eraser", name: "Eraser Tool", img: "assets/eraser.png" },
                    { id: "fill", name: "Fill with Color", img: "assets/fill-with-color.png" },
                    { id: "pencil", name: "Pencil Tool", img: "assets/pencil.png" }
                ],
                correctAnswer: "fill"
            },
            {
                level: 3,
                type: "tool_selection",
                title: "✏️ Level 3: Fixing Mistakes",
                desc: "Oh no! A line went outside the house boundary. Which tool will you use to erase it?",
                options: [
                    { id: "eraser", name: "Eraser Tool", img: "assets/eraser.png" },
                    { id: "color", name: "Color Palette", img: "assets/color .png" },
                    { id: "text", name: "Text Tool", img: "assets/text-tool.png" }
                ],
                correctAnswer: "eraser"
            },
            {
                level: 4,
                type: "window_control",
                title: "🖥️ Level 4: Closing MS Paint",
                desc: "Which window control button is used to close the MS Paint window when you are finished?",
                options: [
                    { id: "minimize", name: "Minimize Button", img: "assets/minimize.png" },
                    { id: "maximize", name: "Maximize Button", img: "assets/maximize.png" },
                    { id: "close", name: "Close Button (X)", img: "assets/close.png" }
                ],
                correctAnswer: "close"
            },
            {
                level: 5,
                type: "hands_on_canvas",
                title: "🎨 Level 5: Hands-on Activity — Draw & Color Your House!",
                desc: "Select tools from the toolbar to draw and color a house on the canvas below!"
            }
        ];

        let currentLevel = 1;
        let wrongAttempts = 0;
        let timerSeconds = 20;
        let timerInterval = null;
        let selectedToolId = null;

        // Hands-on Canvas state
        let activeCanvasTool = 'pencil';
        let isDrawing = false;

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 20;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAttempt("⏱️ Time's up!");
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-display').innerText = `⏱️ ${timerSeconds}s`;
        }

        function loadLevel(lvlNumber) {
            currentLevel = lvlNumber;
            wrongAttempts = 0;
            selectedToolId = null;
            const lvlData = levels.find(l => l.level === lvlNumber);

            document.getElementById('level-title').innerText = lvlData.title;
            document.getElementById('level-desc').innerText = lvlData.desc;
            document.getElementById('check-btn').innerText = "Submit ✨";

            resetCurrentLevel();
        }

        function resetCurrentLevel() {
            selectedToolId = null;
            const lvlData = levels.find(l => l.level === currentLevel);
            const container = document.getElementById('interactive-area');
            container.innerHTML = '';

            if (lvlData.type === "tool_selection" || lvlData.type === "window_control") {
                const palette = document.createElement('div');
                palette.className = 'tool-palette';

                lvlData.options.forEach(opt => {
                    const card = document.createElement('div');
                    card.className = 'tool-card';
                    card.onclick = () => {
                        document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        selectedToolId = opt.id;
                    };

                    card.innerHTML = `
                        <img src="${opt.img}" alt="${opt.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/40?text=${opt.id}';">
                        <span>${opt.name}</span>
                    `;
                    palette.appendChild(card);
                });

                container.appendChild(palette);

            } else if (lvlData.type === "hands_on_canvas") {
                // Interactive Paint Canvas for Drawing House
                container.innerHTML = `
                    <div class="paint-canvas-container">
                        <div class="paint-toolbar">
                            <button class="paint-tool-btn active" id="btn-pencil" onclick="setCanvasTool('pencil')">
                                <img src="assets/pencil.png" onerror="this.style.display='none'"> Pencil
                            </button>
                            <button class="paint-tool-btn" id="btn-fill" onclick="setCanvasTool('fill')">
                                <img src="assets/fill-with-color.png" onerror="this.style.display='none'"> Fill Color
                            </button>
                            <button class="paint-tool-btn" id="btn-eraser" onclick="setCanvasTool('eraser')">
                                <img src="assets/eraser.png" onerror="this.style.display='none'"> Eraser
                            </button>
                        </div>
                        <canvas id="houseCanvas" width="280" height="180"></canvas>
                    </div>
                `;
                initHouseCanvas();
            }

            startTimer();
        }

        // Hands-On Canvas Logic
        function setCanvasTool(tool) {
            activeCanvasTool = tool;
            document.querySelectorAll('.paint-tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tool}`).classList.add('active');
        }

        function initHouseCanvas() {
            const canvas = document.getElementById('houseCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            // Draw a light guide outline of a house
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);

            // Roof Guide
            ctx.beginPath();
            ctx.moveTo(140, 30);
            ctx.lineTo(60, 80);
            ctx.lineTo(220, 80);
            ctx.closePath();
            ctx.stroke();

            // House Body Guide
            ctx.strokeRect(70, 80, 140, 80);
            ctx.setLineDash([]); // Reset line dash

            // Draw Handlers
            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function startDraw(e) {
                isDrawing = true;
                const pos = getCanvasCoords(e);

                if (activeCanvasTool === 'fill') {
                    // Fill area simulation
                    ctx.fillStyle = '#f59e0b'; // Wall color
                    if (pos.y < 80) {
                        ctx.fillStyle = '#ef4444'; // Roof color
                    }
                    ctx.fillRect(pos.x - 15, pos.y - 15, 30, 30);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                }
            }

            function draw(e) {
                if (!isDrawing || activeCanvasTool === 'fill') return;
                const pos = getCanvasCoords(e);

                if (activeCanvasTool === 'eraser') {
                    ctx.clearRect(pos.x - 8, pos.y - 8, 16, 16);
                } else {
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 3;
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                }
            }

            function stopDraw() {
                isDrawing = false;
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);

            canvas.addEventListener('touchstart', startDraw, { passive: true });
            canvas.addEventListener('touchmove', draw, { passive: true });
            canvas.addEventListener('touchend', stopDraw);
        }

        // Check Answer & Wrong Attempt Logic
        function checkAnswer() {
            const lvlData = levels.find(l => l.level === currentLevel);
            let isCorrect = false;

            if (lvlData.type === "hands_on_canvas") {
                // Hands-on level automatically awards completion upon submission
                isCorrect = true;
            } else {
                if (!selectedToolId) {
                    handleWrongAttempt("Please select a tool first!");
                    return;
                }
                isCorrect = selectedToolId === lvlData.correctAnswer;
            }

            if (isCorrect) {
                handleCorrectAnswer();
            } else {
                handleWrongAttempt("Incorrect Tool! Try Again.");
            }
        }

        function handleCorrectAnswer() {
            clearInterval(timerInterval);
            playSound('correct');
            triggerConfetti();

            setTimeout(() => {
                if (currentLevel < levels.length) {
                    loadLevel(currentLevel + 1);
                } else {
                    document.getElementById('level-title').innerText = "🏆 Master Artist!";
                    document.getElementById('level-desc').innerText = "You have completed all MS Paint challenges!";
                    document.getElementById('check-btn').innerText = "Play Again 🔄";
                    document.getElementById('check-btn').onclick = () => {
                        document.getElementById('check-btn').onclick = checkAnswer;
                        loadLevel(1);
                    };
                }
            }, 1800);
        }

        function handleWrongAttempt(message) {
            wrongAttempts++;
            playSound('wrong');

            // Show Sad Overlay
            const overlay = document.getElementById('sad-overlay');
            document.getElementById('sad-msg').innerText = message;
            overlay.style.display = 'flex';

            setTimeout(() => {
                overlay.style.display = 'none';

                if (wrongAttempts >= 2) {
                    // Auto-advance after 2 wrong attempts
                    clearInterval(timerInterval);
                    if (currentLevel < levels.length) {
                        loadLevel(currentLevel + 1);
                    } else {
                        loadLevel(1);
                    }
                } else {
                    resetCurrentLevel();
                }
            }, 1200);
        }

        // Confetti Burst Generator
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            for (let i = 0; i < 75; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 8 + 4,
                    speed: Math.random() * 5 + 3
                });
            }

            let animationFrame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    p.y += p.speed;
                });

                if (particles.some(p => p.y < canvas.height)) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }
            render();
        }
    </script>
</body>
</html>
