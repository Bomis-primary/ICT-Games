<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tux Paint Creative Match</title>
    
    <!-- Canvas Confetti Library for Celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --sky-blue: #bae6fd;
            --primary-blue: #1565c0;
            --primary-dark: #0d47a1;
            --primary-light: #e3f2fd;
            --accent-orange: #ff7043;
            --accent-dark: #e64a19;
            --text-main: #2c3e50;
            --correct-green: #4caf50;
            --correct-dark: #388e3c;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* --- 1. BRANDING SPLASH SCREEN (Strict 5 Seconds) --- */
        #brand-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }
        #brand-splash img {
            max-width: 65%;
            max-height: 70vh;
            object-fit: contain;
        }

        /* --- STAGE SCREEN COMPONENT CARD --- */
        .screen {
            display: none;
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.96);
            border: 6px solid var(--primary-blue);
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 35px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(5px);
            animation: cardPopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .screen.active {
            display: block;
        }

        @keyframes cardPopIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 { color: var(--primary-blue); font-size: 36px; margin-bottom: 15px; }
        h2 { color: var(--primary-dark); font-size: 26px; margin-bottom: 20px; }
        p { color: var(--text-main); font-size: 22px; margin-bottom: 25px; font-weight: bold; }

        /* Setup Form Container */
        .form-container {
            max-width: 450px;
            margin: 0 auto 25px auto;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 20px;
            border: 4px solid #cbd5e1;
            font-size: 18px;
            margin-bottom: 15px;
            outline: none;
            font-family: inherit;
            text-align: center;
            background: #f8fafc;
        }
        input:focus {
            border-color: var(--primary-blue);
            background: #ffffff;
        }

        /* Giant Gameplay / Action Buttons */
        .btn {
            background: linear-gradient(180deg, #ff8a65 0%, var(--accent-orange) 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--accent-dark);
            transition: all 0.1s ease;
            margin: 10px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--accent-dark);
        }

        /* --- HUD TRACKER BAR --- */
        .status-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-light);
            border: 3px solid var(--primary-blue);
            border-radius: 20px;
            padding: 12px 25px;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-blue);
        }

        /* --- GAMEPLAY BUTTON OPTIONS --- */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 550px;
            margin: 20px auto;
        }

        .option-btn {
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            color: var(--text-main);
            border: 4px solid var(--primary-blue);
            padding: 20px 30px;
            border-radius: 24px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        /* Feedback Display */
        .feedback {
            font-size: 26px;
            font-weight: bold;
            min-height: 40px;
            margin-top: 20px;
        }

        /* --- END GAME CERTIFICATE DECORATION --- */
        .certificate-box {
            border: 5px dashed var(--accent-orange);
            background: #fffdf9;
            padding: 25px;
            border-radius: 24px;
            margin: 20px 0;
        }

        .final-score {
            font-size: 70px;
            font-weight: 900;
            color: var(--accent-orange);
            margin: 15px 0;
            text-shadow: 2px 2px 0px #fbe9e7;
        }

        @media(max-width: 600px) {
            h1 { font-size: 28px; }
            p { font-size: 18px; }
            .option-btn { font-size: 18px; padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- 1. BRANDING SPLASH COVER (Strictly 5 Seconds) -->
    <div id="brand-splash">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>

    <!-- 2. SETUP PANEL -->
    <div id="screen-intro" class="screen">
                <h1>🎨 Tux Paint Creative Match</h1>
        <p>Enter your details to start the learning challenge:</p>
        
        <div class="form-container">
            <input type="text" id="studentName" placeholder="✨ Enter Student Name" required>
            <input type="text" id="studentClass" placeholder="🏫 Enter Class / Grade">
            <input type="text" id="schoolName" placeholder="🎒 Enter School Name">
        </div>

        <button class="btn" onclick="validateAndProceed()">Start Learning Adventure 🚀</button>
    </div>

    <!-- 3. MAIN GAMEPLAY SCREEN -->
    <div id="screen-gameplay" class="screen">
        <div class="status-hud">
            <div id="hud-round">Round: 1 / 5</div>
            <div>⭐ Score: <span id="hud-score">0</span></div>
        </div>

        <h2 style="color: var(--primary-dark); margin-bottom: 10px;">Question:</h2>
        <p id="question-text">Loading question...</p>

        <div class="options-container" id="options-box">
            <!-- Dynamic Buttons will render here -->
        </div>

        <div class="feedback" id="gameplay-feedback"></div>
    </div>

    <!-- 4. END-GAME EVALUATION SCREEN -->
    <div id="screen-final" class="screen">
        <h1>🏆 Challenge Completed!</h1>
        
        <div class="certificate-box">
            <p id="finalText" style="font-size: 26px; color: var(--primary-dark); margin-bottom: 10px;"></p>
            <div class="final-score" id="finalScore">0 / 5 Points</div>
            <h2 id="rankText" style="color: var(--correct-green); font-size: 32px; font-weight: 900;"></h2>
        </div>

        <button class="btn" onclick="location.reload()">🔄 Play Again</button>
    </div>

    <!-- CORE AUDIO FEEDBACK LINKS -->
    <audio id="snd-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        let studentName = "";
        let currentRoundIndex = 0;
        let totalScore = 0;
        let canTap = true;

        // Finite Round Challenges Configuration
        const quizRounds = [
            {
                question: "Tux Penguin wants to clear a mistake on his canvas. Which tool should he use?",
                options: [
                    { text: "🧽 Eraser Tool", isCorrect: true },
                    { text: "🎨 Paint Tool", isCorrect: false },
                    { text: "🖼️ New Canvas", isCorrect: false }
                ]
            },
            {
                question: "We want to add a pre-made funny picture of a frog or a tree to our drawing. Choose the tool:",
                options: [
                    { text: "✏️ Lines Tool", isCorrect: false },
                    { text: "🧸 Stamp Tool", isCorrect: true },
                    { text: "🅰️ Text Tool", isCorrect: false }
                ]
            },
            {
                question: "Let's add magical special effects like rainbows, grass, or chalk lines! Which tool is it?",
                options: [
                    { text: "🪄 Magic Tool", isCorrect: true },
                    { text: "🛑 Quit Tool", isCorrect: false },
                    { text: "📐 Shapes Tool", isCorrect: false }
                ]
            },
            {
                question: "We want to type our name or write a story on our drawing. Which tool helps us write?",
                options: [
                    { text: "🎨 Paint Tool", isCorrect: false },
                    { text: "🅰️ Text Tool", isCorrect: true },
                    { text: "🧽 Eraser Tool", isCorrect: false }
                ]
            },
            {
                question: "We love our masterpiece and want to keep it safe so we can look at it tomorrow! Tap the tool:",
                options: [
                    { text: "❌ Undo Tool", isCorrect: false },
                    { text: "📂 Open Tool", isCorrect: false },
                    { text: "💾 Save Tool", isCorrect: true }
                ]
            }
        ];

        // Frame Routing Manager
        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        /* --- Strict 5-Second Timed Branding Splash --- */
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('brand-splash');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    navigateTo('screen-intro');
                }, 500);
            }, 5000);
        });

        // Form Verification
        function validateAndProceed() {
            studentName = document.getElementById('studentName').value.trim();
            if (!studentName) {
                alert("Please enter your name to begin the match!");
                return;
            }
            startQuizChallenge();
        }

        // Sound Engine
        function playFeedbackSound(isCorrect) {
            const audio = document.getElementById(isCorrect ? 'snd-correct' : 'snd-wrong');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        }

        // Initialize Gameplay Loop
        function startQuizChallenge() {
            currentRoundIndex = 0;
            totalScore = 0;
            navigateTo('screen-gameplay');
            loadRound();
        }

        // Core Game Round Processor
        function loadRound() {
            canTap = true;
            const feedbackEl = document.getElementById('gameplay-feedback');
            feedbackEl.innerText = "";
            
            const roundData = quizRounds[currentRoundIndex];
            
            // Render Progress Info
            document.getElementById('hud-round').innerText = `Round: ${currentRoundIndex + 1} / 5`;
            document.getElementById('hud-score').innerText = totalScore;
            document.getElementById('question-text').innerText = roundData.question;

            // Generate Button Layout
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = "";

            roundData.options.forEach(opt => {
                const button = document.createElement('button');
                button.className = "option-btn";
                button.innerText = opt.text;
                button.onclick = () => handleAnswerSelection(opt, button);
                optionsBox.appendChild(button);
            });
        }

        // Evaluator Block
        function handleAnswerSelection(option, selectedButton) {
            if (!canTap) return;

            const feedbackEl = document.getElementById('gameplay-feedback');

            if (option.isCorrect) {
                canTap = false;
                totalScore++;
                document.getElementById('hud-score').innerText = totalScore;
                
                selectedButton.style.background = "linear-gradient(180deg, #81c784 0%, var(--correct-green) 100%)";
                selectedButton.style.borderColor = "var(--correct-dark)";
                selectedButton.style.color = "white";
                
                feedbackEl.innerText = "🎉 Excellent Job! That is Correct!";
                feedbackEl.style.color = "var(--correct-dark)";
                playFeedbackSound(true);

                // Advance automatically after 1.5 seconds
                setTimeout(() => {
                    currentRoundIndex++;
                    if (currentRoundIndex < quizRounds.length) {
                        loadRound();
                    } else {
                        showFinalEvaluation();
                    }
                }, 1500);
            } else {
                selectedButton.style.background = "linear-gradient(180deg, #e57373 0%, #f44336 100%)";
                selectedButton.style.borderColor = "#b71c1c";
                selectedButton.style.color = "white";
                
                feedbackEl.innerText = "❌ Try again! You can do it!";
                feedbackEl.style.color = "#d32f2f";
                playFeedbackSound(false);
            }
        }

        // End Game Final Screen Layout
        function showFinalEvaluation() {
            navigateTo('screen-final');
            document.getElementById('finalText').innerHTML = `Congratulations, <b>${studentName}</b>!`;
            document.getElementById('finalScore').innerText = `${totalScore} / 5 Points`;

            // Interactive Title Grading
            let rankingText = "";
            if (totalScore === 5) {
                rankingText = "👑 Master Tux Artist";
            } else if (totalScore >= 3) {
                rankingText = "🌟 Creative Digital Artist";
            } else {
                rankingText = "🎨 Bright Explorer";
            }
            document.getElementById('rankText').innerText = rankingText;

            // Trigger Confetti Blast
            confetti({
                particleCount: 180,
                spread: 85,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
