<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Detective - MS Paint Game</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-in-out;
        }
        #splash-screen img {
            max-width: 60%;
            max-height: 70vh;
            object-fit: contain;
        }

        /* Main Game Container */
        #game-container {
            display: none;
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
            margin: 20px;
        }

        .header {
            border-bottom: 3px dashed #cbd5e1;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #1e293b;
            margin: 5px 0;
            font-size: 28px;
        }
        .game-status {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #475569;
            font-size: 16px;
        }

        /* Clue Box */
        .clue-box {
            background-color: #f8fafc;
            border-left: 5px solid #3b82f6;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 18px;
            color: #334155;
            line-height: 1.5;
        }

        /* Image Display Canvas */
        .evidence-display {
            background-color: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .evidence-display img {
            max-height: 140px;
            border-radius: 8px;
            object-fit: contain;
        }

        /* Option Buttons */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn-option {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .btn-option:hover {
            background-color: #eff6ff;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        .btn-option:active {
            transform: translateY(0);
        }

        /* Results / Scorecard Screens */
        .scorecard-screen {
            display: none;
            padding: 20px 0;
        }
        .badge-container {
            margin: 25px 0;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .badge {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            border-radius: 50%;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #7c2d12;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
            border: 5px solid #fff;
        }
        .badge-icon {
            font-size: 45px;
            margin-bottom: 5px;
        }
        .badge-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .score-display {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 30px;
        }
        .score-number {
            font-size: 48px;
            font-weight: 800;
            color: #10b981;
        }

        .btn-restart {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-restart:hover {
            background-color: #2563eb;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN (Runs for exactly 5 seconds) -->
    <div id="splash-screen">
        <img src="innovine-logo.png" alt="Innovine Logo">
    </div>

    <!-- 2. MAIN GAME INTERFACE -->
    <div id="game-container">
        <!-- Game Play Interface -->
        <div id="game-play">
            <div class="header">
                <div class="game-status">
                    <span id="round-indicator">Case File: 1 / 3</span>
                    <span id="score-indicator">Points: 0</span>
                </div>
                <h1>🔍 Paint Detective</h1>
            </div>

            <div class="clue-box">
                <strong>Clue:</strong> <span id="clue-text">Loading case details...</span>
            </div>

            <div class="evidence-display">
                <img id="evidence-image" src="" alt="Evidence Fragment">
            </div>

            <div class="options-grid" id="options-container">
                <!-- JavaScript handles generating option buttons here -->
            </div>
        </div>

        <!-- 3. SCORECARD & BADGE SCREEN -->
        <div id="game-scorecard" class="scorecard-screen">
            <div class="header">
                <h1>Case Solved! 🎉</h1>
            </div>
            
            <p class="score-display">You scored <br><span class="score-number" id="final-score">0</span> out of 30</p>
            
            <div class="badge-container" id="badge-zone">
                <!-- Badge renders dynamically based on performance -->
            </div>

            <p id="feedback-text" style="color: #64748b; font-size: 16px; margin-bottom: 30px;"></p>
            
            <button class="btn-restart" onclick="resetGame()">Investigate Again</button>
        </div>
    </div>

    <!-- AUDIO ASSETS -->
    <audio id="audio-correct" src="correct-1.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="wrong.mp3" preload="auto"></audio>

    <script>
        // Game Level Data Database (Mapped directly to MS Paint Chapters 64-73)
        const itemDatabase = [
            {
                clue: "Oh no! Tarun drew an extra line completely out of bounds. Which tool does he need to wipe it clean off his canvas?",
                image: "tools.PNG", 
                options: ["Pencil Tool", "Fill with Color Bucket", "Eraser Tool"],
                correct: 2
            },
            {
                clue: "Riya wants to fill an entire square with a bright splash of yellow paint in a single click! What tool should she choose?",
                image: "tools.PNG",
                options: ["Fill with Color Bucket", "Brushes Tool", "Shapes Tool Group"],
                correct: 0
            },
            {
                clue: "Look at these crisp geometric pathways. Which structural layout window did Aman open to select a Circle and a Rectangle?",
                image: "shapes.PNG",
                options: ["Ribbon Home tab", "Shapes Tool Group", "Color Palette Strip"],
                correct: 1
            },
            {
                clue: "What option should you click if you want a flexible, freehand tool that lets you paint strokes with distinct textures like oil or watercolor?",
                image: "brush.PNG",
                options: ["Brushes Tool", "Text Tool (A)", "Pencil Tool"],
                correct: 0
            }
        ];

        let currentRound = 0;
        let score = 0;
        let activeQuestions = [];
        const maxRounds = 3; // Game strictly tracks 3 active rounds per playthrough

        // 5-Second Splash Screen Logic
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const game = document.getElementById('game-container');
                
                splash.style.opacity = '0';
                game.style.display = 'block';
                
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 800);
                
                initGame();
            }, 5000); // 5000 milliseconds = 5 Seconds
        });

        // Setup clean random sequence
        function initGame() {
            currentRound = 0;
            score = 0;
            // Shuffle database items randomly
            activeQuestions = [...itemDatabase].sort(() => 0.5 - Math.random()).slice(0, maxRounds);
            loadRound();
        }

        // Render current operational round
        function loadRound() {
            if (currentRound >= maxRounds) {
                showScorecard();
                return;
            }

            // Update UI status bars
            document.getElementById('round-indicator').innerText = `Case File: ${currentRound + 1} / ${maxRounds}`;
            document.getElementById('score-indicator').innerText = `Points: ${score}`;

            const activeQuestion = activeQuestions[currentRound];
            document.getElementById('clue-text').innerText = activeQuestion.clue;
            document.getElementById('evidence-image').src = activeQuestion.image;

            // Generate interface select option buttons
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            activeQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'btn-option';
                button.innerText = `${String.fromCharCode(65 + index)}) ${option}`;
                button.onclick = () => evaluationAnswer(index);
                optionsContainer.appendChild(button);
            });
        }

        // Track decision outcome and play audio cues
        function evaluationAnswer(selectedIndex) {
            const correctAnswerIndex = activeQuestions[currentRound].correct;
            
            if (selectedIndex === correctAnswerIndex) {
                score += 10;
                document.getElementById('audio-correct').play().catch(e => console.log("Audio play blocked"));
            } else {
                document.getElementById('audio-wrong').play().catch(e => console.log("Audio play blocked"));
            }

            // Move step forward
            currentRound++;
            setTimeout(loadRound, 600);
        }

        // Output scorecard performance window and assign badge criteria
        function showScorecard() {
            document.getElementById('game-play').style.display = 'none';
            const scorecard = document.getElementById('game-scorecard');
            scorecard.style.display = 'block';

            document.getElementById('final-score').innerText = score;
            
            const badgeZone = document.getElementById('badge-zone');
            const feedbackText = document.getElementById('feedback-text');

            // Badge Evaluation System
            if (score === 30) {
                badgeZone.innerHTML = `
                    <div class="badge">
                        <div class="badge-icon">👑</div>
                        <div class="badge-title">Master Detective</div>
                    </div>
                `;
                feedbackText.innerText = "Incredible Job! You know every single square inch of the MS Paint application!";
            } else if (score >= 10) {
                badgeZone.innerHTML = `
                    <div class="badge" style="background: linear-gradient(135deg, #a1a1aa, #71717a); color: #f4f4f5; box-shadow: 0 10px 20px rgba(113, 113, 122, 0.4);">
                        <div class="badge-icon">🔍</div>
                        <div class="badge-title">Junior Scout</div>
                    </div>
                `;
                feedbackText.innerText = "Great attempt! You traced down several tools. Keep practicing your paint layouts!";
            } else {
                badgeZone.innerHTML = `<div style="font-size: 50px;">⏳</div>`;
                feedbackText.innerText = "Review pages 64-73 of your ICT book and give it another try to earn your badge!";
            }
        }

        // Restart clean game loops
        function resetGame() {
            document.getElementById('game-scorecard').style.display = 'none';
            document.getElementById('game-play').style.display = 'block';
            initGame();
        }
    </script>
</body>
</html>
