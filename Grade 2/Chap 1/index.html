<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPO Cycle Interactive Challenge!</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 5-Second Splash Screen Overlay */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 9999;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #splash-screen img {
            max-width: 80%;
            width: 300px;
            height: auto;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Main Game Layout */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 950px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: #ffffff;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
        }

        .title-area h1 {
            margin: 0;
            font-size: clamp(20px, 4vw, 26px);
            color: #1e3a8a;
        }
        
        .title-area p {
            margin: 5px 0 0 0;
            font-size: clamp(12px, 3vw, 14px);
            color: #6b7280;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        /* On-Screen Feedback Banner (Replaces alert boxes) */
        #feedback-banner {
            width: 100%;
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            display: none;
            transition: all 0.3s ease;
        }

        #feedback-banner.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }

        #feedback-banner.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        /* Mission / Instruction Box */
        .mission-box {
            background-color: #eff6ff;
            border-left: 5px solid #3b82f6;
            padding: 15px 20px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .mission-box h3 {
            margin: 0 0 5px 0;
            color: #1d4ed8;
            font-size: 18px;
        }

        .mission-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.4;
        }

        /* IPO Drop Zones */
        .ipo-zones {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
        }

        .drop-zone {
            flex: 1;
            background-color: #ffffff;
            border: 3px dashed #9ca3af;
            border-radius: 15px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 170px;
            position: relative;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .drop-zone.drag-over {
            background-color: #e0f2fe;
            border-color: #0284c7;
        }

        .drop-zone h4 {
            margin: 0 0 10px 0;
            font-size: 16px;
            padding: 6px 12px;
            border-radius: 8px;
            color: white;
            text-transform: uppercase;
        }

        .zone-input h4 { background-color: #0284c7; }
        .zone-process h4 { background-color: #f97316; }
        .zone-output h4 { background-color: #22c55e; }

        .zone-slot {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Puzzle / Guess Level Wrapper */
        .interactive-area {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .cards-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
            width: 100%;
        }

        .item-card {
            width: 110px;
            height: 120px;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            user-select: none;
            touch-action: none;
        }

        .item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border-color: #3b82f6;
        }

        .item-card img {
            max-width: 65px;
            max-height: 65px;
            object-fit: contain;
            pointer-events: none;
        }

        .item-card span {
            margin-top: 6px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            color: #334155;
        }

        .item-card.selected-tap {
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
        }

        /* Styles for Level 4 Guess Puzzle Options */
        .guess-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 15px;
        }

        .guess-btn {
            background-color: #f1f5f9;
            border: 2px solid #cbd5e1;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .guess-btn:hover {
            background-color: #e2e8f0;
            border-color: #3b82f6;
        }

        .guess-btn.selected {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        /* Action Controls */
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 5px;
        }

        .action-btn {
            flex: 1;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation;
        }

        .action-btn:hover { background-color: #059669; }
        .action-btn:active { transform: scale(0.98); }

        .action-btn.reset-btn {
            background-color: #6b7280;
        }
        .action-btn.reset-btn:hover { background-color: #4b5563; }

        @media (max-width: 650px) {
            .ipo-zones {
                flex-direction: column;
            }
            .drop-zone {
                min-height: 120px;
            }
            .item-card {
                width: 95px;
                height: 105px;
            }
            .item-card img {
                max-width: 50px;
                max-height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- 5-Second Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x120?text=Innovine+Logo';">
    </div>

    <!-- Assets Audio elements -->
    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <!-- Main Workspace -->
    <div class="main-content" id="game-workspace">
        <header>
            <div class="title-area">
                <h1>⚙️ Mission: Master the IPO Cycle!</h1>
                <p>Input ➔ Process ➔ Output Challenge</p>
            </div>
        </header>

        <div class="game-container">
            <!-- Smooth On-Screen Feedback Banner (No Alert Boxes) -->
            <div id="feedback-banner"></div>

            <!-- Level Info Box -->
            <div class="mission-box">
                <h3 id="level-title">🥤 Level 1: Making Fresh Juice</h3>
                <p id="level-desc">Drag or tap the items below into their correct stage in the IPO cycle!</p>
            </div>

            <!-- Standard IPO Drag/Tap View (Levels 1, 2, 3) -->
            <div class="ipo-zones" id="ipo-zones-view">
                <div class="drop-zone zone-input" data-type="input" onclick="handleZoneTap('input')">
                    <h4>1. Input</h4>
                    <div class="zone-slot" id="slot-input"></div>
                </div>

                <div class="drop-zone zone-process" data-type="process" onclick="handleZoneTap('process')">
                    <h4>2. Process</h4>
                    <div class="zone-slot" id="slot-process"></div>
                </div>

                <div class="drop-zone zone-output" data-type="output" onclick="handleZoneTap('output')">
                    <h4>3. Output</h4>
                    <div class="zone-slot" id="slot-output"></div>
                </div>
            </div>

            <!-- Puzzle / Guess View (Level 4 & 5) -->
            <div class="interactive-area" id="interactive-area">
                <span class="label" id="cards-label" style="font-weight: bold; color: #4b5563;">Available Items (Drag or Tap to Place):</span>
                <div class="cards-list" id="cards-list"></div>
                <div class="guess-options" id="guess-options" style="display: none;"></div>
            </div>

            <div class="controls">
                <button class="action-btn reset-btn" onclick="resetCurrentLevel()">Clear / Reset 🔄</button>
                <button class="action-btn" id="check-btn" onclick="checkAnswer()">Check Answer ✨</button>
            </div>
        </div>
    </div>

    <script>
        // Splash Screen (5 Seconds)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const workspace = document.getElementById('game-workspace');
                
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                workspace.style.opacity = '1';
            }, 5000);
            
            loadLevel(1);
        });

        // Audio Handler
        function playSound(type) {
            const correctAudio = document.getElementById('audio-correct');
            const wrongAudio = document.getElementById('audio-wrong');

            if (type === 'correct') {
                correctAudio.currentTime = 0;
                correctAudio.play().catch(e => console.log('Audio playback waiting for gesture'));
            } else if (type === 'wrong') {
                wrongAudio.currentTime = 0;
                wrongAudio.play().catch(e => console.log('Audio playback waiting for gesture'));
            }
        }

        // Display smooth feedback without alerts
        function showFeedback(message, isSuccess) {
            const banner = document.getElementById('feedback-banner');
            banner.className = isSuccess ? 'success' : 'error';
            banner.innerText = message;
        }

        function clearFeedback() {
            const banner = document.getElementById('feedback-banner');
            banner.style.display = 'none';
            banner.className = '';
        }

        // Level Definitions
        const levels = [
            {
                level: 1,
                type: "standard",
                title: "🥤 Level 1: Making Fresh Juice",
                desc: "Arrange the items to show how orange juice is made using the Input ➔ Process ➔ Output cycle!",
                items: [
                    { id: "oranges", name: "Oranges", type: "input", img: "assets/oranges.png" },
                    { id: "juicer", name: "Juicer", type: "process", img: "assets/juicer.png" },
                    { id: "juice-glass", name: "Juice Glass", type: "output", img: "assets/juice-glass.png" }
                ]
            },
            {
                level: 2,
                type: "standard",
                title: "🎨 Level 2: Making a Clay Toy",
                desc: "Identify the Input, Process, and Output steps required to make a clay toy!",
                items: [
                    { id: "clay", name: "Raw Clay", type: "input", img: "assets/clay.png" },
                    { id: "child-clay", name: "Shaping Clay", type: "process", img: "assets/child-clay.png" },
                    { id: "clay-toy", name: "Clay Toy", type: "output", img: "assets/clay-toy.png" }
                ]
            },
            {
                level: 3,
                type: "standard",
                title: "💻 Level 3: Computer Hardware",
                desc: "Show how a computer takes data, processes it, and displays the result!",
                items: [
                    { id: "keyboard", name: "Keyboard", type: "input", img: "assets/keyboard.png" },
                    { id: "cpu", name: "CPU", type: "process", img: "assets/CPU.png" },
                    { id: "monitor", name: "Monitor", type: "output", img: "assets/monitor.png" }
                ]
            },
            {
                level: 4,
                type: "guess_riddle",
                title: "🔍 Level 4: Guess the Stage Riddle!",
                desc: "Riddle: 'I am the brain of the computer. I take your raw data, calculate it, and work hard inside! What IPO stage am I?'",
                options: ["INPUT Stage ⌨️", "PROCESS Stage ⚙️", "OUTPUT Stage 🖥️"],
                correctAnswer: "PROCESS Stage ⚙️",
                hintImage: "assets/CPU.png"
            },
            {
                level: 5,
                type: "sequence_puzzle",
                title: "🧩 Level 5: IPO Sequence Puzzle",
                desc: "Which order correctly shows the IPO Cycle workflow from start to finish?",
                options: [
                    "Output ➔ Process ➔ Input",
                    "Input ➔ Process ➔ Output",
                    "Process ➔ Input ➔ Output"
                ],
                correctAnswer: "Input ➔ Process ➔ Output"
            }
        ];

        let currentLevel = 1;
        let selectedCard = null;
        let selectedOption = null;
        let placements = { input: null, process: null, output: null };

        function loadLevel(lvlNumber) {
            currentLevel = lvlNumber;
            clearFeedback();
            const lvlData = levels.find(l => l.level === lvlNumber);

            document.getElementById('level-title').innerText = lvlData.title;
            document.getElementById('level-desc').innerText = lvlData.desc;
            document.getElementById('check-btn').innerText = "Check Answer ✨";

            resetCurrentLevel();
        }

        function resetCurrentLevel() {
            clearFeedback();
            placements = { input: null, process: null, output: null };
            selectedCard = null;
            selectedOption = null;

            const lvlData = levels.find(l => l.level === currentLevel);
            const ipoView = document.getElementById('ipo-zones-view');
            const cardsList = document.getElementById('cards-list');
            const guessOptions = document.getElementById('guess-options');
            const cardsLabel = document.getElementById('cards-label');

            cardsList.innerHTML = '';
            guessOptions.innerHTML = '';
            document.getElementById('slot-input').innerHTML = '';
            document.getElementById('slot-process').innerHTML = '';
            document.getElementById('slot-output').innerHTML = '';

            if (lvlData.type === "standard") {
                ipoView.style.display = 'flex';
                guessOptions.style.display = 'none';
                cardsLabel.style.display = 'block';
                cardsLabel.innerText = "Available Items (Drag or Tap to Place):";

                const shuffledItems = [...lvlData.items].sort(() => Math.random() - 0.5);
                shuffledItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.draggable = true;
                    card.id = `card-${item.id}`;
                    card.setAttribute('data-id', item.id);
                    card.setAttribute('data-type', item.type);

                    card.innerHTML = `
                        <img src="${item.img}" alt="${item.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/65?text=${item.name}';">
                        <span>${item.name}</span>
                    `;

                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('click', () => handleCardTap(card, item));
                    cardsList.appendChild(card);
                });
                setupDropZones();

            } else if (lvlData.type === "guess_riddle" || lvlData.type === "sequence_puzzle") {
                ipoView.style.display = 'none';
                cardsLabel.style.display = 'none';
                guessOptions.style.display = 'flex';

                if(lvlData.hintImage) {
                    cardsList.innerHTML = `<img src="${lvlData.hintImage}" style="max-height: 100px; object-fit: contain;" alt="Hint">`;
                }

                lvlData.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'guess-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        document.querySelectorAll('.guess-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedOption = opt;
                    };
                    guessOptions.appendChild(btn);
                });
            }
        }

        // Tap Handlers
        function handleCardTap(cardElement, item) {
            document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected-tap'));
            if (selectedCard && selectedCard.id === item.id) {
                selectedCard = null;
            } else {
                selectedCard = item;
                cardElement.classList.add('selected-tap');
            }
        }

        function handleZoneTap(zoneType) {
            if (!selectedCard) return;
            placeItemInZone(selectedCard.id, zoneType);
            selectedCard = null;
            document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected-tap'));
        }

        // Drag and Drop Logic
        let draggedItemId = null;
        function handleDragStart(e) {
            draggedItemId = e.target.getAttribute('data-id');
            e.dataTransfer.setData('text/plain', draggedItemId);
        }

        function setupDropZones() {
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    const itemId = e.dataTransfer.getData('text/plain') || draggedItemId;
                    placeItemInZone(itemId, zone.getAttribute('data-type'));
                });
            });
        }

        function placeItemInZone(itemId, zoneType) {
            const card = document.getElementById(`card-${itemId}`);
            if (!card) return;

            Object.keys(placements).forEach(z => {
                if (placements[z] === itemId) {
                    placements[z] = null;
                    document.getElementById(`slot-${z}`).innerHTML = '';
                }
            });

            if (placements[zoneType]) {
                const existingId = placements[zoneType];
                const existingCard = document.getElementById(`card-${existingId}`);
                document.getElementById('cards-list').appendChild(existingCard);
            }

            placements[zoneType] = itemId;
            document.getElementById(`slot-${zoneType}`).appendChild(card);
        }

        // Check Answers & Play Sounds (No Dialog Boxes)
        function checkAnswer() {
            const lvlData = levels.find(l => l.level === currentLevel);

            if (lvlData.type === "standard") {
                let isComplete = placements.input && placements.process && placements.output;
                if (!isComplete) {
                    playSound('wrong');
                    showFeedback("⚠️ Please place an item in all three boxes (Input, Process, Output)!", false);
                    return;
                }

                let inputCorrect = lvlData.items.find(i => i.type === 'input').id === placements.input;
                let processCorrect = lvlData.items.find(i => i.type === 'process').id === placements.process;
                let outputCorrect = lvlData.items.find(i => i.type === 'output').id === placements.output;

                if (inputCorrect && processCorrect && outputCorrect) {
                    playSound('correct');
                    showFeedback("👏 Excellent work! Correct arrangement!", true);
                    setTimeout(() => advanceToNextLevel(), 1800);
                } else {
                    playSound('wrong');
                    showFeedback("❌ Some items are in the wrong stage. Try again!", false);
                }

            } else if (lvlData.type === "guess_riddle" || lvlData.type === "sequence_puzzle") {
                if (!selectedOption) {
                    playSound('wrong');
                    showFeedback("⚠️ Please select an answer option first!", false);
                    return;
                }

                if (selectedOption === lvlData.correctAnswer) {
                    playSound('correct');
                    showFeedback("👏 Fantastic! That is the correct answer!", true);
                    setTimeout(() => advanceToNextLevel(), 1800);
                } else {
                    playSound('wrong');
                    showFeedback("❌ That's not quite right. Try again!", false);
                }
            }
        }

        function advanceToNextLevel() {
            if (currentLevel < levels.length) {
                loadLevel(currentLevel + 1);
            } else {
                showFeedback("🏆 VICTORY! You have completed all 5 IPO Cycle levels!", true);
                document.getElementById('level-title').innerText = "🏆 Game Completed!";
                document.getElementById('level-desc').innerText = "You have mastered the IPO Cycle!";
                document.getElementById('check-btn').innerText = "Restart Game 🔄";
                document.getElementById('check-btn').onclick = () => {
                    document.getElementById('check-btn').onclick = checkAnswer;
                    loadLevel(1);
                };
            }
        }
    </script>
</body>
</html>
