<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ Robo STEM Circuit Universe ⚡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Fredoka:wght@500;700&display=swap');

:root {
  --primary-cyan: #00f2fe;
  --primary-blue: #4facfe;
  --neon-green: #00ff88;
  --neon-pink: #ff007f;
  --neon-yellow: #ffe600;
  --dark-bg: #090d16;
  --card-bg: rgba(23, 32, 54, 0.75);
  --glass-border: rgba(0, 242, 254, 0.3);
  --glow-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Fredoka', 'Outfit', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

body {
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  background: var(--dark-bg);
  color: #fff;
  position: relative;
}

/* Cybernetic Animated Background Grid & Particles */
.cyber-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background: 
    radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.18) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.18) 0%, transparent 45%),
    linear-gradient(180deg, #090d16 0%, #111827 50%, #090d16 100%);
}

.circuit-grid {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 20s linear infinite;
}

@keyframes gridMove {
  0% { background-position: 0 0; }
  100% { background-position: 40px 40px; }
}

.sparkles {
  position: fixed;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

.sparkle {
  position: absolute;
  width: 8px;
  height: 8px;
  background: var(--primary-cyan);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--primary-cyan), 0 0 20px var(--neon-green);
  animation: floatUp 6s linear infinite;
  opacity: 0.7;
}

@keyframes floatUp {
  0% { transform: translateY(105vh) scale(0); opacity: 0; }
  50% { opacity: 1; transform: translateY(50vh) scale(1.3); }
  100% { transform: translateY(-10vh) scale(0.2); opacity: 0; }
}

/* 1-Second Clean White Splash Screen (Only Place with Innovine Logo) */
#splashScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#splashScreen img {
  max-width: 75%;
  max-height: 50vh;
  object-fit: contain;
}

/* App Screens Container */
.screen {
  display: none;
  width: 100%;
  height: 100vh;
  padding: 20px;
  overflow-y: auto;
  position: relative;
  z-index: 2;
}

.active {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Cyber Futuristic HUD Navbar */
.top-nav {
  position: fixed;
  top: 15px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: flex-end; /* Align score to right without logo */
  align-items: center;
  z-index: 999;
  pointer-events: none;
}

.scoreBox {
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 2px solid var(--primary-cyan);
  padding: 8px 24px;
  border-radius: 50px;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  box-shadow: var(--glow-shadow);
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}

.scoreBox span {
  color: var(--neon-yellow);
  font-size: 28px;
  text-shadow: 0 0 12px var(--neon-yellow);
}

/* Assistant Guide Dialog Overlay */
.guideBox {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(9, 13, 22, 0.95);
  border: 2px solid var(--neon-green);
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 22px;
  font-weight: 600;
  color: #fff;
  display: none;
  z-index: 999;
  box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
  text-align: center;
  max-width: 90vw;
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: translate(-50%, 40px) scale(0.8); opacity: 0; }
  100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
}

/* Glassmorphic Level Container */
.levelBox {
  width: 100%;
  max-width: 920px;
  margin: 75px auto 20px auto;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 2px solid var(--glass-border);
  padding: 30px;
  border-radius: 35px;
  min-height: 530px;
  box-shadow: var(--glow-shadow), inset 0 0 20px rgba(0, 242, 254, 0.1);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.header h1 {
  font-size: 38px;
  font-weight: 800;
  text-align: center;
  background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--neon-green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 10px rgba(0,242,254,0.5));
}

.question {
  font-size: 26px;
  font-weight: 600;
  text-align: center;
  margin: 15px 0;
  color: #f1f5f9;
  text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

.buttonArea {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 25px;
  margin: 20px 0;
}

/* Interactive Modern Buttons */
.gameBtn {
  padding: 16px 38px;
  font-size: 22px;
  font-weight: 700;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--primary-blue) 100%);
  color: #090d16;
  box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.gameBtn:hover {
  transform: translateY(-4px) scale(1.04);
  box-shadow: 0 10px 30px rgba(0, 242, 254, 0.7);
}

.gameBtn:active {
  transform: translateY(2px) scale(0.98);
}

.backBtn {
  position: absolute;
  top: 20px;
  right: 20px;
  padding: 8px 22px;
  font-size: 16px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
}

.nextBtn {
  display: none;
  margin: 15px auto 0 auto;
  background: linear-gradient(135deg, var(--neon-green) 0%, #00d2ff 100%);
  box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
}

/* Interactive Image Option Cards */
.imageCard {
  width: 175px;
  height: 175px;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 28px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  object-fit: contain;
  border: 4px solid transparent;
}

.imageCard:hover {
  transform: translateY(-8px) scale(1.06);
  border-color: var(--primary-cyan);
  box-shadow: 0 15px 35px rgba(0, 242, 254, 0.5);
}

.correct {
  border-color: var(--neon-green) !important;
  background: rgba(0, 255, 136, 0.2) !important;
  box-shadow: 0 0 35px var(--neon-green) !important;
  animation: pulseCorrect 0.6s infinite alternate;
}

.wrong {
  border-color: var(--neon-pink) !important;
  background: rgba(255, 0, 127, 0.2) !important;
  box-shadow: 0 0 35px var(--neon-pink) !important;
  animation: shake 0.4s ease-in-out;
}

@keyframes pulseCorrect {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-12px); }
  40%, 80% { transform: translateX(12px); }
}

.tipBox {
  background: rgba(255, 230, 0, 0.12);
  border: 1px solid rgba(255, 230, 0, 0.35);
  backdrop-filter: blur(8px);
  padding: 14px 22px;
  border-radius: 20px;
  margin-top: 15px;
  font-size: 20px;
  text-align: center;
  color: #ffecb3;
}

/* Minigame: River Electric Bridge Rescue */
.riverArea {
  position: relative;
  width: 100%;
  height: 240px;
  background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
  border-radius: 28px;
  overflow: hidden;
  margin-top: 15px;
  border: 2px solid rgba(0, 242, 254, 0.4);
  box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
}

.stone {
  position: absolute;
  width: 82px;
  height: 82px;
  background: linear-gradient(135deg, #475569 0%, #1e293b 100%);
  border: 3px solid #94a3b8;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 38px;
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 6px 15px rgba(0,0,0,0.4);
}

.stone:hover {
  transform: scale(1.15);
  border-color: var(--primary-cyan);
}

/* Minigame: Drag and Drop Area */
.dragArea {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 35px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.dragBox {
  width: 230px;
  height: 165px;
  border: 3px dashed var(--primary-cyan);
  border-radius: 28px;
  background: rgba(0, 242, 254, 0.08);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 22px;
  color: var(--primary-cyan);
  font-weight: 700;
  text-align: center;
  padding: 10px;
  transition: all 0.3s ease;
}

.dragItem {
  padding: 22px 38px;
  background: linear-gradient(135deg, var(--neon-yellow) 0%, #ffb700 100%);
  color: #090d16;
  border-radius: 28px;
  font-size: 24px;
  font-weight: 800;
  cursor: grab;
  box-shadow: 0 8px 25px rgba(255, 230, 0, 0.4);
  transition: transform 0.2s;
  touch-action: none;
}

.dragItem:active {
  cursor: grabbing;
  transform: scale(1.06);
}

/* Final Victory Modal Screen */
.finalScreen {
  text-align: center;
  margin-top: 20px;
  color: white;
  width: 100%;
}

.badge {
  display: inline-block;
  padding: 20px 40px;
  margin: 20px;
  background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
  color: #090d16;
  border-radius: 35px;
  font-size: 30px;
  font-weight: 800;
  box-shadow: 0 10px 35px rgba(255, 230, 0, 0.6);
  animation: bounce 1.5s infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-15px); }
}

.confetti {
  position: fixed;
  width: 12px;
  height: 12px;
  animation: fall 4s linear forwards;
  z-index: 9999;
}

@keyframes fall {
  0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

@media(max-width: 768px) {
  .levelBox { margin-top: 65px; padding: 20px; min-height: auto; }
  .header h1 { font-size: 28px; }
  .question { font-size: 20px; }
  .gameBtn { font-size: 18px; padding: 12px 28px; }
  .imageCard { width: 130px; height: 130px; padding: 10px; }
  .stone { width: 68px; height: 68px; font-size: 30px; }
  .riverArea { height: 200px; }
  .guideBox { font-size: 17px; width: 92vw; }
}
</style>
</head>

<body>

<div class="cyber-bg">
  <div class="circuit-grid"></div>
</div>
<div class="sparkles" id="sparkles"></div>

<!-- 1-SECOND CLEAN WHITE SPLASH SCREEN (ONLY PLACE WITH INNOVINE LOGO) -->
<div id="splashScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'250\' height=\'100\' viewBox=\'0 0 250 100\'><rect width=\'250\' height=\'100\' rx=\'20\' fill=\'%2300f2fe\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'28\' font-weight=\'bold\' fill=\'%230f172a\'>INNOVINE</text></svg>';">
</div>

<!-- TOP HUD NAVBAR -->
<div class="top-nav">
  <div class="scoreBox">
    ⭐ Score: <span id="score">0</span>/7
  </div>
</div>

<!-- ROBO GUIDE DIALOG OVERLAY -->
<div class="guideBox" id="guideBox">
  🤖 Great Job!
</div>

<!-- GAMEPLAY SCREEN -->
<div class="screen active" id="gameScreen">
  <div class="levelBox">
    <button class="gameBtn backBtn" id="backBtn" onclick="goBack()" style="display: none;">
      ⬅ BACK
    </button>

    <h2 id="levelTitle" style="color: var(--primary-cyan); text-align: center; font-size: 28px;"></h2>
    <div class="question" id="questionText"></div>

    <div id="gameArea"></div>

    <div class="tipBox" id="tipBox">
      💡 STEM Tip appears here!
    </div>

    <div class="buttonArea">
      <button class="gameBtn nextBtn" id="nextBtn" onclick="nextQuestion()">
        ➡ NEXT MISSION
      </button>
    </div>
  </div>
</div>

<!-- FINAL VICTORY SCREEN -->
<div class="screen" id="finalScreen">
  <div class="levelBox" style="text-align: center;">
    <div class="finalScreen">
      <h1 style="font-size: 40px; color: var(--neon-green);">🏆 Mission Accomplished! 🏆</h1>
      <h2 id="finalScore" style="font-size: 28px; margin: 20px 0;"></h2>

      <div id="badgeArea"></div>

      <br><br>
      <button class="gameBtn" onclick="restartGame()">
        🔄 PLAY AGAIN
      </button>
    </div>
  </div>
</div>

<script>
/* Synthesized Web Audio Sound Engine */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  playCorrect() {
    const audio = new Audio("assets/correct.mp3");
    audio.play().catch(() => {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc1.type = 'sine';
      osc2.type = 'triangle';

      osc1.frequency.setValueAtTime(523.25, now);
      osc1.frequency.exponentialRampToValueAtTime(783.99, now + 0.25);

      osc2.frequency.setValueAtTime(261.63, now); 
      osc2.frequency.exponentialRampToValueAtTime(392.00, now + 0.25);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(this.ctx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.35);
      osc2.stop(now + 0.35);
    });
  }

  playWrong() {
    const audio = new Audio("assets/wrong.mp3");
    audio.play().catch(() => {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(90, now + 0.3);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + 0.3);
    });
  }
}

const soundEngine = new SoundEngine();

let currentQuestion = 0;
let score = 0;
let wireStep = 1;
let detectiveCount = 0;
let timerValue = 5;
let timerInterval = null;

// SVG Fallbacks for Missing Local Assets
const svgClosedCircuit = "data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%230f172a\' rx=\'15\'/><path d=\'M20 50 L80 50\' stroke=\'%2300ff88\' stroke-width=\'8\'/><circle cx=\'50\' cy=\'50\' r=\'12\' fill=\'%23ffe600\'/></svg>";
const svgOpenCircuit = "data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%230f172a\' rx=\'15\'/><path d=\'M20 50 L45 50 M55 30 L80 50\' stroke=\'%23ff007f\' stroke-width=\'8\'/><circle cx=\'50\' cy=\'50\' r=\'10\' fill=\'%2364748b\'/></svg>";
const svgPowerSource = "data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%230f172a\' rx=\'15\'/><rect x=\'30\' y=\'25\' width=\'40\' height=\'50\' fill=\'%23ffe600\' rx=\'5\'/><text x=\'50\' y=\'58\' font-size=\'28\' text-anchor=\'middle\' fill=\'%230f172a\' font-weight=\'bold\'>⚡</text></svg>";
const svgSwitch = "data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%230f172a\' rx=\'15\'/><rect x=\'25\' y=\'40\' width=\'50\' height=\'20\' fill=\'%2300f2fe\' rx=\'10\'/><circle cx=\'60\' cy=\'50\' r=\'8\' fill=\'%23fff\'/></svg>";
const svgSolar = "data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%230f172a\' rx=\'15\'/><polygon points=\'20,30 80,30 90,75 10,75\' fill=\'%230284c7\' stroke=\'%2300f2fe\' stroke-width=\'3\'/><circle cx=\'50\' cy=\'20\' r=\'10\' fill=\'%23ffe600\'/></svg>";

const questions = [
  { title:"⚡ Circuit Builder", question:"Choose the CLOSED CIRCUIT", type:"circuit" },
  { title:"🧩 Sorting Game", question:"Find the CLOSED circuit", type:"sorting" },
  { title:"🌉 River Wire Rescue", question:"Help Robo repair broken electric bridge in order (1 ➔ 2 ➔ 3)", type:"wirebridge" },
  { title:"🔎 Detective Mission", question:"Find ALL 3 electrical components!", type:"detective" },
  { title:"🏃 Speed Challenge", question:"Click POWER SOURCE before time runs out!", type:"speed" },
  { title:"🌞 Solar Energy Mission", question:"Choose the SOLAR PANEL", type:"solar" },
  { title:"🎮 Drag & Drop STEM", question:"Drag SWITCH to the target box", type:"drag" }
];

window.addEventListener("DOMContentLoaded", () => {
  createSparkles();
  // Splash Screen appears for 1 second before disappearing directly into Level 1
  setTimeout(() => {
    const splash = document.getElementById("splashScreen");
    splash.style.opacity = "0";
    setTimeout(() => {
      splash.style.visibility = "hidden";
      loadQuestion();
    }, 500);
  }, 1000);
});

function createSparkles() {
  const container = document.getElementById("sparkles");
  for(let i = 0; i < 40; i++) {
    const sparkle = document.createElement("div");
    sparkle.classList.add("sparkle");
    sparkle.style.left = Math.random() * 100 + "%";
    sparkle.style.animationDuration = (Math.random() * 4 + 4) + "s";
    sparkle.style.animationDelay = (Math.random() * 5) + "s";
    container.appendChild(sparkle);
  }
}

function showGuide(message) {
  const guide = document.getElementById("guideBox");
  guide.innerHTML = `🤖 Robo: ${message}`;
  guide.style.display = "block";
  setTimeout(() => {
    guide.style.display = "none";
  }, 3500);
}

function loadQuestion() {
  clearInterval(timerInterval);
  if(currentQuestion >= questions.length) {
    showFinal();
    return;
  }

  document.getElementById("backBtn").style.display = currentQuestion > 0 ? "inline-flex" : "none";
  document.getElementById("nextBtn").style.display = "none";
  const q = questions[currentQuestion];
  document.getElementById("levelTitle").innerHTML = q.title;
  document.getElementById("questionText").innerHTML = q.question;
  document.getElementById("tipBox").innerHTML = "💡 Tap or interact to answer!";

  const gameArea = document.getElementById("gameArea");
  gameArea.innerHTML = "";

  if(q.type === "circuit") {
    gameArea.innerHTML = `
      <div class="buttonArea">
        <img src="assets/closed-circuit.png" class="imageCard" onerror="this.src='${svgClosedCircuit}'" onclick="correctAnswer(this, 'Awesome! You completed the circuit!', '💡 Closed circuits allow electricity to flow.')">
        <img src="assets/open circuit.png" class="imageCard" onerror="this.src='${svgOpenCircuit}'" onclick="wrongAnswer(this, 'Oh no! The wire is broken!', '⚡ Open circuits stop electricity flow.')">
      </div>`;
  }
  else if(q.type === "sorting") {
    gameArea.innerHTML = `
      <div class="buttonArea">
        <img src="assets/open circuit.png" class="imageCard" onerror="this.src='${svgOpenCircuit}'" onclick="wrongAnswer(this, 'Oh no! The wire is broken!', '⚡ Open circuits stop electricity.')">
        <img src="assets/closed-circuit.png" class="imageCard" onerror="this.src='${svgClosedCircuit}'" onclick="correctAnswer(this, 'Great job! Electricity is flowing!', '💡 Electricity flows in closed circuits.')">
      </div>`;
  }
  else if(q.type === "wirebridge") {
    wireStep = 1;
    gameArea.innerHTML = `
      <div class="riverArea">
        <div style="position:absolute; left:20px; top:75px; font-size:55px;">🤖</div>
        <div style="position:absolute; right:20px; top:75px; font-size:55px;">💡</div>
        <div class="stone" style="left:22%; top:75px;" onclick="repairWire(1, this)">🔌</div>
        <div class="stone" style="left:46%; top:75px;" onclick="repairWire(2, this)">⚡</div>
        <div class="stone" style="left:70%; top:75px;" onclick="repairWire(3, this)">💡</div>
      </div>`;
  }
  else if(q.type === "detective") {
    detectiveCount = 0;
    gameArea.innerHTML = `
      <div class="buttonArea">
        <img src="assets/power source.png" class="imageCard" onerror="this.src='${svgPowerSource}'" onclick="detectiveCorrect(this)">
        <img src="assets/switches.png" class="imageCard" onerror="this.src='${svgSwitch}'" onclick="detectiveCorrect(this)">
        <img src="assets/circuits.png" class="imageCard" onerror="this.src='${svgClosedCircuit}'" onclick="detectiveCorrect(this)">
      </div>`;
  }
  else if(q.type === "speed") {
    gameArea.innerHTML = `
      <div style="text-align:center;">
        <h1 id="timer" style="color:var(--neon-pink); font-size:60px; text-shadow:0 0 20px rgba(255,0,127,0.7);">5</h1>
        <br>
        <img src="assets/power source.png" class="imageCard" onerror="this.src='${svgPowerSource}'" onclick="speedClick(this)">
      </div>`;
    startTimer();
  }
  else if(q.type === "solar") {
    gameArea.innerHTML = `
      <div class="buttonArea">
        <img src="assets/solar-panel.png" class="imageCard" onerror="this.src='${svgSolar}'" onclick="correctAnswer(this, 'You are a STEM Hero!', '☀ Solar panels use sunlight for energy.')">
        <img src="assets/circuits.png" class="imageCard" onerror="this.src='${svgClosedCircuit}'" onclick="wrongAnswer(this, 'Try again Robo Explorer!', '⚡ Circuits connect electrical parts.')">
      </div>`;
  }
  else if(q.type === "drag") {
    gameArea.innerHTML = `
      <div class="dragArea">
        <div class="dragItem" draggable="true" id="switchItem">🔌 SWITCH</div>
        <div class="dragBox" id="switchBox">DROP HERE</div>
      </div>`;
    
    const dragItem = document.getElementById("switchItem");
    const dropBox = document.getElementById("switchBox");

    dragItem.addEventListener("dragstart", (e) => e.dataTransfer.setData("text", e.target.id));
    dropBox.addEventListener("dragover", (e) => e.preventDefault());
    dropBox.addEventListener("drop", dropItem);

    // Mobile touch events
    dragItem.addEventListener("touchstart", handleTouchStart, false);
    dragItem.addEventListener("touchmove", handleTouchMove, false);
    dragItem.addEventListener("touchend", handleTouchEnd, false);
  }
}

function correctAnswer(element, message, tip) {
  if(element.classList.contains("correct") || element.classList.contains("wrong")) return;
  element.classList.add("correct");
  soundEngine.playCorrect();
  showGuide(message);
  document.getElementById("tipBox").innerHTML = tip;
  score++;
  updateScore();
  confettiBlast();
  showNextButton();
}

function wrongAnswer(element, message, tip) {
  if(element.classList.contains("correct") || element.classList.contains("wrong")) return;
  element.classList.add("wrong");
  soundEngine.playWrong();
  showGuide(message);
  document.getElementById("tipBox").innerHTML = tip;
  showNextButton();
}

function repairWire(number, element) {
  if(element.style.background.includes("0, 255")) return;

  if(number === wireStep) {
    element.style.background = "linear-gradient(135deg, #00ff88 0%, #00b359 100%)";
    soundEngine.playCorrect();
    showGuide("Great job! Electricity is flowing!");
    wireStep++;

    if(wireStep === 4) {
      document.getElementById("tipBox").innerHTML = "⚡ Electricity flows through connected wires.";
      score++;
      updateScore();
      confettiBlast();
      showGuide("Awesome! You completed the circuit!");
      showNextButton();
    }
  } else {
    element.classList.add("wrong");
    soundEngine.playWrong();
    showGuide("Oh no! The wire is broken!");
    setTimeout(() => element.classList.remove("wrong"), 500);
  }
}

function detectiveCorrect(element) {
  if(element.classList.contains("correct")) return;
  element.classList.add("correct");
  soundEngine.playCorrect();
  detectiveCount++;
  showGuide("You are a STEM Hero!");

  if(detectiveCount === 3) {
    document.getElementById("tipBox").innerHTML = "🔎 Detectives observe electrical parts carefully.";
    score++;
    updateScore();
    confettiBlast();
    showNextButton();
  }
}

function startTimer() {
  timerValue = 5;
  document.getElementById("timer").innerHTML = timerValue;
  timerInterval = setInterval(() => {
    timerValue--;
    document.getElementById("timer").innerHTML = timerValue;
    if(timerValue <= 0) {
      clearInterval(timerInterval);
      soundEngine.playWrong();
      showGuide("Oh no! Time is over.");
      showNextButton();
    }
  }, 1000);
}

function speedClick(element) {
  clearInterval(timerInterval);
  correctAnswer(element, "Awesome! Fast thinking STEM Hero!", "⚡ Power sources give energy to circuits.");
}

/* Touch Support for Drag and Drop */
let activeTouchItem = null;
function handleTouchStart(e) { activeTouchItem = e.target; }
function handleTouchMove(e) {
  e.preventDefault();
  const touch = e.touches[0];
  activeTouchItem.style.position = "fixed";
  activeTouchItem.style.left = touch.clientX - 50 + "px";
  activeTouchItem.style.top = touch.clientY - 30 + "px";
}
function handleTouchEnd(e) {
  const dropBox = document.getElementById("switchBox");
  const rect = dropBox.getBoundingClientRect();
  const touch = e.changedTouches[0];

  if(touch.clientX >= rect.left && touch.clientX <= rect.right &&
     touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
    triggerDragSuccess();
  } else {
    activeTouchItem.style.position = "static";
  }
}

function dropItem(e) {
  e.preventDefault();
  const data = e.dataTransfer.getData("text");
  if(data === "switchItem") triggerDragSuccess();
}

function triggerDragSuccess() {
  soundEngine.playCorrect();
  const dropBox = document.getElementById("switchBox");
  dropBox.style.background = "rgba(0, 255, 136, 0.2)";
  dropBox.style.borderColor = "#00ff88";
  dropBox.innerHTML = "🔌 SWITCH PLACED!";
  document.getElementById("tipBox").innerHTML = "🔌 Switches control electricity flow.";
  score++;
  updateScore();
  confettiBlast();
  showGuide("Great job! Electricity is flowing!");
  showNextButton();
}

function updateScore() {
  document.getElementById("score").innerHTML = score;
}

function showNextButton() {
  document.getElementById("nextBtn").style.display = "inline-flex";
}

function nextQuestion() {
  currentQuestion++;
  loadQuestion();
}

function goBack() {
  if(currentQuestion > 0) {
    currentQuestion--;
    loadQuestion();
  }
}

function confettiBlast() {
  for(let i = 0; i < 70; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left = Math.random() * window.innerWidth + "px";
    confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
    confetti.style.animationDuration = (Math.random() * 2.5 + 1.5) + "s";
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 4000);
  }
}

function showFinal() {
  document.getElementById("gameScreen").classList.remove("active");
  document.getElementById("finalScreen").classList.add("active");
  document.getElementById("finalScore").innerHTML = `⭐ Total Score: ${score} / ${questions.length}`;

  let badgeText = "";
  if(score === 7) badgeText = `<div class="badge">🏆 Ultimate STEM Champion</div>`;
  else if(score >= 5) badgeText = `<div class="badge">⚡ Circuit Master</div>`;
  else if(score >= 3) badgeText = `<div class="badge">🌈 Electricity Hero</div>`;
  else badgeText = `<div class="badge">🔋 Robo Explorer</div>`;

  document.getElementById("badgeArea").innerHTML = badgeText;
  confettiBlast();
}

function restartGame() {
  currentQuestion = 0;
  score = 0;
  updateScore();
  document.getElementById("finalScreen").classList.remove("active");
  document.getElementById("gameScreen").classList.add("active");
  loadQuestion();
}
</script>

</body>
</html>
