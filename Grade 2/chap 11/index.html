<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Jr Space Adventure</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS', cursive;
}

body{
overflow:hidden;
background:linear-gradient(45deg,#6a11cb,#2575fc,#ff758c,#ff7eb3);
background-size:400% 400%;
animation:bgMove 12s infinite alternate;
height:100vh;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

.sparkles{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
}

.sparkle{
position:absolute;
width:10px;
height:10px;
background:white;
border-radius:50%;
animation:sparkleMove 6s linear infinite;
opacity:0.8;
}

@keyframes sparkleMove{
0%{
transform:translateY(100vh);
}
100%{
transform:translateY(-100px);
}
}

.screen{
display:none;
width:100%;
height:100vh;
padding:20px;
overflow:auto;
position:relative;
z-index:2;
}

.active{
display:block;
}

.logo{
position:fixed;
top:10px;
left:10px;
width:120px;
z-index:999;
}

.scoreBox{
position:fixed;
top:10px;
right:10px;
background:white;
padding:10px 20px;
border-radius:20px;
font-size:24px;
font-weight:bold;
z-index:999;
}

.header{
text-align:center;
margin-top:40px;
color:white;
text-shadow:3px 3px 5px black;
}

.header h1{
font-size:55px;
}

.levelBox{
max-width:1100px;
margin:20px auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:30px;
min-height:560px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.question{
font-size:30px;
text-align:center;
margin:25px 0;
}

.buttonArea{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:25px;
}

.gameBtn{
padding:18px 35px;
font-size:24px;
border:none;
border-radius:20px;
cursor:pointer;
background:linear-gradient(to right,#ff758c,#ff7eb3);
color:white;
transition:0.3s;
}

.gameBtn:hover{
transform:scale(1.1);
}

.dropdown{
padding:15px;
font-size:24px;
border-radius:15px;
border:3px solid purple;
}

.correct{
background:limegreen !important;
}

.wrong{
background:red !important;
}

.nextBtn{
display:none;
margin:30px auto;
}

.confetti{
position:fixed;
width:10px;
height:10px;
animation:fall 4s linear forwards;
z-index:9999;
}

@keyframes fall{
0%{
transform:translateY(-100px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

.rocketArea{
text-align:center;
margin-top:30px;
}

.rocket{
font-size:90px;
transition:1s;
display:inline-block;
}

.planet{
font-size:90px;
margin-left:300px;
}

.puzzleArea{
display:grid;
grid-template-columns:repeat(3,120px);
gap:15px;
justify-content:center;
margin-top:30px;
}

.puzzlePiece{
width:120px;
height:120px;
background:#ffeb3b;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
}

.puzzlePiece:hover{
transform:scale(1.1);
}

.danceArea{
text-align:center;
margin-top:30px;
}

.cat{
font-size:100px;
animation:none;
}

@keyframes dance{
0%{transform:rotate(0deg);}
25%{transform:rotate(15deg);}
50%{transform:rotate(-15deg);}
75%{transform:rotate(15deg);}
100%{transform:rotate(0deg);}
}

.progress{
width:100%;
height:25px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.progressBar{
height:100%;
width:0%;
background:linear-gradient(to right,#00f260,#0575e6);
transition:0.5s;
}

.finalScreen{
text-align:center;
margin-top:70px;
color:white;
}

.finalScreen h1{
font-size:60px;
text-shadow:4px 4px black;
}

.badge{
display:inline-block;
padding:20px;
margin:15px;
background:gold;
border-radius:20px;
font-size:28px;
}

.replay{
padding:20px 40px;
font-size:30px;
border:none;
border-radius:20px;
background:#00c853;
color:white;
cursor:pointer;
margin-top:30px;
}

@media(max-width:768px){

.question{
font-size:22px;
}

.gameBtn{
font-size:18px;
padding:15px;
}

.logo{
width:80px;
}

.header h1{
font-size:32px;
}

.planet{
margin-left:120px;
}

.puzzleArea{
grid-template-columns:repeat(2,100px);
}

.puzzlePiece{
width:100px;
height:100px;
}

}

</style>
</head>

<body>

<div class="sparkles" id="sparkles"></div>

<img src="assets/innovine-logo.png" class="logo">

<div class="scoreBox">
⭐ Score: <span id="score">0</span>/6
</div>

<!-- START SCREEN -->

<div class="screen active" id="startScreen">

<div class="header">
<h1>🚀 Scratch Jr Space Mission 🌈</h1>
<h2>Coding + Puzzle + Dance Adventure</h2>
</div>

<div class="levelBox">

<div style="text-align:center;">
<img src="assets/scratch-Jr.png" width="220">
</div>

<div class="question">
🤖 Welcome Space Coder!<br><br>
Scratch Jr helps kids create:
<br><br>
✅ Games  
✅ Stories  
✅ Animations  
✅ Dance Shows  
✅ Coding Adventures
</div>

<div class="buttonArea">
<button class="gameBtn" onclick="startGame()">START ADVENTURE</button>
</div>

</div>

</div>

<!-- GAME SCREEN -->

<div class="screen" id="gameScreen">

<div class="progress">
<div class="progressBar" id="progressBar"></div>
</div>

<div class="levelBox">

<h2 id="levelTitle"></h2>

<div class="question" id="questionText"></div>

<div id="gameArea"></div>

<div class="buttonArea">
<button class="gameBtn nextBtn" id="nextBtn" onclick="nextQuestion()">
➡ NEXT LEVEL
</button>
</div>

</div>

</div>

<!-- FINAL SCREEN -->

<div class="screen" id="finalScreen">

<div class="finalScreen">

<h1>🎉 AMAZING SPACE CODER 🎉</h1>

<h2 id="finalScore"></h2>

<div class="badge">🏅 Coding Star</div>
<div class="badge">🚀 Space Explorer</div>
<div class="badge">🌈 Scratch Jr Hero</div>

<br>

<button class="replay" onclick="location.reload()">PLAY AGAIN</button>

</div>

</div>

<script>

const correctSound = new Audio("assets/correct-1.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

let currentQuestion = 0;
let score = 0;

const questions = [

{
title:"Level 1 - Coding Dropdown",
question:"Choose the block that MOVES sprite FORWARD",
type:"dropdown",
options:["Select","Forward","Sound","Jump"],
correct:"Forward"
},

{
title:"Level 2 - Sound Mission",
question:"Choose the SOUND block",
type:"dropdown",
options:["Select","Sound","Forward","Rotate"],
correct:"Sound"
},

{
title:"Level 3 - Space Rocket Mission",
question:"Launch rocket to planet!",
type:"rocket"
},

{
title:"Level 4 - Scratch Jr Puzzle",
question:"Click puzzle pieces in correct order: 1 → 2 → 3",
type:"puzzle"
},

{
title:"Level 5 - Cat Dance Party",
question:"Make the cat dance!",
type:"dance"
},

{
title:"Level 6 - Coding Challenge",
question:"Choose the picture used in Scratch Jr",
type:"dropdown",
options:["Select","Sprite","Tree","Ball"],
correct:"Sprite"
}

];

function createSparkles(){

for(let i=0;i<60;i++){

const sparkle=document.createElement("div");

sparkle.classList.add("sparkle");

sparkle.style.left=Math.random()*100+"%";

sparkle.style.animationDuration=
(Math.random()*5+3)+"s";

document.getElementById("sparkles").appendChild(sparkle);

}

}

createSparkles();

function startGame(){

document.getElementById("startScreen")
.classList.remove("active");

document.getElementById("gameScreen")
.classList.add("active");

loadQuestion();

}

function loadQuestion(){

if(currentQuestion>=questions.length){

showFinal();
return;

}

document.getElementById("nextBtn").style.display="none";

const q=questions[currentQuestion];

document.getElementById("levelTitle").innerHTML=q.title;

document.getElementById("questionText").innerHTML=q.question;

document.getElementById("progressBar").style.width=
(currentQuestion/questions.length)*100+"%";

const gameArea=document.getElementById("gameArea");

gameArea.innerHTML="";

if(q.type==="dropdown"){

gameArea.innerHTML=`

<div style="text-align:center;">

<select class="dropdown" id="answerSelect">

${q.options.map(option=>
`<option>${option}</option>`
).join("")}

</select>

<br><br>

<button class="gameBtn"
onclick="checkDropdown('${q.correct}')">
SUBMIT
</button>

</div>

`;

}

else if(q.type==="rocket"){

gameArea.innerHTML=`

<div class="rocketArea">

<span class="rocket" id="rocket">🚀</span>

<span class="planet">🪐</span>

<div class="buttonArea">

<button class="gameBtn"
onclick="launchRocket()">
LAUNCH 🚀
</button>

</div>

</div>

`;

}

else if(q.type==="puzzle"){

gameArea.innerHTML=`

<div class="puzzleArea">

<div class="puzzlePiece"
onclick="checkPuzzle(1,this)">1</div>

<div class="puzzlePiece"
onclick="checkPuzzle(2,this)">2</div>

<div class="puzzlePiece"
onclick="checkPuzzle(3,this)">3</div>

</div>

`;

puzzleStep=1;

}

else if(q.type==="dance"){

gameArea.innerHTML=`

<div class="danceArea">

<div class="cat" id="cat">🐱</div>

<div class="buttonArea">

<button class="gameBtn"
onclick="danceCat()">
DANCE 💃
</button>

</div>

</div>

`;

}

}

function checkDropdown(correct){

const answer=
document.getElementById("answerSelect").value;

if(answer===correct){

correctSound.play();

score++;

document.getElementById("score").innerHTML=score;

confettiBlast();

}else{

wrongSound.play();

}

showNextButton();

}

function launchRocket(){

const rocket=document.getElementById("rocket");

rocket.style.transform=
"translateX(300px) translateY(-100px)";

correctSound.play();

score++;

document.getElementById("score").innerHTML=score;

confettiBlast();

showNextButton();

}

let puzzleStep=1;

function checkPuzzle(number,element){

if(number===puzzleStep){

element.style.background="limegreen";

correctSound.play();

puzzleStep++;

if(puzzleStep===4){

score++;

document.getElementById("score").innerHTML=score;

confettiBlast();

showNextButton();

}

}else{

element.style.background="red";

wrongSound.play();

showNextButton();

}

}

function danceCat(){

const cat=document.getElementById("cat");

cat.style.animation="dance 1s infinite";

correctSound.play();

score++;

document.getElementById("score").innerHTML=score;

confettiBlast();

showNextButton();

}

function showNextButton(){

document.getElementById("nextBtn").style.display="block";

}

function nextQuestion(){

currentQuestion++;

loadQuestion();

}

function confettiBlast(){

for(let i=0;i<100;i++){

const confetti=document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left=
Math.random()*window.innerWidth+"px";

confetti.style.background=
`hsl(${Math.random()*360},100%,50%)`;

confetti.style.animationDuration=
(Math.random()*3+2)+"s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},5000);

}

}

function showFinal(){

document.getElementById("gameScreen")
.classList.remove("active");

document.getElementById("finalScreen")
.classList.add("active");

document.getElementById("finalScore").innerHTML=
`⭐ You scored ${score} out of ${questions.length}`;

confettiBlast();

}

</script>

</body>
</html>
