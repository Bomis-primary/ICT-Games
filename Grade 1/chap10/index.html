<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tux Paint Canvas Inspector</title>
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --sky-blue: #e0f2fe;
            --pastel-orange: #ffedd5;
            --primary-blue: #0284c7;
            --primary-dark: #0369a1;
            --accent-wood: #854d0e;
            --wood-light: #ca8a04;
            --text-dark: #1e293b;
            --correct-green: #22c55e;
            --wrong-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, var(--sky-blue) 0%, var(--pastel-orange) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
            color: var(--text-dark);
        }

        /* --- 1. BRANDING SPLASH SCREEN (Strict 5 Seconds) --- */
        #brand-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10000;
            transition: opacity 0.5s ease;
            padding: 20px;
        }
        #brand-splash img {
            max-width: 65%;
            max-height: 60vh;
            object-fit: contain;
        }
        .loading-track {
            width: 60%;
            max-width: 250px;
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .loading-bar-fill {
            width: 100%;
            height: 100%;
            background: var(--primary-blue);
            transform: translateX(-100%);
            animation: loadProgress 4.5s forwards linear;
        }

        @keyframes loadProgress {
            from { transform: translateX(-100%); }
            to { transform: translateX(0%); }
        }

        /* --- CONTAINER FRAME --- */
        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border: 6px solid var(--primary-blue);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: clamp(15px, 4vw, 25px);
            text-align: center;
            position: relative;
            backdrop-filter: blur(4px);
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: auto;
        }

        .screen.active {
            display: block;
        }

        @keyframes popUp {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 { color: var(--primary-blue); font-size: clamp(24px, 5vw, 34px); margin-bottom: 8px; }
        p { font-size: clamp(15px, 3.5vw, 19px); color: #475569; margin-bottom: 15px; }

        /* Large Action Button */
        .btn {
            background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: clamp(18px, 4vw, 22px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #9a3412;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
            max-width: 300px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #9a3412;
        }

        /* --- HUD SCORE TRACKER --- */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0f9ff;
            border: 3px dashed var(--primary-blue);
            border-radius: 18px;
            padding: 8px 20px;
            margin-bottom: 15px;
            font-size: clamp(15px, 3.5vw, 20px);
            font-weight: bold;
            color: var(--primary-dark);
        }

        /* --- WOODEN EASEL & CANVAS LAYOUT --- */
        .easel-frame {
            background: #b45309;
            border: 10px solid var(--accent-wood);
            border-radius: 16px;
            padding: 10px;
            max-width: 580px;
            margin: 0 auto 15px auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.2);
            position: relative;
        }
        
        /* Shelf tray ledge at base of easel */
        .easel-frame::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: -5%;
            width: 110%;
            height: 12px;
            background: #78350f;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        canvas {
            background: #ffffff;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.15);
            max-width: 100%;
            height: auto;
        }

        .prompt-banner {
            font-size: clamp(16px, 3.8vw, 22px);
            font-weight: bold;
            color: var(--text-dark);
            background: #fef3c7;
            border: 2px solid #f59e0b;
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        /* --- OPTION BUTTONS LAYOUT --- */
        .options-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .tool-btn {
            background: white;
            color: var(--text-dark);
            border: 4px solid var(--primary-blue);
            padding: 12px;
            border-radius: 20px;
            font-size: clamp(15px, 3.5vw, 19px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--primary-dark);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 52px;
        }

        .tool-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .tool-btn.shake {
            animation: shakeBtn 0.3s ease-in-out;
        }

        @keyframes shakeBtn {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .feedback-box {
            font-size: clamp(18px, 4vw, 22px);
            font-weight: bold;
            min-height: 38px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* --- CERTIFICATE VIEW --- */
        .cert-card {
            border: 6px double var(--wood-light);
            background: #fffbeb;
            padding: 20px 15px;
            border-radius: 24px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .score-badge {
            font-size: clamp(36px, 8vw, 52px);
            font-weight: 900;
            color: #ea580c;
            margin: 10px 0;
        }
        .rank-title {
            display: inline-block;
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: white;
            padding: 10px 30px;
            font-size: clamp(18px, 4vw, 24px);
            border-radius: 50px;
            box-shadow: 0 6px 12px rgba(202, 138, 4, 0.3);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. BRANDING SPLASH SCREEN -->
    <div id="brand-splash">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.src='https://via.placeholder.com/320x100?text=Innovine+Pedagogy'">
        <div class="loading-track">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <!-- 2. GAMEPLAY SCREEN -->
    <div id="screen-game" class="screen">
        <div class="hud-bar">
            <div id="hud-round">Canvas: 1 / 8</div>
            <div>⭐ Stars: <span id="hud-score">0</span></div>
        </div>

        <div class="prompt-banner" id="prompt-text">
            Prompt question text loading...
        </div>

        <div class="easel-frame">
            <canvas id="clueCanvas" width="560" height="300"></canvas>
        </div>

        <div class="options-row" id="options-container"></div>

        <div class="feedback-box" id="feedback-msg"></div>
    </div>

    <!-- 3. CERTIFICATE COMPLETION SCREEN -->
    <div id="screen-completion" class="screen">
        <h1>🎉 Case Closed, Detective! 🎉</h1>
        
        <div class="cert-card">
            <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 14px; font-weight: bold; color: #78350f;">
                Art Detective Academy Certificate
            </p>
            <div style="font-size: 60px; margin: 10px 0;">🕵️‍♂️🎨</div>
            <div class="score-badge" id="player-score">8/8 Canvases Solved</div>
            <div class="rank-title">Master Art Detective 🏆</div>
        </div>

        <button class="btn" onclick="restartGame()" style="background: linear-gradient(180deg, var(--primary-blue) 0%, var(--primary-dark) 100%); box-shadow: 0 6px 0 #025a87;">🔄 Inspect Again</button>
    </div>

    <!-- AUDIO RIG EMBEDS -->
    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        let currentRound = 0;
        let correctCount = 0;
        let canInteract = true;

        const canvas = document.getElementById('clueCanvas');
        const ctx = canvas.getContext('2d');

        // EXPANDED 8-LEVEL DATABASE WITH VECTOR DRAWINGS
        const stages = [
            // Level 1: Rainbow Magic
            {
                prompt: "Look at this canvas! What magical tool made these beautiful rainbow arcs?",
                choices: [
                    { text: "🪄 Magic Tool", correct: true },
                    { text: "🧽 Eraser Tool", correct: false },
                    { text: "🅰️ Text Tool", correct: false }
                ],
                draw: () => {
                    ctx.fillStyle = "#22c55e";
                    ctx.fillRect(0, 240, 560, 60);
                    for (let i = 0; i < 560; i += 15) {
                        ctx.beginPath();
                        ctx.moveTo(i, 240);
                        ctx.lineTo(i + 5, 220);
                        ctx.lineTo(i + 10, 240);
                        ctx.fill();
                    }
                    const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6", "#6366f1", "#a855f7"];
                    colors.forEach((color, i) => {
                        ctx.beginPath();
                        ctx.arc(280, 240, 160 - (i * 10), Math.PI, 0, false);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 10;
                        ctx.stroke();
                    });
                }
            },
            // Level 2: Stamp Tool
            {
                prompt: "Look at all these repeated picture stickers! Which tool stamped them onto the canvas?",
                choices: [
                    { text: "✏️ Lines Tool", correct: false },
                    { text: "🧸 Stamp Tool", correct: true },
                    { text: "🎨 Paint Tool", correct: false }
                ],
                draw: () => {
                    const drawBearStamp = (x, y) => {
                        ctx.fillStyle = "#b45309";
                        ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(x - 18, y - 15, 8, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(x + 18, y - 15, 8, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = "#fef08a";
                        ctx.beginPath(); ctx.arc(x, y + 4, 8, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = "#000000";
                        ctx.beginPath(); ctx.arc(x - 6, y - 4, 3, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(x + 6, y - 4, 3, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(x, y + 2, 2, 0, Math.PI * 2); ctx.fill();
                    };
                    const drawTreeStamp = (x, y) => {
                        ctx.fillStyle = "#78350f"; ctx.fillRect(x - 5, y, 10, 25);
                        ctx.fillStyle = "#15803d";
                        ctx.beginPath(); ctx.moveTo(x, y - 30); ctx.lineTo(x - 20, y); ctx.lineTo(x + 20, y); ctx.fill();
                    };
                    drawBearStamp(100, 90); drawTreeStamp(220, 75);
                    drawBearStamp(460, 100); drawTreeStamp(350, 160);
                    drawBearStamp(140, 210); drawTreeStamp(480, 200);
                }
            },
            // Level 3: Shapes Tool
            {
                prompt: "This house is built using clean geometric shapes. Which tool created them?",
                choices: [
                    { text: "💾 Save Tool", correct: false },
                    { text: "🎨 Paint Tool", correct: false },
                    { text: "📐 Shapes Tool", correct: true }
                ],
                draw: () => {
                    ctx.fillStyle = "#ef4444"; ctx.lineWidth = 4; ctx.strokeStyle = "#991b1b";
                    ctx.fillRect(190, 130, 180, 130); ctx.strokeRect(190, 130, 180, 130);

                    ctx.fillStyle = "#3b82f6"; ctx.strokeStyle = "#1e40af";
                    ctx.beginPath(); ctx.moveTo(160, 130); ctx.lineTo(280, 40); ctx.lineTo(400, 130); ctx.closePath();
                    ctx.fill(); ctx.stroke();

                    ctx.fillStyle = "#eab308"; ctx.fillRect(215, 155, 45, 45); ctx.strokeRect(215, 155, 45, 45);
                    ctx.fillStyle = "#78350f"; ctx.fillRect(295, 170, 45, 90); ctx.strokeRect(295, 170, 45, 90);
                }
            },
            // Level 4: Text Tool
            {
                prompt: "Someone typed words onto the canvas! Which tool did they use to type?",
                choices: [
                    { text: "🅰️ Text Tool", correct: true },
                    { text: "🧽 Eraser Tool", correct: false },
                    { text: "🪄 Magic Tool", correct: false }
                ],
                draw: () => {
                    ctx.fillStyle = "#1e3a8a";
                    ctx.font = "bold 42px 'Arial Rounded MT Bold', sans-serif";
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText("HELLO TUX PAINT!", 280, 140);

                    ctx.fillStyle = "#0284c7";
                    ctx.font = "bold 24px 'Arial Rounded MT Bold', sans-serif";
                    ctx.fillText("Grade 1 Artists", 280, 200);

                    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(430, 185); ctx.lineTo(430, 215); ctx.stroke();
                }
            },
            // Level 5: Fill Bucket Tool
            {
                prompt: "The entire canvas background was turned bright blue in ONE single click! Which tool filled it?",
                choices: [
                    { text: "🖌️ Paint Brush", correct: false },
                    { text: "🪣 Fill Bucket Tool", correct: true },
                    { text: "🏷️ Stamp Tool", correct: false }
                ],
                draw: () => {
                    ctx.fillStyle = "#38bdf8"; ctx.fillRect(0, 0, 560, 300);
                    ctx.fillStyle = "#fef08a"; ctx.beginPath(); ctx.arc(100, 80, 40, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath(); ctx.arc(400, 80, 25, 0, Math.PI * 2); ctx.arc(430, 80, 35, 0, Math.PI * 2); ctx.arc(460, 80, 25, 0, Math.PI * 2); ctx.fill();
                }
            },
            // Level 6: Eraser Tool
            {
                prompt: "Oh look! White streaks rub away parts of the drawing! Which tool was used to wipe them out?",
                choices: [
                    { text: "🧽 Eraser Tool", correct: true },
                    { text: "📐 Shapes Tool", correct: false },
                    { text: "🪄 Magic Tool", correct: false }
                ],
                draw: () => {
                    ctx.fillStyle = "#f472b6"; ctx.fillRect(0, 0, 560, 300);
                    ctx.fillStyle = "#10b981"; ctx.beginPath(); ctx.arc(280, 150, 90, 0, Math.PI * 2); ctx.fill();

                    // Eraser white wipe streaks
                    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 30; ctx.lineCap = "round";
                    ctx.beginPath(); ctx.moveTo(180, 100); ctx.lineTo(380, 100); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(200, 180); ctx.lineTo(360, 180); ctx.stroke();
                }
            },
            // Level 7: Brushes / Freehand Tool
            {
                prompt: "Look at these freehand wavy strokes and squiggles! Which tool painted them?",
                choices: [
                    { text: "📏 Line Tool", correct: false },
                    { text: "🎨 Brushes Tool", correct: true },
                    { text: "🅰️ Text Tool", correct: false }
                ],
                draw: () => {
                    const strokeColors = ["#ef4444", "#10b981", "#8b5cf6", "#f59e0b"];
                    strokeColors.forEach((color, i) => {
                        ctx.strokeStyle = color; ctx.lineWidth = 14; ctx.lineCap = "round";
                        ctx.beginPath();
                        ctx.moveTo(50, 60 + (i * 60));
                        ctx.bezierCurveTo(180, 10 + (i * 60), 380, 110 + (i * 60), 510, 60 + (i * 60));
                        ctx.stroke();
                    });
                }
            },
            // Level 8: Lines Tool
            {
                prompt: "These perfectly straight, crisp lines form a starburst pattern! Which tool drew straight lines?",
                choices: [
                    { text: "📏 Lines Tool", correct: true },
                    { text: "🧽 Eraser Tool", correct: false },
                    { text: "🪣 Fill Bucket", correct: false }
                ],
                draw: () => {
                    ctx.lineWidth = 8; ctx.lineCap = "round";
                    const lineColors = ["#ef4444", "#f97316", "#eab308", "#10b981", "#06b6d4", "#3b82f6", "#a855f7", "#ec4899"];
                    for (let i = 0; i < 8; i++) {
                        const angle = (i * Math.PI) / 4;
                        ctx.strokeStyle = lineColors[i];
                        ctx.beginPath();
                        ctx.moveTo(280, 150);
                        ctx.lineTo(280 + Math.cos(angle) * 180, 150 + Math.sin(angle) * 120);
                        ctx.stroke();
                    }
                }
            }
        ];

        // Unlock Audio Context on First Interaction
        function unlockAudio() {
            const sndCorrect = document.getElementById('audio-correct');
            const sndWrong = document.getElementById('audio-wrong');
            if (sndCorrect) sndCorrect.load();
            if (sndWrong) sndWrong.load();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Strict 5-Second Splash Screen Engine
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('brand-splash');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.style.display = 'none';
                        showScreen('screen-game');
                        loadInspectionRound();
                    }, 500);
                }
            }, 5000);
        });

        function loadInspectionRound() {
            unlockAudio();
            canInteract = true;
            document.getElementById('feedback-msg').innerHTML = "";
            
            const stage = stages[currentRound];
            document.getElementById('hud-round').innerText = `Canvas: ${currentRound + 1} / ${stages.length}`;
            document.getElementById('hud-score').innerText = correctCount;
            document.getElementById('prompt-text').innerText = stage.prompt;

            // Clear and render canvas art
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stage.draw();

            // Populate choices
            const container = document.getElementById('options-container');
            container.innerHTML = "";

            stage.choices.forEach(choice => {
                const button = document.createElement('button');
                button.className = "tool-btn";
                button.innerText = choice.text;
                button.onclick = () => verifyDeduction(choice.correct, button);
                container.appendChild(button);
            });
        }

        function verifyDeduction(isCorrect, element) {
            if (!canInteract) return;

            const feedback = document.getElementById('feedback-msg');
            const sndCorrect = document.getElementById('audio-correct');
            const sndWrong = document.getElementById('audio-wrong');

            if (isCorrect) {
                canInteract = false;
                correctCount++;
                document.getElementById('hud-score').innerText = correctCount;

                element.style.background = "linear-gradient(180deg, #4ade80 0%, #22c55e 100%)";
                element.style.borderColor = "#166534";
                element.style.color = "#ffffff";

                feedback.innerHTML = "🌟 🎉 Spot on, Detective! That's correct! 🎉 🌟";
                feedback.style.color = "#166534";

                // Localized Button Confetti Burst
                const rect = element.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;
                
                confetti({
                    particleCount: 40,
                    spread: 50,
                    origin: { x: x, y: y }
                });
                
                if (sndCorrect) { sndCorrect.currentTime = 0; sndCorrect.play().catch(()=>{}); }

                setTimeout(() => {
                    currentRound++;
                    if (currentRound < stages.length) {
                        loadInspectionRound();
                    } else {
                        triggerGameCompletion();
                    }
                }, 1600);
            } else {
                element.classList.add('shake');
                setTimeout(() => element.classList.remove('shake'), 300);

                element.style.background = "linear-gradient(180deg, #f87171 0%, #ef4444 100%)";
                element.style.borderColor = "#991b1b";
                element.style.color = "#ffffff";

                feedback.innerHTML = "❌ 😢 Hmm, that tool doesn't match! Try again! 💔 ❌";
                feedback.style.color = "#991b1b";

                if (sndWrong) { sndWrong.currentTime = 0; sndWrong.play().catch(()=>{}); }
            }
        }

        function triggerGameCompletion() {
            showScreen('screen-completion');
            document.getElementById('player-score').innerText = `${correctCount} / ${stages.length} Canvases Solved`;

            confetti({
                particleCount: 180,
                spread: 90,
                origin: { y: 0.6 }
            });
        }

        function restartGame() {
            currentRound = 0;
            correctCount = 0;
            showScreen('screen-game');
            loadInspectionRound();
        }
    </script>
</body>
</html>
