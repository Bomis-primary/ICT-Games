<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 1 STEM Robot Adventure</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS',sans-serif;
}

body{
background:url('assets/robot-bg.jpg');
background-size:cover;
background-position:center;
min-height:100vh;
overflow-x:hidden;
color:white;
transition:1s;
}

.overlay{
background:rgba(0,0,0,0.6);
min-height:100vh;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
text-align:center;
}

.logo{
width:140px;
margin-bottom:10px;
}

h1{
font-size:50px;
color:#FFD700;
text-shadow:3px 3px 10px black;
margin-bottom:10px;
}

.subtitle{
font-size:25px;
margin-bottom:20px;
}

.progressBox{
width:100%;
height:25px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress{
height:100%;
width:0%;
background:linear-gradient(to right,#00e5ff,#00ff95);
transition:0.5s;
}

.topbar{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
font-size:26px;
margin-bottom:20px;
}

.gameCard{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
padding:25px;
border-radius:25px;
box-shadow:0 0 20px rgba(255,255,255,0.2);
}

#question{
font-size:32px;
margin-bottom:20px;
}

.questionImage{
width:240px;
height:240px;
object-fit:contain;
background:white;
padding:10px;
border-radius:20px;
margin:15px auto;
display:block;
}

.options{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.optionBtn{
padding:16px;
font-size:24px;
border:none;
border-radius:18px;
cursor:pointer;
background:white;
color:black;
transition:0.3s;
font-weight:bold;
}

.optionBtn:hover{
transform:scale(1.05);
background:#ffeb3b;
}

#feedback{
font-size:30px;
font-weight:bold;
margin-top:20px;
}

#nextBtn{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:15px;
cursor:pointer;
background:#4CAF50;
color:white;
margin-top:20px;
display:none;
}

.drag-container{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:25px;
}

.drag-item{
padding:15px 20px;
background:#00e5ff;
border-radius:15px;
cursor:grab;
font-size:24px;
font-weight:bold;
color:black;
}

.drop-box{
width:250px;
height:120px;
border:4px dashed white;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
background:rgba(255,255,255,0.1);
}

.checkboxArea{
margin-top:20px;
font-size:25px;
text-align:left;
}

.checkboxArea label{
display:block;
margin:10px;
}

select{
padding:15px;
font-size:22px;
border-radius:12px;
margin-top:20px;
width:300px;
}

.timer{
font-size:32px;
color:#ffeb3b;
margin-bottom:15px;
}

.finalScreen{
display:none;
background:white;
color:black;
padding:30px;
border-radius:25px;
margin-top:30px;
}

.finalScreen h1{
color:#ff5722;
}

.robot{
position:fixed;
bottom:10px;
right:20px;
font-size:90px;
animation:robotJump 2s infinite alternate;
}

@keyframes robotJump{
from{transform:translateY(0);}
to{transform:translateY(-20px);}
}

@media(max-width:768px){

h1{
font-size:36px;
}

#question{
font-size:24px;
}

.optionBtn{
font-size:20px;
}

.questionImage{
width:180px;
height:180px;
}

}

</style>
</head>

<body>

<div class="overlay">

<div class="robot">🤖</div>

<div class="container">

<img src="assets/innovine-logo.png" class="logo">

<h1>🚀 STEM Robot Adventure</h1>

<div class="subtitle">
Science • Technology • Engineering • Mathematics
</div>

<div class="progressBox">
<div class="progress" id="progress"></div>
</div>

<div class="topbar">
<div>⭐ Stars: <span id="stars">0</span></div>
<div>🏆 Trophies: <span id="trophies">0</span></div>
<div class="timer">⏰ <span id="time">40</span>s</div>
</div>

<div class="gameCard" id="gameCard">

<h2 id="question"></h2>

<div id="imageArea"></div>

<div id="options" class="options"></div>

<div id="extraArea"></div>

<div id="feedback"></div>

<button id="nextBtn">Next ➜</button>

</div>

<div class="finalScreen" id="finalScreen">

<h1>🎉 Congratulations STEM Hero 🎉</h1>

<h2>Your Score: <span id="finalScore"></span></h2>

<h2>Total Stars: <span id="finalStars"></span></h2>

<h2>Total Trophies: <span id="finalTrophies"></span></h2>

<br>

<button onclick="restartGame()"
style="padding:15px 30px;font-size:22px;background:#2196F3;color:white;border:none;border-radius:15px;">
Play Again
</button>

</div>

</div>

</div>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

const questions=[

{
type:"mcq",
question:"What does STEM stand for?",
options:[
"Science Technology Engineering Mathematics",
"Sports Toys Energy Music",
"Science Toys English Maths",
"Space Train Engine Motor"
],
answer:"Science Technology Engineering Mathematics",
image:"assets/robots.PNG",
bg:"assets/robot-bg.jpg"
},

{
type:"imageMcq",
question:"Which picture shows Mathematics?",
options:[
"assets/mathematics.PNG",
"assets/communication.PNG",
"assets/engineering.PNG",
"assets/education.PNG"
],
answer:"assets/mathematics.PNG",
bg:"assets/robot-bg1.jpg"
},

{
type:"dragdrop",
question:"Drag the Helper Robot into the correct box",
dragText:"Helper Robot",
dropAnswer:"Helper Robot",
image:"assets/helper-robot.PNG",
bg:"assets/robot-bg.jpg"
},

{
type:"checkbox",
question:"Select TWO uses of robots",
choices:[
"Helping doctors",
"Flying bananas",
"Cleaning floors",
"Eating houses"
],
answers:[
"Helping doctors",
"Cleaning floors"
],
image:"assets/medical-robot.PNG",
bg:"assets/robot-bg1.jpg"
},

{
type:"listbox",
question:"Choose the robot used in factories",
options:[
"Medical Robot",
"Factory Robot",
"Helper Robot",
"Exploration Robot"
],
answer:"Factory Robot",
image:"assets/factory-robot.PNG",
bg:"assets/robot-bg.jpg"
},

{
type:"mcq",
question:"Which robot goes to space?",
options:[
"Exploration Robot",
"Kitchen Robot",
"Toy Robot",
"Dance Robot"
],
answer:"Exploration Robot",
image:"assets/exploration-robot.PNG",
bg:"assets/robot-bg1.jpg"
},

{
type:"imageMcq",
question:"Click the Engineering picture",
options:[
"assets/engineering.PNG",
"assets/mathematics.PNG",
"assets/communication.PNG",
"assets/education.PNG"
],
answer:"assets/engineering.PNG",
bg:"assets/robot-bg.jpg"
},

{
type:"truefalse",
question:"Robots follow commands.",
options:["True","False"],
answer:"True",
image:"assets/robots.PNG",
bg:"assets/robot-bg1.jpg"
},

{
type:"mcq",
question:"Which robot helps doctors?",
options:[
"Medical Robot",
"Factory Robot",
"Dance Robot",
"Toy Robot"
],
answer:"Medical Robot",
image:"assets/medical-robot.PNG",
bg:"assets/robot-bg.jpg"
},

{
type:"mcq",
question:"Technology means tools and gadgets that help us.",
options:[
"True",
"False"
],
answer:"True",
image:"assets/communication.PNG",
bg:"assets/robot-bg1.jpg"
}

];

let currentQuestion=0;
let score=0;
let stars=0;
let trophies=0;
let timer;
let timeLeft=40;

const questionEl=document.getElementById('question');
const optionsEl=document.getElementById('options');
const extraArea=document.getElementById('extraArea');
const imageArea=document.getElementById('imageArea');
const feedback=document.getElementById('feedback');

function startTimer(){

clearInterval(timer);

timeLeft=40;

document.getElementById('time').innerHTML=timeLeft;

timer=setInterval(()=>{

timeLeft--;

document.getElementById('time').innerHTML=timeLeft;

if(timeLeft<=0){

clearInterval(timer);

feedback.innerHTML="⏰ Time Up!";
feedback.style.color="red";

disableAll();

document.getElementById('nextBtn').style.display='inline-block';

}

},1000);

}

function showQuestion(){

startTimer();

const q=questions[currentQuestion];

document.body.style.background=`url('${q.bg}') center/cover`;

questionEl.innerHTML=q.question;

optionsEl.innerHTML='';
extraArea.innerHTML='';
feedback.innerHTML='';
imageArea.innerHTML='';

document.getElementById('nextBtn').style.display='none';

updateProgress();

if(q.image){

imageArea.innerHTML=
`<img src="${q.image}" class="questionImage">`;

}

if(q.type==="mcq" || q.type==="truefalse"){

q.options.forEach(option=>{

const btn=document.createElement('button');

btn.className='optionBtn';

btn.innerHTML=option;

btn.onclick=()=>checkAnswer(option===q.answer,btn);

optionsEl.appendChild(btn);

});

}

else if(q.type==="imageMcq"){

q.options.forEach(option=>{

const img=document.createElement('img');

img.src=option;

img.className='questionImage';

img.style.cursor='pointer';

img.onclick=()=>checkAnswer(option===q.answer,img);

optionsEl.appendChild(img);

});

}

else if(q.type==="dragdrop"){

const dragContainer=document.createElement('div');

dragContainer.className='drag-container';

const drag=document.createElement('div');

drag.className='drag-item';

drag.innerHTML=q.dragText;

drag.draggable=true;

drag.addEventListener('dragstart',dragStart);

const drop=document.createElement('div');

drop.className='drop-box';

drop.innerHTML='Drop Here';

drop.addEventListener('dragover',(e)=>e.preventDefault());

drop.addEventListener('drop',()=>{

correctAnswer();

drop.innerHTML=q.dragText;

});

dragContainer.appendChild(drag);

dragContainer.appendChild(drop);

extraArea.appendChild(dragContainer);

}

else if(q.type==="checkbox"){

const area=document.createElement('div');

area.className='checkboxArea';

q.choices.forEach(choice=>{

const label=document.createElement('label');

label.innerHTML=
`<input type="checkbox" value="${choice}"> ${choice}`;

area.appendChild(label);

});

const btn=document.createElement('button');

btn.className='optionBtn';

btn.innerHTML='Submit';

btn.onclick=()=>{

const selected=[...document.querySelectorAll('input[type=checkbox]:checked')]
.map(x=>x.value);

selected.sort();
q.answers.sort();

if(JSON.stringify(selected)===JSON.stringify(q.answers)){

correctAnswer();

}else{

wrongAnswer(btn);

}

};

extraArea.appendChild(area);
extraArea.appendChild(btn);

}

else if(q.type==="listbox"){

const select=document.createElement('select');

q.options.forEach(option=>{

const op=document.createElement('option');

op.value=option;
op.innerHTML=option;

select.appendChild(op);

});

const btn=document.createElement('button');

btn.className='optionBtn';

btn.innerHTML='Submit';

btn.onclick=()=>{

if(select.value===q.answer){

correctAnswer();

}else{

wrongAnswer(btn);

}

};

extraArea.appendChild(select);
extraArea.appendChild(document.createElement('br'));
extraArea.appendChild(btn);

}

}

function dragStart(e){

e.dataTransfer.setData('text',e.target.innerHTML);

}

function checkAnswer(correct,element){

if(correct){

correctAnswer(element);

}else{

wrongAnswer(element);

}

}

function correctAnswer(){

clearInterval(timer);

feedback.innerHTML="✅ Correct!";
feedback.style.color="#00ff95";

document.getElementById('correctSound').play();

confetti({
particleCount:250,
spread:120
});

score++;
stars+=10;
trophies++;

document.getElementById('stars').innerHTML=stars;
document.getElementById('trophies').innerHTML=trophies;

disableAll();

document.getElementById('nextBtn').style.display='inline-block';

}

function wrongAnswer(el){

clearInterval(timer);

feedback.innerHTML="❌ Wrong!";
feedback.style.color="red";

document.getElementById('wrongSound').play();

disableAll();

document.getElementById('nextBtn').style.display='inline-block';

}

function disableAll(){

document.querySelectorAll('button').forEach(btn=>{

if(btn.id!=="nextBtn"){
btn.disabled=true;
}

});

document.querySelectorAll('img').forEach(img=>{
img.style.pointerEvents='none';
});

}

document.getElementById('nextBtn').addEventListener('click',()=>{

currentQuestion++;

if(currentQuestion<questions.length){

showQuestion();

}else{

showFinal();

}

});

function updateProgress(){

let progress=((currentQuestion)/questions.length)*100;

document.getElementById('progress').style.width=progress+'%';

}

function showFinal(){

document.getElementById('gameCard').style.display='none';

document.getElementById('finalScreen').style.display='block';

document.getElementById('finalScore').innerHTML=
`${score}/${questions.length}`;

document.getElementById('finalStars').innerHTML=stars;

document.getElementById('finalTrophies').innerHTML=trophies;

confetti({
particleCount:500,
spread:180
});

}

function restartGame(){

location.reload();

}

showQuestion();

</script>

</body>
</html>
