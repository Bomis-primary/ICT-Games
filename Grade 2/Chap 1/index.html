<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Magic IPO Factory - Grade 2</title>

<!-- Canvas Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Comic Sans MS', cursive, sans-serif;
}

body{
  background: linear-gradient(135deg, #ffe5ec, #eae6ff, #e8f0fe);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  overflow-x:hidden;
}

/* --- BRANDING SPLASH SCREEN --- */
#brand-splash {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background-color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
  transition: opacity 0.5s ease;
}
#brand-splash img {
  max-width: 65%;
  max-height: 70vh;
  object-fit: contain;
}

/* --- MAIN CONTAINER CARDS --- */
.screen{
  display:none;
  background: white;
  width: 95%;
  max-width: 900px;
  padding: 35px 25px;
  border-radius: 35px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.12);
  text-align: center;
  position: relative;
  border: 4px solid #b3e5fc;
  animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popUp {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.screen.active{
  display:block;
}

h1{
  color: #0284c7;
  font-size: 36px;
  margin-bottom: 10px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
}

.subtitle{
  font-size: 18px;
  color: #64748b;
  margin-bottom: 25px;
}

/* --- SCOREBAR BAR --- */
.scoreboard {
  background: #f0fdf4;
  border: 2px solid #bbf7d0;
  padding: 12px 25px;
  border-radius: 50px;
  display: inline-flex;
  justify-content: space-between;
  align-items: center;
  gap: 30px;
  margin-bottom: 25px;
  font-size: 20px;
  font-weight: bold;
  color: #166534;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}

.btn {
  background: #ff7043;
  color: white;
  border: none;
  padding: 16px 36px;
  border-radius: 50px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 6px 14px rgba(255,112,67,0.3);
  transition: transform 0.2s, background-color 0.2s;
}

.btn:hover {
  transform: scale(1.05);
  background: #e64a19;
}

/* --- CONVEYOR BELT IPO FLOW STYLING --- */
.factory-floor {
  background: #f8fafc;
  border: 3px dashed #cbd5e1;
  border-radius: 24px;
  padding: 20px;
  margin: 20px 0;
  position: relative;
}

.conveyor-belt {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  gap: 15px;
  margin-bottom: 25px;
  position: relative;
  flex-wrap: wrap;
}

.ipo-card {
  flex: 1;
  min-width: 200px;
  background: white;
  padding: 20px 15px;
  border-radius: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  border: 3px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.ipo-card.input-card { border-color: #fca5a5; background: #fff5f5; }
.ipo-card.process-card { border-color: #fde047; background: #fefce8; }
.ipo-card.output-card { border-color: #86efac; background: #f0fdf4; border-style: dashed; }

.ipo-label {
  font-size: 14px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  padding: 4px 12px;
  border-radius: 12px;
  color: white;
}
.input-card .ipo-label { background: #ef4444; }
.process-card .ipo-label { background: #eab308; color: #451a03; }
.output-card .ipo-label { background: #22c55e; }

.ipo-content {
  font-size: 18px;
  font-weight: bold;
  color: #334155;
  line-height: 1.4;
}

.arrow-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #94a3b8;
}

/* --- CHOOSE OPTIONS STYLING --- */
.prompt-text {
  font-size: 22px;
  color: #1e293b;
  font-weight: bold;
  margin-bottom: 20px;
}

.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 15px;
  margin-top: 15px;
}

.option-card {
  background: white;
  border: 3px solid #e2e8f0;
  padding: 20px;
  border-radius: 20px;
  font-size: 20px;
  font-weight: bold;
  color: #334155;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 6px rgba(0,0,0,0.03);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.option-card:hover {
  transform: translateY(-3px);
  border-color: #38bdf8;
  background: #f0f9ff;
}

.feedback-box {
  height: 40px;
  font-size: 24px;
  font-weight: bold;
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* --- CERTIFICATE VIEW STYLING --- */
.certificate {
  border: 8px double #eab308;
  background: #fffdf5;
  padding: 40px 30px;
  border-radius: 24px;
  box-shadow: inset 0 0 40px rgba(234,179,8,0.05);
}

.cert-title {
  font-size: 24px;
  color: #ca8a04;
  letter-spacing: 2px;
  font-weight: bold;
  text-transform: uppercase;
  margin-bottom: 15px;
}

.final-score {
  font-size: 64px;
  font-weight: bold;
  color: #dc2626;
  margin: 15px 0;
}

.rank-badge {
  background: #ca8a04;
  color: white;
  font-size: 24px;
  padding: 12px 30px;
  border-radius: 50px;
  display: inline-block;
  font-weight: bold;
  margin-top: 10px;
  box-shadow: 0 4px 10px rgba(202,138,4,0.3);
}

@media(max-width: 600px) {
  .conveyor-belt { flex-direction: column; }
  .arrow-divider { transform: rotate(90deg); margin: 5px 0; }
  h1 { font-size: 26px; }
}
</style>
</head>
<body>

<!-- CORE GAME AUDIO FEEDBACK -->
<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="assets/clap.mp3" preload="auto"></audio>

<!-- 1. BRANDING SPLASH SCREEN (5 SECONDS) -->
<div id="brand-splash">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- 2. MAIN GAMEPLAY PANEL -->
<div id="gameplayScreen" class="screen">
  <h1>The Magic IPO Factory</h1>
  <div class="scoreboard">
    <div>🎯 Round: <span id="currentRoundNum">1</span>/4</div>
    <div>⭐ Score: <span id="currentScore">0</span></div>
  </div>

  <div class="factory-floor">
    <div class="conveyor-belt">
      <div class="ipo-card input-card">
        <span class="ipo-label">Input</span>
        <div class="ipo-content" id="inputContent">...</div>
      </div>
      <div class="arrow-divider">➜</div>
      <div class="ipo-card process-card">
        <span class="ipo-label">Process</span>
        <div class="ipo-content" id="processContent">...</div>
      </div>
      <div class="arrow-divider">➜</div>
      <div class="ipo-card output-card">
        <span class="ipo-label">Output</span>
        <div class="ipo-content" id="outputContent" style="color:#94a3b8; font-style:italic;">? Hidden ?</div>
      </div>
    </div>
  </div>

  <div class="prompt-text" id="roundPrompt">...</div>
  <div class="options-grid" id="optionsContainer"></div>
  <div class="feedback-box" id="feedbackDisplay"></div>
</div>

<!-- 3. END-GAME EVALUATION SCREEN -->
<div id="certificateScreen" class="screen">
  <div class="certificate">
    <div class="cert-title">📜 Factory Master Certificate</div>
    <p style="font-size: 20px; color: #475569; margin-top: 15px; font-weight: bold;">You completed the IPO Cycle Game with a score of:</p>
    <div class="final-score" id="certFinalScore">0/4 Points</div>
    <div class="rank-badge" id="certRank">Certified Chief Systems Engineer</div>
    <div>
      <button class="btn" onclick="location.reload()" style="margin-top: 30px; font-size:18px; padding:12px 25px;">Play Again 🔄</button>
    </div>
  </div>
</div>

<script>
// Game State variables
let currentRound = 0;
let score = 0;
let isAnswered = false;

// Unified Sequential Round Questions Database
const ipoRoundsData = [
  {
    input: "🥭 Raw Mangoes & Sugar",
    process: "Blends in a Mixer",
    prompt: "What is the final OUTPUT?",
    options: [
      { text: "🧃 Sweet Mango Juice", isCorrect: true },
      { text: "🍕 Cheese Pizza", isCorrect: false },
      { text: "🪵 Wooden Chair", isCorrect: false }
    ]
  },
  {
    input: "⌨️ Tapping keys 'A-P-P-L-E' on Keyboard",
    process: "CPU processes the letters",
    prompt: "What is the correct OUTPUT on the screen?",
    options: [
      { text: "🔊 A loud beep sound", isCorrect: false },
      { text: "🍎 The word 'APPLE' shows on Monitor", isCorrect: true },
      { text: "🖨️ A printed picture", isCorrect: false }
    ]
  },
  {
    input: "🧼 Dirty Clothes & Washing Powder",
    process: "Spinning inside the Washing Machine",
    prompt: "What is the wonderful OUTPUT?",
    options: [
      { text: "👕 Clean, fresh clothes", isCorrect: true },
      { text: "🍽️ Hot dinner", isCorrect: false },
      { text: "🎒 New school bag", isCorrect: false }
    ]
  },
  {
    input: "Numbers: 5 and 2 (with a '+' sign)",
    process: "CPU adds the numbers together",
    prompt: "What is the mathematical OUTPUT?",
    options: [
      { text: "🔢 3", isCorrect: false },
      { text: "🔢 10", isCorrect: false },
      { text: "🔢 7", isCorrect: true }
    ]
  }
];

// Splash Screen Timer Controller (Exactly 5 Seconds)
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const splash = document.getElementById('brand-splash');
    splash.style.opacity = '0';
    setTimeout(() => {
      splash.style.display = 'none';
      document.getElementById('gameplayScreen').classList.add('active');
      loadRound();
    }, 500);
  }, 5000);
});

// Sound Handler
function playAudio(elementId, isSuccess) {
  const audioNode = document.getElementById(elementId);
  if (audioNode && audioNode.src && audioNode.currentTime !== undefined) {
    audioNode.currentTime = 0;
    audioNode.play().catch(() => playFallbackSound(isSuccess));
  } else {
    playFallbackSound(isSuccess);
  }
}

// Fallback Sound Generator
function playFallbackSound(isSuccess) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    if (isSuccess) {
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.setValueAtTime(164.81, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    }
  } catch(e) { console.log('Audio fallback failed'); }
}

// Populate round details
function loadRound() {
  isAnswered = false;
  document.getElementById('feedbackDisplay').innerText = "";
  document.getElementById('outputContent').innerText = "? Hidden ?";
  document.getElementById('outputContent').style.color = "#94a3b8";
  document.getElementById('outputContent').style.fontStyle = "italic";

  const currentData = ipoRoundsData[currentRound];

  document.getElementById('currentRoundNum').innerText = currentRound + 1;
  document.getElementById('inputContent').innerText = currentData.input;
  document.getElementById('processContent').innerText = currentData.process;
  document.getElementById('roundPrompt').innerText = currentData.prompt;

  const optionsContainer = document.getElementById('optionsContainer');
  optionsContainer.innerHTML = "";

  currentData.options.forEach(option => {
    const card = document.createElement('div');
    card.className = "option-card";
    card.innerText = option.text;
    card.onclick = () => evaluateChoice(card, option.isCorrect);
    optionsContainer.appendChild(card);
  });
}

// Evaluate selection
function evaluateChoice(selectedCard, isCorrect) {
  if(isAnswered) return;
  isAnswered = true;

  const feedbackDisplay = document.getElementById('feedbackDisplay');

  if(isCorrect) {
    score++;
    document.getElementById('currentScore').innerText = score;
    selectedCard.style.background = "#dcfce7";
    selectedCard.style.borderColor = "#22c55e";
    feedbackDisplay.innerText = "🎉 Brilliant! Correct Answer!";
    feedbackDisplay.style.color = "#166534";
    playAudio('correctSound', true);
  } else {
    selectedCard.style.background = "#fee2e2";
    selectedCard.style.borderColor = "#ef4444";
    feedbackDisplay.innerText = "❌ Let's try to fix that next time!";
    feedbackDisplay.style.color = "#991b1b";
    playAudio('wrongSound', false);
  }

  // Reveal output
  const targetedAnswer = ipoRoundsData[currentRound].options.find(o => o.isCorrect).text;
  const outputField = document.getElementById('outputContent');
  outputField.innerText = targetedAnswer;
  outputField.style.color = "#166534";
  outputField.style.fontStyle = "normal";

  // Next round delay
  setTimeout(() => {
    currentRound++;
    if(currentRound < ipoRoundsData.length) {
      loadRound();
    } else {
      triggerEvaluationView();
    }
  }, 2200);
}

// Result Screen
function triggerEvaluationView() {
  document.getElementById('gameplayScreen').classList.remove('active');
  document.getElementById('certificateScreen').classList.add('active');

  document.getElementById('certFinalScore').innerText = `${score} / 4 Points`;

  let designRank = "";
  if(score === 4) {
    designRank = "🏆 Certified Chief Systems Engineer";
  } else if (score >= 2) {
    designRank = "🌟 Expert Factory Junior Planner";
  } else {
    designRank = "📘 Systems Apprentice Explorer";
  }

  document.getElementById('certRank').innerText = designRank;

  playAudio('clapSound', true);
  if(typeof confetti === 'function') {
    confetti({
      particleCount: 200,
      spread: 90,
      origin: { y: 0.6 }
    });
  }
}
</script>
</body>
</html>
