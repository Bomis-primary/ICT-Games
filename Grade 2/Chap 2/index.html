<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fun with MS Paint - Ultimate Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            height: 100dvh; /* Dynamic viewport height prevents mobile URL bar overflow */
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash-screen img {
            max-width: 70%;
            max-height: 40dvh;
            object-fit: contain;
        }

        /* Confetti Overlay */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
            z-index: 9998;
        }

        /* Sad Overlay on Wrong Answer */
        #sad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: rgba(255, 255, 255, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9997;
        }

        #sad-overlay .smiley {
            font-size: 75px;
            animation: shake 0.5s ease-in-out;
        }

        #sad-overlay .msg {
            font-size: 20px;
            font-weight: 700;
            color: #ef4444;
            margin-top: 10px;
            text-align: center;
            padding: 0 16px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        /* Main Compact Layout Container */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 100dvh;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.6s ease;
            gap: 6px;
            padding-bottom: calc(env(safe-area-inset-bottom, 6px) + 4px);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background-color: #ffffff;
            padding: 6px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .title-area h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title-area h1 img {
            height: 20px;
            width: auto;
        }

        .timer-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            min-width: 65px;
            text-align: center;
        }

        /* Level Banner */
        .mission-box {
            width: 100%;
            background-color: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 6px 10px;
            border-radius: 4px 8px 8px 4px;
            flex-shrink: 0;
        }

        .mission-box h3 {
            margin: 0;
            color: #0369a1;
            font-size: 13px;
            font-weight: 700;
        }

        .mission-box p {
            margin: 2px 0 0 0;
            font-size: 11px;
            color: #334155;
            line-height: 1.25;
        }

        /* Viewport Canvas Container */
        .paint-window {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            width: 100%;
            flex: 1; /* Automatically resizes to fit screen height */
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 5px;
            overflow: hidden;
        }

        .paint-header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            flex-shrink: 0;
        }

        .paint-header-bar .window-controls img {
            height: 12px;
            margin-left: 3px;
        }

        .canvas-area {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border: 2px dashed #e2e8f0;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 4px;
        }

        /* Target Placement Zones */
        .target-zone {
            position: absolute;
            border: 2px dashed #0284c7;
            background-color: rgba(2, 132, 199, 0.12);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 10px;
            color: #0284c7;
            text-align: center;
            cursor: pointer;
            padding: 2px;
        }

        /* House Illustration SVG */
        .house-svg {
            width: 100%;
            max-width: 220px;
            height: auto;
            max-height: 150px;
        }

        /* Bottom Tool Dock */
        .tools-dock {
            background-color: #ffffff;
            padding: 6px;
            border-radius: 10px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            min-height: 75px;
            align-items: center;
            flex-shrink: 0;
        }

        .tool-card {
            width: 68px;
            height: 68px;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
            position: relative;
            z-index: 10;
        }

        .tool-card img {
            max-width: 32px;
            max-height: 32px;
            object-fit: contain;
            pointer-events: none;
        }

        .tool-card span {
            margin-top: 3px;
            font-size: 9px;
            font-weight: 700;
            text-align: center;
            color: #334155;
            pointer-events: none;
            line-height: 1.1;
        }

        .tool-card.selected-tap {
            border-color: #0284c7;
            background-color: #e0f2fe;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.4);
        }

        .tool-card.dragging {
            opacity: 0.85;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            z-index: 1000 !important;
        }

        /* Multiple Choice Quiz Options */
        .quiz-options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .quiz-btn {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-btn img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .quiz-btn:active, .quiz-btn.selected {
            background-color: #e0f2fe;
            border-color: #0284c7;
            color: #0369a1;
        }

        /* Action Controls Bar (Pinned at Bottom) */
        .controls {
            display: flex;
            gap: 8px;
            width: 100%;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .action-btn {
            flex: 1;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 8px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 0 #059669;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #059669;
        }

        .action-btn.reset-btn {
            background-color: #6b7280;
            box-shadow: 0 3px 0 #4b5563;
        }

        .action-btn.reset-btn:active {
            box-shadow: 0 1px 0 #4b5563;
        }
    </style>
</head>
<body>

    <!-- 5-Second Splash Screen -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/250x100?text=Innovine+Logo';">
    </div>

    <!-- Canvas for Confetti -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Sad Overlay for Wrong Answer -->
    <div id="sad-overlay">
        <div class="smiley">😢</div>
        <div class="msg" id="sad-msg">Wrong Answer!</div>
    </div>

    <!-- Audio Elements -->
    <audio id="audio-clap" src="assets/clap.mp3" preload="auto"></audio>
    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>

    <!-- Game Workspace -->
    <div class="main-content" id="game-workspace">
        <header>
            <div class="title-area">
                <h1>
                    <img src="assets/ms paint.png" alt="MS Paint" onerror="this.style.display='none'">
                    MS Paint Challenge
                </h1>
            </div>
            <div class="timer-badge" id="timer-display">⏱️ 20s</div>
        </header>

        <div class="mission-box">
            <h3 id="level-title">Level 1</h3>
            <p id="level-desc">Description</p>
        </div>

        <!-- MS Paint Canvas Viewport -->
        <div class="paint-window">
            <div class="paint-header-bar" id="paint-header-bar">
                <span>Untitled - MS Paint</span>
                <div class="window-controls" id="window-controls">
                    <img src="assets/minimize.png" alt="min" onerror="this.style.display='none'">
                    <img src="assets/maximize.png" alt="max" onerror="this.style.display='none'">
                    <img src="assets/close.png" alt="close" onerror="this.style.display='none'">
                </div>
            </div>

            <div class="canvas-area" id="canvas-area">
                <!-- SVG House / Quiz Options Rendered Dynamically -->
            </div>
        </div>

        <!-- Tool Dock -->
        <div class="tools-dock" id="tools-dock">
            <!-- Tools Rendered Dynamically -->
        </div>

        <!-- Bottom Action Buttons -->
        <div class="controls">
            <button class="action-btn reset-btn" onclick="resetCurrentLevel()">Clear 🔄</button>
            <button class="action-btn" id="check-btn" onclick="checkAnswer()">Submit ✨</button>
        </div>
    </div>

    <script>
        // Splash Screen (5 Seconds)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                document.getElementById('game-workspace').style.opacity = '1';
            }, 5000);

            loadLevel(1);
        });

        // Sound Player
        function playSound(type) {
            const clapAudio = document.getElementById('audio-clap');
            const correctAudio = document.getElementById('audio-correct');

            if (type === 'correct') {
                clapAudio.currentTime = 0;
                clapAudio.play().catch(() => {
                    correctAudio.currentTime = 0;
                    correctAudio.play().catch(() => {});
                });
            } else if (type === 'wrong') {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, ctx.currentTime);
                    osc.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch(e) {}
            }
        }

        // Level Definitions
        const levels = [
            {
                level: 1,
                type: "placement",
                title: "🏠 Level 1: Draw the House Roof Outlines",
                desc: "Drag or tap the correct tool to place it on the roof outline!",
                targetLabel: "Place Tool Here to Draw Roof 🔺",
                targetPos: { top: '12px', left: '35px', width: '150px', height: '42px' },
                correctTool: "pencil",
                houseState: "outline_roof",
                dockTools: [
                    { id: "pencil", name: "Pencil", img: "assets/pencil.png" },
                    { id: "eraser", name: "Eraser", img: "assets/eraser.png" },
                    { id: "fill", name: "Fill Color", img: "assets/fill-with-color.png" }
                ]
            },
            {
                level: 2,
                type: "placement",
                title: "🚪 Level 2: Clean Up the Extra Line",
                desc: "Oh no! A red line is spoiling the house wall. Place the Eraser on it!",
                targetLabel: "Place Eraser Here ✏️",
                targetPos: { top: '70px', left: '140px', width: '50px', height: '38px' },
                correctTool: "eraser",
                houseState: "extra_line",
                dockTools: [
                    { id: "fill", name: "Fill Color", img: "assets/fill-with-color.png" },
                    { id: "eraser", name: "Eraser", img: "assets/eraser.png" },
                    { id: "text", name: "Text Tool", img: "assets/text-tool.png" }
                ]
            },
            {
                level: 3,
                type: "placement",
                title: "🎨 Level 3: Paint the House Roof",
                desc: "Select and place the Fill Bucket inside the roof to color it orange!",
                targetLabel: "Place Tool Here to Color Roof 🎨",
                targetPos: { top: '15px', left: '50px', width: '120px', height: '38px' },
                correctTool: "fill",
                houseState: "colored_walls",
                dockTools: [
                    { id: "pencil", name: "Pencil", img: "assets/pencil.png" },
                    { id: "fill", name: "Fill Color", img: "assets/fill-with-color.png" },
                    { id: "text", name: "Text Tool", img: "assets/text-tool.png" }
                ]
            },
            {
                level: 4,
                type: "placement",
                title: "🏷️ Level 4: Add Your Name to the Drawing",
                desc: "Place the Text Tool on the bottom section to sign your drawing!",
                targetLabel: "Place Tool Here to Write Name 📝",
                targetPos: { top: '118px', left: '25px', width: '170px', height: '26px' },
                correctTool: "text",
                houseState: "completed_house",
                dockTools: [
                    { id: "text", name: "Text Tool", img: "assets/text-tool.png" },
                    { id: "eraser", name: "Eraser", img: "assets/eraser.png" },
                    { id: "pencil", name: "Pencil", img: "assets/pencil.png" }
                ]
            },
            {
                level: 5,
                type: "guess_riddle",
                title: "🔍 Level 5: Tool Riddle Puzzle",
                desc: "Riddle: 'I can pour color into whole shapes with just one single click! Who am I?'",
                options: [
                    { id: "pencil", name: "Pencil Tool", img: "assets/pencil.png" },
                    { id: "fill", name: "Fill with Color Bucket", img: "assets/fill-with-color.png" },
                    { id: "eraser", name: "Eraser Tool", img: "assets/eraser.png" }
                ],
                correctAnswer: "fill"
            },
            {
                level: 6,
                type: "sequence_puzzle",
                title: "🧩 Level 6: Sequence Order Puzzle",
                desc: "Select the correct step sequence to draw a house in MS Paint:",
                options: [
                    { id: "opt1", text: "1. Color ➔ 2. Erase ➔ 3. Draw Lines" },
                    { id: "opt2", text: "1. Draw Roof Outlines ➔ 2. Erase Extra Lines ➔ 3. Fill Color" },
                    { id: "opt3", text: "1. Erase ➔ 2. Write Text ➔ 3. Fill Color" }
                ],
                correctAnswer: "opt2"
            },
            {
                level: 7,
                type: "placement",
                title: "❌ Level 7: Close MS Paint Window",
                desc: "You finished drawing! Place the Close button on the top-right corner of the window bar.",
                targetLabel: "Place Close Button Here ❌",
                targetPos: { top: '2px', left: '170px', width: '45px', height: '22px' },
                correctTool: "close",
                houseState: "completed_house",
                dockTools: [
                    { id: "minimize", name: "Minimize", img: "assets/minimize.png" },
                    { id: "close", name: "Close (X)", img: "assets/close.png" },
                    { id: "maximize", name: "Maximize", img: "assets/maximize.png" }
                ]
            },
            {
                level: 8,
                type: "spot_puzzle",
                title: "🎯 Level 8: Spot & Match Challenge",
                desc: "Which tool was used to erase the extra mistake lines in Level 2?",
                options: [
                    { id: "eraser", name: "Eraser Tool", img: "assets/eraser.png" },
                    { id: "pencil", name: "Pencil Tool", img: "assets/pencil.png" },
                    { id: "color", name: "Color Palette", img: "assets/color .png" }
                ],
                correctAnswer: "eraser"
            }
        ];

        let currentLevel = 1;
        let wrongAttempts = 0;
        let timerSeconds = 20;
        let timerInterval = null;
        let selectedToolId = null;
        let placedToolId = null;
        let selectedQuizOption = null;

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 20;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAttempt("⏱️ Time's up!");
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-display').innerText = `⏱️ ${timerSeconds}s`;
        }

        function loadLevel(lvlNumber) {
            currentLevel = lvlNumber;
            wrongAttempts = 0;
            const lvlData = levels.find(l => l.level === lvlNumber);

            document.getElementById('level-title').innerText = lvlData.title;
            document.getElementById('level-desc').innerText = lvlData.desc;
            document.getElementById('check-btn').innerText = "Submit ✨";

            resetCurrentLevel();
        }

        function resetCurrentLevel() {
            selectedToolId = null;
            placedToolId = null;
            selectedQuizOption = null;

            const lvlData = levels.find(l => l.level === currentLevel);
            const canvasArea = document.getElementById('canvas-area');
            const toolsDock = document.getElementById('tools-dock');

            canvasArea.innerHTML = '';
            toolsDock.innerHTML = '';
            toolsDock.style.display = 'flex';

            if (lvlData.type === "placement") {
                canvasArea.innerHTML = getHouseSVG(lvlData.houseState);

                const target = document.createElement('div');
                target.className = 'target-zone';
                target.id = 'target-zone';
                target.style.top = lvlData.targetPos.top;
                target.style.left = lvlData.targetPos.left;
                target.style.width = lvlData.targetPos.width;
                target.style.height = lvlData.targetPos.height;
                target.innerText = lvlData.targetLabel;

                target.onclick = () => {
                    if (selectedToolId) {
                        placeToolInZone(selectedToolId);
                    }
                };

                canvasArea.appendChild(target);

                const shuffledTools = [...lvlData.dockTools].sort(() => Math.random() - 0.5);
                shuffledTools.forEach(tool => {
                    const card = document.createElement('div');
                    card.className = 'tool-card';
                    card.id = `tool-${tool.id}`;
                    card.setAttribute('data-id', tool.id);

                    card.innerHTML = `
                        <img src="${tool.img}" alt="${tool.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/32?text=${encodeURIComponent(tool.name)}';">
                        <span>${tool.name}</span>
                    `;

                    makeMobileDraggable(card, tool.id);
                    toolsDock.appendChild(card);
                });

            } else {
                toolsDock.style.display = 'none';

                const quizContainer = document.createElement('div');
                quizContainer.className = 'quiz-options-list';

                lvlData.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-btn';
                    
                    if (opt.img) {
                        btn.innerHTML = `<img src="${opt.img}" onerror="this.style.display='none'"> <span>${opt.name}</span>`;
                    } else {
                        btn.innerHTML = `<span>${opt.text}</span>`;
                    }

                    btn.onclick = () => {
                        document.querySelectorAll('.quiz-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedQuizOption = opt.id;
                    };

                    quizContainer.appendChild(btn);
                });

                canvasArea.appendChild(quizContainer);
            }

            startTimer();
        }

        function getHouseSVG(state) {
            let extraLine = state === "extra_line" ? `<line x1="175" y1="95" x2="205" y2="115" stroke="#ef4444" stroke-width="3" />` : '';
            let roofFill = (state === "colored_walls" || state === "completed_house") ? "#f97316" : "none";
            let wallFill = (state === "colored_walls" || state === "completed_house") ? "#fef08a" : "none";

            return `
                <svg class="house-svg" viewBox="0 0 250 175">
                    <!-- Roof -->
                    <polygon points="125,18 35,75 215,75" fill="${roofFill}" stroke="#334155" stroke-width="3" />
                    <!-- Body -->
                    <rect x="50" y="75" width="150" height="85" fill="${wallFill}" stroke="#334155" stroke-width="3" />
                    <!-- Door -->
                    <rect x="105" y="110" width="40" height="50" fill="#94a3b8" stroke="#334155" stroke-width="2" />
                    <!-- Window -->
                    <rect x="65" y="90" width="30" height="30" fill="#38bdf8" stroke="#334155" stroke-width="2" />
                    ${extraLine}
                </svg>
            `;
        }

        // Unified Pointer Drag/Drop Engine
        function makeMobileDraggable(cardElement, toolId) {
            let isDragging = false;
            let startX = 0, startY = 0;
            let initialRect = null;

            cardElement.addEventListener('click', () => {
                if (isDragging) return;
                document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('selected-tap'));
                if (selectedToolId === toolId) {
                    selectedToolId = null;
                } else {
                    selectedToolId = toolId;
                    cardElement.classList.add('selected-tap');
                }
            });

            const onPointerDown = (e) => {
                isDragging = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialRect = cardElement.getBoundingClientRect();

                const onPointerMove = (moveEvent) => {
                    const curX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
                    const curY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;

                    const deltaX = curX - startX;
                    const deltaY = curY - startY;

                    if (Math.hypot(deltaX, deltaY) > 5) {
                        isDragging = true;
                        cardElement.classList.add('dragging');
                        cardElement.style.position = 'fixed';
                        cardElement.style.left = `${initialRect.left + deltaX}px`;
                        cardElement.style.top = `${initialRect.top + deltaY}px`;
                    }
                };

                const onPointerUp = (upEvent) => {
                    window.removeEventListener('mousemove', onPointerMove);
                    window.removeEventListener('mouseup', onPointerUp);
                    window.removeEventListener('touchmove', onPointerMove);
                    window.removeEventListener('touchend', onPointerUp);

                    if (isDragging) {
                        cardElement.classList.remove('dragging');
                        cardElement.style.position = '';
                        cardElement.style.left = '';
                        cardElement.style.top = '';

                        const endX = upEvent.changedTouches ? upEvent.changedTouches[0].clientX : upEvent.clientX;
                        const endY = upEvent.changedTouches ? upEvent.changedTouches[0].clientY : upEvent.clientY;

                        cardElement.style.display = 'none';
                        const dropTarget = document.elementFromPoint(endX, endY);
                        cardElement.style.display = 'flex';

                        const zone = dropTarget ? dropTarget.closest('.target-zone') : null;
                        if (zone) {
                            placeToolInZone(toolId);
                        }
                    }
                };

                window.addEventListener('mousemove', onPointerMove, { passive: true });
                window.addEventListener('mouseup', onPointerUp, { passive: true });
                window.addEventListener('touchmove', onPointerMove, { passive: true });
                window.addEventListener('touchend', onPointerUp, { passive: true });
            };

            cardElement.addEventListener('mousedown', onPointerDown);
            cardElement.addEventListener('touchstart', onPointerDown, { passive: true });
        }

        function placeToolInZone(toolId) {
            placedToolId = toolId;
            const targetZone = document.getElementById('target-zone');
            const toolCard = document.getElementById(`tool-${toolId}`);

            if (targetZone && toolCard) {
                targetZone.style.backgroundColor = 'rgba(34, 197, 94, 0.25)';
                targetZone.style.borderColor = '#16a34a';
                targetZone.style.color = '#15803d';
                targetZone.innerText = `Placed: ${toolCard.querySelector('span').innerText} ✅`;
            }
        }

        function checkAnswer() {
            const lvlData = levels.find(l => l.level === currentLevel);
            let isCorrect = false;

            if (lvlData.type === "placement") {
                if (!placedToolId) {
                    handleWrongAttempt("Please place a tool into the target zone!");
                    return;
                }
                isCorrect = placedToolId === lvlData.correctTool;
            } else {
                if (!selectedQuizOption) {
                    handleWrongAttempt("Please select an option first!");
                    return;
                }
                isCorrect = selectedQuizOption === lvlData.correctAnswer;
            }

            if (isCorrect) {
                handleCorrectAnswer();
            } else {
                handleWrongAttempt("Wrong Answer!");
            }
        }

        function handleCorrectAnswer() {
            clearInterval(timerInterval);
            playSound('correct');
            triggerConfetti();

            setTimeout(() => {
                if (currentLevel < levels.length) {
                    loadLevel(currentLevel + 1);
                } else {
                    document.getElementById('level-title').innerText = "🏆 Master Paint Grandmaster!";
                    document.getElementById('level-desc').innerText = "Congratulations! You completed all 8 MS Paint levels!";
                    document.getElementById('check-btn').innerText = "Play Again 🔄";
                    document.getElementById('check-btn').onclick = () => {
                        document.getElementById('check-btn').onclick = checkAnswer;
                        loadLevel(1);
                    };
                }
            }, 1800);
        }

        function handleWrongAttempt(message) {
            wrongAttempts++;
            playSound('wrong');

            const overlay = document.getElementById('sad-overlay');
            document.getElementById('sad-msg').innerText = message;
            overlay.style.display = 'flex';

            setTimeout(() => {
                overlay.style.display = 'none';

                if (wrongAttempts >= 2) {
                    clearInterval(timerInterval);
                    if (currentLevel < levels.length) {
                        loadLevel(currentLevel + 1);
                    } else {
                        loadLevel(1);
                    }
                } else {
                    resetCurrentLevel();
                }
            }, 1200);
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            for (let i = 0; i < 75; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 7 + 4,
                    speed: Math.random() * 5 + 3
                });
            }

            let animationFrame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    p.y += p.speed;
                });

                if (particles.some(p => p.y < canvas.height)) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }
            render();
        }
    </script>
</body>
</html>
