<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidPix : The Magic Silhouette Challenge</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            background-color: #f0fdf4; /* Creative mint green background */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #14532d;
            overflow-x: hidden;
            user-select: none;
        }

        /* 5-Second Splash Screen (Logo Only Appears Here) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-screen img {
            max-width: 280px;
            margin-bottom: 20px;
            animation: bounce-in 1.2s infinite alternate ease-in-out;
        }

        @keyframes bounce-in {
            0% { transform: scale(1); }
            100% { transform: scale(1.06) rotate(-2deg); }
        }

        /* Main Game Layout */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1050px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        header {
            background: #ffffff;
            width: 100%;
            padding: 15px;
            border-radius: 20px;
            border: 4px solid #22c55e;
            box-shadow: 6px 6px 0px #15803d;
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            color: #16a34a;
        }

        .game-grid {
            display: flex;
            gap: 25px;
            width: 100%;
        }

        /* Control Panel Sidebar */
        .sidebar {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 20px;
            border: 4px solid #ea580c;
            box-shadow: 6px 6px 0px #9a3412;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .instruction-card {
            background-color: #fff7ed;
            border: 3px dashed #ea580c;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .instruction-card h3 {
            margin: 0 0 6px 0;
            color: #c2410c;
            font-size: 18px;
        }

        /* Quiz Choices Selection Boxes */
        .guess-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .guess-btn {
            background: #f8fafc;
            border: 3px solid #cbd5e1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s, transform 0.1s;
        }

        .guess-btn:hover {
            background: #f1f5f9;
            transform: scale(1.02);
        }

        .action-btn {
            background-color: #a855f7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 12px;
            box-shadow: 4px 4px 0px #6b21a8;
            cursor: pointer;
        }

        /* Studio Canvas Window */
        .canvas-window {
            flex: 1.6;
            background: #ffffff;
            padding: 15px;
            border-radius: 20px;
            border: 4px solid #06b6d4;
            box-shadow: 6px 6px 0px #0e7490;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: #0e7490;
        }

        canvas {
            background: #0f172a; /* Futuristic dark drawing screen */
            border: 4px solid #cbd5e1;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.src='https://via.placeholder.com/250x90?text=Innovine';">
        <h2>✏️ KidPix 2: The Silhouette Drawer! ✏️</h2>
    </div>

    <div class="main-content" id="app-workspace">
        <header>
            <h1>🔍 Watch Closely: What Is The Computer Drawing? 🔍</h1>
        </header>

        <div class="game-grid">
            <div class="sidebar">
                <div>
                    <div class="instruction-card">
                        <h3 id="round-title">🎨 Round 1: The Secret Blueprint</h3>
                        <p id="round-desc">Look at the dark drawing page! The magic paintbrush is sketching an important school technology item. Choose your guess below!</p>
                    </div>

                    <div class="guess-box" id="options-container">
                        </div>
                </div>

                <button class="action-btn" id="next-btn" onclick="advanceRound()" disabled style="background-color:#94a3b8; box-shadow:none; cursor:not-allowed;">Guess Correctly to Advance</button>
            </div>

            <div class="canvas-window">
                <div class="canvas-meta">
                    <span id="drawing-speed-label">Laser Tracer: Active ⚡</span>
                    <span id="status-label">Status: Drawing Object...</span>
                </div>
                <canvas id="sketchCanvas" width="550" height="400"></canvas>
            </div>
        </div>
    </div>

    <audio id="snd-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="snd-clap" src="assets/clap.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('splash-screen').style.visibility = 'hidden';
                document.getElementById('app-workspace').style.opacity = '1';
                setupRound();
            }, 5000);
        });

        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');

        let activeRound = 1;
        let drawingInterval = null;
        let traceProgress = 0;
        let roundSolved = false;

        // Data Structure holding unique procedural line blueprints for kids to decipher
        const roundData = {
            1: {
                title: "🎨 Round 1: The Secret Blueprint",
                desc: "Look at the screen! The neon laser brush is sketching a classic classroom screen display. What tool is it?",
                options: ["A) A Computer Monitor Screen", "B) A Handheld Scanner", "C) A Computer Mouse"],
                correctIndex: 0,
                draw: function(prog) {
                    ctx.strokeStyle = "#38bdf8"; // Neon light blue
                    ctx.lineWidth = 6;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#38bdf8";
                    ctx.beginPath();
                    
                    // Step-by-step drawing interpolation based on progress counter
                    if(prog > 10) ctx.lineTo(400, 100);
                    if(prog > 30) ctx.lineTo(400, 280);
                    if(prog > 50) ctx.lineTo(150, 280);
                    if(prog > 70) ctx.lineTo(150, 100);
                    // Stand mount legs
                    if(prog > 85) {
                        ctx.moveTo(275, 280);
                        ctx.lineTo(275, 330);
                        ctx.lineTo(220, 330);
                        ctx.lineTo(330, 330);
                    }
                    ctx.stroke();
                }
            },
            2: {
                title: "⌨️ Round 2: Typing Foundation",
                desc: "The brush is running again! Wow, look at all those little key rows being formed right now. What is it?",
                options: ["A) Headphones", "B) A Typing Keyboard", "C) A Floppy Disk"],
                correctIndex: 1,
                draw: function(prog) {
                    ctx.strokeStyle = "#f43f5e"; // Neon red-pink
                    ctx.shadowColor = "#f43f5e";
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    
                    // Draw outer chassis frame
                    if(prog > 10) ctx.strokeRect(100, 150, 350, 120);
                    // Draw grid key rows
                    if(prog > 40) {
                        ctx.moveTo(120, 190); ctx.lineTo(430, 190);
                        ctx.moveTo(120, 230); ctx.lineTo(430, 230);
                    }
                    // Spacebar box stamp
                    if(prog > 80) {
                        ctx.strokeRect(200, 240, 150, 20);
                    }
                    ctx.stroke();
                }
            },
            3: {
                title: "🖨️ Round 3: The Paper Machine",
                desc: "Final round! The automated printer module is spitting out digital documents on our canvas stack. Guess the hardware asset!",
                options: ["A) A Web Camera", "B) VR Goggles", "C) A Office Printer"],
                correctIndex: 2,
                draw: function(prog) {
                    ctx.strokeStyle = "#a855f7"; // Magic violet neon tint
                    ctx.shadowColor = "#a855f7";
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    
                    // Main printer box shape body frame setup
                    if(prog > 10) ctx.strokeRect(140, 160, 270, 130);
                    // Top paper tray feed slot line element structures
                    if(prog > 40) {
                        ctx.moveTo(190, 160); ctx.lineTo(190, 100);
                        ctx.lineTo(360, 100); ctx.lineTo(360, 160);
                    }
                    // Bottom exit slot page print paper tray
                    if(prog > 85) {
                        ctx.strokeRect(190, 290, 170, 30);
                    }
                    ctx.stroke();
                }
            }
        };

        function playSound(id) {
            const sound = document.getElementById(id);
            if(sound) {
                sound.currentTime = 0;
                sound.play().catch(() => {});
            }
        }

        function setupRound() {
            roundSolved = false;
            traceProgress = 0;
            clearInterval(drawingInterval);
            
            // Clear canvas viewport space black color slate layout
            ctx.shadowBlur = 0; 
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const currentData = roundData[activeRound];
            document.getElementById('round-title').innerText = currentData.title;
            document.getElementById('round-desc').innerText = currentData.desc;
            document.getElementById('status-label').innerText = "Status: Painting silhouette...";

            // Load selection options onto HTML nodes interface layout dynamically
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            currentData.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = "guess-btn";
                btn.innerText = opt;
                btn.onclick = () => submitGuess(idx);
                container.appendChild(btn);
            });

            // Start running the live vector sketch engine frame updates
            drawingInterval = setInterval(() => {
                if (traceProgress < 100) {
                    traceProgress += 2;
                    currentData.draw(traceProgress);
                } else {
                    clearInterval(drawingInterval);
                    document.getElementById('status-label').innerText = "Status: Sketch complete! Make your guess.";
                }
            }, 60);
        }

        function submitGuess(chosenIndex) {
            if (roundSolved) return;
            const currentData = roundData[activeRound];

            if (chosenIndex === currentData.correctIndex) {
                roundSolved = true;
                clearInterval(drawingInterval);
                
                // Uncover full asset lighting glow
                traceProgress = 100;
                currentData.draw(100);

                if (activeRound === 3) {
                    playSound('snd-clap'); // Big applause finish celebration triggered at round 3 finish lines
                    document.getElementById('status-label').innerText = "Status: ALL CHAMPION BLUEPRINTS UNSCRAMBLED! 🏆";
                } else {
                    playSound('snd-correct');
                    document.getElementById('status-label').innerText = "Status: Spot On! Blueprint verified! ✅";
                }
                
                // Unlock navigation control keys
                const nextBtn = document.getElementById('next-btn');
                nextBtn.disabled = false;
                nextBtn.style.backgroundColor = "#22c55e";
                nextBtn.style.boxShadow = "4px 4px 0px #16a34a";
                nextBtn.style.cursor = "pointer";
                nextBtn.innerText = activeRound === 3 ? "Restart Studio Room 🔄" : "Load Next Blueprint ➡️";
            } else {
                playSound('snd-wrong');
                alert("Oh, that choice doesn't match the lines! Watch the laser drawing move again! 👀");
            }
        }

        function advanceRound() {
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.style.backgroundColor = "#94a3b8";
            nextBtn.style.boxShadow = "none";
            nextBtn.style.cursor = "not-allowed";
            nextBtn.innerText = "Guess Correctly to Advance";

            if (activeRound < 3) {
                activeRound++;
                setupRound();
            } else {
                // Loop execution resetting base variables configuration state parameters
                activeRound = 1;
                setupRound();
            }
        }
    </script>
</body>
</html>
