<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEM Robot Adventure</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS',sans-serif;
}

body{
background:url('assets/robot-bg.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
min-height:100vh;
overflow-x:hidden;
color:white;
transition:1s;
}

.overlay{
background:rgba(0,0,0,0.35);
min-height:100vh;
padding:15px;
backdrop-filter:blur(2px);
}

.container{
max-width:1200px;
margin:auto;
padding-bottom:120px;
}

.logo{
width:140px;
display:block;
margin:auto;
margin-bottom:10px;
}

h1{
text-align:center;
font-size:46px;
margin-bottom:10px;
color:#FFD700;
text-shadow:2px 2px 8px black;
}

.topbar{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
font-size:22px;
margin-bottom:15px;
background:rgba(255,255,255,0.15);
padding:12px;
border-radius:20px;
backdrop-filter:blur(5px);
}

/* ROBOT DESTINATION TRACK */
.destination-track {
background: rgba(0, 0, 0, 0.4);
border: 2px solid rgba(255, 255, 255, 0.3);
border-radius: 20px;
padding: 12px 20px;
margin-bottom: 20px;
display: flex;
align-items: center;
justify-content: space-between;
position: relative;
}

.track-line {
position: absolute;
top: 50%;
left: 60px;
right: 60px;
height: 6px;
background: #475569;
z-index: 1;
transform: translateY(-50%);
border-radius: 3px;
}

.track-fill {
height: 100%;
width: 0%;
background: linear-gradient(90deg, #00e5ff, #00ff95);
border-radius: 3px;
transition: width 0.5s ease;
}

.robot-avatar {
font-size: 38px;
position: absolute;
top: 50%;
left: 40px;
transform: translate(-50%, -50%);
z-index: 2;
transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
}

.destination-flag {
font-size: 38px;
z-index: 2;
position: relative;
}

.card{
background:rgba(255,255,255,0.18);
padding:20px;
border-radius:25px;
backdrop-filter:blur(10px);
border:2px solid rgba(255,255,255,0.2);
}

#question{
font-size:28px;
margin-bottom:20px;
text-align:center;
}

#options{
display:flex;
flex-direction:row;
justify-content:center;
align-items:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.questionImage{
width:200px;
height:200px;
object-fit:contain;
background:white;
padding:10px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.questionImage:hover{
transform:scale(1.08);
background:#fff59d;
}

.optionBtn{
padding:15px 25px;
font-size:22px;
border:none;
border-radius:15px;
cursor:pointer;
margin:10px;
font-weight:bold;
background:linear-gradient(135deg,#ffeb3b,#ff9800);
color:black;
transition:0.3s;
}

.optionBtn:hover{
transform:scale(1.05);
}

.dragArea{
display:flex;
justify-content:center;
align-items:center;
gap:30px;
flex-wrap:wrap;
margin-top:25px;
}

.dragItem{
padding:18px 25px;
background:linear-gradient(135deg,#00e5ff,#00ff95);
border-radius:15px;
font-size:24px;
cursor:grab;
color:black;
font-weight:bold;
}

.dropBox{
width:260px;
height:110px;
border:4px dashed #fff;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
background:rgba(255,255,255,0.2);
}

.feedback{
font-size:28px;
font-weight:bold;
margin-top:20px;
text-align:center;
}

.nextArea{
position:fixed;
bottom:0;
left:0;
width:100%;
background:rgba(0,0,0,0.7);
padding:10px;
text-align:center;
z-index:999;
}

#nextBtn{
padding:15px 45px;
font-size:24px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#00ff95,#00c853);
color:white;
display:none;
cursor:pointer;
font-weight:bold;
}

.finalScreen{
display:none;
background:rgba(255,255,255,0.95);
color:black;
padding:30px;
border-radius:25px;
text-align:center;
margin-top:30px;
}

.playBtn{
padding:15px 30px;
font-size:22px;
background:#2196F3;
color:white;
border:none;
border-radius:15px;
cursor:pointer;
margin-top:20px;
}

@media(max-width:768px){

.questionImage{
width:140px;
height:140px;
}

#options{
gap:10px;
}

.optionBtn{
font-size:18px;
padding:12px 18px;
}

h1{
font-size:32px;
}

#question{
font-size:22px;
}

}

</style>
</head>

<body>

<div class="overlay">

<div class="container">

<img src="assets/innovine-logo.png" class="logo" onerror="this.style.display='none'">

<h1>🚀 STEM Robot Adventure</h1>

<div class="topbar">
<div>⭐ Score: <span id="score">0</span></div>
<div>🏆 Badges: <span id="badges">0</span></div>
<div>⏰ <span id="timer">40</span>s</div>
</div>

<!-- ROBOT DESTINATION TRACK -->
<div class="destination-track">
<div class="track-line"><div class="track-fill" id="trackFill"></div></div>
<div class="robot-avatar" id="robotAvatar">🤖</div>
<div style="width: 100%;"></div>
<div class="destination-flag">🎯</div>
</div>

<div class="card" id="gameCard">

<h2 id="question"></h2>

<div id="imageArea"></div>

<div id="options"></div>

<div class="feedback" id="feedback"></div>

</div>

<div class="finalScreen" id="finalScreen">

<h1 id="finalHeader">🎉 Robot Reached Destination!</h1>

<h2 id="finalScore" style="margin: 15px 0;"></h2>

<h2 id="rank"></h2>

<button onclick="location.reload()" class="playBtn">
Play Again
</button>

</div>

</div>

<div class="nextArea">
<button id="nextBtn">Next ➜</button>
</div>

<audio id="correctSound" src="assets/correct-1.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>

<script>

const questions=[

{
type:"image",
question:"Click the Science picture",
options:[
"assets/science.PNG",
"assets/mathematics.PNG",
"assets/technology.PNG"
],
answer:"assets/science.PNG"
},

{
type:"drag",
question:"Drag COMMAND into the box",
drag:"COMMAND"
},

{
type:"truefalse",
question:"Robots follow commands.",
options:["True","False"],
answer:"True",
image:"assets/robots.PNG"
},

{
type:"list",
question:"Choose the subject using numbers",
options:[
"Mathematics",
"Science",
"Technology"
],
answer:"Mathematics",
image:"assets/mathematics.PNG"
},

{
type:"image",
question:"Click the Technology picture",
options:[
"assets/technology.PNG",
"assets/education.PNG",
"assets/science.PNG"
],
answer:"assets/technology.PNG"
},

{
type:"drag",
question:"Drag ROBOTICS into the box",
drag:"ROBOTICS"
},

{
type:"truefalse",
question:"Technology means tools and gadgets.",
options:["True","False"],
answer:"True",
image:"assets/technology.PNG"
},

{
type:"list",
question:"Choose the subject solving problems",
options:[
"Engineering",
"Entertainment",
"Communication"
],
answer:"Engineering",
image:"assets/engineering.PNG"
},

{
type:"image",
question:"Click the Mathematics picture",
options:[
"assets/mathematics.PNG",
"assets/education.PNG",
"assets/science.PNG"
],
answer:"assets/mathematics.PNG"
},

{
type:"truefalse",
question:"Robots help humans.",
options:["True","False"],
answer:"True",
image:"assets/helper-robot.PNG"
}

];

const backgrounds=[
"assets/robot-bg.jpg",
"assets/robot-bg1.jpg"
];

let current=0;
let score=0;
let badges=0;
let timer;
let time=40;
let attemptsLeft=2;

const question=document.getElementById('question');
const options=document.getElementById('options');
const imageArea=document.getElementById('imageArea');
const feedback=document.getElementById('feedback');

function startTimer(){

clearInterval(timer);

time=40;

document.getElementById('timer').innerHTML=time;

timer=setInterval(()=>{

time--;

document.getElementById('timer').innerHTML=time;

if(time<=0){

clearInterval(timer);

feedback.innerHTML="⏰ Time Up";

document.getElementById('nextBtn').style.display='inline-block';

}

},1000);

}

function updateRobotPosition(){
const percentage = (current / questions.length);
const trackWidth = document.querySelector('.destination-track').offsetWidth - 100;
const leftPos = 40 + (percentage * trackWidth);

document.getElementById('robotAvatar').style.left = leftPos + 'px';
document.getElementById('trackFill').style.width = (percentage * 100) + '%';
}

function showQuestion(){

startTimer();
attemptsLeft=2;
updateRobotPosition();

document.body.style.background=
`url('${backgrounds[current % 2]}')`;

document.body.style.backgroundSize='cover';
document.body.style.backgroundPosition='center';

const q=questions[current];

question.innerHTML=q.question;

options.innerHTML='';
imageArea.innerHTML='';
feedback.innerHTML='';

document.getElementById('nextBtn').style.display='none';

if(q.image){

imageArea.innerHTML=
`<img src="${q.image}" class="questionImage">`;

}

if(q.type==="truefalse"){

q.options.forEach(opt=>{

const btn=document.createElement('button');

btn.className='optionBtn';

btn.innerHTML=opt;

btn.onclick=()=>check(opt===q.answer);

options.appendChild(btn);

});

}

if(q.type==="image"){

q.options.forEach(opt=>{

const img=document.createElement('img');

img.src=opt;

img.className='questionImage';

img.onclick=()=>check(opt===q.answer);

options.appendChild(img);

});

}

if(q.type==="drag"){

const area=document.createElement('div');

area.className='dragArea';

const drag=document.createElement('div');

drag.className='dragItem';

drag.innerHTML=q.drag;

drag.draggable=true;

drag.addEventListener('dragstart',e=>{
e.dataTransfer.setData('text',q.drag);
});

const drop=document.createElement('div');

drop.className='dropBox';

drop.innerHTML='Drop Here';

drop.addEventListener('dragover',e=>e.preventDefault());

drop.addEventListener('drop',()=>{

check(true);

drop.innerHTML=q.drag;

});

area.appendChild(drag);
area.appendChild(drop);

options.appendChild(area);

}

if(q.type==="list"){
const select=document.createElement('select');
select.className='optionBtn';

q.options.forEach(opt=>{
select.innerHTML+=`<option>${opt}</option>`;
});

const btn=document.createElement('button');
btn.className='optionBtn';
btn.innerHTML='Submit';

btn.onclick=()=>{
check(select.value===q.answer);
};

options.appendChild(select);
options.appendChild(btn);
}

}

function check(isCorrect){
if(isCorrect){
correct();
}else{
wrong();
}
}

function correct(){

clearInterval(timer);

feedback.innerHTML="✅ Correct Step!";
feedback.style.color='#00ff95';

score++;
badges++;

document.getElementById('score').innerHTML=score;
document.getElementById('badges').innerHTML=badges;

document.getElementById('nextBtn').style.display='inline-block';

}

function wrong(){

attemptsLeft--;

if(attemptsLeft > 0){
feedback.innerHTML=`❌ Wrong! You have ${attemptsLeft} try left.`;
feedback.style.color='#ffeb3b';
} else {
clearInterval(timer);
feedback.innerHTML="❌ Out of tries!";
feedback.style.color='red';
document.getElementById('nextBtn').style.display='inline-block';
}

}

document.getElementById('nextBtn').onclick=()=>{

current++;

if(current<questions.length){
showQuestion();
}else{
// Move robot to destination flag on final question
current = questions.length;
updateRobotPosition();
showFinal();
}

};

function showFinal(){

document.getElementById('gameCard').style.display='none';
document.getElementById('nextBtn').style.display='none';
document.getElementById('finalScreen').style.display='block';

document.getElementById('finalScore').innerHTML=
`⭐ Your Score: ${score}/10`;

let rank='';

if(score===10){
rank='🏆 CHAMPION ROBOTICIST!';
}else if(score>=7){
rank='👍 EXCELLENT ENGINEER!';
}else if(score>=4){
rank='🙂 GOOD ATTEMPT!';
}else{
rank='📘 BEGINNER EXPLORER';
}

document.getElementById('rank').innerHTML=rank;

// Play sound ONLY at destination step
if(score >= 5){
document.getElementById('finalHeader').innerHTML = "🎉 Robot Reached Destination!";
document.getElementById('correctSound').play();
confetti({
particleCount:400,
spread:160
});
} else {
document.getElementById('finalHeader').innerHTML = "⚠️ Destination Not Reached!";
document.getElementById('wrongSound').play();
}

}

showQuestion();

</script>

</body>
</html>
