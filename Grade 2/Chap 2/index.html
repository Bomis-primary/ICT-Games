<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 2 - MS Paint Adventure</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS',cursive;
}

body{
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.screen{
display:none;
background:white;
width:95%;
max-width:1200px;
padding:25px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

.active{
display:block;
}

.logo{
width:140px;
margin-bottom:10px;
}

h1{
color:#1565c0;
margin-bottom:15px;
}

.question{
font-size:28px;
font-weight:bold;
margin:20px 0;
}

.option-container{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.option{
background:#e3f2fd;
padding:15px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
width:220px;
font-size:22px;
font-weight:bold;
}

.option:hover{
transform:scale(1.05);
background:#90caf9;
}

.option img{
width:120px;
height:120px;
object-fit:contain;
margin-bottom:10px;
}

.btn{
background:#ff7043;
color:white;
border:none;
padding:14px 28px;
border-radius:40px;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

.btn:hover{
transform:scale(1.05);
}

.feedback{
font-size:30px;
font-weight:bold;
height:40px;
margin-top:20px;
}

.score{
font-size:24px;
font-weight:bold;
margin-top:15px;
color:#ff6f00;
}

input{
padding:14px;
width:90%;
border-radius:12px;
border:2px solid #ccc;
font-size:20px;
margin-top:20px;
}

.drag-container{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
margin-top:25px;
}

.drag-item{
background:#c8e6c9;
padding:12px;
border-radius:15px;
font-size:22px;
font-weight:bold;
cursor:grab;
margin-bottom:15px;
}

.drop-box{
width:220px;
height:80px;
border:3px dashed #1565c0;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
background:#f5f5f5;
margin-bottom:15px;
}

.paint-window{
position:relative;
width:100%;
max-width:900px;
height:450px;
background:#f5f5f5;
border:5px solid #1565c0;
margin:auto;
border-radius:20px;
overflow:hidden;
}

.paint-top{
background:#1976d2;
height:60px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:30px;
font-weight:bold;
}

.paint-toolbar{
height:90px;
background:#bbdefb;
display:flex;
justify-content:space-around;
align-items:center;
}

.paint-toolbar img{
width:70px;
height:70px;
object-fit:contain;
}

.paint-canvas{
height:300px;
background:white;
position:relative;
}

.label-target{
position:absolute;
width:170px;
height:50px;
border:3px dashed #ff7043;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
font-size:18px;
font-weight:bold;
background:rgba(255,255,255,0.9);
}

.final-score{
font-size:70px;
font-weight:bold;
color:#ff6f00;
margin:20px 0;
}

@media(max-width:768px){

.option{
width:150px;
font-size:18px;
}

.question{
font-size:22px;
}

.paint-window{
height:500px;
}

}

</style>

</head>

<body>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<!-- INTRO -->

<div class="screen active" id="intro">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎨 MS Paint Adventure</h1>

<input type="text" id="studentName" placeholder="Enter Student Name">

<br>

<button class="btn" onclick="startGame()">
🚀 Start Game
</button>

</div>

<!-- MENU -->

<div class="screen" id="menu">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎮 Choose Activity</h1>

<button class="btn" onclick="startPictureGame()">
🖼️ Picture Identification
</button>

<button class="btn" onclick="startWordGame()">
⌨️ One Word Answer
</button>

<button class="btn" onclick="startLabelGame()">
🧩 Label MS Paint Window
</button>

</div>

<!-- PICTURE IDENTIFICATION -->

<div class="screen" id="pictureScreen">

<img src="assets/innovine-logo.png" class="logo">

<div class="question" id="pictureQuestion"></div>

<div class="option-container" id="pictureOptions"></div>

<div class="feedback" id="pictureFeedback"></div>

<div class="score" id="scoreDisplay">
Score : 0
</div>

<button class="btn" onclick="nextPictureQuestion()">
Next ➜
</button>

</div>

<!-- ONE WORD -->

<div class="screen" id="wordScreen">

<img src="assets/innovine-logo.png" class="logo">

<div class="question" id="wordQuestion"></div>

<img id="wordImage" src="" style="width:180px;height:180px;object-fit:contain;">

<br>

<input type="text" id="wordInput" placeholder="Type your answer">

<br>

<button class="btn" onclick="checkWordAnswer()">
Submit
</button>

<div class="feedback" id="wordFeedback"></div>

</div>

<!-- LABEL GAME -->

<div class="screen" id="labelScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🧩 Label the MS Paint Window</h1>

<div class="paint-window">

<div class="paint-top">
MS Paint
</div>

<div class="paint-toolbar">

<img src="assets/pencil.png">
<img src="assets/eraser.png">
<img src="assets/color .png">
<img src="assets/text-tool.png">
<img src="assets/fill-with-color.png">

</div>

<div class="paint-canvas">

<div class="label-target" data-answer="Pencil"
style="top:20px;left:20px;">
Drop Here
</div>

<div class="label-target" data-answer="Eraser"
style="top:100px;right:20px;">
Drop Here
</div>

<div class="label-target" data-answer="Color"
style="bottom:20px;left:40%;">
Drop Here
</div>

</div>

</div>

<div class="drag-container">

<div>

<div class="drag-item" draggable="true" id="Pencil">
Pencil
</div>

<div class="drag-item" draggable="true" id="Eraser">
Eraser
</div>

<div class="drag-item" draggable="true" id="Color">
Color
</div>

</div>

</div>

<div class="feedback" id="labelFeedback"></div>

<button class="btn" onclick="showFinal()">
Finish Game
</button>

</div>

<!-- FINAL -->

<div class="screen" id="finalScreen">

<img src="assets/innovine-logo.png" class="logo">

<h1>🏆 Congratulations</h1>

<h2 id="studentDisplay"></h2>

<div class="final-score" id="finalScore"></div>

<h2 id="rank"></h2>

<button class="btn" onclick="location.reload()">
🔄 Play Again
</button>

</div>

<script>

let student="";
let score=0;

/* PICTURE QUESTIONS */

const pictureQuestions=[

{
question:"Click the Pencil Tool",
options:[
{img:"assets/pencil.png",text:"Pencil"},
{img:"assets/eraser.png",text:"Eraser"},
{img:"assets/color .png",text:"Color"}
],
answer:"Pencil"
},

{
question:"Click the Eraser Tool",
options:[
{img:"assets/text-tool.png",text:"Text"},
{img:"assets/eraser.png",text:"Eraser"},
{img:"assets/triangle.png",text:"Triangle"}
],
answer:"Eraser"
},

{
question:"Click the Fill With Color Tool",
options:[
{img:"assets/fill-with-color.png",text:"Fill"},
{img:"assets/close.png",text:"Close"},
{img:"assets/minimize.png",text:"Minimize"}
],
answer:"Fill"
},

{
question:"Click the Maximize Button",
options:[
{img:"assets/minimize.png",text:"Minimize"},
{img:"assets/maximize.png",text:"Maximize"},
{img:"assets/close.png",text:"Close"}
],
answer:"Maximize"
}

];

let pictureIndex=0;

/* WORD QUESTIONS */

const wordQuestions=[

{
question:"Type the name of this tool",
img:"assets/pencil.png",
answer:"pencil"
},

{
question:"Type the name of this shape",
img:"assets/triangle.png",
answer:"triangle"
},

{
question:"Type the name of this tool",
img:"assets/eraser.png",
answer:"eraser"
}

];

let wordIndex=0;

/* START */

function startGame(){

student=document.getElementById("studentName").value;

if(student===""){
alert("Please Enter Student Name");
return;
}

showScreen("menu");

}

/* SCREEN */

function showScreen(id){

document.querySelectorAll(".screen").forEach(screen=>{
screen.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}

/* PICTURE GAME */

function startPictureGame(){

pictureIndex=0;

showScreen("pictureScreen");

loadPictureQuestion();

}

function loadPictureQuestion(){

let q=pictureQuestions[pictureIndex];

document.getElementById("pictureQuestion").innerHTML=q.question;

let html="";

q.options.forEach(option=>{

html+=`

<div class="option"
onclick="checkPictureAnswer('${option.text}')">

<img src="${option.img}">

${option.text}

</div>

`;

});

document.getElementById("pictureOptions").innerHTML=html;

document.getElementById("pictureFeedback").innerHTML="";

document.getElementById("scoreDisplay").innerHTML=
"Score : "+score;

}

function checkPictureAnswer(selected){

let q=pictureQuestions[pictureIndex];

if(selected===q.answer){

document.getElementById("pictureFeedback").innerHTML=
"✅ Correct";

document.getElementById("pictureFeedback").style.color="green";

document.getElementById("correctSound").play();

score++;

confetti({
particleCount:150,
spread:90
});

}else{

document.getElementById("pictureFeedback").innerHTML=
"❌ Wrong";

document.getElementById("pictureFeedback").style.color="red";

document.getElementById("wrongSound").play();

}

}

function nextPictureQuestion(){

pictureIndex++;

if(pictureIndex>=pictureQuestions.length){

startWordGame();

}else{

loadPictureQuestion();

}

}

/* WORD GAME */

function startWordGame(){

wordIndex=0;

showScreen("wordScreen");

loadWordQuestion();

}

function loadWordQuestion(){

let q=wordQuestions[wordIndex];

document.getElementById("wordQuestion").innerHTML=q.question;

document.getElementById("wordImage").src=q.img;

document.getElementById("wordInput").value="";

document.getElementById("wordFeedback").innerHTML="";

}

function checkWordAnswer(){

let q=wordQuestions[wordIndex];

let ans=document.getElementById("wordInput").value.toLowerCase();

if(ans===q.answer){

document.getElementById("wordFeedback").innerHTML=
"✅ Correct";

document.getElementById("wordFeedback").style.color="green";

document.getElementById("correctSound").play();

score++;

confetti({
particleCount:120,
spread:80
});

}else{

document.getElementById("wordFeedback").innerHTML=
"❌ Wrong";

document.getElementById("wordFeedback").style.color="red";

document.getElementById("wrongSound").play();

}

wordIndex++;

if(wordIndex<wordQuestions.length){

setTimeout(loadWordQuestion,1200);

}else{

setTimeout(startLabelGame,1200);

}

}

/* LABEL GAME */

function startLabelGame(){

showScreen("labelScreen");

}

let correctDrops=0;

document.querySelectorAll('.drag-item').forEach(item=>{

item.addEventListener('dragstart',e=>{
e.dataTransfer.setData('text',e.target.id);
});

});

document.querySelectorAll('.label-target').forEach(box=>{

box.addEventListener('dragover',e=>{
e.preventDefault();
});

box.addEventListener('drop',e=>{

e.preventDefault();

const data=e.dataTransfer.getData('text');

if(data===box.dataset.answer){

box.style.background='lightgreen';

box.innerHTML='✅ '+data;

document.getElementById("correctSound").play();

score++;

correctDrops++;

document.getElementById("labelFeedback").innerHTML=
"🎉 Correct Label";

document.getElementById("labelFeedback").style.color="green";

confetti({
particleCount:120,
spread:70
});

}else{

document.getElementById("wrongSound").play();

document.getElementById("labelFeedback").innerHTML=
"❌ Wrong Label";

document.getElementById("labelFeedback").style.color="red";

}

});

});

/* FINAL */

function showFinal(){

showScreen("finalScreen");

document.getElementById("studentDisplay").innerHTML=
student;

document.getElementById("finalScore").innerHTML=
score+" Points";

let rank="";

if(score>=8){

rank="🏆 MS Paint Champion";

}else if(score>=5){

rank="🌟 Excellent";

}else{

rank="👍 Keep Practicing";

}

document.getElementById("rank").innerHTML=rank;

confetti({
particleCount:350,
spread:150
});

}

</script>

</body>

</html>
