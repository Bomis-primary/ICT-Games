<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 1 MS Paint Interactive Game</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS', sans-serif;
}

body{
background:url('https://img.freepik.com/free-vector/hand-drawn-back-school-background_23-2149464866.jpg') no-repeat center center/cover;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.game-container{
width:100%;
max-width:950px;
background:rgba(255,255,255,0.95);
border-radius:25px;
padding:25px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
text-align:center;
}

h1{
color:#ff6600;
margin-bottom:20px;
font-size:2rem;
}

#question{
font-size:1.5rem;
margin:20px 0;
color:#333;
}

.option-btn{
display:block;
width:90%;
margin:10px auto;
padding:14px;
border:none;
border-radius:15px;
background:#4da6ff;
color:white;
font-size:1.1rem;
cursor:pointer;
transition:0.3s;
}

.option-btn:hover{
background:#0077ff;
transform:scale(1.03);
}

.correct{
background:green !important;
}

.wrong{
background:red !important;
}

#score{
font-size:1.3rem;
margin-top:20px;
}

#progress{
margin-top:10px;
font-size:1rem;
}

#restartBtn{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:15px;
background:#ff9900;
color:white;
font-size:1.2rem;
cursor:pointer;
display:none;
}

#restartBtn:hover{
background:#ff7700;
}

.drag-container{
display:flex;
justify-content:space-around;
flex-wrap:wrap;
gap:20px;
margin-top:20px;
}

.drag-item{
padding:15px 25px;
background:#4da6ff;
color:white;
border-radius:15px;
cursor:grab;
font-size:1.1rem;
}

.drop-box{
width:220px;
height:80px;
border:3px dashed #666;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
background:#fff8dc;
font-size:1rem;
padding:10px;
}

select{
padding:12px;
font-size:1rem;
border-radius:10px;
margin-top:15px;
width:250px;
}

.result{
font-size:2rem;
color:#ff3300;
margin-top:20px;
}

@media(max-width:768px){

.drag-container{
flex-direction:column;
align-items:center;
}

.drop-box{
width:90%;
}

h1{
font-size:1.5rem;
}

#question{
font-size:1.2rem;
}

}

</style>
</head>

<body>

<div class="game-container">

<h1>🎨 MS Paint Fun Game 🎨</h1>

<div id="question"></div>

<div id="options"></div>

<div id="progress"></div>

<div id="score">⭐ Score: 0</div>

<button id="restartBtn">🔄 Restart Game</button>

<div class="result" id="result"></div>

</div>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

const questions = [

{
type:"mcq",
question:"Which shortcut key is used to COPY?",
options:["CTRL + C","CTRL + V","CTRL + X","CTRL + S"],
answer:"CTRL + C"
},

{
type:"mcq",
question:"Which shortcut key is used to PASTE?",
options:["CTRL + S","CTRL + O","CTRL + V","CTRL + X"],
answer:"CTRL + V"
},

{
type:"mcq",
question:"Which shortcut key is used to CUT?",
options:["CTRL + X","CTRL + C","CTRL + P","CTRL + O"],
answer:"CTRL + X"
},

{
type:"dropdown",
question:"Choose the correct shortcut key to SAVE a file.",
answer:"CTRL + S",
choices:["CTRL + P","CTRL + O","CTRL + S","CTRL + X"]
},

{
type:"dropdown",
question:"Choose the correct shortcut key to OPEN a file.",
answer:"CTRL + O",
choices:["CTRL + V","CTRL + O","CTRL + S","CTRL + C"]
},

{
type:"dragdrop",
question:"Match the tool with its work.",
pairs:[
{drag:"Brush Tool",drop:"Used for Drawing"},
{drag:"Eraser Tool",drop:"Removes Mistakes"}
]
},

{
type:"dragdrop",
question:"Match the shortcut key.",
pairs:[
{drag:"CTRL + C",drop:"Copy"},
{drag:"CTRL + V",drop:"Paste"}
]
},

{
type:"mcq",
question:"Which tool helps to draw pictures?",
options:["Brush Tool","Save Tool","Open Tool","Close Tool"],
answer:"Brush Tool"
},

{
type:"mcq",
question:"Which tool removes mistakes?",
options:["Brush","Text","Eraser","Zoom"],
answer:"Eraser"
},

{
type:"dropdown",
question:"Choose the correct shortcut key for CUT.",
answer:"CTRL + X",
choices:["CTRL + X","CTRL + V","CTRL + C","CTRL + O"]
}

];

questions.sort(() => Math.random() - 0.5);

let currentQuestion = 0;
let score = 0;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const progressEl = document.getElementById("progress");
const scoreEl = document.getElementById("score");
const resultEl = document.getElementById("result");
const restartBtn = document.getElementById("restartBtn");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

correctSound.volume = 1.0;
wrongSound.volume = 1.0;

function loadQuestion(){

optionsEl.innerHTML="";

let q = questions[currentQuestion];

questionEl.innerHTML=`Q${currentQuestion+1}. ${q.question}`;

progressEl.innerHTML=`Question ${currentQuestion+1} / ${questions.length}`;

if(q.type==="mcq"){

q.options.forEach(option=>{

let btn=document.createElement("button");

btn.classList.add("option-btn");

btn.innerText=option;

btn.onclick=()=>checkAnswer(btn,option,q.answer);

optionsEl.appendChild(btn);

});

}

else if(q.type==="dropdown"){

let select=document.createElement("select");

let defaultOption=document.createElement("option");

defaultOption.innerText="Select Answer";

defaultOption.disabled=true;
defaultOption.selected=true;

select.appendChild(defaultOption);

q.choices.forEach(choice=>{

let option=document.createElement("option");

option.value=choice;

option.innerText=choice;

select.appendChild(option);

});

select.onchange=()=>{

if(select.value===q.answer){

correctSound.play();

score++;

scoreEl.innerHTML=`⭐ Score: ${score}`;

confetti({
particleCount:150,
spread:90
});

}

else{

wrongSound.play();

}

setTimeout(nextQuestion,1500);

};

optionsEl.appendChild(select);

}

else if(q.type==="dragdrop"){

let dragContainer=document.createElement("div");

dragContainer.classList.add("drag-container");

q.pairs.forEach((pair,index)=>{

let drag=document.createElement("div");

drag.classList.add("drag-item");

drag.draggable=true;

drag.id="drag"+index;

drag.innerText=pair.drag;

drag.addEventListener("dragstart",(e)=>{
e.dataTransfer.setData("text",drag.id);
});

dragContainer.appendChild(drag);

});

optionsEl.appendChild(dragContainer);

q.pairs.forEach((pair,index)=>{

let drop=document.createElement("div");

drop.classList.add("drop-box");

drop.innerText=pair.drop;

drop.dataset.answer=pair.drag;

drop.addEventListener("dragover",(e)=>{
e.preventDefault();
});

drop.addEventListener("drop",(e)=>{

e.preventDefault();

let draggedId=e.dataTransfer.getData("text");

let draggedElement=document.getElementById(draggedId);

if(draggedElement.innerText===drop.dataset.answer){

drop.style.background="lightgreen";

drop.innerHTML=`✅ ${pair.drop}`;

correctSound.play();

score++;

scoreEl.innerHTML=`⭐ Score: ${score}`;

confetti({
particleCount:120,
spread:80
});

draggedElement.style.display="none";

}

else{

drop.style.background="pink";

wrongSound.play();

}

checkDragCompletion();

});

optionsEl.appendChild(drop);

});

}

}

function checkDragCompletion(){

let hiddenDrags=document.querySelectorAll('.drag-item[style*="display: none"]');

let q=questions[currentQuestion];

if(hiddenDrags.length===q.pairs.length){

setTimeout(nextQuestion,1500);

}

}

function checkAnswer(button,selected,answer){

let buttons=document.querySelectorAll(".option-btn");

buttons.forEach(btn=>btn.disabled=true);

if(selected===answer){

button.classList.add("correct");

correctSound.play();

score++;

scoreEl.innerHTML=`⭐ Score: ${score}`;

confetti({
particleCount:150,
spread:90
});

}

else{

button.classList.add("wrong");

wrongSound.play();

buttons.forEach(btn=>{

if(btn.innerText===answer){

btn.classList.add("correct");

}

});

}

setTimeout(nextQuestion,1500);

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

loadQuestion();

}

else{

showResult();

}

}

function showResult(){

questionEl.style.display="none";

optionsEl.style.display="none";

progressEl.style.display="none";

resultEl.innerHTML=`
🎉 Game Finished! <br><br>
Your Score: ${score} / ${questions.length}
`;

restartBtn.style.display="inline-block";

}

restartBtn.onclick=()=>{

location.reload();

};

loadQuestion();

</script>

</body>
</html>
