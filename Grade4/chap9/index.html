<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Innovine Email Etiquette: Space Defender Arcade</title>
<style>
:root {
    --primary-blue: #1e3a8a;
    --accent-cyan: #06b6d4;
    --success-green: #10b981;
    --error-red: #ef4444;
    --warning-yellow: #f59e0b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f172a;
    padding: 10px;
    overflow: hidden;
}

/* 5-Second Exclusive Splash Screen */
#splash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#splash img {
    width: 250px;
    max-width: 80%;
    animation: bouncePulse 2s infinite ease-in-out;
}

@keyframes bouncePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
}

.container {
    width: 100%;
    max-width: 850px;
    background: #1e293b;
    border: 3px solid #38bdf8;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    color: white;
    text-align: center;
    position: relative;
    z-index: 10;
}

.hidden { display: none !important; }

/* HUD Top Bar */
.hud-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    border: 1px solid #334155;
    padding: 10px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
    font-weight: 800;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
}

.badge-attempt {
    background: var(--warning-yellow);
    color: #0f172a;
    padding: 2px 8px;
    border-radius: 6px;
}

/* Space Arcade Arena */
.game-stage {
    position: relative;
    width: 100%;
    height: 380px;
    background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
    border: 2px solid #38bdf8;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 12px;
}

/* Target Meteor Card */
.target-card {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    max-width: 500px;
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid #f59e0b;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    transition: all 0.3s ease;
}

.target-text {
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    font-weight: 800;
    color: #f8fafc;
    line-height: 1.4;
}

/* Spaceship Model */
.spaceship {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3rem;
    transition: left 0.1s linear;
}

/* Cannon Buttons */
.controls-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.shoot-btn {
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 800;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.1s;
}

.shoot-btn:active { transform: scale(0.96); }

.btn-safe {
    background: linear-gradient(135deg, #10b981, #059669);
    border: 2px solid #a7f3d0;
}

.btn-threat {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border: 2px solid #fecaca;
}

/* Feedback Box */
.feedback-box {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.88rem;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #334155;
    color: white;
}

.feedback-box.correct { background: #065f46; color: #a7f3d0; }
.feedback-box.wrong { background: #991b1b; color: #fecaca; }
.feedback-box.warning { background: #92400e; color: #fef08a; }

/* Final Score Panel */
.report-panel h2 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 10px; }
.score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #0284c7;
    color: white;
    font-size: 2rem;
    font-weight: 800;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 15px auto;
    border: 4px solid #38bdf8;
}
.btn-restart {
    padding: 12px 30px;
    background: #0284c7;
    color: white;
    font-weight: 800;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    margin-top: 15px;
}
</style>
</head>
<body>

<!-- Audio Elements -->
<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>

<!-- 5-Second Splash Screen Layer -->
<div id="splash">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div class="container hidden" id="appMainframe">
    
    <!-- Active Game Arcade -->
    <div id="gamePanel">
        <div class="hud-bar">
            <div>🚀 Target: <span id="currentNum">1</span> / 12</div>
            <div>Attempts: <span class="badge-attempt" id="attemptBadge">2 / 2</span></div>
            <div>🏆 Score: <span id="scoreVal">0</span></div>
        </div>

        <div class="game-stage">
            <div class="target-card" id="targetCard">
                <div style="font-size:0.75rem; color:#f59e0b; margin-bottom:4px; font-weight:bold;">INCOMING TRANSMISSION:</div>
                <div class="target-text" id="targetText">Loading...</div>
            </div>

            <div class="spaceship" id="ship">🚀</div>
        </div>

        <div class="controls-panel">
            <button class="shoot-btn btn-safe" onclick="fireCannon(true)">
                🟢 FIRE SAFE LASER<br><span style="font-size:0.75rem; font-weight:normal;">(Polite / Correct Email)</span>
            </button>
            <button class="shoot-btn btn-threat" onclick="fireCannon(false)">
                🔴 FIRE THREAT MISSILE<br><span style="font-size:0.75rem; font-weight:normal;">(Spam / Virus / Shouting)</span>
            </button>
        </div>

        <div class="feedback-box" id="feedbackBox">
            Identify the incoming transmission and fire the correct laser type!
        </div>
    </div>

    <!-- Final Report Screen -->
    <div id="reportPanel" class="hidden report-panel">
        <h2>📊 Space Defender Analytics</h2>
        <div class="score-circle"><span id="finalScore">0</span></div>
        <h3 id="finalRank" style="color:#f59e0b; margin-bottom:10px;">Evaluating...</h3>
        <p id="finalSummary" style="color:#cbd5e1; font-size:0.9rem; line-height:1.5; max-width:550px; margin:0 auto;"></p>
        <button class="btn-restart" onclick="location.reload()">Reboot Mission 🔄</button>
    </div>

</div>

<script>
/* 5-Second Splash Timer */
setTimeout(() => {
    document.getElementById("splash").style.display = "none";
    document.getElementById("appMainframe").classList.remove("hidden");
    initGame();
}, 5000);

/* Dataset */
const etiquetteDataset = [
    { text: "Greeting the recipient with 'Hi' or 'Good morning'", isSafe: true, info: "Greeting others in an email is as important as doing so in person." },
    { text: "TYPING THE ENTIRE MESSAGE CONTENT IN ALL UPPERCASE LETTERS", isSafe: false, info: "Writing in all capital letters fails to convey a good impression and looks like shouting online." },
    { text: "Closing your message with 'Thank you' or 'Regards' followed by your name", isSafe: true, info: "Always close your message with a courteous line followed by your full name." },
    { text: "Clicking links inside a Spam message claiming you won a free prize", isSafe: false, info: "Clicking unknown links or downloading files from strangers can infect computers with malicious viruses." },
    { text: "Checking your message for proper grammar, spelling, and punctuation before sending", isSafe: true, info: "Taking time to construct a clean, accurate body shows extreme respect to the reader." },
    { text: "Opening email attachments received from unknown strangers", isSafe: false, info: "If you receive an advertisement or a message from a stranger, do not open its attachments." },
    { text: "Keeping the body text short, clear, and concise for effective reading", isSafe: true, info: "Keep your email text content short and clear for effective communication." },
    { text: "Sharing your account login password with online gaming friends", isSafe: false, info: "You must keep your system logins and passwords fully confidential to protect privacy." },
    { text: "Using polite and courteous phrasing in your requests", isSafe: true, info: "'Courteous' is one of the verified 7 Cs of effective email communication." },
    { text: "Writing in sloppy, uncapitalized text with no punctuation everywhere", isSafe: false, info: "Avoiding standard punctuation and writing lazily creates a bad impression." },
    { text: "Ensuring the information provided is Clear, Correct, and Complete", isSafe: true, info: "Ensuring your email is Clear, Correct, Coherent, and Complete matches the 7 Cs framework." },
    { text: "Downloading executable zip attachments from unverified senders", isSafe: false, info: "Unknown files can run dangerous code that harms your computer hardware." }
];

let deck = [];
let currentIndex = 0;
let attemptsLeft = 2;
let currentScore = 0;
let isProcessing = false;
let audioCtx = null;

function triggerSound(isCorrect) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (isCorrect) {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    } catch(e) {}
}

function initGame() {
    deck = [...etiquetteDataset].sort(() => Math.random() - 0.5);
    currentIndex = 0;
    currentScore = 0;
    loadQuestion();
}

function loadQuestion() {
    if (currentIndex >= deck.length) {
        finishGame();
        return;
    }

    attemptsLeft = 2;
    isProcessing = false;

    document.getElementById("currentNum").innerText = currentIndex + 1;
    document.getElementById("attemptBadge").innerText = "2 / 2";
    document.getElementById("attemptBadge").style.background = "#f59e0b";
    document.getElementById("scoreVal").innerText = currentScore;

    const currentItem = deck[currentIndex];
    document.getElementById("targetText").innerText = `"${currentItem.text}"`;

    const card = document.getElementById("targetCard");
    card.style.borderColor = "#f59e0b";
    card.style.transform = "translateX(-50%) scale(1)";

    const fb = document.getElementById("feedbackBox");
    fb.className = "feedback-box";
    fb.innerText = "Identify the incoming transmission and fire the correct laser type!";
}

function fireCannon(userChoseSafe) {
    if (isProcessing) return;

    const currentItem = deck[currentIndex];
    const isCorrect = (userChoseSafe === currentItem.isSafe);
    const fb = document.getElementById("feedbackBox");
    const card = document.getElementById("targetCard");

    if (isCorrect) {
        isProcessing = true;
        triggerSound(true);

        const pts = (attemptsLeft === 2) ? 100 : 50;
        currentScore += pts;
        document.getElementById("scoreVal").innerText = currentScore;

        card.style.borderColor = "#10b981";
        card.style.transform = "translateX(-50%) scale(1.05)";

        fb.className = "feedback-box correct";
        fb.innerHTML = `🎯 DIRECT HIT! (+${pts} pts) ${currentItem.info}`;

        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 1800);

    } else {
        attemptsLeft--;
        triggerSound(false);

        if (attemptsLeft === 1) {
            card.style.borderColor = "#ef4444";
            fb.className = "feedback-box warning";
            fb.innerHTML = `⚠️ DEFENSE SHIELD HELD! 1 Attempt Remaining. Rethink if this is safe or a threat!`;
            document.getElementById("attemptBadge").innerText = "1 / 2";
            document.getElementById("attemptBadge").style.background = "#ef4444";

        } else {
            isProcessing = true;
            card.style.borderColor = "#ef4444";
            fb.className = "feedback-box wrong";
            fb.innerHTML = `💥 TARGET MISSED! Advancing. Note: ${currentItem.info}`;

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 2200);
        }
    }
}

function finishGame() {
    document.getElementById("gamePanel").className = "hidden";
    document.getElementById("reportPanel").classList.remove("hidden");
    document.getElementById("finalScore").innerText = currentScore;

    let rank = "";
    let summary = "";

    if (currentScore >= 1000) {
        rank = "👑 Galactic Netiquette Commander";
        summary = "Flawless defense! You accurately targeted every email transmission using Chapter 9 rules.";
    } else if (currentScore >= 650) {
        rank = "🚀 Senior Fleet Pilot";
        summary = "Great work defending the network! Watch out for uppercase shouting and suspicious email attachments next time.";
    } else {
        rank = "🌱 Cadet Trainee";
        summary = "Network shields breached! Remember: polite greetings are safe, but passwords and stranger attachments are threats.";
    }

    document.getElementById("finalRank").innerText = rank;
    document.getElementById("finalSummary").innerText = summary;
}
</script>
</body>
</html>
