<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stepwise Thinking Adventure</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS', cursive;
}

body{
overflow:hidden;
background:linear-gradient(45deg,#ff9a9e,#fad0c4,#fbc2eb,#84fab0,#8fd3f4,#a18cd1);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
height:100vh;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

.screen{
display:none;
width:100%;
height:100vh;
padding:20px;
overflow:auto;
}

.active{
display:block;
}

.logo{
position:fixed;
top:10px;
left:10px;
width:120px;
z-index:999;
}

.scoreBox{
position:fixed;
top:10px;
right:10px;
background:white;
padding:10px 20px;
border-radius:20px;
font-size:24px;
font-weight:bold;
z-index:999;
}

.header{
text-align:center;
margin-top:50px;
color:white;
text-shadow:3px 3px 5px black;
}

.header h1{
font-size:50px;
}

.levelBox{
max-width:1000px;
margin:20px auto;
background:rgba(255,255,255,0.95);
padding:25px;
border-radius:25px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
animation:pop 0.5s;
}

@keyframes pop{
from{transform:scale(0.5);}
to{transform:scale(1);}
}

.question{
font-size:30px;
text-align:center;
margin:20px 0;
color:#333;
}

.buttonArea{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:20px;
}

.gameBtn{
padding:18px 30px;
font-size:26px;
border:none;
border-radius:20px;
cursor:pointer;
background:linear-gradient(to right,#ff758c,#ff7eb3);
color:white;
transition:0.3s;
box-shadow:0 5px 10px rgba(0,0,0,0.3);
}

.gameBtn:hover{
transform:scale(1.1);
}

.correct{
background:limegreen !important;
}

.wrong{
background:red !important;
}

.teacher{
width:170px;
display:block;
margin:auto;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.progress{
width:100%;
height:25px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.progressBar{
height:100%;
width:0%;
background:linear-gradient(to right,#00f260,#0575e6);
transition:0.5s;
}

.dragContainer{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-top:30px;
}

.dragItem{
padding:15px 20px;
background:#ffeb3b;
border-radius:20px;
cursor:pointer;
font-size:24px;
}

.dropZone{
padding:20px;
border:4px dashed purple;
border-radius:20px;
min-width:200px;
min-height:80px;
font-size:24px;
background:white;
}

.typingBox{
padding:15px;
font-size:26px;
border-radius:15px;
border:3px solid purple;
width:300px;
text-align:center;
}

.confetti{
position:fixed;
width:10px;
height:10px;
animation:fall 4s linear forwards;
z-index:9999;
}

@keyframes fall{
0%{
transform:translateY(-100px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

.finalScreen{
text-align:center;
margin-top:80px;
color:white;
}

.finalScreen h1{
font-size:60px;
text-shadow:4px 4px black;
}

.badge{
display:inline-block;
padding:20px;
margin:15px;
background:gold;
border-radius:20px;
font-size:28px;
}

.replay{
padding:20px 40px;
font-size:30px;
border:none;
border-radius:20px;
background:#00c853;
color:white;
cursor:pointer;
margin-top:30px;
}

@media(max-width:768px){

.question{
font-size:22px;
}

.gameBtn{
font-size:20px;
padding:15px;
}

.typingBox{
width:90%;
}

.logo{
width:90px;
}

.header h1{
font-size:32px;
}

}

</style>
</head>

<body>

<img src="assets/innovine-logo.png" class="logo">

<div class="scoreBox">
⭐ Score: <span id="score">0</span>/12
</div>

<!-- START SCREEN -->

<div class="screen active" id="startScreen">

<div class="header">
<h1>🌈 Stepwise Thinking Adventure 🌈</h1>
<h2>Grade 2 ICT Game</h2>
</div>

<div class="levelBox">

<img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="teacher">

<div class="question">
Help the Robot complete all the stepwise thinking missions!
</div>

<div class="buttonArea">
<button class="gameBtn" onclick="startGame()">START GAME</button>
</div>

</div>

</div>

<!-- GAME SCREEN -->

<div class="screen" id="gameScreen">

<div class="progress">
<div class="progressBar" id="progressBar"></div>
</div>

<div class="levelBox">

<h2 id="levelTitle"></h2>

<div class="question" id="questionText"></div>

<div id="gameArea"></div>

</div>

</div>

<!-- FINAL SCREEN -->

<div class="screen" id="finalScreen">

<div class="finalScreen">

<h1>🎉 GREAT JOB 🎉</h1>

<h2 id="finalScore"></h2>

<div class="badge">🏅 Logic Master</div>
<div class="badge">🌈 Step Hero</div>
<div class="badge">⭐ Robot Champion</div>

<br>

<button class="replay" onclick="location.reload()">PLAY AGAIN</button>

</div>

</div>

<script>

const correctSound = new Audio("assets/correct-1.mp3");
const wrongSound = new Audio("assets/wrong.mp3");

let level = 1;
let score = 0;

const levels = [

{
title:"Level 1 - Morning Routine",
question:"What comes FIRST?",
type:"buttons",
options:["Brush Teeth","Wake Up","Go To School"],
correct:"Wake Up"
},

{
title:"Level 2 - Sandwich Making",
question:"Click the FIRST step",
type:"buttons",
options:["Eat Sandwich","Put Bread","Wash Plate"],
correct:"Put Bread"
},

{
title:"Level 3 - Traffic Signal",
question:"Which light means STOP?",
type:"buttons",
options:["Green","Yellow","Red"],
correct:"Red"
},

{
title:"Level 4 - Plant Growing",
question:"What comes after planting seed?",
type:"buttons",
options:["Water Plant","Eat Fruit","Cut Plant"],
correct:"Water Plant"
},

{
title:"Level 5 - Robot Direction",
question:"Type UP",
type:"typing",
correct:"UP"
},

{
title:"Level 6 - Robot Direction",
question:"Type LEFT",
type:"typing",
correct:"LEFT"
},

{
title:"Level 7 - School Bag Mission",
question:"Click school bag packing step",
type:"buttons",
options:["Pack Books","Sleep","Play"],
correct:"Pack Books"
},

{
title:"Level 8 - Arrange Steps",
question:"Drag WAKE UP into the box",
type:"drag"
},

{
title:"Level 9 - Cooking Adventure",
question:"Click COOK",
type:"buttons",
options:["Cook","Sleep","Dance"],
correct:"Cook"
},

{
title:"Level 10 - Robot Maze",
question:"Type RIGHT",
type:"typing",
correct:"RIGHT"
},

{
title:"Level 11 - Dance Steps",
question:"Click STEP 1",
type:"buttons",
options:["Step 3","Step 1","Step 2"],
correct:"Step 1"
},

{
title:"Level 12 - Final Mission",
question:"Click COMPLETE",
type:"buttons",
options:["Stop","Complete","Wrong"],
correct:"Complete"
}

];

function startGame(){

document.getElementById("startScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");

loadLevel();

}

function loadLevel(){

if(level > levels.length){

showFinal();
return;

}

const current = levels[level-1];

document.getElementById("levelTitle").innerHTML = current.title;

document.getElementById("questionText").innerHTML = current.question;

document.getElementById("progressBar").style.width =
((level-1)/12)*100 + "%";

const gameArea = document.getElementById("gameArea");

gameArea.innerHTML = "";

if(current.type === "buttons"){

const area = document.createElement("div");
area.className = "buttonArea";

current.options.forEach(option=>{

const btn = document.createElement("button");

btn.className = "gameBtn";

btn.innerHTML = option;

btn.onclick = ()=>{

if(option === current.correct){

btn.classList.add("correct");

correctAnswer();

}else{

btn.classList.add("wrong");

wrongSound.play();

}

};

area.appendChild(btn);

});

gameArea.appendChild(area);

}

else if(current.type === "typing"){

gameArea.innerHTML = `

<div style="text-align:center">

<input type="text" id="typingInput" class="typingBox">

<br><br>

<button class="gameBtn" onclick="checkTyping()">SUBMIT</button>

</div>

`;

}

else if(current.type === "drag"){

gameArea.innerHTML = `

<div class="dragContainer">

<div class="dragItem" draggable="true" id="wake">WAKE UP</div>

<div class="dropZone" id="dropBox">DROP HERE</div>

</div>

`;

const dragItem = document.getElementById("wake");

const dropBox = document.getElementById("dropBox");

dragItem.addEventListener("dragstart", dragStart);

dropBox.addEventListener("dragover", dragOver);

dropBox.addEventListener("drop", dropped);

}

}

function checkTyping(){

const input =
document.getElementById("typingInput").value.trim().toUpperCase();

if(input === levels[level-1].correct){

correctAnswer();

}else{

wrongSound.play();

alert("Try Again!");

}

}

function correctAnswer(){

score++;

document.getElementById("score").innerHTML = score;

correctSound.play();

confettiBlast();

setTimeout(()=>{

level++;

loadLevel();

},1500);

}

function confettiBlast(){

for(let i=0;i<100;i++){

const confetti = document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left = Math.random()*window.innerWidth+"px";

confetti.style.background =
`hsl(${Math.random()*360},100%,50%)`;

confetti.style.animationDuration =
(Math.random()*3+2)+"s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},5000);

}

}

function dragStart(e){

e.dataTransfer.setData("text", e.target.id);

}

function dragOver(e){

e.preventDefault();

}

function dropped(e){

e.preventDefault();

const data = e.dataTransfer.getData("text");

if(data === "wake"){

correctAnswer();

}

}

function showFinal(){

document.getElementById("gameScreen").classList.remove("active");

document.getElementById("finalScreen").classList.add("active");

document.getElementById("finalScore").innerHTML =
`⭐ You scored ${score} out of 12`;

confettiBlast();

}

</script>

</body>
</html>
