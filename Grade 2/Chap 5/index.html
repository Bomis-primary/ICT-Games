<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KidPix 2: Wacky TV Studio</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #ffde59;
            color: #1a1a1a;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            padding: 8px;
        }

        /* 5-Second Clean White Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash-screen img {
            max-width: 300px;
            width: 75%;
            height: auto;
            object-fit: contain;
        }

        /* Main Workspace */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: 100dvh;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.6s ease;
            gap: 6px;
            padding-bottom: calc(env(safe-area-inset-bottom, 6px) + 4px);
        }

        header {
            background: white;
            width: 100%;
            padding: 8px 12px;
            border-radius: 12px;
            border: 3px solid #ff5757;
            box-shadow: 0 3px 0px #cb2d2d;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 15px;
            color: #ff5757;
            font-weight: 700;
        }

        .status-badge {
            background-color: #ff5757;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
            gap: 6px;
            overflow: hidden;
        }

        /* Instruction Box */
        .instruction-card {
            background-color: #ffffff;
            border-left: 4px solid #38b6ff;
            padding: 8px 10px;
            border-radius: 4px 8px 8px 4px;
            flex-shrink: 0;
        }

        .instruction-card h3 {
            margin: 0 0 3px 0;
            color: #0080ff;
            font-size: 13px;
            font-weight: 700;
        }

        .instruction-card p {
            margin: 0;
            font-size: 11px;
            color: #334155;
            line-height: 1.3;
        }

        /* CRT Monitor Canvas Window */
        .canvas-window {
            background: #333;
            padding: 6px;
            border-radius: 14px;
            border: 4px solid #545454;
            box-shadow: 0 3px 0px #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 160px;
            position: relative;
            overflow: hidden;
        }

        .canvas-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: 700;
            font-size: 11px;
            color: #ffffff;
        }

        canvas {
            background: #ffffff;
            border-radius: 6px;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }

        /* Tool Rack Dock */
        .dock-panel {
            background: #f0f0f0;
            padding: 8px;
            border-radius: 12px;
            border: 3px solid #38b6ff;
            box-shadow: 0 3px 0px #0080ff;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .tool-dock {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .kidpix-tool {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            touch-action: none;
            position: relative;
            z-index: 10;
        }

        .kidpix-tool.active {
            background: #ffde59;
            border-color: #ff5757;
            color: #1a1a1a;
        }

        .kidpix-tool.dragging {
            opacity: 0.85;
            transform: scale(1.1);
            position: fixed;
            z-index: 1000 !important;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }

        /* Bottom Action Button */
        .action-btn {
            background-color: #94a3b8;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: not-allowed;
            width: 100%;
            flex-shrink: 0;
            box-shadow: 0 3px 0 #64748b;
            transition: background-color 0.2s;
        }

        .action-btn.active-step {
            background-color: #52b788;
            cursor: pointer;
            box-shadow: 0 3px 0 #2d6a4f;
        }

        .action-btn.active-step:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2d6a4f;
        }
    </style>
</head>
<body>

    <!-- 5-Second Clean White Splash Screen -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Solutions Logo" onerror="this.src='https://via.placeholder.com/300x120?text=Innovine+Solutions';">
    </div>

    <!-- Main Workspace -->
    <div class="main-content" id="app-workspace">
        <header>
            <h1>💥 KidPix Wacky Studio</h1>
            <div class="status-badge" id="round-badge">Round 1 / 5</div>
        </header>

        <div class="game-container">
            <div class="instruction-card">
                <h3 id="round-title">📺 Round 1: Fix the Wacky TV!</h3>
                <p id="round-desc">Oh no! The KidPix TV shows fuzzy static. Choose the <b>Wacky Brush (🖌️)</b> tool and tap the screen to reveal the image!</p>
            </div>

            <div class="canvas-window">
                <div class="canvas-meta">
                    <span id="active-tool-label">Active Tool: Wacky Brush</span>
                    <span id="status-label">Status: TV Static Detected!</span>
                </div>
                <canvas id="kidpixCanvas" width="320" height="220"></canvas>
            </div>

            <div class="dock-panel">
                <div class="tool-dock">
                    <button class="kidpix-tool active" id="tool-brush" onclick="selectTool('brush')">🖌️ Brush</button>
                    <button class="kidpix-tool" id="tool-stamp" id="drag-stamp">🦁 Stamp</button>
                    <button class="kidpix-tool" id="tool-dynamite" onclick="selectTool('dynamite')">🧨 Dynamite</button>
                </div>
            </div>
        </div>

        <button class="action-btn" id="next-btn" onclick="advanceRound()" disabled>Solve Current Tool Goal</button>
    </div>

    <!-- Audio Elements -->
    <audio id="snd-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="snd-clap" src="assets/clap.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // Exactly 5 Seconds Splash Screen Delay
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                document.getElementById('app-workspace').style.opacity = '1';
                loadRound1();
            }, 5000);
        });

        const canvas = document.getElementById('kidpixCanvas');
        const ctx = canvas.getContext('2d');

        let currentRound = 1;
        let selectedTool = 'brush';

        let tvCleaned = false;
        let round2Placed = false;
        let dynamiteBlown = false;
        let knobPlaced = false;
        let starsPlacedCount = 0;

        function playSound(id) {
            const track = document.getElementById(id);
            if (track) {
                track.currentTime = 0;
                track.play().catch(() => {});
            }
        }

        function selectTool(tool) {
            selectedTool = tool;
            document.querySelectorAll('.kidpix-tool').forEach(b => b.classList.remove('active'));
            const targetBtn = document.getElementById(`tool-${tool}`);
            if (targetBtn) targetBtn.classList.add('active');

            let labels = { 
                'brush': 'Wacky Brush', 
                'stamp': 'Lion Stamp', 
                'dynamite': 'Dynamite Eraser',
                'knob': 'Tuner Knob',
                'star': 'Star Award'
            };
            document.getElementById('active-tool-label').innerText = `Active Tool: ${labels[tool] || 'Tool'}`;
        }

        // --- ROUND DRAWING FUNCTIONS ---
        function loadRound1() {
            ctx.fillStyle = "#8e8e8e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < canvas.width; i += 6) {
                for (let j = 0; j < canvas.height; j += 6) {
                    if (Math.random() > 0.5) {
                        ctx.fillStyle = "#d0d0d0";
                        ctx.fillRect(i, j, 6, 6);
                    }
                }
            }
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px sans-serif";
            ctx.fillText("📺 TV STATIC 📺", 110, 30);
        }

        function loadRound2() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(110, 60, 100, 100);
            ctx.setLineDash([]);

            ctx.fillStyle = "#64748b";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText("Drag & Drop Lion Here 🦁", 95, 45);
        }

        function loadRound3() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffe4e6";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#111827";
            ctx.beginPath();
            ctx.arc(160, 110, 45, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ef4444";
            ctx.font = "bold 12px sans-serif";
            ctx.fillText("🚨 INK SPILL ERROR 🚨", 95, 40);
        }

        function loadRound4() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#e0f2fe";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw TV screen with empty knob slot
            ctx.fillStyle = "#0284c7";
            ctx.fillRect(40, 30, 180, 140);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px sans-serif";
            ctx.fillText("TV Signal Lost!", 85, 105);

            ctx.strokeStyle = "#0284c7";
            ctx.lineWidth = 3;
            ctx.strokeRect(245, 80, 50, 50);

            ctx.fillStyle = "#0369a1";
            ctx.font = "bold 10px sans-serif";
            ctx.fillText("Drag Knob 🎛️", 238, 70);
        }

        function loadRound5() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fef3c7";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#b45309";
            ctx.font = "bold 12px sans-serif";
            ctx.fillText("🏆 KidPix Hall of Fame 🏆", 85, 30);

            // Draw 3 target drop slots
            for (let i = 0; i < 3; i++) {
                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 2;
                ctx.strokeRect(45 + (i * 85), 80, 60, 60);
            }

            ctx.fillStyle = "#d97706";
            ctx.font = "bold 10px sans-serif";
            ctx.fillText("Drag 3 Star Stickers into slots! ⭐", 60, 175);
        }

        // --- TAP INTERACTION FOR CANVASES ---
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            if (currentRound === 1) {
                if (selectedTool === 'brush' && (x > 80 && x < 240 && y > 40 && y < 180)) {
                    tvCleaned = true;
                    playSound('snd-correct');

                    ctx.fillStyle = "#38b6ff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = "60px Arial";
                    ctx.fillText("🎨", 130, 130);

                    document.getElementById('status-label').innerText = "Status: TV Screen Restored!";
                    unlockNext();
                } else {
                    playSound('snd-wrong');
                }
            } else if (currentRound === 3) {
                if (selectedTool === 'dynamite' && (x >= 115 && x <= 205 && y >= 65 && y <= 155)) {
                    dynamiteBlown = true;
                    playSound('snd-clap');

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillStyle = "#22c55e";
                    ctx.fillText("💥 KABOOM! CANVAS CLEAN! 💥", 40, 115);

                    document.getElementById('status-label').innerText = "Status: Canvas Erased!";
                    unlockNext();
                } else {
                    playSound('snd-wrong');
                }
            }
        });

        // --- UNIFIED MOBILE DRAG AND DROP ENGINE ---
        function makeToolDraggable(btnElement, getTargetZone, onDropSuccess) {
            let isDragging = false;
            let startX = 0, startY = 0;
            let initialRect = null;

            const onPointerDown = (e) => {
                isDragging = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialRect = btnElement.getBoundingClientRect();

                const onPointerMove = (moveEvent) => {
                    const curX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
                    const curY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;

                    const deltaX = curX - startX;
                    const deltaY = curY - startY;

                    if (Math.hypot(deltaX, deltaY) > 5) {
                        isDragging = true;
                        btnElement.classList.add('dragging');
                        btnElement.style.left = `${initialRect.left + deltaX}px`;
                        btnElement.style.top = `${initialRect.top + deltaY}px`;
                    }
                };

                const onPointerUp = (upEvent) => {
                    window.removeEventListener('mousemove', onPointerMove);
                    window.removeEventListener('mouseup', onPointerUp);
                    window.removeEventListener('touchmove', onPointerMove);
                    window.removeEventListener('touchend', onPointerUp);

                    if (isDragging) {
                        btnElement.classList.remove('dragging');
                        btnElement.style.left = '';
                        btnElement.style.top = '';

                        const endX = upEvent.changedTouches ? upEvent.changedTouches[0].clientX : upEvent.clientX;
                        const endY = upEvent.changedTouches ? upEvent.changedTouches[0].clientY : upEvent.clientY;

                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width;
                        const scaleY = canvas.height / rect.height;
                        const canvasX = (endX - rect.left) * scaleX;
                        const canvasY = (endY - rect.top) * scaleY;

                        const zone = getTargetZone();
                        if (canvasX >= zone.x1 && canvasX <= zone.x2 && canvasY >= zone.y1 && canvasY <= zone.y2) {
                            onDropSuccess(canvasX, canvasY);
                        } else {
                            playSound('snd-wrong');
                        }
                    }
                };

                window.addEventListener('mousemove', onPointerMove, { passive: true });
                window.addEventListener('mouseup', onPointerUp, { passive: true });
                window.addEventListener('touchmove', onPointerMove, { passive: true });
                window.addEventListener('touchend', onPointerUp, { passive: true });
            };

            btnElement.addEventListener('mousedown', onPointerDown);
            btnElement.addEventListener('touchstart', onPointerDown, { passive: true });
        }

        function unlockNext() {
            const btn = document.getElementById('next-btn');
            btn.disabled = false;
            btn.classList.add('active-step');
            btn.innerText = currentRound === 5 ? "Restart Studio Room 🎉" : "Load Next KidPix Tool ➡️";
        }

        function advanceRound() {
            const title = document.getElementById('round-title');
            const desc = document.getElementById('round-desc');
            const badge = document.getElementById('round-badge');
            const btn = document.getElementById('next-btn');

            btn.disabled = true;
            btn.classList.remove('active-step');
            btn.innerText = "Solve Current Tool Goal";

            const dock = document.querySelector('.tool-dock');

            if (currentRound === 1) {
                currentRound = 2;
                badge.innerText = "Round 2 / 5";
                title.innerText = "🦁 Round 2: Drag & Drop Lion Stamp";
                desc.innerText = "Drag the <b>Lion Stamp (🦁)</b> from the tool dock and drop it inside the target box on the canvas!";
                
                dock.innerHTML = `
                    <button class="kidpix-tool active" id="drag-tool-stamp">🦁 Stamp</button>
                `;

                selectTool('stamp');
                loadRound2();

                makeToolDraggable(
                    document.getElementById('drag-tool-stamp'),
                    () => ({ x1: 110, x2: 210, y1: 60, y2: 160 }),
                    () => {
                        round2Placed = true;
                        playSound('snd-correct');
                        ctx.font = "50px Arial";
                        ctx.fillText("🦁", 135, 130);
                        document.getElementById('status-label').innerText = "Status: Lion Stamp Dropped!";
                        unlockNext();
                    }
                );

            } else if (currentRound === 2) {
                currentRound = 3;
                badge.innerText = "Round 3 / 5";
                title.innerText = "🧨 Round 3: Dynamite Screen Bomb!";
                desc.innerText = "A black ink spill ruined the canvas! Select <b>Dynamite (🧨)</b> and tap the ink spill to blow it clean!";

                dock.innerHTML = `
                    <button class="kidpix-tool active" id="tool-dynamite" onclick="selectTool('dynamite')">🧨 Dynamite</button>
                `;

                selectTool('dynamite');
                loadRound3();

            } else if (currentRound === 3) {
                currentRound = 4;
                badge.innerText = "Round 4 / 5";
                title.innerText = "🎛️ Round 4: Drag Mixer Knob";
                desc.innerText = "Drag the <b>Tuner Knob (🎛️)</b> from the dock and drop it onto the TV control box to restore the signal!";

                dock.innerHTML = `
                    <button class="kidpix-tool active" id="drag-tool-knob">🎛️ Knob</button>
                `;

                selectTool('knob');
                loadRound4();

                makeToolDraggable(
                    document.getElementById('drag-tool-knob'),
                    () => ({ x1: 245, x2: 295, y1: 80, y2: 130 }),
                    () => {
                        knobPlaced = true;
                        playSound('snd-correct');
                        ctx.font = "30px Arial";
                        ctx.fillText("🎛️", 255, 115);
                        ctx.fillStyle = "#22c55e";
                        ctx.fillRect(40, 30, 180, 140);
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 12px sans-serif";
                        ctx.fillText("Signal Restored! 📺", 75, 105);
                        document.getElementById('status-label').innerText = "Status: Broadcast Live!";
                        unlockNext();
                    }
                );

            } else if (currentRound === 4) {
                currentRound = 5;
                badge.innerText = "Round 5 / 5";
                title.innerText = "⭐ Round 5: Award Hall of Fame";
                desc.innerText = "Drag 3 <b>Star Stickers (⭐)</b> from the dock into each of the 3 award slots on the canvas!";

                dock.innerHTML = `
                    <button class="kidpix-tool active" id="drag-tool-star">⭐ Star Sticker</button>
                `;

                selectTool('star');
                loadRound5();

                makeToolDraggable(
                    document.getElementById('drag-tool-star'),
                    () => ({ x1: 45, x2: 275, y1: 80, y2: 140 }),
                    (dropX) => {
                        let slotIndex = Math.floor((dropX - 45) / 85);
                        if (slotIndex >= 0 && slotIndex < 3) {
                            starsPlacedCount++;
                            playSound('snd-correct');
                            ctx.font = "35px Arial";
                            ctx.fillText("⭐", 58 + (slotIndex * 85), 122);
                            document.getElementById('status-label').innerText = `Stars Placed: ${starsPlacedCount} / 3`;

                            if (starsPlacedCount >= 3) {
                                playSound('snd-clap');
                                unlockNext();
                            }
                        }
                    }
                );

            } else {
                currentRound = 1;
                tvCleaned = false;
                round2Placed = false;
                dynamiteBlown = false;
                knobPlaced = false;
                starsPlacedCount = 0;

                badge.innerText = "Round 1 / 5";
                title.innerText = "📺 Round 1: Fix the Wacky TV!";
                desc.innerText = "Choose the Wacky Brush (🖌️) tool and tap the screen to reveal the image!";

                dock.innerHTML = `
                    <button class="kidpix-tool active" id="tool-brush" onclick="selectTool('brush')">🖌️ Brush</button>
                    <button class="kidpix-tool" id="tool-stamp">🦁 Stamp</button>
                    <button class="kidpix-tool" id="tool-dynamite" onclick="selectTool('dynamite')">🧨 Dynamite</button>
                `;

                selectTool('brush');
                loadRound1();
                document.getElementById('status-label').innerText = "Status: Reset Complete.";
            }
        }
    </script>
</body>
</html>
