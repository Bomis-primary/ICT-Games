<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Working With Mouse Game</title>
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --sky-blue: #e0f2fe;
            --amber-orange: #f59e0b;
            --emerald-green: #10b981;
            --coral-red: #ef4444;
            --slate-charcoal: #1e293b;
            --card-glass: rgba(255, 255, 255, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        /* 5-Second Standalone Splash Screen */
        #screen-splash {
            background: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
        }
        .splash-logo {
            width: 75%;
            max-width: 320px;
            height: auto;
            animation: pulseSoft 1.5s infinite ease-in-out;
        }
        .loading-track {
            width: 60%;
            max-width: 260px;
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .loading-bar-fill {
            width: 100%;
            height: 100%;
            background: #f97316;
            transform: translateX(-100%);
            animation: startLoad 4.5s forwards linear;
        }

        .overlay {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 750px;
            margin: auto;
            padding-bottom: 100px;
        }

        h1 {
            text-align: center;
            font-size: clamp(26px, 5vw, 40px);
            color: #ffd700;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
            margin-bottom: 15px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(16px, 4vw, 22px);
            background: rgba(255,255,255,0.15);
            padding: 12px 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            font-weight: bold;
        }

        .card {
            background: var(--card-glass);
            padding: 25px 20px;
            border-radius: 25px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.15);
            position: relative;
        }

        #question {
            font-size: clamp(18px, 4.5vw, 24px);
            margin-bottom: 20px;
            line-height: 1.4;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }

        #options {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .image-frame-wrapper {
            background: white;
            padding: 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            min-height: 140px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }

        .questionImage {
            width: 180px;
            height: 140px;
            object-fit: contain;
            border-radius: 12px;
        }

        /* Modernized Choice Cards to replace the emoji mix-ups in image_55d485.png */
        .choice-btn {
            background: white;
            padding: 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            border: 4px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 170px;
            color: #1e293b;
            font-weight: bold;
            font-size: 18px;
        }

        .choice-btn:hover {
            transform: scale(1.05);
            border-color: var(--amber-orange);
        }

        .choice-btn img {
            max-width: 100%;
            max-height: 75%;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .fallback-emoji-art {
            font-size: 50px;
        }

        .optionBtn {
            padding: 14px 28px;
            font-size: clamp(18px, 4vw, 22px);
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(135deg, #ffeb3b, #ff9800);
            color: black;
            transition: transform 0.2s;
            box-shadow: 0 5px 0 #b45309;
        }

        .optionBtn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b45309;
        }

        .feedback {
            font-size: clamp(22px, 5vw, 28px);
            font-weight: 900;
            margin-top: 20px;
            min-height: 35px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .nextArea {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            padding: 15px;
            text-align: center;
            z-index: 999;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #nextBtn {
            padding: 12px 50px;
            font-size: 22px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #00ff95, #00c853);
            color: white;
            display: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .finalScreen {
            display: none;
            background: #ffffff;
            color: #1e293b;
            padding: 40px 20px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
        }

        .finalScreen h1 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        .final-stats-txt {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .rank-badge {
            font-size: 28px;
            color: #b45309;
            margin: 20px 0;
            font-weight: 900;
            background: #fef3c7;
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
        }

        .playBtn {
            padding: 15px 40px;
            font-size: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #1d4ed8;
            margin-top: 10px;
        }
        .playBtn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1d4ed8;
        }

        .student-input {
            padding: 15px;
            font-size: 22px;
            border-radius: 15px;
            border: 3px solid #cbd5e1;
            width: 100%;
            max-width: 320px;
            text-align: center;
            margin: 20px 0;
            outline: none;
            color: #1e293b;
            font-weight: bold;
        }

        .animate-shake { animation: shakeEffect 0.4s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-4px); }
        }

        @keyframes startLoad { from { transform: translateX(-100%); } to { transform: translateX(0%); } }
        @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    </style>
</head>

<body>

    <!-- Native Audio Nodes -->
    <audio id="correctSound" src="assets/correct-1.mp3" preload="auto"></audio>
    <audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>

    <!-- 5-Second Brand Loader Splash Screen -->
    <div id="screen-splash">
        <img src="assets/innovine-logo.png" class="splash-logo" onerror="this.src='https://via.placeholder.com/320x100?text=Innovine+Pedagogy'">
        <div class="loading-track">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <div class="overlay">
        <div class="container">

            <!-- Name Entrance Form View -->
            <div id="startScreen" style="display:none;">
                <h1>🖱️ Working With Mouse Game</h1>
                <div class="card">
                    <h2>Welcome Scientist!</h2>
                    <p style="margin-top:5px; font-weight:bold; color:rgba(255,255,255,0.8);">Let's master our smart lab input tool controls.</p>
                    <input type="text" id="studentName" class="student-input" placeholder="Enter Student Name">
                    <br>
                    <button class="optionBtn" onclick="startGame()">Start Lab Quest ➔</button>
                </div>
            </div>

            <!-- Active Gameplay Board Screen -->
            <div id="gameScreen" style="display:none;">
                <div class="topbar">
                    <div>⭐ Score: <span id="score">0</span>/10</div>
                    <div>🏆 Badges: <span id="badges">0</span></div>
                    <div>⏰ <span id="timer">40</span>s</div>
                </div>

                <div class="card" id="main-content-card">
                    <h2 id="question">Loading Round Info...</h2>
                    <div id="imageArea"></div>
                    <div id="options"></div>
                    <div class="feedback" id="feedback"></div>
                </div>
            </div>

            <!-- Final Performance Certification Screen -->
            <div class="finalScreen" id="finalScreen">
                <h1>🎉 Quest Completed! 🎉</h1>
                <div id="finalMessage" class="final-stats-txt"></div>
                <div id="rank" class="rank-badge"></div>
                <br>
                <button onclick="location.reload()" class="playBtn">Play Again 🔄</button>
            </div>

        </div>
    </div>

    <!-- Persistent Bottom Action Row Footer Container -->
    <div class="nextArea">
        <button id="nextBtn">Next Question ➔</button>
    </div>

    <script>
        let localAssetsOperational = true;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('screen-splash').style.display = 'none';
                document.getElementById('startScreen').style.display = 'block';
            }, 5000);
        });

        // Aligned layout using clean image tiles to completely overhaul generic hand representations
        const questions = [
            {
                question: "Click the picture showing the LEFT CLICK action",
                options: [
                    { val: "assets/image_563a08.png", label: "Left Click", fallback: "👈🖱️" },
                    { val: "assets/image_5639c5.png", label: "Right Click", fallback: "👉🖱️" },
                    { val: "assets/mouse finger.PNG", label: "Proper Hold", fallback: "☝️🖱️" }
                ],
                answer: "assets/image_563a08.png"
            },
            {
                question: "Click the picture showing the RIGHT CLICK action",
                options: [
                    { val: "assets/image_5639c5.png", label: "Right Click", fallback: "👉🖱️" },
                    { val: "assets/image_563a08.png", label: "Left Click", fallback: "👈🖱️" },
                    { val: "assets/drag-n-drop.PNG", label: "Drag & Drop", fallback: "📦🖱️" }
                ],
                answer: "assets/image_5639c5.png"
            },
            {
                question: "Which action is used to move an item across the computer screen?",
                options: [
                    { val: "Drag and Drop", label: "Drag and Drop", fallback: "📦" },
                    { val: "Typing", label: "Typing", fallback: "⌨️" },
                    { val: "Printing", label: "Printing", fallback: "🖨️" }
                ],
                answer: "Drag and Drop",
                image: "assets/drag-n-drop.PNG",
                fallbackEmoji: "📦"
            },
            {
                question: "True or False: The computer mouse helps us point, select, and click items.",
                options: [
                    { val: "True", label: "True", fallback: "✅ True" },
                    { val: "False", label: "False", fallback: "❌ False" }
                ],
                answer: "True",
                image: "assets/image_563a08.png",
                fallbackEmoji: "🖱️"
            },
            {
                question: "Choose the picture layout that shows Drag and Drop movement",
                options: [
                    { val: "assets/drag-n-drop.PNG", label: "Drag & Drop", fallback: "📦🖱️" },
                    { val: "assets/image_5639c5.png", label: "Right Click", fallback: "👉🖱️" },
                    { val: "assets/image_563a08.png", label: "Left Click", fallback: "👈🖱️" }
                ],
                answer: "assets/drag-n-drop.PNG"
            },
            {
                question: "Which mouse button is primarily used to select an item on the monitor?",
                options: [
                    { val: "Left Click", label: "Left Click", fallback: "👈" },
                    { val: "Right Click", label: "Right Click", fallback: "👉" },
                    { val: "Scroll Wheel", label: "Scroll Wheel", fallback: "⚙️" }
                ],
                answer: "Left Click",
                image: "assets/image_563a08.png",
                fallbackEmoji: "👈"
            },
            {
                question: "True or False: We should hold the mouse gently with our fingers resting properly.",
                options: [
                    { val: "True", label: "True", fallback: "✅ True" },
                    { val: "False", label: "False", fallback: "❌ False" }
                ],
                answer: "True",
                image: "assets/mouse finger.PNG",
                fallbackEmoji: "🤝"
            },
            {
                question: "Identify the action that helps move graphic elements to another spot.",
                options: [
                    { val: "Drag and Drop", label: "Drag and Drop", fallback: "🚚" },
                    { val: "Double Clicking", label: "Double Click", fallback: "⚡" },
                    { val: "Powering Off", label: "Power Off", fallback: "🛑" }
                ],
                answer: "Drag and Drop",
                image: "assets/drag-n-drop.PNG",
                fallbackEmoji: "🚚"
            },
            {
                question: "Click the picture displaying correct finger placements on a mouse.",
                options: [
                    { val: "assets/mouse finger.PNG", label: "Proper Hold", fallback: "☝️🖱️" },
                    { val: "assets/image_5639c5.png", label: "Right Click", fallback: "👉🖱️" },
                    { val: "assets/image_563a08.png", label: "Left Click", fallback: "👈🖱️" }
                ],
                answer: "assets/mouse finger.PNG"
            },
            {
                question: "True or False: Right clicking an item usually opens up a context options menu.",
                options: [
                    { val: "True", label: "True", fallback: "✅ True" },
                    { val: "False", label: "False", fallback: "❌ False" }
                ],
                answer: "True",
                image: "assets/image_5639c5.png",
                fallbackEmoji: "📋"
            }
        ];

        let studentName = "";
        let current = 0;
        let score = 0;
        let badges = 0;
        let timer;
        let time = 40;
        let choiceControlLocked = false;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const imageAreaEl = document.getElementById('imageArea');
        const feedbackEl = document.getElementById('feedback');
        const nextBtnEl = document.getElementById('nextBtn');

        function startGame() {
            studentName = document.getElementById('studentName').value.trim();
            if (studentName === "") {
                alert("Please enter your name to begin!");
                return;
            }
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            showQuestion();
        }

        function startTimer() {
            clearInterval(timer);
            time = 40;
            document.getElementById('timer').innerHTML = time;

            timer = setInterval(() => {
                time--;
                document.getElementById('timer').innerHTML = time;

                if (time <= 0) {
                    clearInterval(timer);
                    choiceControlLocked = true;
                    feedbackEl.innerHTML = "⏰ Time Up! Click next to keep going.";
                    feedbackEl.style.color = '#f59e0b';
                    document.getElementById('wrongSound').play().catch(()=>{});
                    nextBtnEl.style.display = 'inline-block';
                }
            }, 1000);
        }

        function showQuestion() {
            choiceControlLocked = false;
            startTimer();

            const q = questions[current];
            questionEl.innerHTML = q.question;

            optionsEl.innerHTML = '';
            imageAreaEl.innerHTML = '';
            feedbackEl.innerHTML = '';
            nextBtnEl.style.display = 'none';

            if (q.image) {
                const frame = document.createElement('div');
                frame.className = "image-frame-wrapper";

                if (localAssetsOperational) {
                    const img = document.createElement('img');
                    img.src = q.image;
                    img.className = "questionImage";
                    img.onerror = () => {
                        localAssetsOperational = false;
                        frame.innerHTML = `<span class="fallback-emoji-art">${q.fallbackEmoji || '🖱️'}</span>`;
                    };
                    frame.appendChild(img);
                } else {
                    frame.innerHTML = `<span class="fallback-emoji-art">${q.fallbackEmoji || '🖱️'}</span>`;
                }
                imageAreaEl.appendChild(frame);
            }

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';

                if (opt.val.includes('/') && localAssetsOperational) {
                    const img = document.createElement('img');
                    img.src = opt.val;
                    img.onerror = () => {
                        localAssetsOperational = false;
                        renderCurrentOptionsWithFallbacks(q.options, q.answer);
                    };
                    const labelText = document.createElement('span');
                    labelText.style.marginTop = '4px';
                    labelText.innerText = opt.label;
                    
                    btn.appendChild(img);
                    btn.appendChild(labelText);
                } else {
                    btn.innerHTML = `
                        <span class="fallback-emoji-art">${opt.fallback}</span>
                        <span>${opt.label}</span>
                    `;
                }

                btn.onclick = () => evaluateAnswer(opt.val === q.answer);
                optionsEl.appendChild(btn);
            });
        }

        function renderCurrentOptionsWithFallbacks(optsArray, correctAns) {
            optionsEl.innerHTML = '';
            optsArray.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `
                    <span class="fallback-emoji-art">${opt.fallback}</span>
                    <span>${opt.label}</span>
                `;
                btn.onclick = () => evaluateAnswer(opt.val === correctAns);
                optionsEl.appendChild(btn);
            });
        }

        function evaluateAnswer(isCorrect) {
            if (choiceControlLocked) return;
            choiceControlLocked = true;
            clearInterval(timer);

            if (isCorrect) {
                feedbackEl.innerHTML = "👏 Super Job! Correct.";
                feedbackEl.style.color = '#00ff95';
                document.getElementById('correctSound').play().catch(()=>{});

                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                score++;
                badges++;
                document.getElementById('score').innerHTML = score;
                document.getElementById('badges').innerHTML = badges;
            } else {
                document.getElementById('main-content-card').classList.add('animate-shake');
                feedbackEl.innerHTML = "❌ Let's try another one!";
                feedbackEl.style.color = '#ef4444';
                document.getElementById('wrongSound').play().catch(()=>{});

                setTimeout(() => {
                    document.getElementById('main-content-card').classList.remove('animate-shake');
                }, 400);
            }

            nextBtnEl.style.display = 'inline-block';
        }

        nextBtnEl.onclick = () => {
            current++;
            if (current < questions.length) {
                showQuestion();
            } else {
                showFinalResultsBoard();
            }
        };

        function showFinalResultsBoard() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('finalScreen').style.display = 'block';
            nextBtnEl.style.display = 'none';

            document.getElementById('finalMessage').innerHTML = `
                Outstanding effort, ${studentName}!<br>
                You finished the lab assignment scoring ${score} out of 10 points!
            `;

            let titleRank = '';
            if (score === 10) {
                titleRank = '🏆 MOUSE CHAMPION';
            } else if (score >= 7) {
                titleRank = '👍 EXCELLENT';
            } else if (score >= 4) {
                titleRank = '🙂 RISING STAR';
            } else {
                titleRank = '📘 APPRENTICE';
            }

            document.getElementById('rank').innerHTML = titleRank;

            confetti({
                particleCount: 300,
                spread: 140,
                origin: { y: 0.5 }
            });
        }
    </script>
</body>
</html>
