<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 1 ICT - Chapter 8 Interactive Game</title>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Comic Sans MS', sans-serif;
}

body{
    background:url('assets/bg.jpg') no-repeat center center/cover;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.game-container{
    width:100%;
    max-width:950px;
    background:rgba(255,255,255,0.95);
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.logo{
    width:120px;
    margin-bottom:10px;
}

h1{
    color:#ff6600;
    margin-bottom:15px;
    font-size:2rem;
}

#question{
    font-size:1.7rem;
    color:#333;
    margin:20px 0;
    min-height:90px;
}

.option-btn{
    display:block;
    width:90%;
    margin:12px auto;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#4da6ff;
    color:white;
    font-size:1.2rem;
    cursor:pointer;
    transition:0.3s;
}

.option-btn:hover{
    transform:scale(1.03);
    background:#0077ff;
}

.correct{
    background:green !important;
}

.wrong{
    background:red !important;
}

.image-options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:20px;
}

.image-options img{
    width:100%;
    max-width:180px;
    height:180px;
    object-fit:contain;
    margin:auto;
    background:white;
    border-radius:20px;
    border:5px solid transparent;
    padding:10px;
    cursor:pointer;
    transition:0.3s;
}

.image-options img:hover{
    transform:scale(1.05);
}

#scoreBoard{
    margin-top:20px;
    font-size:1.3rem;
    color:#222;
}

#progress{
    margin-top:10px;
    font-size:1.1rem;
    color:#555;
}

.result{
    font-size:2rem;
    color:#ff3300;
    margin-top:25px;
}

#restartBtn{
    margin-top:25px;
    padding:14px 35px;
    border:none;
    border-radius:15px;
    background:#ff9900;
    color:white;
    font-size:1.2rem;
    cursor:pointer;
    display:none;
}

#restartBtn:hover{
    background:#ff7700;
}

@media(max-width:768px){

    h1{
        font-size:1.5rem;
    }

    #question{
        font-size:1.2rem;
    }

    .option-btn{
        font-size:1rem;
    }

    .image-options{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="game-container">

<img src="assets/innovine-logo.png" class="logo">

<h1>Grade 1 ICT - Introduction to MS Paint – 2</h1>

<div id="question"></div>

<div id="options"></div>

<div id="progress"></div>

<div id="scoreBoard">
⭐ Score: <span id="score">0</span>
</div>

<button id="restartBtn">🔄 Restart Game</button>

<div class="result" id="result"></div>

</div>

<!-- Sounds -->
<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

// QUESTIONS BASED ON CHAPTER 8 (PAGES 73-79)

const questions = [

{
type:"mcq",
question:"Which tool is used to draw in MS Paint?",
options:["Brush Tool","Save Tool","Undo Tool","Zoom Tool"],
answer:"Brush Tool"
},

{
type:"mcq",
question:"Which tool removes mistakes in Paint?",
options:["Brush","Eraser","Text","Fill"],
answer:"Eraser"
},

{
type:"mcq",
question:"Which button is used to save your drawing?",
options:["Close","Delete","Save","Undo"],
answer:"Save"
},

{
type:"mcq",
question:"Which tool is used to type words in Paint?",
options:["Shapes","Text Tool","Brush","Pencil"],
answer:"Text Tool"
},

{
type:"mcq",
question:"Which tool fills colour inside a shape?",
options:["Undo","Text","Fill with Color","Zoom"],
answer:"Fill with Color"
},

{
type:"mcq",
question:"Which tool draws straight lines?",
options:["Line Tool","Brush","Stamp","Text"],
answer:"Line Tool"
},

{
type:"mcq",
question:"Which tool helps make circles and rectangles?",
options:["Shapes Tool","Brush Tool","Text Tool","Save Tool"],
answer:"Shapes Tool"
},

{
type:"mcq",
question:"What should you do before closing MS Paint?",
options:["Restart Computer","Delete Drawing","Save Drawing","Switch Off Monitor"],
answer:"Save Drawing"
},

{
type:"mcq",
question:"Which icon helps undo mistakes?",
options:["Save","Undo","Brush","Cut"],
answer:"Undo"
},

{
type:"mcq",
question:"Which tool adds ready-made pictures?",
options:["Stamp Tool","Brush","Text","Line Tool"],
answer:"Stamp Tool"
},

// IMAGE QUESTIONS

{
type:"image",
question:"Click the Brush Tool",
images:[
{
src:"https://cdn-icons-png.flaticon.com/512/1827/1827933.png",
correct:true
},
{
src:"https://cdn-icons-png.flaticon.com/512/84/84380.png",
correct:false
},
{
src:"https://cdn-icons-png.flaticon.com/512/3176/3176363.png",
correct:false
},
{
src:"https://cdn-icons-png.flaticon.com/512/1159/1159633.png",
correct:false
}
]
},

{
type:"image",
question:"Click the Eraser Tool",
images:[
{
src:"https://cdn-icons-png.flaticon.com/512/3176/3176363.png",
correct:true
},
{
src:"https://cdn-icons-png.flaticon.com/512/1827/1827933.png",
correct:false
},
{
src:"https://cdn-icons-png.flaticon.com/512/84/84380.png",
correct:false
},
{
src:"https://cdn-icons-png.flaticon.com/512/565/565547.png",
correct:false
}
]
},

{
type:"image",
question:"Click the Save Button",
images:[
{
src:"https://cdn-icons-png.flaticon.com/512/84/84380.png",
correct:true
},
{
src:"https://cdn-icons-png.flaticon.com/512/1827/1827933.png",
correct:false
},
{
src:"https://cdn-icons-png.flaticon.com/512/3176/3176363.png",
correct:false
},
{
src:"https://cdn-icons-png.flaticon.com/512/565/565547.png",
correct:false
}
]
},

{
type:"image",
question:"Click the Stamp Tool",
images:[
{
src:"https://cdn-icons-png.flaticon.com/512/565/565547.png",
correct:true
},
{
src:"https://cdn-icons-png.flaticon.com/512/84/84380.png",
correct:false
},
{
src:"https://cdn-icons-png.flaticon.com/512/1827/1827933.png",
correct:false
},
{
src:"https://cdn-icons-png.flaticon.com/512/3176/3176363.png",
correct:false
}
]
},

{
type:"image",
question:"Which picture is made using Paint?",
images:[
{
src:"https://cdn.pixabay.com/photo/2016/03/31/19/58/art-1297405_1280.png",
correct:true
},
{
src:"https://cdn.pixabay.com/photo/2015/04/23/22/00/tree-736885_1280.jpg",
correct:false
}
]
}

];

// RANDOMIZE QUESTIONS
questions.sort(() => Math.random() - 0.5);

let currentQuestion = 0;
let score = 0;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");
const resultEl = document.getElementById("result");
const restartBtn = document.getElementById("restartBtn");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

// SOUND SETTINGS
correctSound.volume = 1.0;
wrongSound.volume = 1.0;

function loadQuestion(){

    optionsEl.innerHTML = "";

    const q = questions[currentQuestion];

    questionEl.innerHTML =
    `Q${currentQuestion + 1}. ${q.question}`;

    progressEl.innerHTML =
    `Question ${currentQuestion + 1} / ${questions.length}`;

    // MCQ QUESTIONS
    if(q.type === "mcq"){

        q.options.forEach(option => {

            const btn = document.createElement("button");

            btn.classList.add("option-btn");

            btn.innerText = option;

            btn.onclick = () =>
            checkAnswer(btn, option, q.answer);

            optionsEl.appendChild(btn);

        });

    }

    // IMAGE QUESTIONS
    else if(q.type === "image"){

        const imageDiv = document.createElement("div");

        imageDiv.classList.add("image-options");

        q.images.forEach(imgData => {

            const img = document.createElement("img");

            img.src = imgData.src;

            img.onclick = () => {

                if(imgData.correct){

                    img.style.border = "5px solid green";

                    correctSound.play();

                    score++;

                    scoreEl.innerText = score;

                    confetti({
                        particleCount:150,
                        spread:90,
                        origin:{ y:0.6 }
                    });

                }

                else{

                    img.style.border = "5px solid red";

                    wrongSound.play();

                }

                disableImages();

                setTimeout(nextQuestion,1500);

            };

            imageDiv.appendChild(img);

        });

        optionsEl.appendChild(imageDiv);

    }

}

// CHECK ANSWER
function checkAnswer(button, selected, answer){

    const buttons =
    document.querySelectorAll(".option-btn");

    buttons.forEach(btn => btn.disabled = true);

    if(selected === answer){

        button.classList.add("correct");

        correctSound.play();

        score++;

        scoreEl.innerText = score;

        confetti({
            particleCount:150,
            spread:90,
            origin:{ y:0.6 }
        });

    }

    else{

        button.classList.add("wrong");

        wrongSound.play();

        buttons.forEach(btn => {

            if(btn.innerText === answer){

                btn.classList.add("correct");

            }

        });

    }

    setTimeout(nextQuestion,1500);

}

// DISABLE IMAGE CLICKS
function disableImages(){

    const images =
    document.querySelectorAll(".image-options img");

    images.forEach(img => {

        img.style.pointerEvents = "none";

    });

}

// NEXT QUESTION
function nextQuestion(){

    currentQuestion++;

    if(currentQuestion < questions.length){

        loadQuestion();

    }

    else{

        showResult();

    }

}

// SHOW RESULT
function showResult(){

    questionEl.style.display = "none";
    optionsEl.style.display = "none";
    progressEl.style.display = "none";

    resultEl.innerHTML = `
    🎉 Game Finished! <br><br>
    You scored ${score} out of ${questions.length}
    `;

    restartBtn.style.display = "inline-block";

}

// RESTART GAME
restartBtn.onclick = () => {

    location.reload();

};

// START GAME
loadQuestion();

</script>

</body>
</html>
