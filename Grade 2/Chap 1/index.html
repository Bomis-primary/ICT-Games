<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPO Cycle Mobile Game</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-screen img {
            max-width: 75%;
            max-height: 50vh;
            object-fit: contain;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
        }

        /* Sad Smiley Animation Overlay */
        #sad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9997;
        }

        #sad-overlay .smiley {
            font-size: 90px;
            animation: shake 0.5s ease-in-out;
        }

        #sad-overlay .msg {
            font-size: 20px;
            font-weight: bold;
            color: #ef4444;
            margin-top: 10px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px); }
            40%, 80% { transform: translateX(15px); }
        }

        /* Main Compact Layout */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            height: 100%;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background-color: #ffffff;
            padding: 8px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .title-area h1 {
            margin: 0;
            font-size: 16px;
            color: #1e3a8a;
        }

        /* Timer Pill */
        .timer-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            min-width: 65px;
            text-align: center;
        }

        /* Level Banner */
        .mission-box {
            width: 100%;
            background-color: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            margin: 4px 0;
        }

        .mission-box h3 {
            margin: 0;
            color: #1d4ed8;
            font-size: 14px;
        }

        .mission-box p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #4b5563;
        }

        /* Drop Zones (IPO) */
        .ipo-zones {
            display: flex;
            gap: 6px;
            width: 100%;
            flex: 1;
            max-height: 140px;
        }

        .drop-zone {
            flex: 1;
            background-color: #ffffff;
            border: 2px dashed #9ca3af;
            border-radius: 10px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .drop-zone h4 {
            margin: 0 0 4px 0;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            color: white;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
        }

        .zone-input h4 { background-color: #0284c7; }
        .zone-process h4 { background-color: #f97316; }
        .zone-output h4 { background-color: #22c55e; }

        .zone-slot {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Interactive Card Area */
        .interactive-area {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .cards-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 90px;
        }

        .item-card {
            width: 80px;
            height: 85px;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
            position: relative;
            z-index: 10;
        }

        .item-card img {
            max-width: 45px;
            max-height: 45px;
            object-fit: contain;
            pointer-events: none;
        }

        .item-card span {
            margin-top: 4px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            color: #334155;
            pointer-events: none;
        }

        .item-card.dragging {
            opacity: 0.6;
        }

        .item-card.selected-tap {
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        /* Guess Options (Level 4 & 5) */
        .guess-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .guess-btn {
            background-color: #f1f5f9;
            border: 2px solid #cbd5e1;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #1e293b;
            cursor: pointer;
            width: 100%;
        }

        .guess-btn.selected {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        /* Action Buttons */
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 5px;
        }

        .action-btn {
            flex: 1;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .action-btn.reset-btn {
            background-color: #6b7280;
        }
    </style>
</head>
<body>

    <!-- 5-Second Splash Screen -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/250x100?text=Innovine+Logo';">
    </div>

    <!-- Canvas for Confetti -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Sad Smiley Overlay -->
    <div id="sad-overlay">
        <div class="smiley">😢</div>
        <div class="msg" id="sad-msg">Wrong Answer!</div>
    </div>

    <!-- Audio Elements -->
    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <!-- Workspace -->
    <div class="main-content" id="game-workspace">
        <header>
            <div class="title-area">
                <h1>⚙️ IPO Challenge</h1>
            </div>
            <div class="timer-badge" id="timer-display">⏱️ 20s</div>
        </header>

        <div class="mission-box">
            <h3 id="level-title">Level 1</h3>
            <p id="level-desc">Description</p>
        </div>

        <!-- IPO Drag & Drop Area (Levels 1,2,3) -->
        <div class="ipo-zones" id="ipo-zones-view">
            <div class="drop-zone zone-input" data-type="input" onclick="handleZoneTap('input')">
                <h4>1. Input</h4>
                <div class="zone-slot" id="slot-input"></div>
            </div>

            <div class="drop-zone zone-process" data-type="process" onclick="handleZoneTap('process')">
                <h4>2. Process</h4>
                <div class="zone-slot" id="slot-process"></div>
            </div>

            <div class="drop-zone zone-output" data-type="output" onclick="handleZoneTap('output')">
                <h4>3. Output</h4>
                <div class="zone-slot" id="slot-output"></div>
            </div>
        </div>

        <!-- Card Pool / Quiz Options -->
        <div class="interactive-area" id="interactive-area">
            <div class="cards-list" id="cards-list"></div>
            <div class="guess-options" id="guess-options" style="display: none;"></div>
        </div>

        <div class="controls">
            <button class="action-btn reset-btn" onclick="resetCurrentLevel()">Clear 🔄</button>
            <button class="action-btn" id="check-btn" onclick="checkAnswer()">Submit ✨</button>
        </div>
    </div>

    <script>
        // Splash Screen (5 Seconds)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('splash-screen').style.visibility = 'hidden';
                document.getElementById('game-workspace').style.opacity = '1';
            }, 5000);
            
            loadLevel(1);
        });

        // Audio Handler
        function playSound(type) {
            const correctAudio = document.getElementById('audio-correct');
            const wrongAudio = document.getElementById('audio-wrong');

            if (type === 'correct') {
                correctAudio.currentTime = 0;
                correctAudio.play().catch(e => {});
            } else if (type === 'wrong') {
                wrongAudio.currentTime = 0;
                wrongAudio.play().catch(e => {});
            }
        }

        // Game Levels Setup
        const levels = [
            {
                level: 1,
                type: "standard",
                title: "🥤 Level 1: Making Fresh Juice",
                desc: "Drag or tap items into Input, Process, and Output!",
                items: [
                    { id: "oranges", name: "Oranges", type: "input", img: "assets/oranges.png" },
                    { id: "juicer", name: "Juicer", type: "process", img: "assets/juicer.png" },
                    { id: "juice-glass", name: "Juice Glass", type: "output", img: "assets/juice-glass.png" }
                ]
            },
            {
                level: 2,
                type: "standard",
                title: "🎨 Level 2: Making a Clay Toy",
                desc: "Place the items in correct IPO order!",
                items: [
                    { id: "clay", name: "Raw Clay", type: "input", img: "assets/clay.png" },
                    { id: "child-clay", name: "Shaping", type: "process", img: "assets/child-clay.png" },
                    { id: "clay-toy", name: "Clay Toy", type: "output", img: "assets/clay-toy.png" }
                ]
            },
            {
                level: 3,
                type: "standard",
                title: "💻 Level 3: Computer Hardware",
                desc: "Arrange computer parts according to IPO!",
                items: [
                    { id: "keyboard", name: "Keyboard", type: "input", img: "assets/keyboard.png" },
                    { id: "cpu", name: "CPU", type: "process", img: "assets/CPU.png" },
                    { id: "monitor", name: "Monitor", type: "output", img: "assets/monitor.png" }
                ]
            },
            {
                level: 4,
                type: "guess_riddle",
                title: "🔍 Level 4: Riddle Puzzle",
                desc: "Riddle: 'I am the brain of the computer that processes calculations. What stage am I?'",
                options: ["INPUT Stage ⌨️", "PROCESS Stage ⚙️", "OUTPUT Stage 🖥️"],
                correctAnswer: "PROCESS Stage ⚙️",
                hintImage: "assets/CPU.png"
            },
            {
                level: 5,
                type: "sequence_puzzle",
                title: "🧩 Level 5: IPO Order Puzzle",
                desc: "Select the correct sequence order for the IPO cycle:",
                options: [
                    "Output ➔ Process ➔ Input",
                    "Input ➔ Process ➔ Output",
                    "Process ➔ Input ➔ Output"
                ],
                correctAnswer: "Input ➔ Process ➔ Output"
            }
        ];

        let currentLevel = 1;
        let wrongAttempts = 0;
        let timerSeconds = 20;
        let timerInterval = null;
        let selectedCard = null;
        let selectedOption = null;
        let placements = { input: null, process: null, output: null };

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 20;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAttempt("⏱️ Time's up!");
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-display').innerText = `⏱️ ${timerSeconds}s`;
        }

        function loadLevel(lvlNumber) {
            currentLevel = lvlNumber;
            wrongAttempts = 0;
            const lvlData = levels.find(l => l.level === lvlNumber);

            document.getElementById('level-title').innerText = lvlData.title;
            document.getElementById('level-desc').innerText = lvlData.desc;
            document.getElementById('check-btn').innerText = "Submit ✨";

            resetCurrentLevel();
        }

        function resetCurrentLevel() {
            placements = { input: null, process: null, output: null };
            selectedCard = null;
            selectedOption = null;

            const lvlData = levels.find(l => l.level === currentLevel);
            const ipoView = document.getElementById('ipo-zones-view');
            const cardsList = document.getElementById('cards-list');
            const guessOptions = document.getElementById('guess-options');

            cardsList.innerHTML = '';
            guessOptions.innerHTML = '';
            document.getElementById('slot-input').innerHTML = '';
            document.getElementById('slot-process').innerHTML = '';
            document.getElementById('slot-output').innerHTML = '';

            if (lvlData.type === "standard") {
                ipoView.style.display = 'flex';
                guessOptions.style.display = 'none';

                const shuffledItems = [...lvlData.items].sort(() => Math.random() - 0.5);
                shuffledItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.id = `card-${item.id}`;
                    card.setAttribute('data-id', item.id);

                    card.innerHTML = `
                        <img src="${item.img}" alt="${item.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/45?text=${item.name}';">
                        <span>${item.name}</span>
                    `;

                    // Attach Touch Drag & Tap Handlers
                    makeMobileDraggable(card, item);
                    cardsList.appendChild(card);
                });

            } else {
                ipoView.style.display = 'none';
                guessOptions.style.display = 'flex';

                if (lvlData.hintImage) {
                    cardsList.innerHTML = `<img src="${lvlData.hintImage}" style="max-height: 60px; object-fit: contain;" alt="Hint">`;
                }

                lvlData.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'guess-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        document.querySelectorAll('.guess-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedOption = opt;
                    };
                    guessOptions.appendChild(btn);
                });
            }

            startTimer();
        }

        // Touch Drag & Drop Engine for Mobile
        function makeMobileDraggable(cardElement, item) {
            let activeTouch = false;
            let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

            cardElement.addEventListener('click', () => {
                document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected-tap'));
                if (selectedCard && selectedCard.id === item.id) {
                    selectedCard = null;
                } else {
                    selectedCard = item;
                    cardElement.classList.add('selected-tap');
                }
            });

            cardElement.addEventListener('touchstart', (e) => {
                activeTouch = true;
                const touch = e.touches[0];
                initialX = touch.clientX - xOffset;
                initialY = touch.clientY - yOffset;
                cardElement.classList.add('dragging');
                cardElement.style.zIndex = '1000';
            }, { passive: true });

            cardElement.addEventListener('touchmove', (e) => {
                if (!activeTouch) return;
                const touch = e.touches[0];
                currentX = touch.clientX - initialX;
                currentY = touch.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                cardElement.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }, { passive: true });

            cardElement.addEventListener('touchend', (e) => {
                if (!activeTouch) return;
                activeTouch = false;
                cardElement.classList.remove('dragging');

                const changedTouch = e.changedTouches[0];
                cardElement.style.display = 'none';
                const dropTarget = document.elementFromPoint(changedTouch.clientX, changedTouch.clientY);
                cardElement.style.display = 'flex';

                cardElement.style.transform = 'none';
                xOffset = 0;
                yOffset = 0;
                cardElement.style.zIndex = '10';

                const zone = dropTarget ? dropTarget.closest('.drop-zone') : null;
                if (zone) {
                    placeItemInZone(item.id, zone.getAttribute('data-type'));
                }
            });
        }

        function handleZoneTap(zoneType) {
            if (!selectedCard) return;
            placeItemInZone(selectedCard.id, zoneType);
            selectedCard = null;
            document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected-tap'));
        }

        function placeItemInZone(itemId, zoneType) {
            const card = document.getElementById(`card-${itemId}`);
            if (!card) return;

            Object.keys(placements).forEach(z => {
                if (placements[z] === itemId) {
                    placements[z] = null;
                    document.getElementById(`slot-${z}`).innerHTML = '';
                }
            });

            if (placements[zoneType]) {
                const existingId = placements[zoneType];
                const existingCard = document.getElementById(`card-${existingId}`);
                document.getElementById('cards-list').appendChild(existingCard);
            }

            placements[zoneType] = itemId;
            document.getElementById(`slot-${zoneType}`).appendChild(card);
        }

        // Check Answer & Wrong Attempts Handling
        function checkAnswer() {
            const lvlData = levels.find(l => l.level === currentLevel);
            let isCorrect = false;

            if (lvlData.type === "standard") {
                let isComplete = placements.input && placements.process && placements.output;
                if (!isComplete) {
                    handleWrongAttempt("Incomplete Answer!");
                    return;
                }

                let inputCorrect = lvlData.items.find(i => i.type === 'input').id === placements.input;
                let processCorrect = lvlData.items.find(i => i.type === 'process').id === placements.process;
                let outputCorrect = lvlData.items.find(i => i.type === 'output').id === placements.output;

                isCorrect = inputCorrect && processCorrect && outputCorrect;
            } else {
                if (!selectedOption) {
                    handleWrongAttempt("No option selected!");
                    return;
                }
                isCorrect = selectedOption === lvlData.correctAnswer;
            }

            if (isCorrect) {
                handleCorrectAnswer();
            } else {
                handleWrongAttempt("Wrong Answer!");
            }
        }

        function handleCorrectAnswer() {
            clearInterval(timerInterval);
            playSound('correct');
            triggerConfetti();

            setTimeout(() => {
                if (currentLevel < levels.length) {
                    loadLevel(currentLevel + 1);
                } else {
                    document.getElementById('level-title').innerText = "🏆 Victory!";
                    document.getElementById('level-desc').innerText = "You completed all levels!";
                    document.getElementById('check-btn').innerText = "Restart 🔄";
                    document.getElementById('check-btn').onclick = () => {
                        document.getElementById('check-btn').onclick = checkAnswer;
                        loadLevel(1);
                    };
                }
            }, 1800);
        }

        function handleWrongAttempt(message) {
            wrongAttempts++;
            playSound('wrong');

            // Show Sad Overlay
            const overlay = document.getElementById('sad-overlay');
            document.getElementById('sad-msg').innerText = message;
            overlay.style.display = 'flex';

            setTimeout(() => {
                overlay.style.display = 'none';

                if (wrongAttempts >= 2) {
                    // Auto-advance after 2 wrong attempts
                    clearInterval(timerInterval);
                    if (currentLevel < levels.length) {
                        loadLevel(currentLevel + 1);
                    } else {
                        loadLevel(1);
                    }
                } else {
                    resetCurrentLevel();
                }
            }, 1200);
        }

        // Confetti Effect Generator
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    size: Math.random() * 8 + 4,
                    speed: Math.random() * 5 + 3
                });
            }

            let animationFrame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    p.y += p.speed;
                });

                if (particles.some(p => p.y < canvas.height)) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }
            render();
        }
    </script>
</body>
</html>
