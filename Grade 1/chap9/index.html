<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tux Paint Fun Challenge</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Comic Sans MS', sans-serif;
}

body{
background:linear-gradient(to bottom,#b3f0ff,#ffe6ff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.game-box{
width:100%;
max-width:950px;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
text-align:center;
border:8px solid #ffcc00;
}

.logo{
width:120px;
margin-bottom:10px;
}

h1{
color:#ff6600;
margin-bottom:20px;
font-size:2rem;
}

#question{
font-size:1.5rem;
margin:20px 0;
min-height:80px;
color:#333;
}

#options{
margin-top:20px;
}

.word-card{
display:inline-block;
padding:15px 25px;
background:#4da6ff;
color:white;
border-radius:15px;
margin:10px;
cursor:pointer;
font-size:1.2rem;
transition:0.3s;
}

.word-card:hover{
transform:scale(1.05);
background:#0077ff;
}

.option-btn{
display:block;
width:90%;
margin:10px auto;
padding:15px;
border:none;
border-radius:15px;
background:#4da6ff;
color:white;
font-size:1.1rem;
cursor:pointer;
transition:0.3s;
}

.option-btn:hover{
background:#0077ff;
transform:scale(1.03);
}

.image-grid{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.image-grid img{
width:180px;
height:180px;
object-fit:contain;
background:#fff;
padding:10px;
border-radius:20px;
border:5px solid transparent;
cursor:pointer;
transition:0.3s;
}

.image-grid img:hover{
transform:scale(1.05);
}

.drag-item{
display:inline-block;
padding:14px 20px;
background:#4da6ff;
color:white;
border-radius:15px;
cursor:grab;
margin:10px;
font-size:1.1rem;
}

.drop-zone{
width:250px;
height:90px;
border:3px dashed #666;
border-radius:15px;
margin:20px auto;
display:flex;
justify-content:center;
align-items:center;
font-size:1rem;
background:#fff8dc;
}

.memory-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:20px;
justify-items:center;
}

.memory-card{
width:180px;
height:180px;
background:#4da6ff;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:1.2rem;
color:white;
cursor:pointer;
overflow:hidden;
}

.memory-card img{
width:100%;
height:100%;
object-fit:contain;
background:white;
}

#scoreBoard{
margin-top:20px;
font-size:1.3rem;
}

#progress{
margin-top:10px;
font-size:1rem;
}

#restartBtn{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:15px;
background:#ff9900;
color:white;
font-size:1.2rem;
cursor:pointer;
display:none;
}

#restartBtn:hover{
background:#ff7700;
}

.result{
font-size:2rem;
color:#ff3300;
margin-top:25px;
}

input{
padding:15px;
font-size:1.1rem;
border-radius:10px;
border:2px solid #4da6ff;
margin-top:15px;
width:250px;
}

@media(max-width:768px){

.memory-card{
width:130px;
height:130px;
}

.image-grid img{
width:130px;
height:130px;
}

#question{
font-size:1.2rem;
}

}

</style>
</head>

<body>

<div class="game-box">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎨 Tux Paint Fun Challenge 🎨</h1>

<div id="question"></div>

<div id="options"></div>

<div id="progress"></div>

<div id="scoreBoard">
⭐ Score: <span id="score">0</span>
</div>

<button id="restartBtn">🔄 Restart Game</button>

<div class="result" id="result"></div>

</div>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

const questions = [

{
type:"unscramble",
question:"Unscramble the drawing software name.",
scrambled:"XTU TPIAN",
answer:"TUX PAINT"
},

{
type:"unscramble",
question:"Unscramble the tool name.",
scrambled:"HBSUR",
answer:"BRUSH"
},

{
type:"guessimage",
question:"Click on the Brush Tool.",
images:[
{src:"assets/brushtool.PNG",correct:true},
{src:"assets/eraser.PNG",correct:false},
{src:"assets/undo.PNG",correct:false}
]
},

{
type:"guessimage",
question:"Click on the Lines Tool.",
images:[
{src:"assets/linesimage.PNG",correct:true},
{src:"assets/brushtool.PNG",correct:false},
{src:"assets/eraser.PNG",correct:false}
]
},

{
type:"dragdrop",
question:"Drag the correct tool name to the picture.",
answer:"Brush Tool",
image:"assets/brushtool.PNG"
},

{
type:"dragdrop",
question:"Drag the correct tool name to the picture.",
answer:"Lines Tool",
image:"assets/linesimage.PNG"
},

{
type:"memory",
question:"Match the tool name with the correct image.",
pairs:[
{
word:"Brush Tool",
image:"assets/brushtool.PNG"
},
{
word:"Lines Tool",
image:"assets/linesimage.PNG"
}
]
},

{
type:"tapfast",
question:"Tap the correct tool quickly!",
correct:"Undo Tool",
options:["Undo Tool","Brush Tool","Paint Tool"]
}

];

questions.sort(()=>Math.random()-0.5);

let currentQuestion=0;
let score=0;

const questionEl=document.getElementById("question");
const optionsEl=document.getElementById("options");
const progressEl=document.getElementById("progress");
const scoreEl=document.getElementById("score");
const restartBtn=document.getElementById("restartBtn");
const resultEl=document.getElementById("result");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

function loadQuestion(){

optionsEl.innerHTML="";

let q=questions[currentQuestion];

questionEl.innerHTML=`Q${currentQuestion+1}. ${q.question}`;

progressEl.innerHTML=`Question ${currentQuestion+1} / ${questions.length}`;

if(q.type==="unscramble"){

let scramble=document.createElement("h2");

scramble.style.color="#ff6600";

scramble.innerText=q.scrambled;

optionsEl.appendChild(scramble);

let input=document.createElement("input");

input.type="text";

input.placeholder="Type Answer";

optionsEl.appendChild(input);

let btn=document.createElement("button");

btn.innerText="Check";

btn.classList.add("word-card");

btn.onclick=()=>{

if(input.value.toUpperCase().trim()===q.answer){

correctAnswer();

}
else{

wrongAnswer();

}

};

optionsEl.appendChild(btn);

}

else if(q.type==="guessimage"){

let grid=document.createElement("div");

grid.classList.add("image-grid");

q.images.forEach(imgData=>{

let img=document.createElement("img");

img.src=imgData.src;

img.onclick=()=>{

disableImageClicks();

if(imgData.correct){

img.style.border="5px solid green";

correctAnswer();

}
else{

img.style.border="5px solid red";

wrongAnswer();

}

};

grid.appendChild(img);

});

optionsEl.appendChild(grid);

}

else if(q.type==="dragdrop"){

let img=document.createElement("img");

img.src=q.image;

img.style.width="180px";
img.style.marginTop="15px";

optionsEl.appendChild(img);

let drop=document.createElement("div");

drop.classList.add("drop-zone");

drop.innerText="Drop Correct Tool Here";

optionsEl.appendChild(drop);

["Brush Tool","Lines Tool","Eraser Tool"].forEach(tool=>{

let drag=document.createElement("div");

drag.classList.add("drag-item");

drag.draggable=true;

drag.innerText=tool;

drag.addEventListener("dragstart",(e)=>{

e.dataTransfer.setData("text",tool);

});

optionsEl.appendChild(drag);

});

drop.addEventListener("dragover",(e)=>{

e.preventDefault();

});

drop.addEventListener("drop",(e)=>{

e.preventDefault();

let data=e.dataTransfer.getData("text");

if(data===q.answer){

drop.style.background="lightgreen";

drop.innerHTML="✅ Correct!";

correctAnswer();

}
else{

drop.style.background="pink";

wrongAnswer();

}

});

}

else if(q.type==="memory"){

createMemoryGame(q);

}

else if(q.type==="tapfast"){

q.options.sort(()=>Math.random()-0.5);

q.options.forEach(option=>{

let btn=document.createElement("button");

btn.classList.add("option-btn");

btn.innerText=option;

btn.onclick=()=>{

if(option===q.correct){

correctAnswer();

}
else{

wrongAnswer();

}

};

optionsEl.appendChild(btn);

});

}

}

function createMemoryGame(q){

let cards=[];

q.pairs.forEach(pair=>{

cards.push({
type:"word",
value:pair.word,
match:pair.image
});

cards.push({
type:"image",
value:pair.image,
match:pair.word
});

});

cards.sort(()=>Math.random()-0.5);

let selectedCards=[];
let matchedCount=0;

let grid=document.createElement("div");

grid.classList.add("memory-grid");

cards.forEach(card=>{

let cardDiv=document.createElement("div");

cardDiv.classList.add("memory-card");

cardDiv.innerHTML="?";

cardDiv.dataset.revealed="false";

cardDiv.onclick=()=>{

if(cardDiv.dataset.revealed==="true") return;

if(selectedCards.length===2) return;

cardDiv.dataset.revealed="true";

if(card.type==="word"){

cardDiv.innerHTML=card.value;

}
else{

cardDiv.innerHTML=`<img src="${card.value}">`;

}

selectedCards.push({
element:cardDiv,
card:card
});

if(selectedCards.length===2){

setTimeout(()=>{

let first=selectedCards[0];
let second=selectedCards[1];

let isMatch=
(first.card.match===second.card.value) ||
(second.card.match===first.card.value);

if(isMatch){

first.element.style.background="green";
second.element.style.background="green";

correctSound.play();

matchedCount++;

score++;

scoreEl.innerHTML=score;

confetti({
particleCount:100,
spread:70
});

if(matchedCount===q.pairs.length){

setTimeout(nextQuestion,1500);

}

}
else{

first.element.innerHTML="?";
second.element.innerHTML="?";

first.element.dataset.revealed="false";
second.element.dataset.revealed="false";

wrongSound.play();

}

selectedCards=[];

},800);

}

};

grid.appendChild(cardDiv);

});

optionsEl.appendChild(grid);

}

function disableImageClicks(){

let imgs=document.querySelectorAll(".image-grid img");

imgs.forEach(img=>{

img.style.pointerEvents="none";

});

}

function correctAnswer(){

correctSound.play();

score++;

scoreEl.innerHTML=score;

confetti({
particleCount:150,
spread:90
});

setTimeout(nextQuestion,1500);

}

function wrongAnswer(){

wrongSound.play();

setTimeout(nextQuestion,1500);

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

loadQuestion();

}
else{

showResult();

}

}

function showResult(){

questionEl.style.display="none";
optionsEl.style.display="none";
progressEl.style.display="none";

resultEl.innerHTML=`
🎉 Game Finished! <br><br>
Your Score: ${score} / ${questions.length}
`;

restartBtn.style.display="inline-block";

}

restartBtn.onclick=()=>{

location.reload();

};

loadQuestion();

</script>

</body>
</html>
