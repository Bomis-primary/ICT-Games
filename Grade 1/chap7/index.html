<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Paint 1 Adventure</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Trebuchet MS',sans-serif;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
}

.screen{
display:none;
background:rgba(255,255,255,0.96);
width:95%;
max-width:850px;
padding:25px;
border-radius:30px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.active{
display:block;
}

.logo{
width:150px;
margin-bottom:15px;
}

h1{
color:#6a1b9a;
margin-bottom:10px;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:2px solid #ccc;
font-size:18px;
margin:10px 0;
}

.btn{
background:#8e24aa;
color:white;
border:none;
padding:14px;
width:100%;
font-size:18px;
border-radius:50px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.btn:hover{
background:#6a1b9a;
}

.status{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
margin-bottom:20px;
font-weight:bold;
font-size:18px;
}

.level{
background:#ff9800;
color:white;
padding:8px 20px;
border-radius:20px;
display:inline-block;
margin-bottom:15px;
font-weight:bold;
}

.question{
font-size:28px;
font-weight:bold;
color:#4a148c;
margin-bottom:20px;
}

.options{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
}

.option-btn{
background:#f3e5f5;
border:none;
padding:15px 20px;
border-radius:20px;
font-size:18px;
font-weight:bold;
cursor:pointer;
min-width:200px;
transition:0.3s;
}

.option-btn:hover{
background:#ce93d8;
transform:scale(1.05);
}

.question-image{
width:250px;
height:220px;
object-fit:contain;
background:#f5f5f5;
padding:10px;
border-radius:20px;
margin:15px auto;
display:block;
}

.feedback{
font-size:28px;
font-weight:bold;
margin:20px;
height:40px;
}

.final-score{
font-size:70px;
font-weight:bold;
color:#ff6f00;
margin:20px 0;
}

</style>
</head>

<body>

<audio id="correctSound" src="assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<div id="intro" class="screen active">

<img src="assets/innovine-logo.png" class="logo">

<h1>🎨 MS Paint 1 Adventure</h1>

<input type="text" id="studentName" placeholder="Enter Student Name">
<input type="text" id="studentClass" placeholder="Enter Class">
<input type="text" id="schoolName" placeholder="Enter School Name">

<button class="btn" onclick="startGame()">Start Game</button>

</div>

<div id="game" class="screen">

<div class="status">

<div>⭐ Score: <span id="score">0</span></div>
<div>🏅 Badges: <span id="badges">0</span></div>
<div>📚 Question: <span id="qno">1</span>/5</div>

</div>

<div class="level" id="levelText"></div>

<div class="question" id="questionText"></div>

<div id="imageBox"></div>

<div class="options" id="optionsBox"></div>

<div class="feedback" id="feedback"></div>

<button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">
Next ➜
</button>

</div>

<div id="final" class="screen">

<img src="assets/ribbon.PNG" class="logo">

<h1>🏆 Congratulations!</h1>

<p id="finalMessage"></p>

<div class="final-score" id="finalScore"></div>

<h2 id="categoryText"></h2>

<button class="btn" onclick="location.reload()">Play Again</button>

</div>

<script>

const questions=[

{
level:"Level 1",
question:"Which program is used for drawing pictures?",
options:["MS Paint","Calculator","Music"],
answer:"MS Paint"
},

{
level:"Level 2",
question:"Which tool is used to draw freely?",
options:["Brush Tool","Delete Tool","Zoom Tool"],
answer:"Brush Tool",
image:"assets/brush.PNG"
},

{
level:"Level 3",
question:"Which box helps to choose colours?",
options:["Colour Box","Shape Tool","Ribbon"],
answer:"Colour Box",
image:"assets/colour.PNG"
},

{
level:"Level 4",
question:"Which tool helps to draw shapes?",
options:["Shapes Tool","Brush Tool","Fill Tool"],
answer:"Shapes Tool",
image:"assets/shapes.PNG"
},

{
level:"Level 5",
question:"Which section contains many tools?",
options:["Ribbon","Desktop","Taskbar"],
answer:"Ribbon",
image:"assets/ribbon.PNG"
}

];

let currentQuestion=0;
let score=0;
let badges=0;
let studentName="";

function showScreen(id){

document.querySelectorAll('.screen').forEach(screen=>{
screen.classList.remove('active');
});

document.getElementById(id).classList.add('active');

}

function startGame(){

studentName=document.getElementById('studentName').value;

if(studentName===""){
alert("Please Enter Name");
return;
}

showScreen('game');
loadQuestion();

}

function loadQuestion(){

const q=questions[currentQuestion];

document.getElementById('qno').innerText=currentQuestion+1;
document.getElementById('score').innerText=score;
document.getElementById('badges').innerText=badges;
document.getElementById('levelText').innerText=q.level;
document.getElementById('questionText').innerText=q.question;

document.getElementById('feedback').innerText="";
document.getElementById('nextBtn').style.display='none';

const imageBox=document.getElementById('imageBox');

imageBox.innerHTML=q.image ?
`<img src="${q.image}" class="question-image">` : "";

const optionsBox=document.getElementById('optionsBox');

optionsBox.innerHTML="";

q.options.forEach(option=>{

const btn=document.createElement('button');

btn.className='option-btn';

btn.innerText=option;

btn.onclick=()=>checkAnswer(option,q.answer);

optionsBox.appendChild(btn);

});

}

function checkAnswer(selected,correct){

const feedback=document.getElementById('feedback');

if(selected===correct){

score++;
badges++;

document.getElementById('score').innerText=score;
document.getElementById('badges').innerText=badges;

feedback.innerHTML="✅ Correct!";
feedback.style.color="green";

document.getElementById('correctSound').play();

}else{

feedback.innerHTML="❌ Wrong!";
feedback.style.color="red";

document.getElementById('wrongSound').play();

}

document.getElementById('nextBtn').style.display='block';

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

loadQuestion();

}else{

showFinal();

}

}

function showFinal(){

showScreen('final');

document.getElementById('finalMessage').innerHTML=
`🎉 Great Job <b>${studentName}</b>`;

document.getElementById('finalScore').innerText=
`${score}/5`;

let category="";

if(score===5){
category="🏆 Paint Champion";
}else if(score>=4){
category="🌟 Excellent";
}else if(score>=2){
category="👍 Good Try";
}else{
category="📘 Keep Practicing";
}

document.getElementById('categoryText').innerText=category;

confetti({
particleCount:150,
spread:100
});

}

</script>

</body>
</html>
