<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM Sorting Factory</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --science-color: #FF4757;
            --tech-color: #2ED573;
            --eng-color: #1E90FF;
            --math-color: #FFA502;
            --dark-color: #2F3542;
            --light-bg: rgba(255, 255, 255, 0.94);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F1F2F6;
            overflow-x: hidden;
            position: relative;
        }

        /* Aesthetic Dynamic Background with Overlay Layer */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/robot-bg.jpg'), url('assets/robot-bg1.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(162, 210, 255, 0.75), rgba(189, 224, 254, 0.75));
            z-index: -1;
        }

        /* Base Screen Framework Layouts */
        .screen {
            display: none;
            width: 100%;
            max-width: 750px;
            background: var(--light-bg);
            border: 6px solid #4A90E2;
            border-radius: 32px;
            padding: 35px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.2);
            text-align: center;
            margin: 15px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .screen.active {
            display: block;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Absolute Branding Splash Overlay Screen Layer (5-second block) */
        #splash-screen {
            background: white;
            border: none;
            box-shadow: none;
            max-width: 100%;
            width: 100vw;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        
        #splash-screen img {
            max-width: 320px;
            width: 80%;
            height: auto;
            animation: pulse 1.6s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.96); }
            50% { transform: scale(1.04); }
            100% { transform: scale(0.96); }
        }

        /* Setup Panel Inputs styling */
        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2F3542;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            border: 4px solid #BDE0FE;
            border-radius: 16px;
            font-size: 1.2rem;
            outline: none;
            transition: border-color 0.3s;
            background-color: white;
        }

        input:focus {
            border-color: #4A90E2;
        }

        .btn {
            background-color: #2ED573;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 #218c42;
            transition: all 0.1s;
            display: inline-block;
            margin-top: 10px;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #218c42;
        }

        /* Gameplay Arena Layout HUD */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            border: 3px dashed #4A90E2;
        }

        .hud-item {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--dark-color);
        }

        /* Central Conveyor Belt Box */
        .conveyor-belt {
            background: #E4E7EB;
            padding: 20px;
            border-radius: 24px;
            border: 4px dashed #718096;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 260px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }

        .conveyor-card {
            background: white;
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 280px;
            width: 100%;
            animation: cardSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15);
        }

        @keyframes cardSlideIn {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .conveyor-card img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        .fallback-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: #4A90E2;
            margin-top: 10px;
        }

        /* High-Contrast Tap Action Sorting Target Buttons Grid */
        .sorting-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media(max-width: 500px) {
            .sorting-grid {
                grid-template-columns: 1fr;
            }
        }

        .bucket-btn {
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .bucket-btn:active {
            transform: scale(0.96);
        }

        .bucket-science { background-color: var(--science-color); box-shadow: 0 6px 0 #C0392B; }
        .bucket-tech { background-color: var(--tech-color); box-shadow: 0 6px 0 #27AE60; }
        .bucket-eng { background-color: var(--eng-color); box-shadow: 0 6px 0 #2980B9; }
        .bucket-math { background-color: var(--math-color); box-shadow: 0 6px 0 #D35400; }

        .bucket-btn span {
            font-size: 2.2rem;
        }

        .rank-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            padding: 16px 40px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 50px;
            margin: 25px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .score-summary {
            font-size: 1.4rem;
            line-height: 1.8;
            margin-bottom: 30px;
            color: var(--dark-color);
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="bg-overlay"></div>

    <audio id="snd-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="snd-clap" src="assets/clap.mp3" preload="auto"></audio>

    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>

    <div id="setup-screen" class="screen">
        <h1 style="color: #4A90E2; margin-bottom: 12px; font-size: 2.3rem;">🏭 STEM Sorting Factory 🤖</h1>
        <p style="margin-bottom: 25px; font-size: 1.2rem; color: #57606F;">Welcome little factory worker! Let's get registered to sort items!</p>
        
        <form id="profile-form" onsubmit="handleRegistration(event)">
            <div class="form-group">
                <label for="student-name">⭐ Student Name:</label>
                <input type="text" id="student-name" required placeholder="Enter your name here">
            </div>
            <div class="form-group">
                <label for="class-name">🏫 Class / Grade:</label>
                <input type="text" id="class-name" required placeholder="e.g. Grade 1-A">
            </div>
            <div class="form-group">
                <label for="school-name">🏢 School Name:</label>
                <input type="text" id="school-name" required placeholder="Enter your school name">
            </div>
            <button type="submit" class="btn">Start Sorting! 🚀</button>
        </form>
    </div>

    <div id="game-screen" class="screen">
        <div class="hud-bar">
            <div class="hud-item" id="hud-round">📦 Item: 1 / 5</div>
            <div class="hud-item" id="hud-score">🏆 Score: 0</div>
        </div>

        <h2 style="margin-bottom: 20px; font-size: 1.5rem; color: #2F3542;">Tap the matching bucket to sort the item! 👇</h2>

        <div class="conveyor-belt">
            <div class="conveyor-card" id="card-display">
                <img id="card-img" src="" alt="STEM Item">
            </div>
            <div id="fallback-title" class="fallback-text"></div>
        </div>

        <div class="sorting-grid">
            <button class="bucket-btn bucket-science" onclick="processSortChoice('Science')">
                <span>🔬</span> Science
            </button>
            <button class="bucket-btn bucket-tech" onclick="processSortChoice('Technology')">
                <span>💻</span> Technology
            </button>
            <button class="bucket-btn bucket-eng" onclick="processSortChoice('Engineering')">
                <span>⚙️</span> Engineering
            </button>
            <button class="bucket-btn bucket-math" onclick="processSortChoice('Mathematics')">
                <span>➕</span> Mathematics
            </button>
        </div>
    </div>

    <div id="end-screen" class="screen">
        <h1 style="color: #2ED573; font-size: 2.6rem;">🎉 Factory Mission Complete! 🎉</h1>
        <div class="rank-badge">Master STEM Sorter</div>
        
        <div class="score-summary" id="end-summary"></div>

        <button class="btn" onclick="restartGame()" style="background-color: #4A90E2; box-shadow: 0 8px 0 #2980B9;">Play Again 🔄</button>
    </div>

    <script>
        // Game Mission Dataset Puzzles
        const roundDataConfigs = [
            { round: 1, imageSrc: "assets/science.PNG", title: "Science Activity 🔬", correctCategory: "Science" },
            { round: 2, imageSrc: "assets/technology.PNG", title: "Technology Gadget 💻", correctCategory: "Technology" },
            { round: 3, imageSrc: "assets/engineering.PNG", title: "Engineering Blueprint ⚙️", correctCategory: "Engineering" },
            { round: 4, imageSrc: "assets/mathematics.PNG", title: "Mathematics Puzzle ➕", correctCategory: "Mathematics" },
            { round: 5, imageSrc: "assets/factory-robot.PNG", title: "Factory Robot 🤖", correctCategory: "Engineering" }
        ];

        let currentRoundIndex = 0;
        let totalScore = 0;
        let studentDataProfile = { name: '', class: '', school: '' };

        // 5-Second Splash View Window Control Hook
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.display = 'none';
                switchScreen('setup-screen');
            }, 5000);
        });

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function handleRegistration(event) {
            event.preventDefault();
            studentDataProfile.name = document.getElementById('student-name').value;
            studentDataProfile.class = document.getElementById('class-name').value;
            studentDataProfile.school = document.getElementById('school-name').value;

            currentRoundIndex = 0;
            totalScore = 0;
            renderRoundChallenge();
            switchScreen('game-screen');
        }

        function renderRoundChallenge() {
            document.getElementById('hud-round').innerText = `📦 Item: ${currentRoundIndex + 1} / 5`;
            document.getElementById('hud-score').innerText = `🏆 Score: ${totalScore}`;

            const currentData = roundDataConfigs[currentRoundIndex];
            
            // Render backup labels text alongside image components
            document.getElementById('fallback-title').innerText = currentData.title;
            
            const cardImgNode = document.getElementById('card-img');
            const cardDisplayNode = document.getElementById('card-display');
            
            cardDisplayNode.style.animation = 'none';
            cardDisplayNode.offsetHeight; /* Trigger layout engine reflow reset */
            cardDisplayNode.style.animation = 'cardSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15)';

            cardImgNode.src = currentData.imageSrc;
        }

        function processSortChoice(chosenCategory) {
            const activeRoundData = roundDataConfigs[currentRoundIndex];
            
            const sndCorrect = document.getElementById('snd-correct');
            const sndWrong = document.getElementById('snd-wrong');

            if (chosenCategory === activeRoundData.correctCategory) {
                totalScore += 100;
                // Safe play execution wrappers to bypass browser lockouts
                if (sndCorrect) {
                    sndCorrect.currentTime = 0;
                    sndCorrect.play().catch(e => console.log("Audio skipped due to autoplay policy rules"));
                }
            } else {
                if (sndWrong) {
                    sndWrong.currentTime = 0;
                    sndWrong.play().catch(e => console.log("Audio skipped due to autoplay policy rules"));
                }
            }

            // Move safely to next screen cards array index items
            if (currentRoundIndex < roundDataConfigs.length - 1) {
                currentRoundIndex++;
                renderRoundChallenge();
            } else {
                triggerFactoryWinFinish();
            }
        }

        function triggerFactoryWinFinish() {
            switchScreen('end-screen');

            const sndClap = document.getElementById('snd-clap');
            if (sndClap) {
                sndClap.currentTime = 0;
                sndClap.play().catch(e => console.log("Audio celebration skipped safely"));
            }

            // Rainbow Canvas Particles Blast
            let duration = 3.5 * 1000;
            let animationEnd = Date.now() + duration;

            (function confettiFrame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.65 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.65 } });
                
                if (Date.now() < animationEnd) {
                    requestAnimationFrame(confettiFrame);
                }
            }());

            document.getElementById('end-summary').innerHTML = `
                <strong>Sorter Profile:</strong><br>
                👤 Name: ${studentDataProfile.name}<br>
                🏫 Class: ${studentDataProfile.class}<br>
                🏢 School: ${studentDataProfile.school}<br>
                <hr style="margin: 15px 0; border: 1px dashed #CBD5E0;">
                ⭐ Factory Efficiency Score: <strong>${totalScore} / 500 Points</strong><br>
                📦 Items Sorted Correctly: <strong>${totalScore / 100} out of 5 Items</strong>
            `;
        }

        function restartGame() {
            document.getElementById('profile-form').reset();
            switchScreen('setup-screen');
        }
    </script>
</body>
</html>
